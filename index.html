digo":"OAB2026TIPO1-061","area":"Direito Penal","dificuldade":"Médio","enunciado":"Josué foi condenado, por sentença transitada em julgado, pela prática do crime de tráfico de drogas, a cumprir a pena de 9 anos de reclusão e 900 dias-multa. Durante a execução da pena, entre as opções de trabalho e estudo que lhe foram ofertadas, Josué optou por aderir aos cursos profissionalizantes a distância, com o objetivo de reduzir o tempo de encarceramento. Diante de tal situação hipotética, assinale a afirmativa correta.","alternativas":["Josué tem direito à remição na razão de um dia de pena para cada dia de estudo.","O tempo de ensino a distância pode ser computado para fins de remição da pena.","Em caso de falta grave, o Juiz poderá revogar a integralidade do tempo remido do ato praticado.","A detração por trabalho na prisão é mais vantajosa do que a remição do tempo de pena pelo estudo."],"gabarito":"B","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa B. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":18,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":62,"codigo":"OAB2026TIPO1-062","area":"Direito Penal","dificuldade":"Médio","enunciado":"Pedro costumava consumir maconha. Vislumbrando a perspectiva de lucro, passou a plantá-la e a fabricar artesanalmente cigarros de maconha, mantendo-os parcialmente em depósito e vendendo o restante da produção por meio de aplicativo de mensagens telefônicas. Devido ao aumento da divulgação do serviço prestado, Pedro foi investigado e preso quando possuía, em casa, 500 gramas de maconha, sendo acusado da prática do crime de tráfico de drogas por cinco vezes, haja vista que importou sementes, plantou-as, fabricou cigarros e os manteve em depósito, além de vender parte da produção. Você, como advogado(a), foi constituído(a) por Pedro para atuar no curso da Ação Penal. Sobre o caso narrado, assinale a opção que indica, corretamente, a orientação jurídica que você prestou.","alternativas":["Pedro praticou apenas o crime de porte de drogas para o consumo pessoal, pois a droga foi produzida e apreendida no interior de sua casa.","Pedro praticou o crime de tráfico de drogas por cinco vezes, sob continuidade delitiva, razão pela qual faz jus à mitigação da pena total.","Pedro praticou crime único de tráfico de drogas, pois o tipo penal aplicável ao caso é misto, o que atrai a incidência do princípio da alternatividade.","Pedro praticou o crime de tráfico de drogas por cinco vezes, sob concurso formal, razão pela qual faz jus à mitigação da pena total."],"gabarito":"C","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa C. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":18,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":63,"codigo":"OAB2026TIPO1-063","area":"Direito Processual Penal","dificuldade":"Médio","enunciado":"Marivaldo foi denunciado por organização criminosa e peculato. A denúncia foi lastreada, exclusivamente, no depoimento de Sérgio, corréu, que celebrou acordo de colaboração premiada com o Ministério Público. Assim, recebida a denúncia, foram citados ambos os réus, sendo que a citação de Marivaldo ocorreu no dia 10/05, e a de Sérgio, no dia 20/05 do corrente ano. De acordo com o caso narrado, na qualidade de advogado(a) de Marivaldo, assinale a opção que apresenta a conduta adequada a ser adotada.","alternativas":["O prazo de apresentação da resposta à acusação é de dez dias a contar da citação do último corréu, tratando-se de prazo comum às partes.","O prazo de apresentação da resposta à acusação é de dez dias a contar da citação de Marivaldo, podendo ser encerrado antes do prazo de Sérgio.","Deve ser alegada a violação ao contraditório, pois o corréu delatado deve participar das tratativas de celebração do acordo de colaboração premiada.","Deve ser alegada a ausência de justa causa para o recebimento da denúncia, pois a palavra do colaborador, sem provas de corroboração, é insuficiente para o recebimento da denúncia."],"gabarito":"D","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa D. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":18,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":64,"codigo":"OAB2026TIPO1-064","area":"Direito Processual Penal","dificuldade":"Difícil","enunciado":"Vanessa foi denunciada pelo crime de furto por ter subtraído um celular. Na audiência, a prova testemunhal apontou que Vanessa utilizou de grave ameaça, consistente em apontar um revólver para a vítima, como meio de obtenção do celular. A vítima não compareceu à audiência de reconhecimento de pessoas. O Juiz, usando a prova testemunhal, sem qualquer aditamento da denúncia por parte do Ministério Público, condenou Vanessa pelo crime de roubo. Sobre a hipótese, assinale a opção que apresenta, corretamente, o que a defesa deve alegar na apelação.","alternativas":["A violação ao princípio do ne bis in idem.","A violação ao princípio da correlação entre acusação e sentença.","A impossibilidade de a prova testemunhal servir para condenar a ré, inclusive pelo furto.","A nulidade do processo, porque a condenação dependeria necessariamente do reconhecimento pessoal feito pela vítima."],"gabarito":"B","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa B. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":18,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":65,"codigo":"OAB2026TIPO1-065","area":"Direito Processual Penal","dificuldade":"Difícil","enunciado":"Anderson está sendo investigado pela prática do crime de extorsão mediante sequestro. Depois da quebra dos sigilos bancários e fiscal, a polícia efetuou o indiciamento de Anderson, sendo certo que não existia mais nenhuma diligência pendente. A defesa de Anderson requereu o acesso aos autos da investigação, que foi negado pelo Delegado de Polícia, com o argumento da inquisitividade e sigilo do inquérito policial. O Juiz também negou o acesso afirmando que o inquérito é sigiloso e possuía extratos bancários e fiscais. Assinale a opção que indica, corretamente, o argumento que você, na condição de advogado(a), deve usar no recurso para garantir o acesso ao inquérito.","alternativas":["O princípio de in dubio pro reo.","O direito absoluto de acessar o inquérito, em qualquer hipótese, como consectário da ampla defesa.","O princípio da publicidade, que deve ser aplicado tanto na fase de investigação quanto na fase processual.","É direito do advogado regularmente constituído ter acesso às diligências já documentadas, somado ao fato de não existir nenhuma diligência pendente."],"gabarito":"D","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa D. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":19,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":66,"codigo":"OAB2026TIPO1-066","area":"Direito Processual Penal","dificuldade":"Médio","enunciado":"Nicola injuriou Robson e Carlos, servidores públicos federais, por fatos relacionados a times de futebol, mas sem caráter racial na injúria. Robson ofereceu queixa-crime, ao passo que Carlos deixou passar o prazo de decadência. O Juiz extinguiu a punibilidade, sob o argumento de que a decadência do direito de um dos envolvidos provocava a extinção de punibilidade em relação a todos. Assinale a opção que apresenta o recurso que você, na condição de advogado(a) de Robson, deve apresentar.","alternativas":["O princípio da eventualidade demonstra o equívoco da decisão do Juiz.","O direito de queixa é autônomo para cada vítima, o que torna impossível, juridicamente, a extensão da decadência nesse caso.","A decadência não extingue a punibilidade, sendo apenas uma causa de diminuição a ser levada em consideração na dosimetria da pena.","A propositura de queixa por parte de Robson interrompeu o prazo de decadência para Carlos, uma vez que não há que se falar em extinção de punibilidade."],"gabarito":"B","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa B. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":19,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":67,"codigo":"OAB2026TIPO1-067","area":"Direito Processual Penal","dificuldade":"Médio","enunciado":"Leandro oferece queixa-crime no Juizado Especial Criminal. O Juiz rejeita a queixa sustentando a existência de decadência. Na condição de advogado(a) de Leandro, assinale a opção que indica, corretamente, o recurso que deve ser interposto contra a decisão que rejeitou a queixa.","alternativas":["Apelação.","Recurso inominado.","Carta testemunhável.","Recurso em sentido estrito."],"gabarito":"A","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa A. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":19,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":68,"codigo":"OAB2026TIPO1-068","area":"Direito Processual Penal","dificuldade":"Médio","enunciado":"Débora, primária e sem antecedentes, foi presa em flagrante no Aeroporto Internacional de Guarulhos, quando desembarcava no Brasil, em voo vindo do exterior, com um artefato que simulava uma arma de fogo de uso proibido na bagagem, ou seja, um simulacro que pode facilmente ser confundido com uma arma de fogo real. O simulacro é produto de importação proibida no Brasil. Débora foi enquadrada no delito de tráfico internacional de armas, previsto no Art. 18 do Estatuto do Desarmamento, cuja pena cominada é de 8 a 16 anos de reclusão, com a causa de aumento de metade (Art. 19 do Estatuto). A Polícia Federal lavrou o auto de prisão em flagrante e Débora foi submetida à audiência de custódia perante o Juiz Federal de Guarulhos. Como advogado(a) de Débora, assinale a afirmativa que contém as teses defensivas corretas.","alternativas":["A atipicidade do fato, ante o crime impossível e, ainda que assim não fosse, há incompetência absoluta da Justiça Federal.","A desclassificação para contrabando (pena de 2 a 5 anos) e o cabimento de liberdade provisória, com ou sem medidas cautelares diversas da prisão.","Como Débora é mulher e não tem antecedentes criminais, e o fato não foi cometido mediante violência ou grave ameaça, é cabível a substituição da prisão preventiva por domiciliar.","O fato foi meramente tentado, de forma que a pena mínima cominada com a redução máxima pela tentativa é igual a 4 anos, tornando cabível o acordo de não persecução penal."],"gabarito":"B","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa B. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":19,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":69,"codigo":"OAB2026TIPO1-069","area":"Direito Previdenciário","dificuldade":"Médio","enunciado":"Antônio José, segurado obrigatório do Regime Geral de Previdência Social, completou 65 anos de idade, após 30 anos ininterruptos de atividade remunerada como segurado empregado. Diante disso, procurou você, como advogado(a), para ser orientado sobre sua aposentadoria. Assinale a opção que apresenta, corretamente, a sua orientação.","alternativas":["Antônio não possui carência para fins de aposentadoria.","Antônio já possui idade e carência para fins de aposentadoria.","Antônio somente poderia, no caso narrado, se aposentar após 35 anos de contribuição.","Antônio não possui idade mínima, na forma fixada pela Constituição da República de 1988."],"gabarito":"A","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa A. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":20,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":70,"codigo":"OAB2026TIPO1-070","area":"Direito do Trabalho","dificuldade":"Médio","enunciado":"Manuela Dias, empregada doméstica, procurou você, como advogado(a), para receber orientação jurídica para uma demanda relacionada a acidente de trabalho, que ocorreu durante os seus afazeres diários na residência da empregadora doméstica, que gerou incapacidade temporária. Assinale a opção que indica a orientação correta.","alternativas":["Manuela poderá usufruir de benefício previdenciário por incapacidade temporária, ainda que possua menos de 12 contribuições mensais.","O acidente de trabalho somente será reconhecido como tal caso haja incapacidade mínima de seis meses para o trabalho, avaliada por perícia médica.","A conexão da incapacidade com o trabalho poderá ser aferida pelo INSS, mas nunca com a aplicação do Nexo Técnico Epidemiológico Previdenciário – NTEP.","A incapacidade de Manuela, na situação narrada, nunca poderia ser decorrente de doenças, pois o acidente de trabalho é sempre súbito, imediato e instantâneo."],"gabarito":"A","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa A. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":20,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":71,"codigo":"OAB2026TIPO1-071","area":"Direito do Trabalho","dificuldade":"Médio","enunciado":"Paulo foi contratado pela sociedade empresária Novos Horizontes para exercer a função de técnico em informática. João trabalha no mesmo setor e, por força de readaptação, exerce a mesma função de Paulo há seis meses. Luciana foi contratada um ano depois de Paulo, e ambos exercem a mesma função, não havendo diferença no trabalho realizado pelos três empregados. A sociedade empresária não tinha pessoal organizado em quadro de carreira, e o trabalho era distribuído entre os três indistintamente. Contudo, João recebia R$ 600,00 (seiscentos reais) a mais que Paulo, que, por sua vez recebia R$ 500,00 (quinhentos reais) a mais de salário que Luciana. Diante disso, você, como advogado(a), foi consultado(a) por Luciana acerca da diferença salarial. Assinale a opção que apresenta a resposta correta dada ao questionamento.","alternativas":["A diferença salarial não se justifica em nenhuma das hipóteses, cabendo a equiparação ao salário de maior valor.","Paulo pode ganhar mais que Luciana pelo fato de ser homem, mas, em relação a João, a diferença salarial é injustificável.","Paulo pode ganhar mais que Luciana em razão do tempo na função, que é a razão de Luciana não fazer jus ao mesmo salário que João.","A diferença salarial de Luciana em relação a Paulo não se justifica, pelo que os dois deveriam receber o mesmo salário, mas no caso de João, por ser readaptado, a diferença salarial é cabível."],"gabarito":"D","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa D. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":20,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":72,"codigo":"OAB2026TIPO1-072","area":"Direito do Trabalho","dificuldade":"Fácil","enunciado":"Uma Organização não Governamental está realizando uma série de parcerias com entidades privadas visando à inserção e ao aprendizado de menores no mercado de trabalho, a fim de estimular o primeiro emprego, bem como evitar os riscos de envolvimento com a criminalidade. Diante disso, consultou você, na qualidade de advogado(a), a respeito do trabalho do menor como empregado. Assinale a opção que apresenta, corretamente, a sua orientação sobre o caso.","alternativas":["É permitido ao menor de 18 e maior de 16 anos, o trabalho em bilheterias em cinemas e teatros, das 22 às 24 horas, a fim de não gerar prejuízo à frequência escolar.","É permitido ao maior de 16 anos e menor de 18 anos, o trabalho como frentista em postos de gasolina.","É permitido ao menor o trabalho em quiosques da orla das praias destinados à venda de comidas de todo o gênero e bebidas alcoólicas e não alcoólicas.","É permitido ao menor, a partir de 14 anos, trabalhar na condição de aprendiz."],"gabarito":"D","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa D. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":20,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":73,"codigo":"OAB2026TIPO1-073","area":"Direito do Trabalho","dificuldade":"Médio","enunciado":"Pedro trabalha numa sociedade empresária desde 2022. Na norma coletiva da categoria de Pedro há uma cláusula que fixa o intervalo intrajornada de 20 minutos para a jornada superior a seis horas diárias e, outra cláusula, prevendo que a remuneração do trabalho noturno será igual à do diurno. Considerando o que foi estipulado na norma coletiva, de acordo com a CLT, assinale a afirmativa correta.","alternativas":["Ambas as cláusulas da norma coletiva são inválidas.","Somente a cláusula relativa ao trabalho noturno é válida.","Somente a cláusula relativa ao intervalo intrajornada é válida.","Ambas as cláusulas são válidas, porque relativas a direitos passíveis de negociação."],"gabarito":"A","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa A. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":21,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":74,"codigo":"OAB2026TIPO1-074","area":"Direito do Trabalho","dificuldade":"Médio","enunciado":"A sociedade empresária Distribuidora de Bebidas Bom Paladar Ltda. pretende instituir uma política de incentivo aos seus empregados. Para tanto, deseja dar benefícios compreendidos em melhorias da condição de trabalho, com o fornecimento de uniformes novos, mais leves e confortáveis, computadores portáteis, transporte coletivo de ida e volta para o trabalho em ônibus da sociedade empresária, além de incentivo à educação, com pagamento de mensalidades e bolsa-livros para todos os empregados. Você foi procurado(a), como advogado(a), para responder à consulta da sociedade empresária acerca da integração dos valores à remuneração dos empregados. Diante disso, observado o texto da CLT, assinale a afirmativa que, corretamente, apresenta a sua resposta.","alternativas":["Todos os benefícios concedidos não integrarão a remuneração dos empregados.","Apenas a concessão de uniformes novos não integrará a remuneração dos empregados.","Apenas o benefício de incentivo à educação não integrará a remuneração dos empregados.","Apenas o fornecimento de transporte não integrará a remuneração dos empregados, por ser tempo à disposição do empregador."],"gabarito":"A","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa A. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":21,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":75,"codigo":"OAB2026TIPO1-075","area":"Direito do Trabalho","dificuldade":"Médio","enunciado":"Jonas trabalhava em uma sociedade empresária desde 2021. Com a nova chefia, que assumiu em janeiro de 2025, Jonas passou a ser explícita e sistematicamente discriminado pelo chefe em razão de sua orientação sexual, já que mantinha uma relação homoafetiva que era de conhecimento geral. Jonas foi dispensado, sem justa causa, em março de 2025. Em razão disso, Jonas o(a) procurou, na condição de advogado(a), para conhecer dos seus direitos. Assinale a opção que, considerando os fatos narrados e a norma de regência, apresenta, corretamente, sua orientação jurídica para o caso.","alternativas":["Nada há a fazer, porque é direito do empregador efetuar a dispensa sem justa causa.","O direito que assiste a Jonas é ser reintegrado, com ressarcimento integral de todo o período de afastamento.","Jonas poderá optar entre a reintegração ou a percepção, em dobro, da remuneração do período de afastamento.","Caberá apenas o pagamento, de forma simples, do período compreendido entre a dispensa e o ajuizamento da ação."],"gabarito":"C","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa C. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":21,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":76,"codigo":"OAB2026TIPO1-076","area":"Direito Processual do Trabalho","dificuldade":"Médio","enunciado":"Jorge Lucas trabalhou por um ano na sociedade empresária Alfa Beta Gama Ltda. Insatisfeito por trabalhar várias horas extras diárias sem recebê-las, apesar de consignar corretamente a sobrejornada nos controles de ponto, Jorge Lucas pediu demissão. Na rescisão do contrato de trabalho, por um equívoco do Departamento de Pessoal, foi pago um valor equivalente ao aviso prévio. Dias depois, Jorge Lucas ajuizou reclamação trabalhista pleiteando horas extras. A sociedade empresária contratou você, como advogado(a), para defendê-la. Acerca do que poderá ser alegado sobre o equívoco do pagamento a mais de aviso prévio, à luz do entendimento consolidado na jurisprudência do Tribunal Superior do Trabalho (TST), assinale a afirmativa correta.","alternativas":["Tendo sido pago o valor do aviso prévio espontaneamente pela sociedade empresária, está preclusa qualquer argumentação a esse respeito.","Deverá ser alegada a dedução dos valores pagos a título de aviso prévio da condenação ao pagamento dos valores relativos às horas extras.","Deverá ser alegada a compensação do valor pago a título do aviso prévio com eventual condenação em horas extras, o que deverá ser feito em sede de contestação.","Deverá ser alegada a quitação do valor pago a título do aviso prévio com eventual condenação em horas extras, o que poderá ser feito em qualquer momento processual na instância ordinária."],"gabarito":"C","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa C. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":21,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":77,"codigo":"OAB2026TIPO1-077","area":"Direito Processual do Trabalho","dificuldade":"Médio","enunciado":"Em determinada reclamação trabalhista que tramita perante a 60ª Vara do Trabalho de Maringá, PR, o autor requereu o pagamento do vale-transporte, que jamais fora pago, e as diferenças do FGTS, afirmando que, em parte do contrato, ele não foi depositado pelo ex-empregador na conta vinculada. Em defesa, a sociedade empresária sustentou que o empregado não necessitava de vale-transporte, porque ele residia próximo à sede da sociedade empresária em que exercia as suas atividades, deslocando-se a pé para ir ao serviço e voltar, e que recolheu de forma escorreita o FGTS. Sobre o ônus da prova, considerando os fatos narrados e o entendimento consolidado do Tribunal Superior do Trabalho (TST), assinale a afirmativa correta.","alternativas":["Tanto em relação ao vale-transporte quanto ao FGTS, o ônus da prova caberá ao empregado.","Em relação ao vale-transporte caberá à sociedade empresária; quanto ao FGTS, ao trabalhador.","Em relação ao vale-transporte, caberá ao trabalhador; quanto ao FGTS, à sociedade empresária.","Tanto em relação ao vale-transporte quanto ao FGTS, o ônus da prova caberá à sociedade empresária."],"gabarito":"D","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa D. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":22,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":78,"codigo":"OAB2026TIPO1-078","area":"Direito Processual do Trabalho","dificuldade":"Médio","enunciado":"Em determinada reclamação trabalhista que tramita perante a 58ª Vara do Trabalho de Cuiabá, MT, o pedido formulado foi julgado procedente em parte. A sociedade empresária reclamada recorreu ordinariamente e o reclamante, de forma adesiva. Distribuídos os apelos pelo Tribunal Regional, o Relator verificou que o recurso ordinário da reclamada se encontrava intempestivo, já que interposto no 16º dia contado da publicação da sentença. Considerando esses fatos e a norma de regência, assinale a afirmativa correta.","alternativas":["Os dois recursos não serão conhecidos.","O recurso ordinário não será conhecido, e o recurso adesivo será apreciado.","O recurso adesivo não será conhecido, salvo se o reclamante recorrente tiver feito o preparo na forma da lei.","Equivocado o Relator, pois, havendo recurso adesivo, o prazo é contado em dobro, pelo que o recurso ordinário é tempestivo e será conhecido."],"gabarito":"A","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa A. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":22,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":79,"codigo":"OAB2026TIPO1-079","area":"Direito Processual do Trabalho","dificuldade":"Fácil","enunciado":"Daniele, assistida pelo seu sindicato de classe, ajuizou reclamação trabalhista contra o seu ex-empregador. Na audiência, as partes chegaram a um acordo de R$ 200.000,00 (duzentos mil reais), mas o Juiz indeferiu a concessão de gratuidade de justiça à autora, porque a situação financeira dela era, comprovadamente, muito confortável. O Juiz fixou as custas em R$ 4.000,00 (quatro mil reais). Considerando esses fatos e o previsto na CLT, uma vez que nada foi convencionado no acordo, assinale a opção que indica quem pagará as custas.","alternativas":["O reclamado, pois as custas sempre serão pagas pelo réu.","O sindicato de classe deverá pagar as custas, integralmente.","Daniele, pois além da sua situação financeira, fez um acordo de vultoso valor.","Se de outra forma não for convencionado, o pagamento das custas caberá em partes iguais aos litigantes."],"gabarito":"D","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa D. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":22,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":80,"codigo":"OAB2026TIPO1-080","area":"Direito Processual do Trabalho","dificuldade":"Fácil","enunciado":"Jonas, executado na Justiça do Trabalho, reclamou com você, na condição de advogado(a), porque um Oficial de Justiça chegou à residência dele, em uma quinta-feira, dia útil, às 5h30, com ordem judicial para penhorar o seu imóvel, sendo certo que o mandado de penhora não continha nenhuma previsão de excepcionalidade. A revolta do executado reside no horário de chegada do Oficial de Justiça à sua residência, o que o obrigou a acordar muito cedo, o mesmo valendo para sua esposa. Sobre os fatos apresentados, considerando o previsto na CLT, assinale a afirmativa correta.","alternativas":["O procedimento é regular porque a lei não prevê horário para a prática dos atos processuais.","O Oficial de Justiça está equivocado, porque somente poderia realizar o ato processual a partir das 6 horas.","O procedimento é irregular, porque a lei prevê que os atos processuais podem ser feitos a partir das 7 horas.","Se os atos podem ser realizados até mesmo no domingo, mesmo sem a autorização do Juiz, com igual razão pode ser feito durante a semana, às 5h30."],"gabarito":"B","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa B. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":22,"status":"pendente_revisao"}]

async function initSupabaseData(){if(supabaseLoaded)return;const client=getSupabaseClient();if(!client){supabaseStatus='Offline';return}supabaseLoaded=true;try{const [muralRes,questoesRes]=await Promise.all([client.from('mural').select('*').order('created_at',{ascending:false}),client.from('questoes').select('*').order('created_at',{ascending:false})]);if(muralRes.error)throw muralRes.error;if(Array.isArray(muralRes.data)&&muralRes.data.length)muralCards.splice(0,muralCards.length,...muralRes.data.map(mapSupabaseMural));if(!questoesRes.error&&Array.isArray(questoesRes.data)){supabaseQuestoes=questoesRes.data.map(mapSupabaseQuestao);syncQuestoesBanco()}supabaseStatus='Conectado';if(document.getElementById('main'))render()}catch(err){supabaseStatus='Erro';console.warn('Supabase indisponível:',err);if(document.getElementById('main'))render()}}
async function getFirebaseIdTokenForApi(){const user=window.lexiaFirebaseAuth?.currentUser||window.lexiaFirebaseUser;if(user?.getIdToken)return await user.getIdToken();return null}
async function callLexiaAdminApi(table,action,data={},id=null){const token=await getFirebaseIdTokenForApi();if(!token)return{ok:false,skipped:true,error:'Login Google Firebase necessário para gravar no Supabase.'};const response=await fetch(LEXIA_ADMIN_API_URL,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({table,action,data,id})});const payload=await response.json().catch(()=>({}));if(!response.ok)throw new Error(payload.error||'Falha ao gravar no Supabase.');return payload}
function syncSeguroSupabase(table,action,data,id=null){callLexiaAdminApi(table,action,data,id).then(result=>{if(result.skipped)console.info(result.error);else console.info('Supabase sincronizado:',table,action)}).catch(err=>console.warn('Sincronização Supabase falhou:',err.message))}

function salvarQuestaoManual(){const area=document.getElementById('admArea')?.value||'Direito Civil',fonte=(document.getElementById('admFonte')?.value||'Questões do professor · '+syncState.periodo).trim(),ano=(document.getElementById('admAno')?.value||anoFromText(fonte)).trim(),dif=document.getElementById('admDif')?.value||'Médio',text=(document.getElementById('admEnunciado')?.value||'').trim(),opts=['A','B','C','D'].map(l=>(document.getElementById('admAlt'+l)?.value||'').trim()),correta=Number(document.querySelector('input[name="admCorreta"]:checked')?.value||0),comment=(document.getElementById('admComentario')?.value||'').trim();if(!text||opts.some(o=>!o)){alert('Preencha o enunciado e as quatro alternativas.');return}const nova=makeBancoQuestao({fonte,ano,area,dif,text,opts,correta,comment,origem:'Professor'});syncSeguroSupabase('questoes','create',{codigo:nova.codigo,area,prova:fonte,ano,dificuldade:dif,enunciado:text,alternativas:opts,correta,comentario:nova.comment,origem:'Professor'});addQuestoesAoBanco([nova]);alert('Questão salva e sincronizada com o painel do aluno.')}
function importarQuestoesIA(){const fonte=(document.getElementById('admImportProva')?.value||'Importação IA · '+syncState.periodo).trim(),ano=anoFromText(fonte),difSel=document.getElementById('admImportDif')?.value||'Automático',areaSel=document.getElementById('admImportArea')?.value||'Automático',dif=difSel==='Automático'?'Médio':difSel,baseCount=questoes.filter(q=>q.exame===fonte||q.ref?.startsWith(fonte+' - Questão')).length,pool=areaSel==='Automático'?areas.slice(0,5):[areaSel];const novas=pool.map((area,i)=>{const modelo=modelos[area]||modelos.default,gabarito='A',q=makeBancoQuestao({fonte,ano,area,dif,text:modelo[0],opts:modelo[1],correta:0,comment:comentarioIADemo(area,gabarito,modelo[1][0],modelo[1],0),origem:'Importação IA'});q.ref=fonte+' - Questão '+(baseCount+i+1);q.codigo=makeQuestaoCodigo(fonte,ano,baseCount+i+1);return q});addQuestoesAoBanco(novas);alert(novas.length+' questões importadas e sincronizadas com o painel do aluno.')}

function salvarComentarioQuestao(codigo,textareaId){const q=questoes.find(item=>item.codigo===codigo),el=document.getElementById(textareaId);if(!q||!el)return;const texto=el.value.trim();if(!texto){alert('Informe um comentário para salvar.');return}q.comment=texto;questaoComentarioOverrides[codigo]=texto;persistQuestaoComentarioOverrides();questoesExtras=questoesExtras.map(item=>item.codigo===codigo?{...item,comment:texto}:item);persistQuestoesExtras();syncSeguroSupabase('questoes','upsert',{codigo:q.codigo,area:q.area,prova:q.exame||q.prova,ano:q.ano,dificuldade:q.dif,enunciado:q.text,alternativas:q.opts,correta:q.correta,comentario:texto,origem:q.origem||'Professor'});syncQuestoesBanco();render();alert('Comentário salvo e sincronizado com o painel do aluno.')}
function editarComentarioQuestao(codigo){const q=questoes.find(item=>item.codigo===codigo);if(!q)return;const novo=prompt('Editar comentário / fundamento',q.comment||'');if(novo===null)return;const texto=novo.trim()||q.comment;q.comment=texto;questaoComentarioOverrides[codigo]=texto;persistQuestaoComentarioOverrides();questoesExtras=questoesExtras.map(item=>item.codigo===codigo?{...item,comment:texto}:item);persistQuestoesExtras();syncQuestoesBanco();render()}
function adminAlunos(){const filtrados=estudantes.filter(e=>!studentSearch||e.nome.toLowerCase().includes(studentSearch.toLowerCase())||e.email.toLowerCase().includes(studentSearch.toLowerCase()));const ativos=estudantes.filter(e=>e.status==='Ativo').length;return '<div class="admin-head"><div class="page-title" style="margin:0;border:0;padding:0">Estudantes</div><div class="admin-tools"><input class="form-input" style="width:195px" placeholder="Buscar por nome..." value="'+escapeHtml(studentSearch)+'" oninput="studentSearch=this.value;render()"><button class="btn" onclick="showStudentForm=!showStudentForm;render()">+ Cadastrar</button></div></div>'+adminAlunoForm()+'<div class="grid4"><div class="card"><div class="stat-val">'+estudantes.length+'</div><div class="stat-lbl">Total</div></div><div class="card"><div class="stat-val" style="color:var(--grn)">'+ativos+'</div><div class="stat-lbl">Ativos</div></div><div class="card"><div class="stat-val" style="color:var(--gold)">'+(estudantes.length-ativos)+'</div><div class="stat-lbl">Inativos</div></div><div class="card"><div class="stat-val" style="color:var(--blue)">3</div><div class="stat-lbl">Este mês</div></div></div><div class="card"><table class="student-table"><tr><th>Estudante</th><th>E-mail</th><th>Turma</th><th>Trilha</th><th>XP</th><th>Última atividade</th><th>Status</th><th></th></tr>'+filtrados.map((e,i)=>'<tr><td><div class="student-name"><div class="student-avatar" style="background:'+e.color+'">'+iniciais(e.nome)+'</div><div><b>'+e.nome+'</b><div class="student-doc">'+e.doc+'</div></div></div></td><td>'+e.email+'</td><td>'+e.turma+'</td><td>'+tag(e.trilha)+'</td><td><b>'+e.xp+'</b></td><td style="color:var(--t2)">'+e.atividade+'</td><td><span class="status-pill '+(e.status==='Ativo'?'':'off')+'">'+e.status+'</span></td><td><button class="icon-btn" onclick="editarAluno('+i+')">✎</button><button class="icon-btn" onclick="removerAluno('+i+')">🗑</button></td></tr>').join('')+'</table></div>'}

<script type="module">
const firebaseConfig = {

};
const lexiaAuthRules = {
  coordenadorEmails: ["coordenador@lexia.br","plataformalexia@gmail.com.br","plataformalexia@gmail.com","brunofelipe.oem@gmail.com"],
  professorEmails: ["professor@lexia.br","bruno_miranda88@hotmail.com"]
};
const firebaseSdkVersion = "12.7.0";
function firebaseIsConfigured(){
  return firebaseConfig.apiKey && !firebaseConfig.apiKey.includes("COLE_AQUI");
}
function roleForGoogleEmail(email){
  const normalized = String(email||"").toLowerCase();
  if(lexiaAuthRules.coordenadorEmails.map(e=>e.toLowerCase()).includes(normalized))return "coord";
  const professoresCadastrados = window.getProfessoresAcessoEmails ? window.getProfessoresAcessoEmails() : [];
  if([...lexiaAuthRules.professorEmails,...professoresCadastrados].map(e=>e.toLowerCase()).includes(normalized))return "professor";
  return "aluno";
}
async function getFirebaseAuth(){
  if(!window.lexiaFirebaseApp){
    const appSdk = await import(`https://www.gstatic.com/firebasejs/${firebaseSdkVersion}/firebase-app.js`);
    window.lexiaFirebaseApp = appSdk.initializeApp(firebaseConfig);
  }
  if(!window.lexiaFirebaseAuth){
    const authSdk = await import(`https://www.gstatic.com/firebasejs/${firebaseSdkVersion}/firebase-auth.js`);
    window.lexiaFirebaseAuthSdk = authSdk;
    window.lexiaFirebaseAuth = authSdk.getAuth(window.lexiaFirebaseApp);
  }
  return window.lexiaFirebaseAuth;
}
window.lexiaGoogleLogin = async function(selectedRole){
  if(!firebaseIsConfigured()){
    alert("Firebase ainda não foi configurado. Entrando em modo demonstrativo.");
    window.lexiaApplyGoogleUser(selectedRole,null);
    return;
  }
  try{
    const auth = await getFirebaseAuth();
    const {GoogleAuthProvider,signInWithPopup} = window.lexiaFirebaseAuthSdk || await import(`https://www.gstatic.com/firebasejs/${firebaseSdkVersion}/firebase-auth.js`);
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({prompt:"select_account"});
    const result = await signInWithPopup(auth,provider);
    const user = result.user;
    window.lexiaFirebaseUser = user;
    window.lexiaApplyGoogleUser(roleForGoogleEmail(user.email),{name:user.displayName||user.email,email:user.email});
  }catch(err){
    alert("Não foi possível entrar com Google. Verifique a configuração do Firebase e os domínios autorizados.");
    console.error(err);
  }
};
window.lexiaFirebaseSignOut = async function(){
  try{
    if(!window.lexiaFirebaseAuth)return;
    const {signOut} = window.lexiaFirebaseAuthSdk || await import(`https://www.gstatic.com/firebasejs/${firebaseSdkVersion}/firebase-auth.js`);
    await signOut(window.lexiaFirebaseAuth);
    window.lexiaFirebaseUser = null;
  }catch(err){
    console.warn(err);
  }
};
</script>
