tende ao regime constitucional vigente, pois a matéria em questão exige projeto de iniciativa da Câmara Municipal, não do Chefe do Poder Executivo."],"gabarito":"D","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa D. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":6,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":17,"codigo":"OAB2026TIPO1-017","area":"Direitos Humanos","dificuldade":"Difícil","enunciado":"Na condição de advogado(a), você é procurado(a) por membros de uma comunidade indígena que estão sofrendo reiteradas ofensas aos seus direitos originários sobre as terras que tradicionalmente ocupam, sofrendo renitente esbulho, em conflito possessório que se arrasta desde antes da promulgação da Constituição Federal de 1988. Nesse contexto, de acordo com o entendimento da Corte Interamericana de Direitos Humanos (Corte IDH) e do Supremo Tribunal Federal (STF), assinale a opção que apresenta, corretamente, a sua orientação.","alternativas":["Diante da natureza jurídica despersonalizada da comunidade indígena, reconhece-se a possibilidade de quaisquer de seus integrantes pleitear individualmente, em substituição à coletividade respectiva, o provimento de tutela jurisdicional adequada à proteção dos seus direitos originários violados.","Em razão da situação narrada protrair-se no tempo, estendendo-se o conflito possessório a período anterior à edição da nova ordem constitucional, não há, no caso, óbice de ordem técnico-jurídica que inviabiliza o reconhecimento da tradicionalidade da ocupação indígena, nos termos da jurisprudência mais recente do STF.","Tanto a Corte IDH quanto o STF reconhecem a possibilidade de a comunidade indígena, por livre disposição, anuir à solução conciliatória em que se estabeleça a alienação das terras indígenas, desde que o produto da venda seja destinado exclusivamente à comunidade, assegurada a sua capacidade de autodeterminação sobre a sua disposição.","Diante das peculiaridades culturais e de organização inerentes aos povos originários, para melhor proteção dos seus direitos, é obrigatório que a sua representação em juízo seja realizada por órgão governamental especialmente instituído para atuar na defesa de seus interesses, como ocorre no contexto brasileiro com a Fundação Nacional do Índio (Funai)."],"gabarito":"B","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa B. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":7,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":18,"codigo":"OAB2026TIPO1-018","area":"Direitos Humanos","dificuldade":"Médio","enunciado":"Após a edição da Emenda Constitucional nº 45/2004, com a inserção do § 3º no Art. 5º da Constituição Federal de 1988, muito se discutiu acerca do status normativo que deveria ser atribuído aos Tratados e Convenções Internacionais sobre Direitos Humanos já incorporados ao ordenamento jurídico brasileiro em data anterior ao advento da reforma constitucional referida. Acerca do tema, e de acordo com a atual jurisprudência do Supremo Tribunal Federal (STF), assinale a opção correta.","alternativas":["Diante da impossibilidade de adoção do rito constitucionalmente exigido para a aprovação de emendas constitucionais, os Tratados e as Convenções Internacionais sobre Direitos Humanos incorporados ao ordenamento jurídico nacional antes da EC nº 45/2004 possuem status de lei ordinária.","Diante da ausência de previsão constitucional expressa em relação à matéria, em razão dos compromissos assumidos pelo Estado brasileiro no plano internacional, os Tratados e as Convenções Internacionais sobre Direitos Humanos incorporados ao ordenamento jurídico nacional antes da EC nº 45/2004 possuem status de norma supraconstitucional.","Em razão da cláusula aberta contida no Art. 5º, § 2º, da Constituição Federal de 1988, ao admitir expressamente a existência de outros direitos fundamentais para além daqueles expressamente elencados no texto constitucional, os Tratados e as Convenções Internacionais sobre Direitos Humanos incorporados ao ordenamento jurídico nacional antes da EC nº 45/2004 possuem status de norma constitucional.","Em razão da necessidade de interpretação do texto constitiucional, notadamente as previsões insertas nos parágrafos do art. 5º da Constituição Federal de 1988, à luz do Art. 7º, § 7º, da Convenção Americana de Direitos Humanos (Pacto de São José da Costa Rica), os Tratados e as Convenções Internacionais sobre Direitos Humanos incorporados ao ordenamento jurídico nacional antes da edição da EC nº 45/2004 possuem status supralegal."],"gabarito":"D","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa D. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":7,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":19,"codigo":"OAB2026TIPO1-019","area":"Direito Eleitoral","dificuldade":"Médio","enunciado":"Maria pretendia concorrer ao cargo eletivo de senadora. Embora tivesse nascido no Estado Alfa e passasse a maior parte do seu tempo nesse Estado, possuía propriedades nos Estados Beta e Gama, para onde se deslocava com regularidade em razão de sua atividade profissional, ali permanecendo por longos períodos. Para saber em qual desses Estados poderia concorrer ao cargo eletivo de senadora, Maria o(a) consultou como advogado(a). Sobre a hipótese apresentada, assinale a afirmativa correta.","alternativas":["Maria somente pode concorrer no Estado em que tenha domicílio eleitoral, o qual deve ser estabelecido até seis meses antes da eleição.","Na medida em que o domicílio eleitoral é uma condição de elegibilidade regida pelo princípio da unicidade, Maria deve defini-lo no momento do registro.","Em razão do caráter nacional do cargo eletivo de senadora, Maria pode concorrer em qualquer dos Estados, ainda que não tenha domicílio eleitoral no Estado escolhido.","Como o domicílio eleitoral não é uma ficção, sendo regido pela realidade, Maria somente pode concorrer no Estado Alfa, no qual passa a maior parte do tempo, ainda que tenha declinado domicílio diverso à Justiça Eleitoral."],"gabarito":"A","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa A. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":7,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":20,"codigo":"OAB2026TIPO1-020","area":"Direito Eleitoral","dificuldade":"Médio","enunciado":"Logo após a diplomação de Maria, candidata eleita para o cargo de Prefeita do Município Delta, Ana, candidata derrotada, procurou você, como advogado(a), com provas de que Maria recebera doação estimável em dinheiro, por meio da publicidade realizada, em seu benefício, pela organização da sociedade civil de interesse público Gama. Ana o(a) questionou em relação à juridicidade da conduta de Maria. Quanto à orientação a ser dada, assinale a afirmativa correta.","alternativas":["Trata-se de captação ilícita de recursos, e a medida a ser ajuizada deve observar o procedimento da ação de investigação judicial eleitoral.","Como não houve repasse de recursos financeiros, o fato de Maria ter sido beneficiada pela publicidade realizada por Gama não configura ilícito eleitoral.","Ocorreu a preclusão de qualquer medida passível de ser adotada em relação à situação descrita, o que torna desinfluente a análise de sua licitude ou não.","Como somente são admitidas doações expressas em moeda, a conduta é ilícita, o que acarreta a incidência da pena cominada, sendo possível a aplicação da sanção de multa a Gama e a Maria."],"gabarito":"A","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa A. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":7,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":21,"codigo":"OAB2026TIPO1-021","area":"Direito Internacional","dificuldade":"Difícil","enunciado":"Um cidadão brasileiro, domiciliado na Espanha, faleceu deixando um testamento particular que dispõe sobre bens situados tanto no exterior quanto no Brasil. Após a sua morte, os herdeiros promoveram, de comum acordo, perante autoridade notarial estrangeira competente, procedimento consensual de confirmação do testamento particular e partilha do patrimônio, incluindo os bens localizados no Brasil. Posteriormente, requereram ao Superior Tribunal de Justiça (STJ) a homologação do ato notarial estrangeiro, alegando a inexistência de litígio entre os herdeiros e a plena validade do procedimento conforme a legislação do país de origem. Sobre o caso apresentado, à luz do sistema jurídico brasileiro, assinale a afirmativa correta.","alternativas":["A homologação será possível apenas se o ato estrangeiro for convertido em decisão judicial no país de origem, pois somente decisões judiciais estrangeiras são passíveis de homologação pelo STJ.","O ato notarial poderá ser homologado pelo STJ desde que todos os herdeiros sejam capazes e tenham manifestado consentimento expresso quanto à confirmação do testamento e à partilha dos bens, inclusive os situados no Brasil.","A homologação deverá ser deferida parcialmente, produzindo efeitos automáticos sobre os bens situados no Brasil, em respeito ao princípio da autonomia da vontade dos herdeiros e ao reconhecimento internacional dos atos notariais.","O ato notarial estrangeiro não poderá ser homologado na parte relativa aos bens situados no Brasil, pois a confirmação de testamento particular e a partilha desses bens se inserem na competência jurisdicional exclusiva da autoridade judiciária brasileira."],"gabarito":"D","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa D. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":8,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":22,"codigo":"OAB2026TIPO1-022","area":"Direito Internacional","dificuldade":"Médio","enunciado":"François, cidadão francês, residente e domiciliado na Holanda, e Maria, cidadã brasileira, residente e domiciliada na França, são casados. Conheceram-se na Alemanha, onde concluíram o doutorado em Direito Internacional na Universidade de Frankfurt. Os nubentes eram domiciliados na Alemanha na ocasião do casamento e tiveram em Frankfurt o seu primeiro domicílio conjugal. Posteriormente, mudaram-se para países diferentes por razões profissionais. Após alguns meses, resolveram não dar continuidade ao casamento. Maria pretende ajuizar ação de divórcio no Brasil porque está prestes a retornar ao seu país de origem. Sobre a hipótese, assinale a opção que indica a lei que será aplicada ao regime de bens de acordo com a legislação brasileira, em especial a Lei de Introdução às Normas do Direito Brasileiro.","alternativas":["Francesa.","Brasileira.","Alemã.","Holandesa."],"gabarito":"C","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa C. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":8,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":23,"codigo":"OAB2026TIPO1-023","area":"Direito Financeiro","dificuldade":"Médio","enunciado":"O Município Alfa estava enfrentando dificuldades para pagar em dia a remuneração de seus servidores públicos municipais. Em razão disso, resolveu requerer à instituição financeira federal BNDES um empréstimo, a fim de pagar as remunerações em atraso. O Município ofereceu, em garantia do empréstimo, terrenos de sua propriedade, cujo valor de mercado inclusive suplantava o montante a ser emprestado. Diante desse cenário, assinale a afirmativa correta.","alternativas":["É proibido ao BNDES realizar empréstimo para o pagamento de despesas com pessoal.","Como houve oferta de garantia em valor superior ao do empréstimo, este deverá ser realizado pelo BNDES.","É facultado ao BNDES realizar o empréstimo, mas apenas se reputar que as garantias oferecidas são de liquidez satisfatória.","Somente uma instituição financeira controlada pelo Estado em que se localiza o Município Alfa poderia realizar tal empréstimo."],"gabarito":"A","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa A. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":8,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":24,"codigo":"OAB2026TIPO1-024","area":"Direito Financeiro","dificuldade":"Médio","enunciado":"Em determinado ano, na elaboração do projeto de Lei Orçamentária Anual (LOA) da União, o Poder Executivo resolveu inserir as previsões de despesas para os exercícios seguintes, com a especificação dos investimentos plurianuais e daqueles em andamento. Sobre esse projeto de LOA, à luz das regras constitucionais de elaboração das leis orçamentárias, assinale a afirmativa correta.","alternativas":["Veiculou indevidamente investimentos plurianuais e aqueles em andamento, os quais somente poderiam constar do Plano Plurianual (PPA).","Inseriu, equivocadamente, os investimentos plurianuais em seu conteúdo, pois deveriam estar previstos na Lei de Diretrizes Orçamentárias (LDO).","Adequa-se às disposições constitucionais que permitem tais inserções dos investimentos plurianuais e daqueles em andamento.","Poderia conter, apenas, os investimentos já em andamento, uma vez que os investimentos plurianuais somente poderiam constar do Plano Plurianual (PPA)."],"gabarito":"C","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa C. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":8,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":25,"codigo":"OAB2026TIPO1-025","area":"Direito Tributário","dificuldade":"Médio","enunciado":"Com necessidade de ampliar os gastos na área da seguridade social, a União criou uma nova contribuição de seguridade social, por meio da Lei Ordinária nº XXX/2024, publicada em 1º de setembro de 2024, cuja cobrança se iniciou em 1º de novembro de 2024. Diante desse cenário, assinale a afirmativa correta.","alternativas":["A Lei Ordinária nº XXX/2024 é inconstitucional por violar tanto a reserva de lei complementar como os princípios da anterioridade tributária anual e nonagesimal.","Embora não viole o princípio da anterioridade tributária anual, a Lei Ordinária nº XXX/2024 é inconstitucional por violar tanto a reserva de lei complementar como o princípio da anterioridade tributária nonagesimal.","Não há qualquer inconstitucionalidade na Lei Ordinária nº XXX/2024, uma vez que as novas contribuições de seguridade social são instituídas por meio de lei ordinária e constituem exceção aos princípios da anterioridade tributária anual e nonagesimal.","As novas contribuições de seguridade social constituem exceção aos princípios da anterioridade tributária anual e nonagesimal, de modo que a única inconstitucionalidade formal presente na Lei Ordinária nº XXX/2024 é a de violar a reserva de lei complementar."],"gabarito":"B","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa B. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":9,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":26,"codigo":"OAB2026TIPO1-026","area":"Direito Tributário","dificuldade":"Difícil","enunciado":"Mateus devia um valor elevado ao Fisco Federal, em dívidas de certo tributo federal devidamente lançadas e inscritas em Dívida Ativa da União ainda não prescritas, o que levou a Procuradoria da Fazenda Nacional (PFN), em fevereiro de 2020, a ajuizar execução fiscal contra ele. Mateus não foi localizado para ser citado nem foram encontrados bens sobre os quais poderia recair a penhora, tendo sido a PFN cientificada desses fatos, em abril de 2020. Assim, foi requerida e realizada a citação de Mateus por edital, ainda em abril de 2020. Em julho de 2025, sem que a situação se alterasse, o Magistrado, ouvida previamente a Fazenda Nacional, decretou a ocorrência da prescrição de tais créditos tributários. Diante desse cenário, assinale a afirmativa correta.","alternativas":["Ocorreu a prescrição direta de tais créditos, pois foi alcançado o prazo prescricional quinquenal previsto no Código Tributário Nacional.","A ausência de citação pessoal de Mateus impede o curso da prescrição, de modo que esta, nesse caso, não poderia ter se consumado.","A prescrição intercorrente prevista no Código Tributário Nacional, ocorrida na pendência do processo de execução fiscal, fulminou tais créditos tributários.","A prescrição intercorrente prevista na Lei de Execuções Fiscais ainda não havia sido atingida, pois não se computou na contagem geral do prazo o período de 1 ano de suspensão do curso da execução."],"gabarito":"D","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa D. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":9,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":27,"codigo":"OAB2026TIPO1-027","area":"Direito Tributário","dificuldade":"Médio","enunciado":"João da Silva recebeu vultosa importância da sociedade empresária em que trabalhava, a título de indenização por danos morais, por ter sido exposto meses antes, em público, diante de seus colegas, a uma situação vexatória. No momento do pagamento do valor da indenização, a sociedade empresária reteve na fonte o Imposto sobre a Renda que entendeu devido, recolhendo-o em DARF no mesmo ato. João, inconformado com a retenção, impugnou administrativamente a cobrança, mas a decisão de primeira instância administrativa denegou a restituição do imposto. João então consultou você, como advogado(a), pretendendo reaver o imposto que entende ser indevido. Diante desse cenário, assinale a afirmativa correta.","alternativas":["Foi correta a retenção do Imposto de Renda sobre aquela verba indenizatória, por se tratar de fato ocorrido em relação de emprego, equiparando-a a verba salarial.","Caso queira promover ação anulatória contra a decisão administrativa que denegou a restituição do Imposto sobre a Renda, João terá um prazo máximo de dois anos para fazê-lo.","João somente poderá requerer judicialmente a restituição do valor de Imposto sobre a Renda retido indevidamente, por ter natureza indenizatória, após esgotar a via administrativa tributária em todas as instâncias.","Tendo sido negado em primeira instância administrativa o seu pedido de restituição do Imposto sobre a Renda que entende indevidamente retido, João somente poderá recorrer à segunda instância administrativa após realizar depósito prévio."],"gabarito":"B","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa B. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":9,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":28,"codigo":"OAB2026TIPO1-028","area":"Direito Tributário","dificuldade":"Médio","enunciado":"A lei federal que instituiu a Contribuição de Intervenção no Domínio Econômico incidente sobre a importação e a comercialização de petróleo e seus derivados (Cide Combustíveis) fixou a alíquota do álcool etílico combustível em R$ 37,20/m³ para a comercialização no mercado interno. Contudo, o governo federal, querendo estimular o uso do álcool etílico combustível, pelo Decreto do Presidente da República nº XXX, de 1º de agosto de 2024, reduziu esta alíquota para R$ 20,50/m³. Mudada a política governamental sobre a matéria, pelo Decreto nº YYY, datado de 1º de fevereiro de 2025, tal alíquota foi restabelecida em R$ 37,20/m³, com efeitos a serem produzidos a partir de 3 de junho de 2025. Diante desse cenário, assinale a afirmativa correta.","alternativas":["A produção de efeitos do Decreto nº YYY a partir de 3 de junho de 2025 viola o princípio da anterioridade tributária anual.","A redução da alíquota para R$ 20,50/m³ por decreto é inconstitucional, ainda que seja mais benéfica ao sujeito passivo tributário.","A redução da alíquota para R$ 20,50/m³ e seu restabelecimento para R$ 37,20/m³ podem ser feitas por decreto.","O restabelecimento de tal alíquota da Cide Combustíveis para o patamar de R$ 37,20/m³ por decreto viola o princípio da legalidade tributária."],"gabarito":"C","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa C. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":9,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":29,"codigo":"OAB2026TIPO1-029","area":"Direito Tributário","dificuldade":"Médio","enunciado":"O Município Alfa, por lei ordinária municipal, criou a Taxa de Fiscalização de Cemitérios, relativa ao custeio das atividades de fiscalização das instalações e atividades das concessionárias de cemitérios em território municipal, tendo tais concessionárias como contribuintes. A lei criadora estabeleceu que a data de pagamento dessa taxa seria fixada em decreto do Prefeito Municipal. O Decreto Municipal XX/2023 fixou a data de pagamento em 15 dias após o recebimento da notificação para pagamento. Diante desse cenário, assinale a afirmativa correta.","alternativas":["Somente lei municipal, e não mero decreto, poderia fixar o prazo de pagamento da referida taxa.","O Decreto Municipal XX/2023 não poderia fixar a data de pagamento dessa taxa em 15 dias, por contrariar o prazo de 30 dias previsto no Código Tributário Nacional (CTN).","Como a fiscalização de cemitérios configura uma taxa de polícia, e não uma taxa de serviço público específico e divisível, tal taxa não poderia ser instituída pelo Município Alfa.","Ainda que não houvesse previsão na lei instituidora do tributo de que seria um decreto a fixar a data de pagamento dessa taxa, o Decreto Municipal XX/2023 seria ato normativo apto a fazê-lo."],"gabarito":"D","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa D. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":10,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":30,"codigo":"OAB2026TIPO1-030","area":"Direito Administrativo","dificuldade":"Médio","enunciado":"A sociedade empresária Begônia deseja participar de um procedimento licitatório, na modalidade concorrência, para a contratação de uma obra, que adotará a sequência adotada como regra na Lei nº 14.133/2021, mas está com receio de ser prejudicada no julgamento das propostas, que antecede à fase de habilitação. Em razão disso, a sociedade empresária consultou você, como advogado(a), a fim de esclarecer a possibilidade de apresentar um recurso administrativo, o momento correto para fazê-lo e os efeitos dele decorrentes, caso tal receio venha a ser concretizado. Sobre essa situação hipotética, assinale a opção que indica, corretamente, o esclarecimento que você prestou.","alternativas":["Não há a possibilidade de se apresentar um recurso administrativo contra o julgamento das propostas, diante da vedação expressa na aludida norma.","Apenas depois da habilitação é que caberá a apresentação de um recurso administrativo contra o julgamento das propostas, de modo que é necessário aguardar o prosseguimento do certame para a manifestação da intenção de recorrer no momento oportuno.","O pedido de reconsideração em relação ao julgamento das propostas deve ser prontamente apresentado ao fim da respectiva fase e possui efeito suspensivo, de modo que a licitação só seguirá para a fase de habilitação após a apreciação das irresignações apresentadas.","A intenção de recorrer do julgamento das propostas deve ser imediatamente manifestada, mas o prazo para a apresentação das razões recursais será iniciado na data da intimação ou da lavratura da ata de habilitação ou inabilitação, pois sua apreciação dar-se-á em fase única."],"gabarito":"D","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa D. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":10,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":31,"codigo":"OAB2026TIPO1-031","area":"Direito Administrativo","dificuldade":"Médio","enunciado":"O Estado Alfa, cuja capital é o Município Beta, mediante decreto do Governador, em observância às formalidades legais, declarou de utilidade pública uma grande área localizada no Município Sigma, sede de Comarca, a qual abarca o imóvel pertencente ao particular João. Em razão do grande apego emocional com a localidade, onde vive há 25 anos, João recusou todas as propostas oferecidas pelo Poder Público e tentou impedir que as autoridades administrativas estaduais ingressassem no terreno do seu imóvel para a realização de levantamentos. Por isso, o Estado Alfa pretende ingressar, em juízo, com uma ação visando à desapropriação do bem. Preocupado, João contratou você, como advogado(a), para defendê-lo na futura demanda judicial. Nesse cenário, considerando as disposições do Decreto-Lei nº 3.365/1941, que versa sobre as desapropriações por utilidade pública, assinale a afirmativa correta.","alternativas":["A ação judicial deverá ser proposta pelo expropriante no foro da situação do bem imóvel, ou seja, na Comarca do Município Sigma.","As autoridades administrativas do Estado Alfa poderão ingressar nas áreas compreendidas pela declaração de utilidade pública após a autorização judicial específica, ouvido o expropriado João.","O Estado Alfa poderá se imitir provisoriamente na posse do imóvel de João, desde que, declarada a situação de urgência, deposite, em juízo, o valor que o expropriado João entender justo a título de indenização.","Incumbirá ao expropriado João, em sede de contestação, expor todas as razões de fato e de direito com que impugna o pedido do expropriante, especificando as provas que pretende produzir para demonstrar que inexiste utilidade pública na desapropriação almejada pelo Estado Alfa."],"gabarito":"A","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa A. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":10,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":32,"codigo":"OAB2026TIPO1-032","area":"Direito Administrativo","dificuldade":"Médio","enunciado":"A sociedade empresária Alfa tomou conhecimento de que o Conselho Diretor da Agência Reguladora Beta realizou reunião deliberativa, na semana anterior, tendo por objeto discussões sobre documentos classificados como sigilosos, bem como sobre matérias de natureza administrativa. Considerando que a data da referida reunião não foi previamente divulgada no sítio da agência reguladora na internet, tampouco foi gravada em meio eletrônico, os sócios da entidade privada procuraram você para, na qualidade de advogado (a), prestar a devida consultoria jurídica. Nesse cenário, à luz da Lei no 13.848/2019, que dispõe sobre a gestão, a organização, o processo decisório e o controle social das agências reguladoras, assinale a opção que apresenta, corretamente, a orientação jurídica prestada.","alternativas":["A reunião deliberativa do Conselho Diretor da Agência Reguladora Beta deverá ser anulada, na medida em que não houve a sua gravação em meio eletrônico.","Inexiste irregularidade na reunião deliberativa do Conselho Diretor da Agência Reguladora Beta, já que foram discutidos documentos classificados como sigilosos, bem como matérias de natureza administrativa.","Muito embora a gravação, em meio eletrônico, da reunião deliberativa do Conselho Diretor da Agência Reguladora Beta não fosse obrigatória, era necessário a prévia divulgação da sua data no sítio da referida autarquia na internet.","Para que a reunião deliberativa do Conselho Diretor da Agência Reguladora Beta seja anulada, a sociedade empresária Alfa deverá demonstrar prejuízo em razão da ausência de divulgação prévia desta no sítio da referida autarquia na internet."],"gabarito":"B","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa B. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":10,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":33,"codigo":"OAB2026TIPO1-033","area":"Direito Administrativo","dificuldade":"Médio","enunciado":"O Ministério Público ingressou, em Juízo, com ação de improbidade administrativa em face de João, agente público no Município Alfa, sob o fundamento de que ele teria, em outubro de 2025, frustrado, em ofensa à imparcialidade, o caráter concorrencial de procedimento licitatório. Citado, o servidor público ofereceu contestação, por meio da sua atuação, na qualidade de advogado(a). Contudo, as preliminares suscitadas pelo réu, na contestação, foram rejeitadas. Em assim sendo, João procurou você, na condição de advogado(a), para tomar conhecimento das próximas etapas procedimentais. Nesse cenário, considerando as disposições da Lei nº 8.429/1992 (Lei de Improbidade Administrativa), assinale a afirmativa correta.","alternativas":["A apelação é o recurso cabível para questionar a decisão judicial que rejeitou as questões preliminares suscitadas na contestação.","A defesa de João poderá interpor agravo de instrumento em detrimento da decisão judicial que rejeitou as questões preliminares suscitadas em sede de contestação.","Muito embora não seja cabível recurso em face da decisão judicial que rejeitou as questões preliminares suscitadas por João na contestação, nada impede que a defesa formule pedido de reconsideração.","Por não ter ingressado no mérito da relação processual, a decisão judicial que rejeitou as questões preliminares suscitadas na contestação não é passível de impugnação via recurso ou pedido de reconsideração."],"gabarito":"B","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa B. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":11,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":34,"codigo":"OAB2026TIPO1-034","area":"Direito Administrativo","dificuldade":"Fácil","enunciado":"As autoridades competentes de determinado órgão federal, diante do grande acúmulo de trabalho, fizeram editar um ato formal delegando parcela de sua competência para outro órgão que a ele não é hierarquicamente subordinado, mediante a especificação das matérias e dos poderes transferidos, os limites da atuação do delegado, a duração e os objetivos da delegação e o recurso cabível. Ao tomar conhecimento de tal fato, Gyslaine ficou muito preocupada quanto à possibilidade de o órgão delegado vir a decidir determinado recurso administrativo que estava tramitando perante o órgão delegante, razão pela qual buscou a sua assessoria jurídica a fim de esclarecer as peculiaridades e os limites da delegação de competência, à luz do disposto na Lei nº 9.784/1999. Assinale a opção que apresenta a informação correta que você, na qualidade de advogado(a), prestou.","alternativas":["A competência relativa à decisão de recursos administrativos não pode ser objeto de delegação.","O ato de delegação é irrevogável, razão pela qual o desfazimento da delegação deve ser objeto de avocação.","A competência, inexistindo impedimento legal, apenas poderia ser delegada para o órgão hierarquicamente subordinado.","As decisões adotadas por delegação devem mencionar explicitamente essa qualidade e considerar-se-ão editadas pela autoridade delegante, que detém a competência originária."],"gabarito":"A","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa A. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":11,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":35,"codigo":"OAB2026TIPO1-035","area":"Direito Ambiental","dificuldade":"Fácil","enunciado":"A sociedade empresária Alfa está em processo de licenciamento ambiental de atividade de tingimento de tecidos e fabricação de roupas, e pretende obter outorga pelo Poder Público do direito do uso de recursos hídricos, consistente em extração de água de aquífero subterrâneo existente no local, como insumo do processo produtivo. Nesse contexto, o empreendedor tomou conhecimento de que será cobrado um valor pelo recurso natural consumido. Inconformado com a cobrança, pois ainda terá grande gasto financeiro com as obras para a extração de água do aquífero, a sociedade empresária procurou a advogada Marcela, especialista em Direito Ambiental, para esclarecer as dúvidas dele acerca da viabilidade de tal exigência. Sobre a cobrança pelo uso da água, à luz dos princípios do Direito Ambiental, assinale a opção que apresenta, corretamente, o esclarecimento dado por Marcela.","alternativas":["O empreendedor não deve pagar pelo uso da água, exceto se houver efetivo dano ambiental, com base no princípio de direito ambiental da prevenção.","A cobrança antecipada por danos ambientais a serem causados por poluidores é pertinente, com base no princípio de direito ambiental do desenvolvimento sustentável.","O empreendedor deve pagar uma contribuição financeira à coletividade, que sofre as consequências do uso privado da água, com base no princípio de direito ambiental do usuário-pagador.","A cobrança pelo uso da água não é pertinente, salvo se houver efetivo dano ambiental com a necessária prova pericial que demonstre o nexo causal, com base no princípio de direito ambiental da precaução."],"gabarito":"C","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa C. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":11,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":36,"codigo":"OAB2026TIPO1-036","area":"Direito Ambiental","dificuldade":"Médio","enunciado":"O Prefeito do Município Ômega, após os trâmites pertinentes, fez editar um decreto que delimitou uma Área de Proteção Ambiental (APA), unidade de conservação de uso sustentável, em decorrência de sua grande extensão e do grau de ocupação humana, diante de atributos abióticos, bióticos, estéticos ou culturais especialmente importantes para a qualidade de vida e o bem-estar das populações humanas. Dessa maneira busca proteger a diversidade biológica, disciplinar o processo de ocupação e assegurar a sustentabilidade do uso dos recursos naturais. A propriedade privada de Adélia Figueiredo está situada dentro da mencionada unidade de conservação. Preocupada, ela procura você, como advogado, para receber orientação sobre a validade do mencionado decreto e a extensão de seus efeitos, à luz do disposto na Lei nº 9.985/2000. Acerca dessa situação hipotética, assinale a afirmativa correta.","alternativas":["As condições para a pesquisa e a visitação do público, observadas as exigências e restrições legais, devem ser estabelecidas por Adélia.","O Prefeito não poderia ter editado um decreto para a finalidade descrita, pois a Unidade de Conservação Ambiental só pode ser criada por lei.","A propriedade de Adélia deve ser desapropriada de acordo com o que dispõe a lei, porque está localizada em uma Unidade de Conservação de domínio público.","A Unidade de Conservação pertence, na realidade, ao grupo das unidades de proteção integral, o que permite o uso dos recursos naturais pelos proprietários privados."],"gabarito":"A","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa A. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":11,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":37,"codigo":"OAB2026TIPO1-037","area":"Direito Civil","dificuldade":"Fácil","enunciado":"Joaquim Cardoso e Celina de Holanda são pais das gêmeas Clarice e Maria, que têm 17 anos de idade. No ano passado, Clarice, com a devida autorização dos pais, casou-se com Ariano. Maria, no mês de março deste ano, iniciou o curso de Medicina em uma universidade federal. O casal procurou você, como advogado(a) especializado(a) em Direito Civil, para ser orientado sobre a situação jurídica das filhas. A respeito da capacidade civil das filhas de Joaquim e Celina, assinale a afirmativa correta.","alternativas":["Como Clarice é casada, ela é civilmente capaz.","Maria do Carmo, pela matrícula no ensino superior, é civilmente capaz.","Todas as filhas são relativamente incapazes, pois são maiores de 16 e menores de 18 anos.","Todas as filhas são absolutamente incapazes, pois são menores de 18 anos, sujeitando-se à autoridade parental."],"gabarito":"A","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa A. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":12,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":38,"codigo":"OAB2026TIPO1-038","area":"Direito Civil","dificuldade":"Médio","enunciado":"Joaquim, de 71 anos de idade, é viúvo de Marta há cerca de quatro anos, e não finalizou a partilha de bens deixados por sua falecida esposa, porque há um litígio entre o filho comum do ex-casal e a filha do primeiro casamento de Marta. Na semana passada, Joaquim procurou você, como advogado(a), para ser orientado juridicamente acerca da união que pretende estabelecer com Joana, tendo em vista que a partilha anterior não será realizada antes do novo matrimônio. A respeito do regime de bens que deveria adotar na nova união, assinale a opção que apresenta, corretamente, a sua orientação.","alternativas":["Separação convencional de bens, ante a idade de Joaquim.","Qualquer regime de bens, por força da autonomia que é assegurada a Joaquim.","Comunhão parcial de bens, de forma a resguardar os bens ainda não partilhados.","Separação obrigatória de bens, para evitar a confusão patrimonial entre os vínculos conjugais."],"gabarito":"D","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa D. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":12,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":39,"codigo":"OAB2026TIPO1-039","area":"Direito Civil","dificuldade":"Médio","enunciado":"Após uma intensa discussão motivada por questões financeiras, Lucas desferiu golpes fatais em seus pais, resultando na morte de ambos, que deixaram uma herança significativa. Mateus, seu irmão mais novo, ainda menor de idade, está sob a tutela de seu tio Ricardo, que se recusa a promover a exclusão de Lucas da sucessão por indignidade. Considerando que Mateus, por ser menor, não tem capacidade legal para agir diretamente, surgem dúvidas sobre quem tem legitimidade para requerer judicialmente a exclusão de Lucas da herança e quais são os procedimentos adequados para isso. Diante da situação hipotética narrada e com base na legislação vigente, assinale a afirmativa correta.","alternativas":["Apenas Mateus, ao atingir a maioridade, terá o direito de pedir judicialmente a exclusão de Lucas da sucessão, pois ele é o herdeiro direto prejudicado.","O Ministério Público tem legitimidade para requerer a exclusão de Lucas por indignidade, protegendo os direitos de Mateus, menor e incapaz de agir por conta própria.","Apenas Ricardo, na qualidade de tutor de Mateus, pode requerer judicialmente a exclusão de Lucas da sucessão, e a recusa de Ricardo impede que qualquer outra pessoa o faça.","Lucas só poderá ser excluído da sucessão se Ricardo, na qualidade de tutor, concordar, independentemente da legitimidade de outro herdeiro ou do Ministério Público para a propositura da ação."],"gabarito":"B","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa B. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":12,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":40,"codigo":"OAB2026TIPO1-040","area":"Direito Civil","dificuldade":"Médio","enunciado":"Lorena resolveu alienar um imóvel avaliado em R$ 2.000.000,00 para Marta. Para tanto, elas elaboraram uma minuta de contrato de compra e venda, especificando as partes, o bem, o preço e a forma de pagamento. Considerando a urgência da vendedora, que iria se mudar para o exterior, essa minuta foi impressa na casa de Marta e assinada pelas partes e pelas testemunhas Natália e Oscar. Sobre a situação hipotética narrada, assinale a afirmativa correta.","alternativas":["O contrato de compra e venda é válido, uma vez que, na presença de duas testemunhas, o instrumento particular poderia ser utilizado.","O contrato de compra e venda é nulo, por desobediência de sua forma, mas poderá ser convertido em promessa de compra e venda.","O contrato de compra e venda é anulável, por vício de sua forma, decaindo as partes do direito de promover a anulação no prazo de dois anos de sua celebração.","O contrato de compra e venda é anulável por vício de forma. A lei permite, entretanto, a sua convalidação caso haja o reconhecimento das firmas de todos os envolvidos no Ofício de Notas."],"gabarito":"B","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa B. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":12,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":41,"codigo":"OAB2026TIPO1-041","area":"Direito Civil","dificuldade":"Médio","enunciado":"Eduardo vendeu um imóvel urbano a Clara, estipulando em contrato particular que, caso futuramente ela decidisse vendê-lo, Clara deveria notificá-lo previamente, conferindo-lhe o direito de adquirir o bem nas mesmas condições ofertadas a terceiros. Passados doze meses da compra, Clara recebeu proposta de venda pelo mesmo valor pago e, sem notificar Eduardo, vendeu o imóvel para Flávio. Eduardo, ao saber do negócio já concluído, procurou Flávio para discutir o direito de preferência, mas este afirmou não ter sido informado sobre qualquer cláusula contratual anterior. Eduardo ajuizou ação para haver o imóvel para si, mediante o pagamento do mesmo valor da proposta aceita por Clara. Com base nas disposições legais sobre o direito de preempção, assinale a afirmativa correta.","alternativas":["Eduardo não pode exigir o imóvel para si, mas poderá pleitear perdas e danos contra Clara, caso comprove que foi privado de exercer seu direito de preferência.","Eduardo poderá reaver o imóvel se provar que notificou Flávio, por escrito, antes da conclusão do negócio, mesmo que Clara tenha omitido a existência da preferência.","Eduardo perdeu o direito à preempção, pois este não pode ser exercido se o novo comprador não tinha ciência da cláusula de preferência existente no contrato anterior.","Eduardo pode exigir o imóvel para si, mediante depósito do valor ajustado com o terceiro, desde que o faça no prazo de até 180 dias da alienação, conforme admite o Código Civil."],"gabarito":"A","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa A. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":13,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":42,"codigo":"OAB2026TIPO1-042","area":"Direito Civil","dificuldade":"Médio","enunciado":"Sara, em 24 de outubro de 2023, outorgou a Vítor, seu filho, uma procuração por instrumento público para vender seu imóvel até 24 de outubro de 2026. No momento da outorga, Sara gozava de boa saúde mental. A partir de 2024, Sara passou a sofrer um acelerado processo de demência, vindo a perder as suas habilidades cognitivas básicas no início de 2025. Sara foi interditada e Roberto, seu marido, tornou-se o seu curador. Em 24 de setembro de 2025, Raul se interessou em comprar o imóvel de Sara, e Vítor se apresentou como procurador da mãe. Na qualidade de advogado de Raul, assinale a opção que apresenta a sua orientação jurídica para o caso.","alternativas":["Não recomendaria a aquisição do imóvel, figurando Vítor como representante de Sara, pois há possíveis interesses conflitantes entre eles.","Não recomendaria a aquisição do imóvel, figurando Vítor como representante de Sara, pois, diante da interdição, o contrato de mandato é extinto.","Recomendaria a aquisição do imóvel, figurando Vítor como representante de Sara, pois, apesar da incapacidade superveniente, o contrato de mandato é eficaz até o término do prazo, quando este for determinado.","Recomendaria a aquisição do imóvel, figurando Vítor como representante de Sara, pois, tendo a procuração sido outorgada por instrumento público, e estando Sara com boa saúde mental no momento da outorga, o mandato é válido e eficaz."],"gabarito":"B","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa B. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":13,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":43,"codigo":"OAB2026TIPO1-043","area":"Estatuto da Criança e do Adolescente","dificuldade":"Fácil","enunciado":"Enzo, de 16 anos de idade, ingressou em um grande supermercado e subtraiu diversas peças de picanha, que totalizaram mais de R$ 2.000,00 (dois mil reais). Um segurança, percebendo a atitude suspeita de Enzo, o apreendeu no estacionamento. Enzo confessou a autoria. O Ministério Público representou contra o adolescente pela prática de ato infracional análogo ao crime de furto (Art. 155, caput, do CP). Durante a instrução processual, ficou constatado que essa foi a primeira passagem de Enzo pela Vara da Infância e Juventude. A família de Enzo procurou você, como advogado(a), para saber qual medida poderá ser aplicada ao caso. Com base na expressa disposição do Estatuto da Criança e do Adolescente (ECA), assinale a afirmativa que apresenta, corretamente, a medida que você indicou.","alternativas":["Não poderá ser aplicada a medida socioeducativa de advertência, tendo em vista a primariedade e a pouca lesividade do ato.","Ele deve receber a medida socioeducativa de internação, já que isso o afastará do meio criminoso e permitirá sua ressocialização.","A medida cabível é a semiliberdade, já que ele deve receber uma medida socioeducativa, mas não a ponto de mantê-lo totalmente privado de liberdade.","Não cabe a aplicação da medida socioeducativa de internação, porque o ato não foi cometido mediante grave ameaça ou violência à pessoa e não há reiteração em infrações graves."],"gabarito":"D","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa D. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":13,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":44,"codigo":"OAB2026TIPO1-044","area":"Estatuto da Criança e do Adolescente","dificuldade":"Médio","enunciado":"Matheus, 17 anos, insiste em passar longos períodos na rua, deixando de lado os deveres escolares e, também, os compromissos familiares. A rebeldia de Matheus é atribuída à ausência do pai, que abandonou a família logo após o seu nascimento e de quem nunca mais ele teve notícia. Carolina, preocupada com a situação do filho, busca a inserção de Matheus no mercado formal de trabalho e encontra a oportunidade em um grande supermercado da região. O estabelecimento necessita de uma pessoa para carregar as caixas de produtos e abastecer o mercado durante a madrugada, especificamente entre meia-noite e quatro horas da manhã. Entretanto, por ainda não ter atingido a maioridade, Carolina possui dúvidas sobre a possibilidade de Matheus trabalhar. Por isso, procura você, como advogado(a), para ter sua orientação jurídica. Sobre a hipótese apresentada, assinale a afirmativa que, corretamente, apresenta a sua orientação.","alternativas":["Matheus, por estar no final da adolescência, pode trabalhar sem restrições.","Matheus não pode ingressar no mercado formal de trabalho, por ainda não ter completado 18 anos.","Matheus não pode trabalhar no cargo oferecido, já que o ECA veda o trabalho noturno entre as 22h de um dia e as 5h do dia seguinte.","Por ter 17 anos, Matheus pode trabalhar no mercado durante a madrugada, desde que a atividade não prejudique a sua frequência às aulas."],"gabarito":"C","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa C. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":13,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":45,"codigo":"OAB2026TIPO1-045","area":"Direito do Consumidor","dificuldade":"Médio","enunciado":"Mário, passando por dificuldades financeiras, solicitou, em juízo, a instauração de processo de repactuação de dívidas, que é deferido juntamente com a designação de audiência conciliatória. Na data fixada, a maior parte dos credores compareceu, com exceção do Banco XYZ S.A., que preferiu não se submeter à conciliação por superendividamento, por entender ser infrutífero o procedimento. A respeito da ausência do Banco XYZ S.A. à audiência, assinale a afirmativa correta.","alternativas":["Acarreta o vencimento antecipado da dívida de Mário.","Interrompe os encargos da mora incidentes em seu crédito.","Permite-lhe ajuizar individualmente ação de cobrança do crédito.","Importa na submissão ao plano de repactuação de dívidas nas mesmas condições que os credores presentes."],"gabarito":"B","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa B. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":14,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":46,"codigo":"OAB2026TIPO1-046","area":"Direito do Consumidor","dificuldade":"Médio","enunciado":"Maria Victoria, em maio de 2023, decidiu aceitar a oferta do cartão de crédito Black, oferecido pelo Banco Y, do qual já era correntista há cerca de três anos. Contudo, em agosto de 2023, deixou de pagar a fatura de julho, no valor de R$ 5.300,00 (cinco mil e trezentos reais). Em razão disso, passado o vencimento, o Banco Y debitou automaticamente da conta-corrente dela o valor de R$ 300,00 (trezentos reais), referente ao denominado “pagamento mínimo” da fatura do cartão de crédito. Sobre a hipótese apresentada, assinale a afirmativa correta.","alternativas":["Nas hipóteses em que não há previsão contratual para tanto, é possível ao banco debitar automaticamente o valor integral da fatura do cartão de crédito da conta-corrente do consumidor, quando ultrapassados 60 dias do inadimplemento e notificado o consumidor do débito após 30 dias da data do seu vencimento.","Independentemente de serem contratos distintos, pelo fato de existir uma única relação jurídica entre o consumidor e o banco, pode o banco debitar o valor mínimo da fatura do cartão de crédito automaticamente da conta-corrente do consumidor em caso de inadimplemento.","Havendo saldo em conta, mesmo não havendo previsão contratual para tanto, é possível ao banco debitar automaticamente o valor integral da fatura do cartão de crédito da conta-corrente do consumidor, quando ultrapassados 30 dias do inadimplemento e notificado o consumidor do débito.","Tratando-se de contratos distintos, de cartão de crédito e de conta-corrente, o banco somente pode fazer o débito na conta-corrente do valor mínimo da fatura se essa possibilidade estiver prevista de forma expressa, clara e destacada no contrato celebrado com a instituição financeira."],"gabarito":"D","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa D. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":14,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":47,"codigo":"OAB2026TIPO1-047","area":"Direito Empresarial","dificuldade":"Médio","enunciado":"Mercado Barra Velha Ltda. emitiu nota promissória no valor de R$ 19.800,00 (dezenove mil e oitocentos reais), com vencimento no dia 19 de dezembro de 2021. Não houve pagamento na data do vencimento e o credor somente levou o título a protesto no dia 2 de dezembro de 2023, sendo o protesto lavrado dois dias após. Sobre o caso, com base na legislação de regência da nota promissória e das condições para sua cobrança em face do emitente, assinale a afirmativa correta.","alternativas":["O credor ainda poderá promover a execução da nota promissória em face do emitente em razão da interrupção da prescrição pelo protesto cambial.","O credor poderá promover a execução da nota promissória em face do emitente, considerando-se que ainda não expirou o prazo de cinco anos para a propositura da ação cambial.","O credor não pode promover a execução da nota promissória, em razão do protesto para a cobrança do emitente ser facultativo e do decurso do prazo de três anos da data do vencimento.","O título deveria ter sido apresentado até o primeiro dia útil após o vencimento, acarretando a perda do direito de ação em caso de inobservância dessa regra, embora o protesto seja facultativo para a cobrança."],"gabarito":"A","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa A. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":14,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":48,"codigo":"OAB2026TIPO1-048","area":"Direito Empresarial","dificuldade":"Difícil","enunciado":"A padaria Jacaré dos Homens Ltda. teve sua falência requerida em razão da impontualidade no pagamento de duplicata de prestação de serviço, no valor de R$ 62.000,00 (sessenta e dois mil reais), aceita e devidamente protestada para este fim. A devedora procurou você, como advogado(a), informando que pretende depositar o valor cobrado. Acerca deste depósito, assinale a afirmativa correta.","alternativas":["Deverá ser realizado em dinheiro, no prazo de quinze dias, contado da citação da devedora.","Compreenderá o valor total do crédito, acrescido de correção monetária, juros e honorários advocatícios.","Suspenderá o processo pelo prazo de trinta dias ou até que seja apreciado o mérito da cobrança, o que ocorrer por último.","Poderá ser realizado em dinheiro ou mediante prestação de caução real ou fidejussória no prazo de cinco dias, contado da citação."],"gabarito":"B","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa B. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":14,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":49,"codigo":"OAB2026TIPO1-049","area":"Direito Empresarial","dificuldade":"Médio","enunciado":"A sociedade empresária Pinheiros & Filhos Ltda., constituída em 2017 e com sede em Pancas, ES, pretende registrar como marca o sinal distintivo nominativo Pancadão, a ser utilizado nos produtos alimentícios que ela fornece a mercados, supermercados e armazéns na região de Pancas, ES, e Resplendor, MG. Na mesma cidade de Pancas, ES, há um estabelecimento explorado pelo empresário individual Domingos Guandu, cujo título é Bar e Mercearia Pancadão, constituído em 2000 e usado desde então, que revende os produtos alimentícios fornecidos por Pinheiros & Filhos Ltda. Considerados estes dados, a respeito do registro de marca, assinale a afirmativa correta.","alternativas":["Não há impedimento do registro de Pancadão como marca, pois o uso do mesmo sinal distintivo para título de estabelecimento de terceiro, ainda que anterior, é incapaz de retirar a originalidade da marca.","Não há impedimento do registro de Pancadão como marca, haja vista que o sinal distintivo é novo e só há proteção para o título de estabelecimento no âmbito da propriedade industrial com o registro no INPI.","Pancadão não poderá ser registrado como marca por ser a reprodução de sinal distintivo característico de título de estabelecimento de terceiro, quando suscetível de causar confusão ou associação entre a marca e o título de estabelecimento.","Pancadão não poderá ser registrado como marca em razão da prioridade de uso do título de estabelecimento Pancadão pelo empresário Domingos Guandu, em âmbito nacional, decorrente da inscrição do empresário na Junta Comercial."],"gabarito":"C","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa C. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":15,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":50,"codigo":"OAB2026TIPO1-050","area":"Direito Empresarial","dificuldade":"Fácil","enunciado":"Em relação aos elementos caracterizadores do empresário, assinale a afirmativa correta.","alternativas":["O empresário caracteriza-se pelo exercício profissional de atos de comércio, dentre os quais não se inclui a prestação de serviços.","O exercício de profissão intelectual, de natureza artística, literária ou científica em nenhuma hipótese poderá servir para caracterizar o empresário.","O empresário caracteriza-se pelo exercício profissional de atividade econômica organizada para produção ou circulação de bens ou de serviços.","A inscrição do empresário na Junta Comercial e o exercício de atividade econômica em caráter habitual são os dois requisitos para sua caracterização."],"gabarito":"C","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa C. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":15,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":51,"codigo":"OAB2026TIPO1-051","area":"Direito Processual Civil","dificuldade":"Médio","enunciado":"Machado de Assis ajuizou ação indenizatória em face de Quincas Borba, pugnando pela condenação do réu ao pagamento de indenização por danos morais e materiais, resultantes do inadimplemento de contrato de prestação de serviços. O Juiz condenou o réu ao pagamento de indenização por danos morais no montante de R$ 5.000,00 (cinco mil reais) e danos materiais, a serem apurados em sede de liquidação de sentença, diante da necessidade de comprovação dos prejuízos que vêm sendo experimentados pelo autor, desde a ocorrência do ilícito. Quincas Borba contratou você, como advogado(a), para interpor recurso de apelação, buscando a reforma integral da sentença. Tomando o caso acima como premissa, assinale a opção que, corretamente, apresenta sua orientação.","alternativas":["Enquanto não houver o julgamento do recurso de apelação, não será possível realizar a liquidação de sentença no capítulo referente aos danos materiais.","Apesar de Quincas Borba ter ofertado apelação, Machado de Assis poderá requerer desde logo a liquidação do capítulo dos danos materiais em autos apartados.","A liquidação de sentença somente poderá ser promovida por requerimento de Machado de Assis, pois o réu não detém legitimidade para requerer a liquidação de sentença.","Quincas Borba, em liquidação de sentença, poderá rediscutir a obrigação de pagamento dos danos materiais, sendo lícito ao Juiz modificar a sentença anteriormente proferida."],"gabarito":"B","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa B. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":15,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":52,"codigo":"OAB2026TIPO1-052","area":"Direito Processual Civil","dificuldade":"Médio","enunciado":"Por conta de danos sofridos em um acidente de trânsito, Juciara ajuizou ação em face de Carla, pleiteando a sua condenação ao pagamento de indenização. Julgado procedente o pedido, a Ré foi condenada ao pagamento de R$ 20.000,00 (vinte mil reais) a título de indenização por danos morais e materiais. Transitada em julgado a sentença, Carla imediatamente peticiona no referido processo, antes de qualquer depósito, oferecendo o pagamento de R$ 15.000,00 (quinze mil reais), com o devido depósito de tal quantia, e pleiteando o reconhecimento do cumprimento de sua obrigação. Sobre tal fato, assinale a afirmativa correta.","alternativas":["Concluindo o Juiz pela insuficiência do depósito, incidirão a multa e os honorários advocatícios de 10% sobre o valor total devido.","Juciara deverá ser intimada do depósito e, caso impugne o valor, somente poderá levantar o montante total após o Juiz decidir sobre a suficiência do depósito.","Caso Juciara não se oponha ao valor ofertado, ainda que inferior à condenação, será reconhecida como satisfeita a obrigação, com a consequente extinção do processo.","O cumprimento de sentença depende da expressa manifestação de vontade da parte autora, de modo que Carla não poderia realizar o depósito dos valores devidos antes de intimada para tanto."],"gabarito":"C","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa C. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":15,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":53,"codigo":"OAB2026TIPO1-053","area":"Direito Processual Civil","dificuldade":"Médio","enunciado":"Paula ajuizou ação indenizatória por atraso de voo contra a companhia aérea Big Ben perante certo Juizado Especial Cível. Em sentença, o Magistrado condenou a companhia aérea ao pagamento de determinada quantia em dinheiro. Interposto recurso inominado pela companhia aérea, a Turma Recursal competente proveu o recurso. No entanto, em sua decisão, cometeu graves erros de aplicação de normas infraconstitucionais federais e normas constitucionais. A decisão colegiada, por outro lado, não incorreu em omissão, contradição, obscuridade ou erro material, e a matéria constitucional está devidamente pré-questionada. Diante desse cenário, assinale a afirmativa correta.","alternativas":["Não há recurso cabível contra a decisão proferida pela Turma Recursal.","Paula deve opor embargos de declaração a fim de sanar os erros de interpretação de norma cometidos pela Turma Recursal.","Paula deve interpor recurso extraordinário contra a decisão da Turma Recursal, tendo em vista que a decisão incorreu em erros de aplicação de normas constitucionais.","Paula deve interpor recurso especial e recurso extraordinário simultaneamente, tendo em vista que o primeiro é cabível quando há violação à norma infraconstitucional federal, enquanto o segundo é cabível quando há violação à norma constitucional."],"gabarito":"C","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa C. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":16,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":54,"codigo":"OAB2026TIPO1-054","area":"Direito Processual Civil","dificuldade":"Médio","enunciado":"Aziz ajuizou ação de procedimento comum contra Betina, na qual requer sua condenação ao pagamento de R$ 10.000,00 (dez mil reais) por danos morais, após ter se sentido humilhado por Betina, que o xingou na frente de colegas de trabalho durante certa reunião profissional. Em primeiro grau, o Magistrado proferiu sentença que julgou parcialmente procedente o pedido de Aziz, condenando Betina ao pagamento de R$ 6.000,00 (seis mil reais). Aberto o prazo de 15 dias úteis para a interposição de recurso contra a sentença, apenas Aziz interpôs apelação, tendo requerido a reforma da decisão para que Betina fosse condenada a pagar o valor integral de R$ 10.000,00 (dez mil reais). Após a interposição do recurso de apelação por Aziz, o Magistrado abriu o prazo para que Betina apresentasse contrarrazões no prazo legal. Diante desse cenário, assinale a afirmativa correta.","alternativas":["Betina poderá apresentar contrarrazões ao recurso unicamente no prazo de 15 dias corridos.","Betina poderá apresentar contrarrazões ao recurso no prazo de 15 dias úteis e, nos 15 dias úteis subsequentes, poderá interpor apelação adesiva.","Betina poderá apresentar, no prazo concedido, contrarrazões ao recurso e interpor apelação adesiva; caso o recurso de apelação de Aziz seja inadmitido, o recurso de Betina também o será.","Betina poderá apresentar apenas contrarrazões ao recurso, não sendo possível a interposição de recurso adesivo no caso concreto, tendo em vista que o recurso adesivo não é admissível em apelação."],"gabarito":"C","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa C. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":16,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":55,"codigo":"OAB2026TIPO1-055","area":"Direito Processual Civil","dificuldade":"Médio","enunciado":"João propõe ação de exigência das contas contra o seu sócio, Vinícius, para verificar a regularidade da administração dos bens da pessoa jurídica Discos de Vinil Ltda, da qual ambos são sócios. Vinícius contesta o pedido, sustentando que já havia prestado as contas extrajudicialmente, bem como efetuado a juntada da prestação de contas em conjunto com a contestação. Nesse caso, continuando o procedimento, o Juiz deverá","alternativas":["intimar João para se manifestar no prazo de 15 dias.","julgar antecipadamente o mérito, impondo a Vinícius o dever de prestar as contas.","extinguir o processo sem resolução do mérito, ante a falta de interesse de agir de João.","designar, necessariamente, uma audiência de instrução e julgamento para colher o depoimento pessoal das partes, a fim de deslindar a controvérsia."],"gabarito":"A","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa A. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":16,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":56,"codigo":"OAB2026TIPO1-056","area":"Direito Processual Civil","dificuldade":"Difícil","enunciado":"A Associação de Defesa dos Usuários de Smartphone (ADUS) ajuizou ação civil pública em face do fabricante X, requerendo a sua condenação para a retirada do aparelho Y do mercado, em razão de vícios em seu processo construtivo. Após a oferta de contestação pelo réu, no curso da fase instrutória, houve abandono imotivado da causa pela Associação. Sobre o caso narrado, assinale a afirmativa correta.","alternativas":["É vedado ao Poder Público se habilitar como litisconsorte na causa.","O Ministério Público poderá assumir a titularidade da ação, assim como outra associação legitimada.","A ação deverá ser extinta sem resolução do mérito, fundado em abandono da causa, independentemente de requerimento do réu.","A associação, para propor a ação civil pública, deve necessariamente ter sido constituída há pelo menos um ano, vedada a dispensa de tal requisito por decisão judicial."],"gabarito":"B","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa B. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":16,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":57,"codigo":"OAB2026TIPO1-057","area":"Direito Penal","dificuldade":"Médio","enunciado":"Daniel chegou em casa embriagado e exigiu que sua esposa, Bianca, praticasse com ele conjunção carnal. Diante da recusa de Bianca, Daniel passou a empregar a coação física contra a sua esposa, porém, os gritos de Bianca foram ouvidos por vizinhos, que lograram entrar no imóvel e imobilizar Daniel, antes que consumasse o ato. Daniel foi denunciado pelo delito de estupro, mas, alguns meses após os fatos, e antes do recebimento da denúncia, Daniel e Bianca reataram o casamento. A você, na qualidade de advogado(a) de defesa de Daniel, cabe alegar","alternativas":["a retratação tácita da representação da ofendida.","a causa de diminuição de pena em razão da tentativa.","a excludente de ilicitude ante o exercício regular de um direito.","o perdão tácito em razão da manutenção da sociedade conjugal."],"gabarito":"B","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa B. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":17,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":58,"codigo":"OAB2026TIPO1-058","area":"Direito Penal","dificuldade":"Médio","enunciado":"Hermenegildo e Ataulfo são amigos desde a infância, mas, devido a divergências políticas, tornaram-se inimigos. Na véspera da eleição para Presidente do Sindicato da classe a qual pertencem, eles se encontraram em um botequim da cidade de Sucupira e o primeiro sacou sua pistola, que estava carregada com 17 munições, e disparou uma vez, com a intenção de matar, na direção de Ataulfo, atingindo-o no joelho. No clima tenso que surgiu depois do ato, Ataulfo lembrou a Hermegildo que ambos formaram o ataque do time de futebol que se sagrou campeão juvenil na escola primária. Hermenegildo, emocionado com a lembrança do ex-amigo, abandonou a arma de fogo no chão e foi embora. Ataulfo sobreviveu sem sequelas. Diante da situação hipotética narrada, assinale a afirmativa correta.","alternativas":["Houve arrependimento voluntário, e Hermenegildo deve responder pelo crime que desejou consumar.","Houve crime impossível, pois a conduta de Hermenegildo mostrou-se absolutamente ineficaz.","Houve tentativa imperfeita, pois a hesitação de Hermenegildo impediu o resultado mais gravoso.","Houve desistência voluntária, e Hermenegildo deve responder pelos atos já praticados."],"gabarito":"D","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa D. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":17,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":59,"codigo":"OAB2026TIPO1-059","area":"Direito Penal","dificuldade":"Difícil","enunciado":"Leandro e Leonardo planejaram matar Sérgio e, para tanto, resolveram simular um assalto durante o qual aqueles efetuariam disparos com armas de fogo na direção deste. Leandro e Leonardo foram conduzidos ao local em dois carros pilotados, respectivamente, por José e Luciano, que estavam cientes do plano, mas se recusaram a pegar nas armas de fogo. Sérgio faleceu em razão dos ferimentos. Diante da situação hipotética, assinale a opção correta.","alternativas":["José e Luciano são partícipes do crime de homicídio doloso consumado praticado por Leandro e Leonardo.","José e Luciano praticaram tentativa de roubo, enquanto Leandro e Leonardo praticaram o crime de homicídio.","José e Luciano são autores colaterais do crime de roubo, enquanto Leandro e Leonardo são autores mediatos do crime de homicídio.","José e Luciano não integram o concurso de agentes, pois somente Leandro e Leonardo detinham o domínio final da empreitada criminosa."],"gabarito":"A","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa A. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":17,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":60,"codigo":"OAB2026TIPO1-060","area":"Direito Penal","dificuldade":"Médio","enunciado":"Paulo, ao sair irritado da partida em que o seu clube de futebol havia perdido de goleada para o maior rival, sacou sua arma de fogo e, mesmo não desejando diretamente matar alguém, mas assumindo o risco de fazê-lo, disparou diversas vezes na direção de uma estação de trem, pois tinha ciência de que ela estava lotada e servia como ponto de encontro para a torcida do clube rival. Um dos disparos acabou atingindo fatalmente um padre, que se deslocava em direção à igreja para oficiar a missa. Sobre o crime praticado por Paulo, assinale a afirmativa correta.","alternativas":["Homicídio, mediante dolo eventual.","Homicídio culposo, pois sua intenção não era causar a morte.","Tentativa de homicídio, pois sua intenção não era causar a morte.","Homicídio mediante preterdolo, pois o padre não estava entre os alvos de Paulo."],"gabarito":"A","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa A. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":17,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":61,"co
