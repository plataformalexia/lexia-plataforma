function normalizarTexto(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}

function nucleoEnunciado(texto){const t=String(texto||'').replace(/\s+/g,' ').trim();if(!t)return '';const partes=t.match(/[^.!?]+[.!?]?/g)||[t];return partes.slice(0,2).join(' ').slice(0,320)}
function regraAlternativa(opcao,correta,enunciado,area,ehCorreta){const t=normalizarTexto(opcao),e=normalizarTexto(enunciado),c=normalizarTexto(correta);if(ehCorreta||t===c){if(t.includes('correlacao entre acusacao e sentenca'))return 'correta: a condena\u00e7\u00e3o por elementar f\u00e1tica n\u00e3o narrada na den\u00fancia viola a correla\u00e7\u00e3o entre acusa\u00e7\u00e3o e senten\u00e7a; a altera\u00e7\u00e3o f\u00e1tica exige aditamento, nos termos do CPP, art. 384.';if(t.includes('culpa consciente'))return 'correta: a descri\u00e7\u00e3o aponta previs\u00e3o do resultado acompanhada de confian\u00e7a sincera de que ele n\u00e3o ocorreria, quadro compat\u00edvel com culpa consciente.';if(t.includes('clausula petrea')||t.includes('clausula petr'))return 'correta: proposta tendente a abolir voto direto, secreto, universal e peri\u00f3dico encontra limite material na CF, art. 60, \u00a74\u00ba, II.';if(t.includes('tutela provisoria de urgencia'))return 'correta: probabilidade do direito e perigo de dano autorizam tutela provis\u00f3ria de urg\u00eancia, conforme CPC, art. 300.';return 'correta: coincide com o gabarito oficial e resolve o ponto central apresentado no enunciado.'}const regras=[['ne bis in idem','incorreta: ne bis in idem veda dupla persecu\u00e7\u00e3o ou puni\u00e7\u00e3o pelo mesmo fato; o problema narrado n\u00e3o \u00e9 dupla puni\u00e7\u00e3o, mas correla\u00e7\u00e3o entre acusa\u00e7\u00e3o e senten\u00e7a.'],['prova testemunhal','incorreta: a prova testemunhal pode ter valor probat\u00f3rio; o v\u00edcio do caso n\u00e3o est\u00e1 na esp\u00e9cie de prova, mas na condena\u00e7\u00e3o por fato ou elementar n\u00e3o imputado na den\u00fancia.'],['reconhecimento pessoal','incorreta: reconhecimento pessoal da v\u00edtima n\u00e3o \u00e9 pressuposto absoluto para condena\u00e7\u00e3o; o ponto decisivo \u00e9 a aus\u00eancia de aditamento quando surge elementar f\u00e1tica nova.'],['habeas corpus','incorreta: habeas corpus protege liberdade de locomo\u00e7\u00e3o contra ilegalidade ou abuso de poder; n\u00e3o substitui a provid\u00eancia material ou processual pedida pelo caso.'],['controle concentrado','incorreta: controle concentrado discute constitucionalidade em abstrato; n\u00e3o resolve, por si, a provid\u00eancia concreta exigida no enunciado.'],['acao penal privada','incorreta: a\u00e7\u00e3o penal privada depende de hip\u00f3tese legal de iniciativa do ofendido; n\u00e3o \u00e9 resposta adequada quando o enunciado pede solu\u00e7\u00e3o de outra natureza.'],['dolo direto','incorreta: dolo direto exige vontade dirigida ao resultado, nos termos do CP, art. 18, I; se o agente prev\u00ea o resultado mas confia sinceramente que ele n\u00e3o ocorrer\u00e1, o enquadramento muda.'],['dolo eventual','incorreta: dolo eventual pressup\u00f5e assumir o risco de produzir o resultado, CP, art. 18, I; confiar sinceramente na n\u00e3o ocorr\u00eancia afasta essa conclus\u00e3o.'],['crime impossivel','incorreta: crime imposs\u00edvel exige inefic\u00e1cia absoluta do meio ou impropriedade absoluta do objeto, conforme CP, art. 17; isso n\u00e3o decorre automaticamente do enunciado.'],['maioria simples','incorreta: emenda constitucional exige procedimento qualificado e n\u00e3o pode superar cl\u00e1usula p\u00e9trea do art. 60, \u00a74\u00ba, da CF.'],['referendo','incorreta: referendo posterior n\u00e3o convalida viola\u00e7\u00e3o a limite material de emenda constitucional.'],['sentenca definitiva','incorreta: aguardar senten\u00e7a definitiva n\u00e3o \u00e9 necess\u00e1rio quando a lei admite tutela provis\u00f3ria diante de urg\u00eancia demonstrada.'],['recurso especial','incorreta: recurso especial pressup\u00f5e decis\u00e3o recorr\u00edvel e requisitos constitucionais; n\u00e3o \u00e9 instrumento preventivo para pedir tutela na origem.'],['alternativa incompativel','incorreta: a reda\u00e7\u00e3o \u00e9 gen\u00e9rica e n\u00e3o resolve o fato descrito no enunciado.'],['confunde institutos','incorreta: mistura institutos e afasta a resposta do regime jur\u00eddico cobrado.'],['sem fundamento','incorreta: n\u00e3o apresenta base jur\u00eddica suficiente para solucionar o caso.']];const achou=regras.find(r=>t.includes(r[0]));if(achou)return achou[1];if(e.includes('grave ameaca')&&e.includes('denuncia')&&e.includes('roubo'))return 'incorreta: no caso, a defesa deve atacar a condena\u00e7\u00e3o por elementar n\u00e3o imputada na den\u00fancia; a alternativa n\u00e3o \u00e9 a que melhor traduz esse v\u00edcio processual.';if(e.includes('dados pessoais')&&e.includes('termino do tratamento'))return 'incorreta: a LGPD, art. 16, admite conserva\u00e7\u00e3o ap\u00f3s o t\u00e9rmino do tratamento apenas em hip\u00f3teses espec\u00edficas, como uso exclusivo do controlador, com anonimiza\u00e7\u00e3o e vedado acesso por terceiro; a alternativa n\u00e3o respeita esse recorte.';const resumo=String(opcao||'').replace(/\s+/g,' ').trim().slice(0,150);return 'incorreta: a op\u00e7\u00e3o afirma "'+resumo+'"; ao confront\u00e1-la com o fato narrado e com o gabarito oficial, ela n\u00e3o preserva o requisito jur\u00eddico decisivo cobrado pela banca.'}
function erroAlternativa(area,opcao,correta,enunciado,idx,corretaIndex){return regraAlternativa(opcao,correta,enunciado,area,idx===corretaIndex)}
function comentarioCompletoQuestao(area,g,alternativa,opts=[],corretaIndex=null,enunciado=''){const letras='ABCD',correta=Number.isInteger(corretaIndex)?corretaIndex:Math.max(0,letras.indexOf(g||'A')),lista=Array.isArray(opts)?opts.slice(0,4):[],corretaTxt=alternativa||lista[correta]||'alternativa indicada',fundamento=fundamentoArea(area),nucleo=nucleoEnunciado(enunciado);const analise=lista.length?lista.map((op,i)=>letras[i]+') '+erroAlternativa(area,op,corretaTxt,enunciado,i,correta)).join('\n'):'Sem alternativas suficientes para an\u00e1lise individual.';return 'A alternativa '+(g||letras[correta]||'A')+' est\u00e1 correta.\n\nFundamento: '+fundamento+(nucleo?'\n\nPonto decisivo do enunciado: '+nucleo:'')+'\n\nAlternativa correta: '+corretaTxt+'.\n\nAn\u00e1lise das alternativas:\n'+analise}
function comentarioIADemo(area,g,alternativa,opts,corretaIndex,enunciado){return comentarioCompletoQuestao(area,g,alternativa,opts,corretaIndex,enunciado)}
function distribuirAlternativas(opts,correta){const corretaTxt=opts[0],erradas=opts.slice(1),out=[];let wi=0;for(let i=0;i<4;i++)out[i]=i===correta?corretaTxt:(erradas[wi++]||'Alternativa incompatível');return out}
function makeExam(exame,ano,prova,total){const ans=['A','B','C','D'];return Array.from({length:total},(_,i)=>{const area=areas[i%areas.length],m=modelos[area]||modelos.default,correta=(i+exame.length)%4,g=ans[correta],opts=distribuirAlternativas(m[1],correta);return{codigo:makeQuestaoCodigo(exame,ano,i+1),prova,exame,ano,area,dif:i<20?'Fácil':i<55?'Médio':'Difícil',ref:exame+' - Questão '+(i+1),text:m[0],opts,correta,gabarito:g,comment:comentarioIADemo(area,g,opts[correta],opts,correta)}})}
const oab44Dados=[{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":1,"codigo":"OAB44TIPO1-001","area":"Ética Profissional","dificuldade":"Fácil","enunciado":"Antônia, advogada atuante na área previdenciária, foi consultada por Osvaldo sobre a possibilidade de propor ação judicial contra decisão do Instituto Nacional do Seguro Social (INSS), visando à obtenção de benefício previdenciário indeferido na via administrativa. Ao estudar o caso, Antônia verificou que o indeferimento do benefício havia se dado com base em dispositivo claro e expresso da lei que dispõe sobre o Plano de Benefícios da Previdência Social; e que não havia, até aquele momento, notícia de precedente judicial favorável à pretensão de Osvaldo. Essas informações, bem como os riscos de eventual ação judicial, foram prestadas de modo claro e inequívoco por Antônia ao cliente. No entanto, devido à insistência de Osvaldo, Antônia decidiu propor a demanda judicial. Com base nesse cenário, considerando o regime das infrações e sanções disciplinares da Advocacia, assinale a afirmativa correta.","alternativas":["Antônia advogou contra literal disposição de lei, o que, não obstante seja conduta irrelevante no regime das infrações disciplinares, poderá sujeitá-la a eventual sanção por litigância de má-fé aplicada pelo juiz da causa.","Antônia advogou contra literal disposição de lei, conduta que poderá sujeitá-la, perante o órgão competente da OAB, à pena isolada de multa.","Antônia advogou contra literal disposição de lei, porém poderá contar com a presunção de boa-fé em seu favor, caso tenha fundamentado seu pedido na inconstitucionalidade ou na injustiça da lei.","Antônia advogou contra literal disposição de lei, conduta que não possui relevância jurídico-disciplinar, mesmo porque a atuação da advocacia deve ser a mais ampla possível na defesa dos interesses de seus clientes."],"gabarito":"C","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa C. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":3,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":2,"codigo":"OAB44TIPO1-002","area":"Ética Profissional","dificuldade":"Fácil","enunciado":"Roberto, advogado autônomo com destacada atuação no Direito Criminal, foi investido no cargo de diretor jurídico da Nossa Estatal, empresa pública federal que atua no mercado financeiro em regime de competição com o setor privado. Acerca da nova condição profissional de Roberto, assinale a afirmativa correta.","alternativas":["A nova atividade exercida por Roberto caracteriza incompatibilidade para o exercício da advocacia, mesmo em causa própria.","Durante o período da investidura, Roberto estará exclusivamente legitimado para o exercício da advocacia vinculada ao cargo de diretor jurídico.","Roberto, durante o período da investidura, somente não poderá atuar como advogado autônomo contra a Fazenda Pública à qual está vinculada sua entidade empregadora.","Uma vez que a atuação de Roberto é na área criminal, sem relação direta com o mercado financeiro, Roberto poderá continuar exercendo normalmente a advocacia autônoma."],"gabarito":"B","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa B. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":3,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":3,"codigo":"OAB44TIPO1-003","area":"Ética Profissional","dificuldade":"Médio","enunciado":"Gustavo, conhecido comerciante de Brasília/DF, obteve graduação no curso de Direito. Em sequência, foi aprovado no Exame de Ordem, e, em razão disso, inscreveu-se como advogado na OAB. Desejando conciliar as atividades de comércio com o exercício da advocacia, decidiu reunir, em um mesmo estabelecimento, seu escritório de advocacia e sua loja comercial, adaptando a fachada do prédio para identificar que, naquele local, praticava-se, conjuntamente, o comércio e a advocacia. Para solucionar a parte contábil, decidiu elaborar aditivo ao contrato social da sua sociedade empresária de comércio, tendo incorporado, como finalidade adicional da pessoa jurídica, a atividade de advocacia. Em função da expansão do negócio, admitiu sócios sem formação jurídica na sociedade, para que esses últimos conduzissem a parte comercial, e ele, Gustavo, pudesse se dedicar à prestação de serviços jurídicos. Sobre a natureza e as características da sociedade de advogados e sobre sua constituição e registro, assinale a afirmativa correta.","alternativas":["É possível a admissão de sócio não advogado nas sociedades advocatícias, sendo proibido apenas que a razão social contenha o nome daquele sócio não inscrito na OAB.","A sociedade criada por Gustavo não pode ser admitida a registro, porque congrega serviços de advocacia com atividades estranhas à prática advocatícia, além de contar com sócios não inscritos como advogado.","Apesar de ser admitida a realização de atividades estranhas à advocacia por parte da sociedade de advogados, a sociedade fundada por Gustavo não pode ser registrada por incluir como sócio pessoa não inscrita como advogado.","A conduta adotada por Gustavo de incorporar serviços de comércio e advocatícios em uma mesma pessoa jurídica, a despeito de pouco usual, é válida, porque se admite o registro nas juntas comerciais de sociedade que inclua, entre suas finalidades, a atividade de advocacia."],"gabarito":"B","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa B. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":3,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":4,"codigo":"OAB44TIPO1-004","area":"Ética Profissional","dificuldade":"Médio","enunciado":"O Presidente do Conselho Seccional da Ordem dos Advogados do Brasil do Estado Alfa recebeu representação devidamente identificada, contendo narrativa fática indicativa da prática de infração disciplinar pelo advogado Paulo. O autor da representação apresentou documentos, rol de testemunhas e indicou a produção de provas. Ato contínuo, o Presidente imediatamente designou relator para a competente instrução do processo disciplinar. Considerando a legislação que rege o processo disciplinar do advogado, assinale a afirmativa correta.","alternativas":["Se a infração ético-disciplinar apontada na representação for punível com a sanção de censura, será admissível a celebração de termo de ajustamento de conduta, desde que o fato apurado não tenha gerado repercussão negativa à advocacia.","A autoridade competente que proferir o despacho declaratório da instauração do processo disciplinar deverá, no mesmo ato, promover a suspensão preventiva de Paulo pelo prazo de até 90 (noventa) dias.","Na hipótese de arquivamento liminar da representação pelo Presidente do Conselho Seccional, caberá recurso ao Conselho Federal da OAB.","A designação imediata de relator pelo Presidente do Conselho Seccional, sem a prévia oitiva de Paulo, viola o princípio da ampla defesa."],"gabarito":"A","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa A. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":3,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":5,"codigo":"OAB44TIPO1-005","area":"Ética Profissional","dificuldade":"Fácil","enunciado":"O advogado Gomes representou Dênis em uma ação de responsabilidade civil contra o Banco Alfa, tendo firmado contrato escrito com Dênis, no qual foi estipulado que Gomes receberia honorários convencionais de 20% sobre o proveito econômico obtido, além dos honorários sucumbenciais que fossem concedidos. No entanto, Dênis entrou em contato diretamente com o advogado do Banco Alfa e firmou um acordo extrajudicial para receber R$ 5.000,00 de indenização por danos morais, sem a participação de Gomes e renunciando aos direitos aos honorários advocatícios. Gomes foi informado do acordo posteriormente. Sobre o caso relatado, com base no Art. 24 do Estatuto da Advocacia e da OAB, assinale a afirmativa correta.","alternativas":["Dênis tem o direito de renunciar aos honorários advocatícios convencionados e sucumbenciais, desde que tenha feito isso expressamente no acordo com o Banco Alfa, e isso prejudica o direito de Gomes de receber qualquer valor.","O acordo firmado por Dênis com o Banco Alfa retira o direito de Gomes aos honorários convencionados, mas Gomes ainda pode pleitear apenas os honorários sucumbenciais, desde que haja condenação judicial.","Gomes mantém o direito aos honorários convencionados e sucumbenciais, independentemente do acordo realizado por Dênis com o Banco Alfa, uma vez que o acordo não prejudica o advogado sem sua aquiescência.","Gomes somente poderá cobrar os honorários convencionados se houver uma decisão judicial declarando nulo o acordo firmado entre Dênis e o Banco Alfa."],"gabarito":"C","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa C. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":4,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":6,"codigo":"OAB44TIPO1-006","area":"Ética Profissional","dificuldade":"Médio","enunciado":"O advogado Ivan precisava embarcar em um voo doméstico de Recife para Curitiba, a fim de participar do Congresso Brasileiro de Direito de Família. Ao chegar ao balcão de check-in, percebeu que havia esquecido todos os seus documentos de identificação em seu escritório, com exceção da carteira da Ordem dos Advogados do Brasil (OAB), na qual consta sua foto. A responsável pelo atendimento da companhia aérea informou que não aceitaria a carteira da OAB como documento de identidade e, por isso, Ivan estaria impedido de embarcar. Ivan argumentou que o documento deveria ser aceito como prova de identidade civil, uma vez que é o único documento de identidade profissional obrigatório para o exercício da advocacia. Sobre a hipótese, com base no Estatuto da Ordem dos Advogados do Brasil, assinale a afirmativa correta.","alternativas":["Ivan não poderá embarcar, pois a carteira da OAB não é considerada documento de identidade civil válido para viagens nacionais em aviões.","Ivan poderá embarcar, pois a carteira da OAB constitui prova de identidade civil para todos os fins legais, inclusive para viagens nacionais em aviões.","Ivan somente poderá embarcar se apresentar outro documento de identificação civil junto com a carteira da OAB, como medida de segurança adicional.","Ivan não poderá embarcar, pois a carteira da OAB só é válida como documento de identificação quando utilizada em exercício da atividade profissional em fóruns e tribunais."],"gabarito":"B","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa B. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":4,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":7,"codigo":"OAB44TIPO1-007","area":"Ética Profissional","dificuldade":"Fácil","enunciado":"No âmbito de investigação sigilosa, o Magistrado competente decretou a prisão de João, amigo íntimo de Carlos. Carlos é advogado regularmente inscrito na Ordem dos Advogados do Brasil. Ao saber do cumprimento do mandado, com a consequente custódia de João, Carlos se dirigiu à delegacia e, em seguida, procurou o Magistrado plantonista para tratar do caso. Nesse contexto, assinale a afirmativa correta.","alternativas":["Carlos somente terá acesso aos autos da investigação que culminou na prisão de João se apresentar procuração para representá-lo. Nesse caso, deve lhe ser franqueado amplo acesso aos elementos de prova colhidos pela autoridade policial, não sendo possível a imposição de qualquer limitação.","Carlos deverá ter acesso aos autos da investigação que culminou na prisão de João, independentemente da apresentação de procuração para representá-lo. Ademais, deve lhe ser franqueado amplo acesso aos elementos de prova colhidos pela autoridade policial, não sendo possível a imposição de qualquer limitação.","Carlos somente terá acesso aos autos da investigação que culminou na prisão de João se apresentar procuração para representá-lo. Entretanto, o acesso aos elementos de prova colhidos pela autoridade policial poderá ser delimitado, desde que relacionados a diligências em andamento e ainda não documentados nos autos, desde que haja comprovado risco de comprometimento da eficiência, da eficácia ou da finalidade da investigação.","Carlos deverá ter acesso aos autos da investigação que culminou na prisão de João, independentemente da apresentação de procuração para representá-lo. Entretanto, o acesso aos elementos de prova colhidos pela autoridade policial poderá ser delimitado, ainda que relacionados a diligências já encerradas e devidamente documentadas nos autos, desde que haja comprovado risco de comprometimento da eficiência, da eficácia ou da finalidade da investigação."],"gabarito":"C","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa C. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":4,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":8,"codigo":"OAB44TIPO1-008","area":"Ética Profissional","dificuldade":"Médio","enunciado":"Euclides é advogado regularmente inscrito na OAB e foi flagrado praticando assédio sexual contra diversas colaboradoras de seu escritório, conduta que foi amplamente divulgada na imprensa regional após a veiculação de imagens captadas por câmeras de segurança, nas quais o advogado aparece se insinuando de forma inapropriada. O caso causou grande repercussão regional, afetando a imagem da Advocacia. Diante disso, o Tribunal de Ética e Disciplina do Conselho Seccional determinou a suspensão preventiva de Euclides, designando sessão especial para ouvi-lo na semana seguinte à suspensão. No mesmo ato, o Tribunal estabeleceu que o processo disciplinar deveria ser concluído em prazo máximo de 180 dias. Com base no Estatuto da Advocacia e da OAB, sobre a decisão do Tribunal, assinale a afirmativa correta.","alternativas":["O procedimento adotado foi regular, pois diante da gravidade dos fatos e da ampla repercussão, o Tribunal de Ética pode suspender preventivamente o advogado e prorrogar o prazo do processo disciplinar para até 180 dias.","O procedimento adotado foi válido apenas quanto à suspensão, pois o Estatuto admite a suspensão preventiva sem qualquer necessidade de notificação ou sessão de oitiva, desde que haja repercussão negativa à imagem da OAB.","O procedimento foi irregular, porque a suspensão preventiva do advogado somente é válida se o representado for previamente notificado ou, depois de notificado, não comparecer, e o prazo máximo do processo, na hipótese, é de 90 dias.","O procedimento adotado foi regular quanto ao prazo máximo de duração do processo disciplinar, mas irregular quanto à suspensão preventiva, pois, embora seja cabível, a oitiva do advogado deve ocorrer antes da suspensão, e não posteriormente."],"gabarito":"C","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa C. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":5,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":9,"codigo":"OAB44TIPO1-009","area":"Filosofia do Direito","dificuldade":"Médio","enunciado":"John Locke, em seu Segundo Tratado sobre o Governo, fala da instituição de uma sociedade política onde devem vigorar não mais as leis da natureza, mas as leis feitas pelo poder civil. Portanto, nessa sociedade política, o parlamento faz as leis para que sejam cumpridas. Assinale a opção que, segundo Locke no livro em referência, expressa corretamente a ideia de cumprimento e obediência às leis civis.","alternativas":["Todas as pessoas, as mais distintas e as mais modestas, estão sujeitas às leis feitas pelo parlamento, inclusive os próprios parlamentares, pois ninguém pode, na sociedade civil, isentar-se das leis que a regem.","Os cidadãos ficam sujeitos às leis do governo civil após o contrato social, mas o soberano, encarnado nos agentes do governo, não faz parte do pacto e, por isso, não deve obediência às leis que produz.","Os cidadãos e os governantes estão sujeitos às leis instituídas após o contrato social, contudo as autoridades religiosas, ainda que vivam na sociedade civil, não devem obediência às leis, mas, sim, a Deus.","Os governantes, responsáveis pela administração da sociedade política, e os governados devem se submeter ao império da lei, contudo, parlamentares e magistrados estão isentos da obediência à lei para exercerem seu ofício de forma livre e soberana."],"gabarito":"A","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa A. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":5,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":10,"codigo":"OAB44TIPO1-010","area":"Direito Constitucional","dificuldade":"Fácil","enunciado":"O Artigo 5º, inciso XI, da CRFB/88 dispõe que “a casa é asilo inviolável do indivíduo, ninguém nela podendo penetrar sem consentimento do morador, salvo em caso de flagrante delito ou desastre, ou para prestar socorro, ou, durante o dia, por determinação judicial.” João Vicente, que residia em um quarto de hotel, procura você, na função de advogado(a), para tentar anular o ingresso policial, sem mandado judicial e sem flagrante delito, utilizando como fundamento a norma constitucional acima citada. Assinale a opção que indica o tipo de interpretação adequado para fundamentar a ilegalidade do ingresso.","alternativas":["Interpretação gramatical, baseada no brocardo in claris cessat interpretatio.","Interpretação restritiva, sob o argumento de que não se pode usar um conceito de modo amplo.","Interpretação autêntica, usando conceito semelhante previsto em norma de Direito Civil, que possui legislação específica acerca do alcance semântico do domicílio.","Interpretação extensiva, usando a argumentação de que o alcance da norma e do conceito de casa é mais amplo do que o utilizado pela autoridade policial, a fim de abarcar aquele que reside em quarto de hotel."],"gabarito":"D","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa D. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":5,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":11,"codigo":"OAB44TIPO1-011","area":"Direito Constitucional","dificuldade":"Fácil","enunciado":"Após diversos indicadores de qualidade da saúde evidenciarem que, entre todos os estados da Federação, o Estado Delta é aquele que oferta o pior serviço de saúde à sua população, o governador desse Estado prometeu elevado investimento público na área. Ele assegurou que iria trabalhar junto à Assembleia Legislativa no sentido de aumentar a dotação orçamentária dos hospitais públicos estaduais, como, também, auxiliar financeiramente os hospitais privados que comprovassem, por vias fidedignas, que sua margem de lucro estaria sendo insuficiente para investir em uma melhor qualidade no atendimento. Sobre o posicionamento do governador, segundo a perspectiva jurídico-constitucional, assinale a afirmativa correta.","alternativas":["Ele poderá cumprir sua promessa, contanto que não ultrapasse o percentual máximo de gastos constitucionalmente permitidos para os serviços de saúde.","Ele poderá promover a política de saúde indicada, porque, como chefe do Poder Executivo de ente federativo autônomo, é ele quem determina as ações de governo.","Ele não está autorizado a destinar recursos públicos para auxiliar hospitais privados que possuam a característica explicitada no caso narrado.","Ele não poderá concretizar sua promessa, já que a matéria orçamentária em temas relacionados ao cuidado e à defesa da saúde é de competência exclusiva da União."],"gabarito":"C","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa C. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":5,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":12,"codigo":"OAB44TIPO1-012","area":"Direito Constitucional","dificuldade":"Médio","enunciado":"Um consumidor, cliente de instituição financeira constituída sob a forma de sociedade de economia mista federal, teve seu nome negativado indevidamente em um cadastro de devedores. Por essa razão, procurou você, na qualidade de advogado(a), para saber se seria possível ingressar, de acordo com a Constituição da República, com uma ação de responsabilidade civil em face da referida instituição no âmbito da Justiça Federal. Com base na situação descrita e no sistema jurídico-constitucional brasileiro, assinale a opção que apresenta, corretamente, sua resposta.","alternativas":["A competência para apreciar a ação de responsabilidade civil a ser proposta é da Justiça Federal, pois a União, indiretamente, figura no polo passivo.","A ação deve ser proposta perante a Justiça Estadual, não perante a Justiça Federal, isto se o referido foro tiver sido definido pela lei que autorizou a criação da instituição financeira.","Por se tratar de sociedade de economia mista federal, a competência originária para a apreciação da ação de responsabilidade civil é do Tribunal Regional Federal da região do consumidor.","A despeito de possuir a União como seu sócio majoritário, a ação de responsabilidade civil em face da instituição financeira deve ser proposta na Justiça Estadual."],"gabarito":"D","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa D. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":6,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":13,"codigo":"OAB44TIPO1-013","area":"Direito Constitucional","dificuldade":"Médio","enunciado":"No Estado Sigma foi promulgada a Lei Estadual nº X/2024, que aborda matéria de Direito Financeiro. Ocorre que os dispositivos desse diploma normativo entram em conflito com as normas do Ato das Disposições Constitucionais Transitórias (ADCT) que ainda produzem seus naturais efeitos. O Presidente do Partido Político Delta, o deputado federal João Silva, sem possuir conhecimentos jurídicos, resolve consultar você, como advogado(a), para saber se poderia questionar a constitucionalidade das normas da Lei Estadual nº X/2024, por afrontarem as normas do ADCT. Assinale a opção que indica a resposta correta à consulta formulada.","alternativas":["Embora federais, as normas do ADCT possuem hierarquia legal, razão pela qual não poderia haver controle de constitucionalidade, mas controle de legalidade da Lei Estadual nº X/2024.","As normas do ADCT, por possuírem status supralegal, poderiam servir de parâmetro para aferir a validade da Lei Estadual nº X/2024, muito embora não pudessem ser consideradas normas paramétricas para o controle de constitucionalidade.","Na medida em que as normas do ADCT têm estatura constitucional, pode ser proposta Ação Direta de Inconstitucionalidade para que seja reconhecida a inconstitucionalidade das normas da Lei Estadual nº X/2024.","Como o ADCT possui natureza legal, uma possível antinomia entre suas normas e as da Lei Estadual nº X/2024 faria que as normas anteriores, as do ADCT, fossem tacitamente revogadas."],"gabarito":"C","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa C. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":6,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":14,"codigo":"OAB44TIPO1-014","area":"Direito Constitucional","dificuldade":"Médio","enunciado":"O Presidente da República apresentou projeto de lei para aumentar a remuneração dos cargos X e Y do Poder Executivo. Durante a tramitação na Câmara dos Deputados, foi aprovada uma emenda parlamentar que estendeu esse aumento também aos cargos W e X. Sobre a emenda parlamentar apresentada, considerando a sistemática estabelecida pela Constituição da República, assinale a afirmativa correta.","alternativas":["Deve ser considerada válida, pois o Congresso Nacional tem competência para modificar projetos de lei de iniciativa do Presidente da República.","É constitucional, desde que seja aprovada pela maioria absoluta dos membros da Câmara dos Deputados e do Senado Federal.","Deve ser considerada inválida, pois o aumento de remuneração só pode ser feito por medida provisória editada pelo Presidente da República.","É inconstitucional, pois não se pode aumentar despesa prevista em projetos de lei de iniciativa exclusiva do Presidente da República."],"gabarito":"D","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa D. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":6,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":15,"codigo":"OAB44TIPO1-015","area":"Direito Constitucional","dificuldade":"Médio","enunciado":"A partir da análise do conflito entre normas constitucionais originárias em uma relação processual, ambas válidas e vigentes, João, advogado do autor, sustentou que a norma X, por ser, sob a perspectiva conteudística, materialmente constitucional, deve ter preponderância sobre a norma Y, pois esta última versa sobre matéria que não é própria de uma Constituição, sendo considerada norma constitucional apenas sob o prisma da forma. Pedro, advogado da parte ex adversa, por não concordar com a análise de João, se opõe, afirmando que, sob uma perspectiva normativo-hierárquica, a discussão não possui sentido, já que, prima facie, ambas as normas possuem a mesma hierarquia no âmbito do ordenamento jurídico brasileiro. Sobre a hipótese apresentada, segundo a visão jurídico-constitucional brasileira, assinale a afirmativa correta.","alternativas":["João está correto, pois as normas constitucionais, na perspectiva meramente formal, possuem, prima facie, status legal e, portanto, hierarquia inferior àquelas materialmente constitucionais.","Pedro está correto, porque as normas formalmente constitucionais, sob a perspectiva do conteúdo, obrigatoriamente também o são sob a perspectiva de análise material.","João, como a norma Y consubstancia norma constitucional somente sob o ponto de vista formal, está correto, pois há de se considerar que a ela deve ser sempre atribuído status supralegal, mas infraconstitucional.","Pedro está correto, porque as normas X e Y, na perspectiva normativo-hierárquica, não possuem qualquer superioridade uma sobre a outra, sendo reconhecida em ambas a estatura constitucional."],"gabarito":"D","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa D. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":6,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":16,"codigo":"OAB44TIPO1-016","area":"Direito Constitucional","dificuldade":"Médio","enunciado":"Durante uma forte tempestade que causou inundações e interrupções no fornecimento de energia na cidade Delta, o Prefeito Municipal, buscando evitar o agravamento da situação de iminente perigo público, requisitou um gerador de energia de propriedade da sociedade empresária Gama para manter em funcionamento o hospital municipal. O equipamento foi utilizado por dois dias, até que o fornecimento de energia fosse restabelecido, o que não causou qualquer dano ao bem requisitado. Diante dessa situação, o sócio-gerente de Gama compareceu à Prefeitura de Delta para exigir indenização pela requisição do bem. A esse respeito, assinale a afirmativa correta.","alternativas":["A sociedade empresária Gama tem direito à indenização, independentemente de ter havido dano ao bem.","Como o bem não sofreu danos durante sua utilização, a sociedade empresária Gama não tem direito à indenização.","A utilização de bem privado, em prol do interesse público, sendo-lhe causado dano, ou não, não gera direito à indenização.","A sociedade empresária Gama só teria direito à indenização se a requisição tivesse sido realizada por autoridade federal, mas não pela autoridade citada no caso concreto."],"gabarito":"B","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa B. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":7,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":17,"codigo":"OAB44TIPO1-017","area":"Direitos Humanos","dificuldade":"Médio","enunciado":"No que concerne aos standards internacionais atualmente adotados para defesa do Direito Humano à Igualdade, assinale a afirmativa correta.","alternativas":["O direito à igualdade abrange atualmente três dimensões, havendo amplo consenso quanto à existência de uma dimensão de ordem formal, também compreendida como igualdade perante a lei; uma segunda dimensão, de ordem material, comumente relacionada ao conceito de justiça retributiva; e uma terceira dimensão, de ordem instrumental, que reconhece no direito à igualdade a condição viabilizadora da concretização de outros direitos fundamentais.","No âmbito do sistema global de proteção aos direitos humanos, a Convenção das Nações Unidas sobre a Eliminação de Todas as Formas de Discriminação Contra a Mulher pode ser apontada como importante instrumento para superação das desigualdades de gênero. Contudo, o instrumento não admite de forma expressa a utilização de ações afirmativas, ou medidas compensatórias, destinadas a acelerar o processo de superação das desigualdades existentes.","A Convenção Internacional sobre a Eliminação de Todas as Formas de Discriminação Racial rechaça a possibilidade dos Estados-parte estabelecerem medidas de tratamento desigual, em detrimento de grupos étnicos historicamente mais favorecidos, por considerar que a referida prática pode configurar a conduta expressamente vedada do denominado “racismo reverso”.","Ao interpretar a Convenção Americana sobre Direitos Humanos, a Corte IDH reconhece a possibilidade de serem adotados critérios para “distinção” de tratamento entre determinados grupos de indivíduos. O que não se admite é a prática de condutas “discriminatórias”. Para a Corte, as “distinções” constituem diferenças compatíveis com a Convenção Americana por serem razoáveis e objetivas. Já as “discriminações” constituem diferenças arbitrárias que redundam em prejuízo dos Direitos Humanos."],"gabarito":"D","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa D. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":7,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":18,"codigo":"OAB44TIPO1-018","area":"Direitos Humanos","dificuldade":"Difícil","enunciado":"Em relação aos Direitos Humanos das pessoas presas, assinale a afirmativa correta.","alternativas":["Tanto as Regras de Nelson Mandela quanto as Regras de Bangkok possuem natureza de soft law, ou seja, são consideradas normas não vinculantes de Direito Internacional. Nada obstante, configuram-se em importantes diretrizes que servem de orientação para os Estados membros da Organização das Nações Unidas.","No âmbito do Sistema de Proteção Interamericano de Direitos Humanos foram editadas as denominadas regras de Nelson Mandela, com vistas à fixação de standards mínimos de organização e funcionamento dos estabelecimentos prisionais, em ordem à proteção dos direitos dos indivíduos privados de suas liberdades.","De acordo com as Regras Mínimas das Nações Unidas para o Tratamento de Presos, todas as penas cruéis, desumanas, degradantes ou que impliquem tortura devem ser proibidas. Entretanto, não há óbice à imposição do confinamento solitário prolongado, desde que aplicado como forma de sanção disciplinar, em razão de falta grave cometida pelo apenado.","No âmbito do sistema global, há dois tratados, consubstanciando-se em norma de jus cogens, que estabelecem disposições específicas para os presos do sexo masculino e do sexo feminino. Assim, enquanto as Regras de Nelson Mandela disciplinam os cuidados mínimos com os encarcerados do sexo masculino, não se aplicando às mulheres presas, as regras de Bangkok se destinam exclusivamente ao encarceramento feminino."],"gabarito":"A","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa A. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":7,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":19,"codigo":"OAB44TIPO1-019","area":"Direito Eleitoral","dificuldade":"Fácil","enunciado":"Maria e João foram eleitos, respectivamente, prefeita e vice-prefeito do Município Alfa, com poucos votos de vantagem sobre Ana e Antônio, que formavam a outra chapa que disputou a eleição. Dez dias após a diplomação dos eleitos, os integrantes da chapa derrotada obtiveram provas cabais de que os integrantes da chapa vencedora teriam praticado uma fraude, o que comprometera a normalidade e a legitimidade do pleito. Sobre o caso apresentado, como advogado(a) dos integrantes da chapa derrotada, assinale a medida judicial que deve ser ajuizada em face dos integrantes da chapa vencedora.","alternativas":["Investigação judicial eleitoral.","Ação de captação ilícita de votos.","Recurso contra expedição de diploma.","Ação de impugnação de mandato eletivo."],"gabarito":"D","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa D. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":7,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":20,"codigo":"OAB44TIPO1-020","area":"Direito Eleitoral","dificuldade":"Fácil","enunciado":"Pedro, que teve deferido o registro de candidatura para concorrer ao cargo eletivo de Prefeito Municipal de uma importante capital brasileira, deseja aumentar a capilaridade de seu projeto de governo junto à população, de modo que um número maior de eleitores tenha conhecimento de suas propostas. Com esse objetivo, consultou você, como advogado(a), a respeito da possibilidade de veicular propaganda eleitoral paga, na imprensa escrita, durante o período de propaganda eleitoral. Quanto à orientação a ser dada, assinale a afirmativa que apresenta, corretamente, sua resposta.","alternativas":["A realização da propaganda eleitoral na forma pretendida é vedada, em qualquer hipótese.","A propaganda eleitoral que ele deseja realizar é a única de natureza não gratuita permitida pela legislação eleitoral, podendo ser realizada até o dia da eleição.","A veiculação de anúncios de propaganda eleitoral na imprensa escrita é permitida, observados limites quantitativos e de espaço, até a antevéspera das eleições.","Somente os partidos políticos podem contratar a realização da propaganda eleitoral pretendida por Pedro, sendo os limites quantitativos distribuídos internamente entre os candidatos do respectivo partido."],"gabarito":"C","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa C. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":8,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":21,"codigo":"OAB44TIPO1-021","area":"Direito Internacional","dificuldade":"Médio","enunciado":"João, brasileiro domiciliado no Japão, celebrou um contrato presencial no Japão com Adam, estrangeiro domiciliado no Brasil, com uma cláusula de eleição de foro, em que o Brasil foi escolhido como competente para resolver eventuais conflitos. A controvérsia sobre o contrato foi submetida à justiça brasileira. Assinale a opção que indica, conforme a Lei de Introdução às normas do Direito Brasileiro (LINDB), a lei que deve ser aplicada para a resolução da lide.","alternativas":["A do Brasil, devido à cláusula de eleição de foro.","A do Japão, porque é o local em que João é domiciliado.","A do Brasil, porque é o local em que Adam é domiciliado.","A do Japão, porque é o local em que o contrato foi celebrado."],"gabarito":"D","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa D. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":8,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":22,"codigo":"OAB44TIPO1-022","area":"Direito Internacional","dificuldade":"Fácil","enunciado":"A Convenção de Viena sobre os Direitos dos Tratados de 1969 estabelece regras gerais para os tratados internacionais em relação a diversos aspectos, como entrada em vigor, aplicação e interpretação. Quanto à interpretação dos tratados, estes devem ser interpretados de boa-fé levando em consideração o contexto, o objetivo e a finalidade. A esse respeito, assinale a afirmativa correta.","alternativas":["Para os fins de interpretação de um tratado, o contexto compreenderá, além do texto, seu preâmbulo e anexos.","Toda vez que um tratado for autenticado em duas ou mais línguas, sem exceção, seu texto tem validade em cada uma delas.","Uma versão do tratado em língua diversa daquelas em que o texto foi autenticado, só será considerada texto autêntico se o tratado o previr.","Não são admitidos meios suplementares de interpretação dos tratados internacionais, como os trabalhos preparatórios e as circunstâncias de conclusão do tratado, ainda que a interpretação deixe o sentido ambíguo ou obscuro."],"gabarito":"A","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa A. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":8,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":23,"codigo":"OAB44TIPO1-023","area":"Direito Tributário / Direito Financeiro","dificuldade":"Médio","enunciado":"Em um determinado exercício financeiro, o Projeto de Lei Orçamentária Anual (PLOA) enviado pelo Governador do Estado Alfa à Assembleia Legislativa dispunha sobre matérias relacionadas ao direito financeiro, entre as quais: I. autorização para abertura de créditos adicionais suplementares; II. autorização para abertura de créditos adicionais especiais; III. autorização para contratação de operações de crédito; IV. autorização para contratação de operações de crédito por antecipação de receita. Diante desse cenário, à luz do texto da Constituição Federal de 1988, assinale a afirmativa correta.","alternativas":["A autorização para abertura de créditos adicionais suplementares não poderia constar neste PLOA.","A autorização para abertura de créditos adicionais especiais foi indevidamente inserida neste PLOA.","A autorização para contratação de operações de crédito não poderia ser prevista neste PLOA.","A Constituição Federal expressamente proíbe que se insira no PLOA autorização para contratação de operações de crédito por antecipação de receita."],"gabarito":"B","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa B. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":8,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":24,"codigo":"OAB44TIPO1-024","area":"Direito Tributário / Direito Financeiro","dificuldade":"Fácil","enunciado":"O Município Alfa revogou a lei que instituía a cobrança do Imposto Predial e Territorial Urbano (IPTU) dos imóveis situados em seu território, há mais de 5 anos, deixando, desde então, de realizar sua cobrança e arrecadação. Notificado pelo respectivo Tribunal de Contas para retornar a cobrar o imposto por descumprir um dos requisitos essenciais de uma gestão fiscal responsável, o prefeito pergunta a você, como advogado(a), qual será a consequência para a municipalidade, caso mantenha a política da não instituição, previsão e efetiva arrecadação de todos os impostos de sua competência constitucionalmente atribuída. Nesse cenário, à luz da Lei de Responsabilidade Fiscal (LC nº 101/2000), você respondeu que o Município Alfa ficará impedido de","alternativas":["realizar operações de crédito.","realizar qualquer concurso público.","receber transferências voluntárias.","contratar com qualquer outro ente da Federação."],"gabarito":"C","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa C. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":8,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":25,"codigo":"OAB44TIPO1-025","area":"Direito Tributário / Direito Financeiro","dificuldade":"Médio","enunciado":"Paulo, domiciliado em Ubatuba (SP), era proprietário de uma única embarcação automotora, que ficava ancorada em Paraty (RJ). Ele veio a falecer no início do ano de 2024, em Belo Horizonte (MG), durante visita à filha e única herdeira, Joana, domiciliada nesta mesma cidade. A filha, maior de idade e capaz, realizou o inventário extrajudicial de seu pai perante tabelião de Belo Horizonte (MG). De acordo com o texto da Constituição Federal de 1988, assinale a opção que indica, corretamente, o Estado em que o Imposto sobre Transmissão Causa Mortis e Doação (ITCMD) incidente sobre essa transmissão causa mortis é devido.","alternativas":["Minas Gerais, por ser o local onde se processou o inventário extrajudicial.","Minas Gerais, por ser o local de domicílio da única herdeira.","São Paulo, por ser o local de domicílio do falecido.","Rio de Janeiro, por ser o local onde ancorada a embarcação automotora."],"gabarito":"C","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa C. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":9,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":26,"codigo":"OAB44TIPO1-026","area":"Direito Tributário / Direito Financeiro","dificuldade":"Médio","enunciado":"A entidade religiosa ABC requereu o reconhecimento da imunidade de IPTU do imóvel em que realizava seus cultos, bem como do edifício ao lado, que servia de moradia para seus ministros religiosos e suas famílias. O Município Alfa negou parcialmente tal reconhecimento, afirmando que, embora ambos os imóveis fossem registrados em nome da entidade religiosa ABC, possuíam matrículas distintas no Registro de Imóveis. Desta forma, reconheceu que apenas o imóvel em que realizava seus cultos seria contemplado com a imunidade tributária reconhecida pela Constituição Federal. Surpreendida, a entidade religiosa ABC procurou você, como advogado(a), para questionar essa decisão. Assinale a opção que apresenta, corretamente, sua orientação para o caso.","alternativas":["A entidade deve escolher sobre qual imóvel deve recair a imunidade do IPTU, uma vez que os imóveis têm matrículas distintas.","O imóvel que tem como função precípua a realização dos cultos fará jus à imunidade do IPTU, já que os imóveis apresentam duplicidade de matrículas.","A imunidade tributária religiosa do IPTU beneficia o imóvel em que se realiza o culto e todos os imóveis afetados à sua finalidade essencial, ainda que os imóveis tenham matrículas distintas.","Para que os imóveis pudessem gozar da imunidade tributária religiosa do IPTU, seria necessário que suas matrículas fossem unificadas."],"gabarito":"C","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa C. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":9,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":27,"codigo":"OAB44TIPO1-027","area":"Direito Tributário / Direito Financeiro","dificuldade":"Difícil","enunciado":"Uma sociedade empresária do setor petrolífero adquiriu uma Unidade Flutuante de Produção, Armazenamento e Transferência de Petróleo, a fim de produzir petróleo nas águas territoriais brasileiras. Esta Unidade tem capacidade de se locomover pelas águas por meio de motores próprios, razão pela qual o Estado Alfa, onde fica o domicílio da sociedade empresária, publicou, em 10/02/2024, lei estadual ordinária estabelecendo que a propriedade de tais Unidades configura fato gerador de IPVA. Diante desse cenário, assinale a afirmativa correta.","alternativas":["Embora se trate de veículo automotor, a Constituição Federal proíbe a incidência de IPVA sobre quaisquer veículos aquáticos.","O IPVA não pode incidir sobre veículo que é utilizado nas águas territoriais brasileiras, mas apenas se fosse utilizado em terra.","Somente por lei complementar se poderia delimitar a incidência de IPVA sobre este tipo de Unidade.","Apesar de poder ser classificada como veículo automotor, o IPVA não incidirá por exceção constitucional."],"gabarito":"D","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa D. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":9,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":28,"codigo":"OAB44TIPO1-028","area":"Direito Tributário / Direito Financeiro","dificuldade":"Médio","enunciado":"José recebeu notificação para pagar ou impugnar o lançamento referente a determinado crédito tributário estadual dentro do prazo de 30 dias corridos. No 20º dia do recebimento da notificação, quando pretendia protocolizar impugnação administrativa contra a cobrança, verificou, por meio da Internet, que seu nome já constava do cadastro da Dívida Ativa Estadual, em razão da dívida que lhe fora notificada. Diante desse cenário, assinale a afirmativa correta.","alternativas":["Como já ocorrera previamente o lançamento tributário, a inserção do nome de José no cadastro da Dívida Ativa Estadual era devida.","Foi indevida a inserção do nome de José no cadastro da Dívida Ativa Estadual antes do vencimento do prazo para pagamento ou impugnação.","É possível a inserção do nome de José no cadastro da Dívida Ativa Estadual, sob condição resolutiva vinculada ao prazo de 30 dias ofertado para que pagasse ou impugnasse o lançamento.","O lançamento da dívida tributária se faz por meio do Termo de Inscrição em Dívida Ativa, razão pela qual não seria possível fazer o lançamento sem que o nome de José fosse inscrito em Dívida Ativa."],"gabarito":"B","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa B. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":9,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":29,"codigo":"OAB44TIPO1-029","area":"Direito Tributário / Direito Financeiro","dificuldade":"Fácil","enunciado":"Tendo ocorrido uma situação de calamidade pública no Município Alfa, no final do ano de 2022, a União enviou vultosos recursos federais para enfrentar tal situação. De modo a também diminuir a carga tributária sobre a população municipal nesse período, a União, por lei federal, aprovou uma isenção de Imposto sobre a Propriedade Predial e Territorial Urbana (IPTU) no Município, por todo o ano de 2023. O Prefeito municipal estava de acordo e editou um decreto para regulamentar a forma como se daria o gozo dessa isenção. Diante desse cenário, assinale a afirmativa correta.","alternativas":["A referida isenção, para ser válida, deveria ter sido veiculada por lei municipal.","A União, em situação de calamidade pública, excepcionalmente, fica autorizada por lei federal a conceder isenção de qualquer imposto municipal.","A União, como ente central, pode condicionar a entrega de tais recursos ao Município à aceitação de que lei federal conceda isenção de imposto municipal.","A edição de decreto por parte do Prefeito configura a concordância do ente municipal com a concessão de tal isenção, tornando-a válida por ratificação expressa do Município."],"gabarito":"A","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa A. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":10,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":30,"codigo":"OAB44TIPO1-030","area":"Direito Administrativo","dificuldade":"Médio","enunciado":"Juliana ajuizou duas ações indenizatórias que resultaram na condenação dos réus, obrigando-os a pagar vultosa quantia em dinheiro. A primeira foi ajuizada em face de uma autarquia e, a segunda, em face de uma sociedade de economia mista que realiza atividade econômica em regime concorrencial, cujos bens não estão afetados ao serviço público. Considerando que ambas as condenações transitaram em julgado e estão em fase de cumprimento de sentença, Juliana questionou você, como advogada(o), acerca da viabilidade de penhora dos bens das mencionadas entidades administrativas. Considerando a definição legal de bens públicos, assinale a opção que indica a informação correta que você prestou.","alternativas":["A penhora dos bens das referidas entidades administrativas integrantes da Administração Indireta é possível, considerando que os bens de ambas são privados.","A penhora dos bens das citadas entidades administrativas não é admissível, na medida em que os bens de ambas são públicos.","A penhora dos bens da autarquia é possível, na medida em que seus bens são privados, mas os da sociedade de economia mista não é viável, considerando que seus bens são públicos.","A penhora dos bens da sociedade de economia mista é possível, porque seus bens são privados, mas os da autarquia não podem ser penhorados, uma vez que seus bens são públicos."],"gabarito":"D","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa D. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":10,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":31,"codigo":"OAB44TIPO1-031","area":"Direito Administrativo","dificuldade":"Fácil","enunciado":"Jaílson pretende adquirir uma propriedade rural, considerada média nos termos da lei, que será a única de sua titularidade, para realizar a plantação de alimentos orgânicos para subsistência, mas tem o receio de investir todas as suas economias em imóvel que seja passível de desapropriação para fins de reforma agrária pela União, mediante indenização em títulos da dívida agrária. Diante disso, Jaílson consultou você, como advogado(a), acerca dos bens que podem ser objeto dessa intervenção do Estado na propriedade. Assinale a opção que apresenta a informação que você, corretamente, prestou.","alternativas":["São insuscetíveis de desapropriação para fins de reforma agrária a pequena e a média propriedade rural, assim definidas em lei, desde que seu proprietário não possua outra.","Qualquer propriedade é passível de desapropriação para fins de reforma agrária, independentemente de seu tamanho ou produtividade.","O tamanho da propriedade não é relevante com relação à desapropriação para fins de reforma agrária, pois são insuscetíveis de tal medida apenas os imóveis produtivos.","Somente os latifúndios são passíveis de desapropriação para fins de reforma agrária, ainda que sejam produtivos."],"gabarito":"A","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa A. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":10,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":32,"codigo":"OAB44TIPO1-032","area":"Direito Administrativo","dificuldade":"Médio","enunciado":"A sociedade empresária Chique possui dois contratos administrativos distintos regularmente formalizados com o Município Gama, tendo por objeto a realização de serviços contínuos, com contratação de mão de obra para atividades de limpeza e manutenção predial. Registre-se que em apenas uma das contratações há cláusula expressa para a adoção de meios alternativos de solução de controvérsias. Durante a execução, o equilíbrio econômico-financeiro dos contratos foi fortemente afetado por áleas econômicas extraordinárias e imprevisíveis. Dessa forma, os representantes da sociedade empresária Chique procuram você, como advogado(a), sobre a viabilidade de usar instrumentos consensuais para restabelecer o equilíbrio econômico-financeiro do contrato ou outro meio extrajudicial para dirimir o conflito. À luz do disposto na Lei nº 14.133/2021, assinale a opção que, corretamente, materializa a essência da consultoria jurídica prestada por você à sociedade empresária Chique.","alternativas":["O contrato, que não prevê expressamente a utilização de meios alternativos de solução de controvérsias, pode ser aditado para admitir instrumentos consensuais para tal finalidade.","O contrato, que possui previsão expressa, pode usar a arbitragem como meio alternativo de resolução das controvérsias, sendo que a escolha dos árbitros cabe à contratante, independentemente dos critérios isonômicos, técnicos e de transparência.","A conciliação e a mediação não são admitidas como instrumentos consensuais para a resolução de conflitos com a Administração Pública, de modo que não é possível a utilização de tais meios alternativos, nem mesmo para a hipótese em que exista previsão contratual.","Em razão da natureza do conflito, que versa sobre o equilíbrio econômico-financeiro de contrato administrativo, não é viável o uso de qualquer meio alternativo de resolução das controvérsias, de forma que eventual cláusula contratual nesse sentido, estipulada pelo Município Alfa e pela sociedade empresária Chique, é nula."],"gabarito":"A","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa A. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":10,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":33,"codigo":"OAB44TIPO1-033","area":"Direito Administrativo","dificuldade":"Difícil","enunciado":"A sociedade empresária Bemquerer obteve junto ao órgão municipal competente uma licença, que não tem cunho ambiental, versando sobre matéria administrativa, a qual é ato vinculado, mediante o preenchimento dos requisitos legais, de acordo com a orientação geral da Administração, vigente à época do deferimento, quanto a certo conceito jurídico indeterminado constante da respectiva norma local. Diante da relevância de tal licença para as suas atividades, os dirigentes da aludida sociedade consultaram você, na condição de advogado(a), em relação à viabilidade de modificação da situação jurídica deles, em decorrência de eventual mudança de entendimento atinente ao referido conceito jurídico indeterminado, notadamente se a nova orientação vier a impor um novo condicionamento para o Direito. À luz das normas sobre segurança jurídica e eficiência na interpretação e aplicação do Direito Público, introduzidas pela Lei nº 13.655/2018 no Decreto-Lei nº 4.657/1942 (Lei de Introdução às Normas do Direito Brasileiro), assinale a opção que, corretamente, apresenta seu esclarecimento.","alternativas":["Caso nova orientação geral venha a ser editada pela Administração, deve ser invalidada situação jurídica consolidada para a sociedade Bemquerer, mesmo que a licença ainda esteja em seu prazo de validade, considerando que a anulação deve operar efeitos retroativos.","Eventual mudança de orientação geral em sede administrativa deve retroagir para alcançar a situação jurídica constituída para a sociedade Bemquerer, independentemente da orientação vigente à época do deferimento da licença, o que importaria necessariamente na revogação do ato deferido.","O entendimento que permitiu o deferimento da licença para a sociedade Bemquerer apenas poderia prevalecer se fundado em jurisprudência firmada no âmbito do Poder Judiciário, considerando que as diretrizes estabelecidas em sede administrativa não podem ser consideradas orientações gerais.","A decisão administrativa que venha a estabelecer nova orientação que preveja novo condicionamento do Direito, deverá prever regime de transição para que a sociedade Bemquerer possa cumprir tal condicionamento ulterior de modo proporcional, equânime e eficiente e sem prejuízo aos interesses gerais."],"gabarito":"D","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa D. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":11,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":34,"codigo":"OAB44TIPO1-034","area":"Direito Administrativo","dificuldade":"Médio","enunciado":"Em dezembro de 2024, Lucas, servidor público celetista no âmbito da empresa pública XYZ, permitiu, culposamente, que Matheus da Silva utilizasse veículos automotores da estatal para a execução de serviços particulares, sem qualquer relação com a empresa pública. Nesse contexto, após tomar ciência de que o Ministério Público deflagrou inquérito civil para apurar os fatos, Lucas procurou você para, na qualidade de advogado(a), lhe prestar a adequada orientação jurídica. Sobre a posição de Lucas, considerando a Lei nº 8.429/1992 (Lei de Improbidade Administrativa), assinale a afirmativa correta.","alternativas":["Ele responderá por ato de improbidade administrativa, desde que se comprove a perda patrimonial efetiva em detrimento da empresa pública XYZ.","Ele não está sujeito aos regramentos da Lei de Improbidade Administrativa, por não se enquadrar como um servidor público estatutário.","Ele não poderá ser responsabilizado por ato de improbidade administrativa, já que não agiu de forma dolosa.","Ele será responsabilizado pela prática de ato de improbidade administrativa que importa enriquecimento ilícito."],"gabarito":"C","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa C. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":11,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":35,"codigo":"OAB44TIPO1-035","area":"Direito Ambiental","dificuldade":"Médio","enunciado":"A sociedade empresária Empreendedorix deseja construir um grande shopping center em terreno situado na área urbana do Município Delta, que contribuirá para incrementar o comércio na localidade, mas surtirá efeitos na qualidade de vida da população e no meio ambiente do entorno, razão pela qual a atividade se enquadra entre aquelas para as quais é necessária a elaboração de Estudo de Impacto Ambiental (EIA). Ocorre que o Município Delta tem legislação local que define que tal empreendimento privado depende de elaboração de Estudo Prévio de Impacto de Vizinhança (EIV), para obter as licenças ou autorizações de construção, ampliação ou funcionamento a cargo do Poder Público local. Em razão disso, os representantes da sociedade empresária Empreendedorix procuram você, como advogado(a), para esclarecer as peculiaridades do instrumento previsto na referida legislação municipal. Considerando os fatos narrados, assinale a afirmativa correta.","alternativas":["O EIV, diferentemente do EIA, não pode ser enquadrado como instrumento da Política Nacional do Meio Ambiente.","A realização do EIV não substitui a elaboração e a aprovação do EIA, requeridas nos termos da legislação ambiental.","O EIV será executado de forma a contemplar seus efeitos positivos, mas não precisa apontar os efeitos negativos do empreendimento, diante de seus objetivos legítimos.","Independentemente de previsão na lei municipal, o EIV seria necessário, considerando o grande empreendimento a ser realizado pela sociedade Empreendedorix."],"gabarito":"B","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa B. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":11,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":36,"codigo":"OAB44TIPO1-036","area":"Direito Ambiental","dificuldade":"Fácil","enunciado":"Por decisão de seus representantes legais, o exercício de determinada atividade empresarial da sociedade Aurora, em benefício próprio, ensejou a poluição de um determinado rio, de modo que a conduta praticada ocasionou severos danos ao meio ambiente e, ao mesmo tempo, caracteriza ilícito penal, civil e administrativo. Diante dessa situação hipotética e considerando as normas de responsabilização da pessoa jurídica em matéria ambiental, assinale a afirmativa correta.","alternativas":["A sociedade Aurora deve ser responsabilizada administrativa, civil e penalmente pela aludida conduta, nos termos da legislação de regência.","Eventual responsabilização penal da sociedade Aurora afasta a possibilidade de que ela seja responsabilizada nas esferas civil e administrativa.","Para que possa responder na esfera administrativa, é imprescindível a condenação penal da sociedade Aurora, o que não ocorre para fins de responsabilização civil.","Por se tratar de pessoa jurídica, a sociedade Aurora não pode ser responsabilizada na esfera penal, de modo que a sua responsabilização fica restrita às esferas civil e administrativa."],"gabarito":"A","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa A. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":12,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":37,"codigo":"OAB44TIPO1-037","area":"Direito Civil","dificuldade":"Médio","enunciado":"Gabriel e Vitória, pais de Ana e de Clara, faleceram em um acidente aéreo. Os parentes mais próximos de Ana e Clara são os tios, Rafael – irmão de Gabriel –, com 42 anos de idade, e a tia, Júlia – irmã de Vitória –, com 38 anos de idade. Atualmente, Ana tem 9 anos de idade e, Clara, 7. Verificou-se que, em seus respectivos testamentos, Gabriel e Vitória nomearam, como tutor de Ana e Clara, Lucas, primo de Gabriel. Sobre o caso narrado, segundo o ordenamento jurídico brasileiro, assinale a afirmativa correta.","alternativas":["Júlia deverá exercer a tutela das meninas, por estar no mesmo grau de parentesco que Rafael, e por ser mais nova que ele, além de ser parente mais próxima que Lucas.","Rafael deverá exercer a tutela das meninas, por estar no mesmo grau de parentesco que Júlia, e por ser mais velho que ela, além de ser parente mais próximo que Lucas.","Lucas não poderá exercer a tutela, porque somente os colaterais até o terceiro grau podem ser tutores.","Lucas deverá exercer a tutela, por ter sido nomeado pelos pais das meninas em testamento."],"gabarito":"D","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa D. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":12,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":38,"codigo":"OAB44TIPO1-038","area":"Direito Civil","dificuldade":"Médio","enunciado":"A sociedade empresária Calçados Novos Ltda. consultou você, como advogado(a), na qualidade de controladora dos dados pessoais de seus clientes. Isso porque há quantidade relevante de dados cujo término do tratamento já ocorreu, considerando o fim do período de tratamento. Contudo, a sociedade empresária tem a intenção de manter as informações históricas de seus clientes, para fins exclusivamente estatísticos, sem a necessidade de identificar pessoalmente os titulares de cada informação. Sobre a hipótese narrada, considerando o interesse do cliente, assinale a afirmativa correta.","alternativas":["A controladora é obrigada a eliminar os dados pessoais dos clientes cujo término do tratamento já ocorreu, em qualquer hipótese.","A controladora pode conservar os dados cujo término do tratamento já ocorreu, desde que ainda seja possível tratar os dados conforme a finalidade específica.","A controladora pode conservar os dados cujo término do tratamento já ocorreu, para seu uso exclusivo, vedado o acesso por terceiro, e desde que anonimizados os dados.","A controladora é obrigada a eliminar os dados pessoais dos clientes cujo término do tratamento já ocorreu, desde que desnecessários ao alcance da finalidade específica almejada."],"gabarito":"C","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa C. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":12,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":39,"codigo":"OAB44TIPO1-039","area":"Direito Civil","dificuldade":"Difícil","enunciado":"Cláudia é devedora de valores elevados e foi executada em determinada demanda. Para evitar a penhora de seu carro, celebrou contrato de compra e venda do veículo com Eduardo, seu amigo fraterno, indicando data anterior às dívidas. Cláudia e Eduardo combinaram que o contrato não produziria qualquer efeito, de modo que não houve o pagamento do preço e tampouco a transferência da propriedade do carro. Sobre o contrato celebrado entre Cláudia e Eduardo, assinale a afirmativa correta.","alternativas":["É anulável.","É válido, mas ineficaz.","É nulo, sem possibilidade de aproveitamento.","Pode ser convalidado, bastando que se desconsidere a data indicada e se considere a data em que ele efetivamente foi celebrado."],"gabarito":"C","comentario":"Gabarito extraído do
