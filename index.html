.75;font-weight:700;margin-bottom:1rem">'+escapeHtml(q.text)+'</p>'+q.opts.map((o,i)=>'<button class="q-option '+(qSelected!==null?(i===q.correta?'correct':qSelected===i?'wrong':''):'')+'" '+(qSelected!==null?'disabled':'')+' onclick="qSelected='+i+';render()"><span class="q-letter">'+'ABCD'[i]+'</span>'+escapeHtml(o)+'</button>').join('')+(qSelected!==null?'<div class="card" style="margin-top:.8rem;background:'+(qSelected===q.correta?'var(--grn-l)':'var(--red-l)')+';color:'+(qSelected===q.correta?'var(--grn)':'var(--red)')+'"><b>'+(qSelected===q.correta?'Correto.':'Incorreto.')+'</b> '+escapeHtml(q.comment)+'</div>':'')+'<div style="text-align:right;margin-top:1rem"><button class="btn" onclick="qIndex=(qIndex+1)%'+Math.max(1,qs.length)+';qSelected=null;render()">Próxima questão</button></div></div>'}

function pesquisarJuris(){const q=(document.getElementById('jurisBusca')?.value||'').trim();const box=document.getElementById('jurisResultados');if(!box)return;box.innerHTML=q?'<div class="juris-result"><b>Consulta preparada:</b> '+escapeHtml(q)+'<br>Use o chat ao lado para pedir ementas, fundamentos legais, teses relacionadas ou riscos da argumentação.</div>':'<div class="juris-result">Digite um tema para preparar a pesquisa.</div>'}
async function enviarChatJuridico(){const input=document.getElementById('chatPergunta'),pergunta=(input?.value||'').trim();if(!pergunta)return;chatHistory.push({role:'user',content:pergunta},{role:'assistant',content:'Consultando a API...'});render();try{const response=await fetch(getChatEndpoint(),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:pergunta,history:chatHistory.slice(0,-1)})});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Falha ao consultar a API.');chatHistory[chatHistory.length-1]={role:'assistant',content:data.answer||'A API não retornou texto.'}}catch(err){chatHistory[chatHistory.length-1]={role:'assistant',content:'Não consegui consultar a API. '+(err?.message||'Verifique se o servidor local está ativo e se OPENAI_API_KEY foi configurada.')}}render()}

essões ativas dos alunos no período selecionado.</p>'+coordDurationRows()+'</div></div><div class="card"><div style="display:flex;justify-content:space-between;gap:1rem;align-items:flex-start"><div><h3>Dúvidas mais recorrentes no Chat Jurídico IA</h3><p class="coord-note">No protótipo, estes dados são exemplos agregados. Em produção, a tela pode puxar logs anonimizados do chat, com consentimento e política de privacidade, no fechamento mensal.</p></div>'+tag('Chat IA','purple')+'</div><div class="grid2" style="margin-top:.7rem">'+coordDuvidas.map(d=>'<div class="coord-topic"><div><b>'+d.tema+'</b><p>'+d.amostra+'</p></div><span class="coord-count">'+d.qtd+' dúvidas</span></div>').join('')+'</div></div>'}

evisão para prova em sala','Acionar alunos com baixa permanência'].map((x,i)=>'<div class="coord-mini"><span>'+x+'</span>'+tag(i<2?'Prioridade':'Acompanhar',i<2?'red':'gray')+'</div>').join('')+'</div><div class="card"><h3>Critérios de disparo mensal</h3>'+['Erro acima de 45% em matéria-chave','Mais de 20 dúvidas semelhantes no Chat IA','Tempo médio abaixo de 15 minutos por aluno','Professor sem aplicação registrada no mês'].map(x=>'<div class="coord-topic"><div><b>'+x+'</b><p>Gera sugestão automática para análise da coordenação no fechamento mensal.</p></div></div>').join('')+'</div></div>'}
function coordProfessoresPage(){const lista=professoresAcesso.map((p,i)=>({...p,idx:i})).filter(p=>!teacherSearch||p.nome.toLowerCase().includes(teacherSearch.toLowerCase())||p.email.toLowerCase().includes(teacherSearch.toLowerCase())||p.materia.toLowerCase().includes(teacherSearch.toLowerCase())),ativos=professoresAcesso.filter(p=>p.status==='Ativo').length,materias=new Set(professoresAcesso.map(p=>p.materia)).size,novos=professoresAcesso.filter(p=>String(p.cadastro||'').endsWith('/2026')).length;return syncStrip('Acessos de professores')+'<div class="admin-head"><div class="page-title" style="margin:0;border:0;padding:0">Professores <small>cadastro de acesso ao painel</small></div><div class="admin-tools"><input class="form-input" style="width:220px" placeholder="Buscar professor..." value="'+escapeHtml(teacherSearch)+'" oninput="teacherSearch=this.value;render()"><button class="btn" onclick="showTeacherForm=!showTeacherForm;editingTeacherIndex=null;render()">+ Cadastrar professor</button></div></div><div class="card mural-hero"><div><div class="mural-kicker">Controle do coordenador</div><h2>Defina quem acessa o painel de professor</h2><p class="mural-text">O e-mail cadastrado deve ser o mesmo usado no login com Google. Professores ativos entram diretamente no painel de professor; inativos continuam sem esse perfil no protótipo.</p></div>'+tag('Login Google','green')+'</div>'+professorAcessoForm()+'<div class="grid4"><div class="card"><div class="stat-val">'+professoresAcesso.length+'</div><div class="stat-lbl">Professores cadastrados</div></div><div class="card"><div class="stat-val" style="color:var(--grn)">'+ativos+'</div><div class="stat-lbl">Com acesso ativo</div></div><div class="card"><div class="stat-val" style="color:var(--blue)">'+materias+'</div><div class="stat-lbl">Matérias cobertas</div></div><div class="card"><div class="stat-val" style="color:var(--gold)">'+novos+'</div><div class="stat-lbl">Registros em 2026</div></div></div><div class="card"><table class="student-table teacher-table"><tr><th>Professor</th><th>E-mail de acesso</th><th>Matéria</th><th>Turma</th><th>Cadastro</th><th>Último acesso</th><th>Status</th><th></th></tr>'+lista.map(p=>'<tr><td><div class="student-name"><div class="student-avatar" style="background:'+p.color+'">'+iniciais(p.nome)+'</div><div><b>'+escapeHtml(p.nome)+'</b><div class="student-doc">Painel de professor</div></div></div></td><td>'+escapeHtml(p.email)+'</td><td>'+tag(escapeHtml(p.materia))+'</td><td>'+escapeHtml(p.turma)+'</td><td>'+escapeHtml(p.cadastro)+'</td><td style="color:var(--t2)">'+escapeHtml(p.ultimo)+'</td><td><button class="icon-btn" onclick="toggleProfessorAcesso('+p.idx+')"><span class="status-pill '+(p.status==='Ativo'?'':'off')+'">'+escapeHtml(p.status)+'</span></button></td><td><button class="icon-btn" onclick="editarProfessorAcesso('+p.idx+')">✎</button><button class="icon-btn" onclick="removerProfessorAcesso('+p.idx+')">🗑</button></td></tr>').join('')+'</table></div>'}
function professorAcessoForm(){const p=editingTeacherIndex!==null?professoresAcesso[editingTeacherIndex]:null;return '<div class="card student-form '+(showTeacherForm?'show':'')+'"><h3>'+(p?'Editar professor':'Cadastrar professor')+'</h3><p class="coord-note">Use o e-mail Google institucional ou pessoal que o professor usará para entrar na Lexia.</p><div class="grid4" style="margin-top:.9rem"><label class="form-label">Nome<input id="profNome" class="form-input" placeholder="Nome completo" value="'+escapeHtml(p?.nome||'')+'"></label><label class="form-label">E-mail Google<input id="profEmail" class="form-input" placeholder="professor@lexia.br" value="'+escapeHtml(p?.email||'')+'"></label><label class="form-label">Matéria<select id="profMateria" class="form-select">'+areas.map(a=>'<option '+(p?.materia===a?'selected':'')+'>'+a+'</option>').join('')+'</select></label><label class="form-label">Turma<input id="profTurma" class="form-input" placeholder="Turma 2026" value="'+escapeHtml(p?.turma||'Turma 2026')+'"></label><label class="form-label">Status<select id="profStatus" class="form-select"><option '+(!p||p.status==='Ativo'?'selected':'')+'>Ativo</option><option '+(p?.status==='Inativo'?'selected':'')+'>Inativo</option></select></label><label class="form-label">Data de cadastro<input id="profCadastro" class="form-input" placeholder="dd/mm/aaaa" value="'+escapeHtml(p?.cadastro||'26/05/2026')+'"></label><label class="form-label">Último acesso<input id="profUltimo" class="form-input" placeholder="Hoje" value="'+escapeHtml(p?.ultimo||'Hoje')+'"></label><div style="display:flex;align-items:end;gap:.5rem"><button class="btn" onclick="salvarProfessorAcesso()">Salvar acesso</button><button class="btn btn-outline" onclick="showTeacherForm=false;editingTeacherIndex=null;render()">Cancelar</button></div></div></div>'}
function salvarProfessorAcesso(){const nome=(document.getElementById('profNome')?.value||'').trim(),email=(document.getElementById('profEmail')?.value||'').trim().toLowerCase(),materia=document.getElementById('profMateria')?.value||'Direito Civil',turma=(document.getElementById('profTurma')?.value||'Turma 2026').trim(),status=document.getElementById('profStatus')?.value||'Ativo',cadastro=(document.getElementById('profCadastro')?.value||'26/05/2026').trim(),ultimo=(document.getElementById('profUltimo')?.value||'Hoje').trim();if(!nome||!emailValido(email)){alert('Informe nome e e-mail válido do professor.');return}if(!new RegExp('^\\\\d{2}/\\\\d{2}/\\\\d{4}$').test(cadastro)){alert('Informe a data de cadastro no formato dd/mm/aaaa.');return}const duplicado=professoresAcesso.some((p,i)=>i!==editingTeacherIndex&&String(p.email).toLowerCase()===email);if(duplicado){alert('Este e-mail já está cadastrado para outro professor.');return}const item={nome,email,materia,turma,status,cadastro,ultimo,color:professoresAcesso[editingTeacherIndex]?.color||['#1a4f8a','#b03020','#1a7a3a','#5a3690','#8a6010'][professoresAcesso.length%5]};if(editingTeacherIndex!==null)professoresAcesso[editingTeacherIndex]=item;else professoresAcesso.unshift(item);persistProfessoresAcesso();showTeacherForm=false;editingTeacherIndex=null;render();alert('Professor salvo. Esse e-mail agora acessa o painel de professor quando o login Google estiver ativo.')}
function editarProfessorAcesso(i){editingTeacherIndex=i;showTeacherForm=true;render()}
function removerProfessorAcesso(i){if(confirm('Remover este professor da lista de acesso?')){professoresAcesso.splice(i,1);persistProfessoresAcesso();render()}}
function toggleProfessorAcesso(i){professoresAcesso[i].status=professoresAcesso[i].status==='Ativo'?'Inativo':'Ativo';persistProfessoresAcesso();render()}

function analyticsRadarChart(){return '<svg viewBox="0 0 300 205" aria-label="Perfil médio por área"><g transform="translate(150 104)" stroke="#dce2e9" fill="none"><polygon points="0,-74 64,-37 64,37 0,74 -64,37 -64,-37"/><polygon points="0,-50 43,-25 43,25 0,50 -43,25 -43,-25"/><polygon points="0,-25 22,-12 22,12 0,25 -22,12 -22,-12"/><line x1="0" y1="0" x2="0" y2="-74"/><line x1="0" y1="0" x2="64" y2="-37"/><line x1="0" y1="0" x2="64" y2="37"/><line x1="0" y1="0" x2="0" y2="74"/><line x1="0" y1="0" x2="-64" y2="37"/><line x1="0" y1="0" x2="-64" y2="-37"/><polygon points="0,-49 49,-28 38,22 0,48 -42,24 -50,-29" fill="rgba(26,79,138,.16)" stroke="#1a4f8a" stroke-width="3"/><polygon points="0,-62 56,-32 50,29 0,60 -55,31 -58,-34" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3 3"/></g><g font-size="10" fill="#596879" text-anchor="middle"><text x="150" y="18">Civil</text><text x="230" y="60">Penal</text><text x="236" y="145">Processo</text><text x="150" y="194">Trabalho</text><text x="66" y="145">Tributário</text><text x="68" y="60">Consumidor</text><text x="150" y="43">75</text><text x="150" y="67">50</text><text x="150" y="91">25</text></g></svg>'}
function adminProvas(){return '<div class="page-title">Provas & Questões</div><div class="admin-tabs">'+[['importar','Importar PDF (IA)'],['manual','Inserir manualmente'],['banco','Banco de questões']].map(t=>'<button class="admin-tab '+(adminProvasTab===t[0]?'on':'')+'" onclick="adminProvasTab=\''+t[0]+'\';render()">'+t[1]+'</button>').join('')+'</div>'+(adminProvasTab==='manual'?adminProvasManual():adminProvasTab==='banco'?adminProvasBanco():adminProvasImportar())}
function adminProvasImportar(){return '<div class="card"><h3>Importar prova em PDF via IA</h3><p class="mural-text">A IA extrairá questões, alternativas e gabaritos automaticamente. No protótipo, o botão gera questões demonstrativas e já adiciona ao banco usado pelo aluno.</p><div class="upload-box" onclick="document.getElementById(\'admPdf\').click()"><input id="admPdf" type="file" accept="application/pdf" style="display:none"><div class="upload-ico">'+icons.doc+'</div><b>Arraste o PDF ou clique para selecionar</b><div class="upload-sub">Apenas .pdf · Máx. 20 MB</div></div><div class="grid3"><label class="form-label">Área<select id="admImportArea" class="form-select"><option>Automático</option>'+areas.map(a=>'<option>'+a+'</option>').join('')+'</select></label><label class="form-label">Prova / Exame<input id="admImportProva" class="form-input" placeholder="Ex: OAB 40º · 2024" value="Simulado Coordenação · 2026"></label><label class="form-label">Dificuldade<select id="admImportDif" class="form-select"><option>Automático</option><option>Fácil</option><option selected>Médio</option><option>Difícil</option></select></label></div><button class="btn" style="margin-top:1rem" onclick="importarQuestoesIA()">Extrair com IA</button></div>'}
function adminProvasManual(){return '<div class="card"><h3>Inserir questão manualmente</h3><div class="grid2" style="margin-top:.9rem"><label class="form-label">Área *<select id="admArea" class="form-select">'+areas.map(a=>'<option '+(a==='Direito Civil'?'selected':'')+'>'+a+'</option>').join('')+'</select></label><label class="form-label">Prova / Fonte<input id="admFonte" class="form-input" placeholder="Ex: OAB 40º · FGV · 2024"></label><label class="form-label">Ano<input id="admAno" class="form-input" value="2026"></label><label class="form-label">Dificuldade<select id="admDif" class="form-select"><option>Fácil</option><option selected>Médio</option><option>Difícil</option></select></label></div><label class="form-label" style="margin-top:.9rem">Enunciado *<textarea id="admEnunciado" class="form-input" style="min-height:88px;resize:vertical" placeholder="Enunciado completo..."></textarea></label><label class="form-label" style="margin-top:.9rem">Imagem do enunciado (opcional)<div class="upload-box" style="min-height:105px;margin:.35rem 0 0"><div class="upload-ico">IMG</div><b>Clique ou arraste uma imagem</b><div class="upload-sub">JPG, PNG, GIF · Máx. 5 MB</div></div></label><div class="form-label" style="margin-top:.9rem">Alternativas <span class="muted-small">(marque a correta)</span></div>'+['A','B','C','D'].map((l,i)=>'<div class="alt-row"><span class="alt-letter">'+l+'</span><input id="admAlt'+l+'" class="form-input" placeholder="Alternativa '+l+'"><input type="radio" name="admCorreta" value="'+i+'" '+(i===0?'checked':'')+' aria-label="Marcar alternativa '+l+' como correta"></div>').join('')+'<label class="form-label" style="margin-top:.9rem">Comentário / Fundamento<textarea id="admComentario" class="form-input" style="min-height:66px;resize:vertical"></textarea></label><div class="admin-actions"><button class="btn" onclick="salvarQuestaoManual()">Salvar questão</button><button class="btn btn-outline" onclick="limparFormularioManual()">Limpar</button></div></div>'}
function adminProvasBanco(){const total=questoes.length,extras=questoesExtras.length,exames=new Set(questoes.map(q=>q.exame||q.prova));return '<div class="grid5"><div class="card"><div class="stat-val" style="color:var(--blue)">'+total+'</div><div class="stat-lbl">Questões no banco do aluno</div></div><div class="card"><div class="stat-val" style="color:var(--grn);font-size:1.4rem">'+total+'/'+total+'</div><div class="stat-lbl">Gabarito sincronizado</div></div><div class="card"><div class="stat-val" style="color:var(--pur);font-size:1.3rem">OAB + ENADE</div><div class="stat-lbl">Provas integradas</div></div><div class="card"><div class="stat-val" style="color:var(--gold);font-size:1.3rem">'+extras+'</div><div class="stat-lbl">Cadastradas/importadas</div></div><div class="card"><div class="stat-val" style="color:var(--blue2)">'+exames.size+'</div><div class="stat-lbl">Exames/fontes</div></div></div><div class="card">'+tag('Banco do aluno sincronizado','green')+tag('Extras: '+extras,'gold')+tag('OAB 2023 Tipo 1','green')+tag('ENADE 2025','purple')+'<div style="margin-top:.8rem"><a class="btn btn-outline" href="'+prova2023Url+'" target="_blank" rel="noopener">Abrir prova OAB 2023 - PDF FGV</a></div><div style="margin-top:1rem">'+questoes.slice(-14).reverse().map(q=>'<div class="question-bank-row"><div><b>'+escapeHtml(q.ref)+'</b><div style="font-size:.72rem;color:var(--t3);margin-top:.15rem">'+escapeHtml(q.text.slice(0,100))+'...</div></div><div>'+escapeHtml(q.area)+'</div><div>'+tag(q.gabarito)+'</div><div>'+tag(q.origem?'Professor':'Sincronizada',q.origem?'gold':'green')+'</div></div>').join('')+'</div></div>'}
function salvarQuestaoManual(){const area=document.getElementById('admArea')?.value||'Direito Civil',fonte=(document.getElementById('admFonte')?.value||'Questões do professor · '+syncState.periodo).trim(),ano=(document.getElementById('admAno')?.value||anoFromText(fonte)).trim(),dif=document.getElementById('admDif')?.value||'Médio',text=(document.getElementById('admEnunciado')?.value||'').trim(),opts=['A','B','C','D'].map(l=>(document.getElementById('admAlt'+l)?.value||'').trim()),correta=Number(document.querySelector('input[name="admCorreta"]:checked')?.value||0),comment=(document.getElementById('admComentario')?.value||'').trim();if(!text||opts.some(o=>!o)){alert('Preencha o enunciado e as quatro alternativas.');return}const nova=makeBancoQuestao({fonte,ano,area,dif,text,opts,correta,comment,origem:'Professor'});addQuestoesAoBanco([nova]);alert('Questão salva e sincronizada com o painel do aluno.')}
function importarQuestoesIA(){const fonte=(document.getElementById('admImportProva')?.value||'Importação IA · '+syncState.periodo).trim(),ano=anoFromText(fonte),difSel=document.getElementById('admImportDif')?.value||'Automático',areaSel=document.getElementById('admImportArea')?.value||'Automático',dif=difSel==='Automático'?'Médio':difSel,baseCount=questoes.filter(q=>q.exame===fonte||q.ref?.startsWith(fonte+' - Questão')).length,pool=areaSel==='Automático'?areas.slice(0,5):[areaSel];const novas=pool.map((area,i)=>{const modelo=modelos[area]||modelos.default,q=makeBancoQuestao({fonte,ano,area,dif,text:modelo[0],opts:modelo[1],correta:0,comment:'Questão extraída por IA no painel do professor e sincronizada com o banco do aluno.',origem:'Importação IA'});q.ref=fonte+' - Questão '+(baseCount+i+1);return q});addQuestoesAoBanco(novas);alert(novas.length+' questões importadas e sincronizadas com o painel do aluno.')}
function adminAlunos(){const filtrados=estudantes.filter(e=>!studentSearch||e.nome.toLowerCase().includes(studentSearch.toLowerCase())||e.email.toLowerCase().includes(studentSearch.toLowerCase()));const ativos=estudantes.filter(e=>e.status==='Ativo').length;return '<div class="admin-head"><div class="page-title" style="margin:0;border:0;padding:0">Estudantes</div><div class="admin-tools"><input class="form-input" style="width:195px" placeholder="Buscar por nome..." value="'+escapeHtml(studentSearch)+'" oninput="studentSearch=this.value;render()"><button class="btn" onclick="showStudentForm=!showStudentForm;render()">+ Cadastrar</button></div></div>'+adminAlunoForm()+'<div class="grid4"><div class="card"><div class="stat-val">'+estudantes.length+'</div><div class="stat-lbl">Total</div></div><div class="card"><div class="stat-val" style="color:var(--grn)">'+ativos+'</div><div class="stat-lbl">Ativos</div></div><div class="card"><div class="stat-val" style="color:var(--gold)">'+(estudantes.length-ativos)+'</div><div class="stat-lbl">Inativos</div></div><div class="card"><div class="stat-val" style="color:var(--blue)">3</div><div class="stat-lbl">Este mês</div></div></div><div class="card"><table class="student-table"><tr><th>Estudante</th><th>E-mail</th><th>Turma</th><th>Trilha</th><th>XP</th><th>Última atividade</th><th>Status</th><th></th></tr>'+filtrados.map((e,i)=>'<tr><td><div class="student-name"><div class="student-avatar" style="background:'+e.color+'">'+iniciais(e.nome)+'</div><div><b>'+e.nome+'</b><div class="student-doc">'+e.doc+'</div></div></div></td><td>'+e.email+'</td><td>'+e.turma+'</td><td>'+tag(e.trilha)+'</td><td><b>'+e.xp+'</b></td><td style="color:var(--t2)">'+e.atividade+'</td><td><span class="status-pill '+(e.status==='Ativo'?'':'off')+'">'+e.status+'</span></td><td><button class="icon-btn" onclick="editarAluno('+i+')">✎</button><button class="icon-btn" onclick="removerAluno('+i+')">🗑</button></td></tr>').join('')+'</table></div>'}
function adminAlunoForm(){return '<div class="card student-form '+(showStudentForm?'show':'')+'"><h3>Cadastrar estudante</h3><div class="grid4" style="margin-top:.9rem"><label class="form-label">Nome<input id="alunoNome" class="form-input" placeholder="Nome completo"></label><label class="form-label">E-mail<input id="alunoEmail" class="form-input" placeholder="aluno@lexia.br"></label><label class="form-label">CPF<input id="alunoDoc" class="form-input" placeholder="000.000.000-00"></label><label class="form-label">Turma<input id="alunoTurma" class="form-input" value="Turma 2026 — 1º período"></label><label class="form-label">Trilha<select id="alunoTrilha" class="form-select">'+areas.slice(0,8).map(a=>'<option>'+a+'</option>').join('')+'</select></label><label class="form-label">Status<select id="alunoStatus" class="form-select"><option>Ativo</option><option>Inativo</option></select></label><label class="form-label">XP<input id="alunoXp" class="form-input" type="number" value="0"></label><div style="display:flex;align-items:end;gap:.5rem"><button class="btn" onclick="cadastrarAluno()">Salvar</button><button class="btn btn-outline" onclick="showStudentForm=false;render()">Cancelar</button></div></div></div>'}
function iniciais(nome){return nome.split(' ').filter(Boolean).slice(0,2).map(p=>p[0]).join('').toUpperCase()}
function cadastrarAluno(){const nome=(document.getElementById('alunoNome')?.value||'').trim(),email=(document.getElementById('alunoEmail')?.value||'').trim();if(!nome||!email){alert('Preencha nome e e-mail.');return}estudantes=[{nome,email,doc:(document.getElementById('alunoDoc')?.value||'').trim()||'000.000.000-00',turma:(document.getElementById('alunoTurma')?.value||'Turma 2026 — 1º período').trim(),trilha:document.getElementById('alunoTrilha')?.value||'Direito Civil',xp:Number(document.getElementById('alunoXp')?.value||0),atividade:'Hoje',status:document.getElementById('alunoStatus')?.value||'Ativo',color:'#1a4f8a'},...estudantes];showStudentForm=false;studentSearch='';render()}
function removerAluno(i){estudantes.splice(i,1);estudantes=[...estudantes];render()}
function editarAluno(i){const e=estudantes[i];showStudentForm=true;render();setTimeout(()=>{document.getElementById('alunoNome').value=e.nome;document.getElementById('alunoEmail').value=e.email;document.getElementById('alunoDoc').value=e.doc;document.getElementById('alunoTurma').value=e.turma;document.getElementById('alunoTrilha').value=e.trilha;document.getElementById('alunoStatus').value=e.status;document.getElementById('alunoXp').value=e.xp;removerAluno(i)},0)}
function adminMural(){return '<div class="admin-head"><div class="page-title" style="margin:0;border:0;padding:0">Mural</div><div class="admin-tools"><button class="btn" onclick="novoItemMural()">+ Novo aviso</button></div></div><div class="card mural-hero"><div><div class="mural-kicker">Gestão do mural dos alunos</div><h2>Edite notícias, prazos e avisos importantes</h2><p class="mural-text">Os cards abaixo alimentam a aba Mural do estudante no protótipo. Use para destacar datas da OAB, notícias jurídicas e comunicados internos.</p></div><button class="btn btn-outline" onclick="panel=\'mural\';role=\'aluno\';renderNav();render()">Pré-visualizar como aluno</button></div>'+adminMuralForm()+'<div class="grid2">'+muralCards.map((m,i)=>'<div class="card mural-card '+m.tone+'">'+tag(m.tag,m.tone==='urgent'?'red':m.tone==='event'?'gold':'purple')+'<h3 style="margin-top:.55rem">'+m.title+'</h3><div class="mural-date">'+m.date+'</div><p class="mural-text">'+m.text+'</p><a class="mural-link" href="'+m.url+'" target="_blank" rel="noopener">Fonte: '+m.source+'</a><div class="admin-actions"><button class="btn btn-outline" onclick="editarMural('+i+')">Editar</button><button class="btn btn-outline" onclick="removerMural('+i+')">Remover</button></div></div>').join('')+'</div>'}
function adminMuralForm(){const m=editingMuralIndex!==null?muralCards[editingMuralIndex]:null,ex={tag:'Ex: OAB 47º EOU',date:'Ex: 30/08/2026',title:'Ex: 1ª fase do 47º Exame de Ordem',text:'Ex: Prova objetiva prevista no calendário oficial. Revise Ética, Constitucional, Civil e Processo Civil nesta semana.',source:'Ex: OAB/FGV',url:'Ex: https://examedeordem.oab.org.br/'};return '<div class="card student-form '+(showMuralForm?'show':'')+'"><h3>'+(m?'Editar aviso':'Novo aviso')+'</h3><div class="grid3" style="margin-top:.9rem"><label class="form-label">Tipo<select id="muralTone" class="form-select"><option value="urgent" '+(m?.tone==='urgent'?'selected':'')+'>Urgente</option><option value="event" '+(!m||m?.tone==='event'?'selected':'')+'>Evento</option><option value="study" '+(m?.tone==='study'?'selected':'')+'>Estudo</option></select></label><label class="form-label">Etiqueta<input id="muralTag" class="form-input" value="'+escapeHtml(m?.tag||'')+'" placeholder="'+escapeHtml(ex.tag)+'"></label><label class="form-label">Data<input id="muralDate" class="form-input" value="'+escapeHtml(m?.date||'')+'" placeholder="dd/mm/aaaa"></label></div><label class="form-label" style="margin-top:.9rem">Título<input id="muralTitle" class="form-input" value="'+escapeHtml(m?.title||'')+'" placeholder="'+escapeHtml(ex.title)+'"></label><label class="form-label" style="margin-top:.9rem">Texto<textarea id="muralText" class="form-input" style="min-height:88px;resize:vertical" placeholder="'+escapeHtml(ex.text)+'">'+escapeHtml(m?.text||'')+'</textarea></label><div class="grid2" style="margin-top:.9rem"><label class="form-label">Fonte<input id="muralSource" class="form-input" value="'+escapeHtml(m?.source||'')+'" placeholder="'+escapeHtml(ex.source)+'"></label><label class="form-label">Link<input id="muralUrl" class="form-input" value="'+escapeHtml(m?.url||'')+'" placeholder="'+escapeHtml(ex.url)+'"></label></div><div class="admin-actions"><button class="btn" onclick="salvarMural()">Salvar aviso</button><button class="btn btn-outline" onclick="showMuralForm=false;editingMuralIndex=null;render()">Cancelar</button></div></div>'}
function novoItemMural(){showMuralForm=true;editingMuralIndex=null;render()}
function editarMural(i){editingMuralIndex=i;showMuralForm=true;render()}
function removerMural(i){muralCards.splice(i,1);render()}
function salvarMural(){const item={tone:document.getElementById('muralTone')?.value||'study',tag:(document.getElementById('muralTag')?.value||'Comunicado').trim(),title:(document.getElementById('muralTitle')?.value||'Aviso').trim(),date:(document.getElementById('muralDate')?.value||'').trim(),text:(document.getElementById('muralText')?.value||'').trim(),url:(document.getElementById('muralUrl')?.value||'#').trim(),source:(document.getElementById('muralSource')?.value||'Lexia').trim()};if(!item.title||!item.text){alert('Preencha título e texto do aviso.');return}if(!new RegExp('^\\\\d{2}/\\\\d{2}/\\\\d{4}$').test(item.date)){alert('Informe a data no formato dd/mm/aaaa.');return}if(editingMuralIndex!==null)muralCards[editingMuralIndex]=item;else muralCards.unshift(item);showMuralForm=false;editingMuralIndex=null;render()}
function adminSimple(){return '<div class="page-title">'+document.getElementById('crumb').textContent+'</div><div class="card"><p style="font-size:.85rem;line-height:1.7;color:var(--t2)">Área administrativa preservada em formato navegável para gestão de conteúdo, peças e relatórios.</p></div>'}
</script>

  messagingSenderId: "482222531258",
  storageBucket: "lexia-plataforma.firebasestorage.app"
};
const lexiaAuthRules = {
  coordenadorEmails: ["coordenador@lexia.br"],
  professorEmails: ["professor@lexia.br"]
};
const firebaseSdkVersion = "12.7.0";
function firebaseIsConfigured(){
  return firebaseConfig.apiKey && !firebaseConfig.apiKey.includes("COLE_AQUI");
}
function roleForGoogleEmail(email){
  const normalized = String(email||"").toLowerCase();
  if(lexiaAuthRules.coordenadorEmails.map(e=>e.toLowerCase()).includes(normalized))return "coord";
  const professoresCadastrados = window.getProfessoresAcessoEmails ? window.getProfessoresAcessoEmails() : [];
  if([...lexiaAuthRules.professorEmails,...professoresCadastrados].map(e=>e.toLowerCase()).includes(normalized))return "professor";
  return "aluno";
}
async function getFirebaseAuth(){
  if(!window.lexiaFirebaseApp){
    const appSdk = await import(`https://www.gstatic.com/firebasejs/${firebaseSdkVersion}/firebase-app.js`);
    window.lexiaFirebaseApp = appSdk.initializeApp(firebaseConfig);
  }
  if(!window.lexiaFirebaseAuth){
    const authSdk = await import(`https://www.gstatic.com/firebasejs/${firebaseSdkVersion}/firebase-auth.js`);
    window.lexiaFirebaseAuthSdk = authSdk;
    window.lexiaFirebaseAuth = authSdk.getAuth(window.lexiaFirebaseApp);
  }
  return window.lexiaFirebaseAuth;
}
window.lexiaGoogleLogin = async function(selectedRole){
  if(!firebaseIsConfigured()){
    alert("Firebase ainda não foi configurado. Entrando em modo demonstrativo.");
    window.lexiaApplyGoogleUser(selectedRole,null);
    return;
  }
  try{
    const auth = await getFirebaseAuth();
    const {GoogleAuthProvider,signInWithPopup} = window.lexiaFirebaseAuthSdk || await import(`https://www.gstatic.com/firebasejs/${firebaseSdkVersion}/firebase-auth.js`);
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({prompt:"select_account"});
    const result = await signInWithPopup(auth,provider);
    const user = result.user;
    window.lexiaApplyGoogleUser(roleForGoogleEmail(user.email),{name:user.displayName||user.email,email:user.email});
  }catch(err){
    alert("Não foi possível entrar com Google. Verifique a configuração do Firebase e os domínios autorizados.");
    console.error(err);
  }
};
window.lexiaFirebaseSignOut = async function(){
  try{
    if(!window.lexiaFirebaseAuth)return;
    const {signOut} = window.lexiaFirebaseAuthSdk || await import(`https://www.gstatic.com/firebasejs/${firebaseSdkVersion}/firebase-auth.js`);
    await signOut(window.lexiaFirebaseAuth);
  }catch(err){
    console.warn(err);
  }
};
</script>
