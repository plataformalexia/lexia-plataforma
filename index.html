#app-screen{display:none;height:100vh;flex-direction:column}.topbar{height:54px;background:var(--navy);border-bottom:2px solid var(--blue2);display:flex;align-items:center;justify-content:space-between;color:#fff;flex-shrink:0}.tb-left{display:flex;align-items:center;height:100%}.tb-logo-wrap{width:var(--sidebar);height:100%;background:var(--navy2);display:flex;align-items:center;gap:10px;padding:0 1.25rem;border-right:1px solid rgba(255,255,255,.06)}.tb-logo-name{font-weight:900}.tb-logo-name span{color:#5b9bd5}.tb-breadcrumb{font-size:.75rem;color:rgba(255,255,255,.48);margin-left:1.5rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.tb-right{display:flex;align-items:center;gap:.75rem;margin-right:1.2rem}.tb-uinfo{text-align:right}.tb-uname{font-size:.78rem;font-weight:800}.tb-urole{font-size:.68rem;color:rgba(255,255,255,.45)}.tb-avatar{width:32px;height:32px;border-radius:5px;background:var(--blue2);display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:900;cursor:pointer}.app-body{display:flex;flex:1;min-height:0}.sidebar{width:var(--sidebar);background:var(--navy2);color:#fff;overflow:auto;flex-shrink:0}.sb-section-label{font-size:.62rem;font-weight:900;color:rgba(255,255,255,.25);letter-spacing:.16em;text-transform:uppercase;padding:.9rem 1.2rem .35rem;margin-top:.25rem}.sb-item{display:flex;align-items:center;gap:.65rem;width:100%;padding:.56rem 1.2rem;font-size:.82rem;font-weight:700;color:rgba(255,255,255,.58);cursor:pointer;border:0;background:transparent;text-align:left;border-left:3px solid transparent;transition:.12s}.sb-item:hover{background:rgba(255,255,255,.05);color:#fff}.sb-item.on{background:rgba(91,155,213,.14);color:#5b9bd5;border-left-color:#5b9bd5}.sb-ico{width:18px}.sb-badge{margin-left:auto;background:rgba(255,255,255,.12);border-radius:4px;padding:.1rem .45rem;font-size:.62rem}.main-content{flex:1;overflow:auto;padding:1.75rem 2rem}.page-title{font-size:1.15rem;font-weight:900;margin-bottom:1.5rem;padding-bottom:.9rem;border-bottom:1px solid var(--bd)}.page-title small{font-size:.78rem;color:var(--t3);font-weight:400;margin-left:.5rem}.card{background:#fff;border:1px solid var(--bd);border-radius:var(--r);padding:1.25rem;margin-bottom:1rem;box-shadow:0 1px 4px rgba(0,0,0,.04)}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:.85rem}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:.85rem}.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:.85rem}.stat-val{font-size:1.85rem;font-weight:900;line-height:1}.stat-lbl{font-size:.74rem;color:var(--t2);margin-top:.35rem}.tag{display:inline-flex;align-items:center;padding:.22rem .55rem;border-radius:4px;font-size:.68rem;font-weight:900;background:var(--blue-l);color:var(--blue);margin-right:.3rem}.tag.green{background:var(--grn-l);color:var(--grn)}.tag.red{background:var(--red-l);color:var(--red)}.tag.gold{background:var(--gold-l);color:var(--gold)}.tag.purple{background:var(--pur-l);color:var(--pur)}.tag.gray{background:#f0f3f6;color:var(--t2)}.btn{display:inline-flex;align-items:center;justify-content:center;gap:.35rem;background:var(--blue);color:#fff;border:0;border-radius:6px;padding:.55rem 1rem;font-size:.8rem;font-weight:800;cursor:pointer}.btn:hover{background:#1e5fa0}.btn-outline{background:#fff;color:var(--tx);border:1px solid #c4ced8}.progress{height:6px;background:#eef2f6;border:1px solid var(--bd);border-radius:999px;overflow:hidden}.bar{height:100%;background:var(--blue);border-radius:999px}.form-label{display:flex;flex-direction:column;gap:.35rem;font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;font-weight:900;color:var(--t2)}.form-select,.form-input{border:1.5px solid var(--bd);border-radius:6px;padding:.58rem .8rem;color:var(--tx);background:#fff;font-size:.84rem}.hero{display:flex;align-items:center;gap:1.1rem;margin-bottom:1.25rem}.avatar-xl{width:56px;height:56px;border-radius:8px;background:var(--blue);color:#fff;font-size:1.3rem;font-weight:900;display:flex;align-items:center;justify-content:center}.hero-main{flex:1}.hero-side{text-align:right}.timeline-row{display:flex;gap:.85rem;border-bottom:1px solid var(--bd);padding:.7rem 0}.dot{width:10px;height:10px;border-radius:50%;background:var(--blue);margin-top:.28rem;flex-shrink:0}.dot.gold{background:var(--gold)}.trilha-card{background:#fff;border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.04)}.trilha-header{padding:1rem 1.25rem;border-bottom:1px solid var(--bd)}.modulo{display:flex;align-items:center;gap:.75rem;padding:.65rem 1.25rem;border-left:3px solid transparent;cursor:pointer}.modulo:hover{background:#f7f9fb}.mod-ico{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;border:1.5px solid var(--bd);background:#f0f3f6}.modulo.done{border-left-color:var(--grn)}.modulo.active{background:var(--blue-l);border-left-color:var(--blue)}.modulo.done .mod-ico{background:var(--grn-l);color:var(--grn);border-color:var(--grn)}.modulo.active .mod-ico{background:var(--blue-l);color:var(--blue);border-color:var(--blue)}.fc-deck{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem}.flash-card{border:1.5px solid var(--bd);background:#fff;border-radius:var(--r);padding:1.15rem;text-align:left;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.04)}.flash-card:hover{border-color:var(--blue);box-shadow:0 3px 12px rgba(26,79,138,.1)}.flash-card.revealed{background:var(--blue-l);border-color:var(--blue2)}.fc-q{font-size:.86rem;font-weight:800;line-height:1.55;margin:.8rem 0}.fc-a{display:none;border-top:1px solid var(--bd);padding-top:.75rem;font-size:.8rem;line-height:1.65;color:var(--t2)}.revealed .fc-a{display:block}.fc-hint{text-align:right;font-size:.68rem;color:var(--t3);font-style:italic}.q-option{display:flex;align-items:flex-start;gap:.65rem;width:100%;border:1.5px solid var(--bd);background:#fff;border-radius:6px;padding:.72rem .9rem;text-align:left;font-size:.82rem;line-height:1.5;cursor:pointer;margin:.55rem 0}.q-option:hover{background:var(--blue-l);border-color:var(--blue)}.q-option.correct{border-color:var(--grn);background:var(--grn-l);color:var(--grn)}.q-option.wrong{border-color:var(--red);background:var(--red-l);color:var(--red)}.q-letter{width:24px;height:24px;border-radius:50%;background:#f0f3f6;border:1px solid var(--bd);font-size:.72rem;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0}.report-q{border:1px solid var(--bd);border-radius:8px;padding:.9rem;margin:.7rem 0}.mini-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem;margin-top:.75rem}.mini{border-radius:6px;padding:.55rem .7rem;font-size:.75rem;font-weight:800}.mini.blue{background:var(--blue-l);color:var(--blue)}.mini.green{background:var(--grn-l);color:var(--grn)}.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:20}.modal.show{display:flex}.modal-box{width:560px;max-width:94vw;background:#fff;border-radius:8px;border:1px solid var(--bd);padding:1.5rem;box-shadow:0 12px 50px rgba(0,0,0,.2)}.modal-head{display:flex;justify-content:space-between;border-bottom:1px solid var(--bd);padding-bottom:.85rem;margin-bottom:1rem}.close{background:0;border:0;font-size:1.2rem;color:var(--t3);cursor:pointer}@media(max-width:950px){.grid2,.grid3,.grid4,.grid5,.fc-deck{grid-template-columns:1fr}.main-content{padding:1rem}.sidebar,.tb-logo-wrap{width:200px}.hero{align-items:flex-start}.hero-side{text-align:left}}
</style>

<div id="app-screen"><div class="topbar"><div class="tb-left"><div class="tb-logo-wrap"><span>⚖️</span><span class="tb-logo-name">Lex<span>ia</span></span></div><span class="tb-breadcrumb" id="crumb">Painel</span></div><div class="tb-right"><div class="tb-uinfo"><div class="tb-uname" id="u-name">Ana Beatriz Lima</div><div class="tb-urole" id="u-role">Estudante de Direito</div></div><div class="tb-avatar" onclick="logout()" id="u-avatar">AB</div></div></div><div class="app-body"><aside class="sidebar" id="sidebar"></aside><main class="main-content" id="main"></main></div></div>
<script>
const theme={blue:'#1a4f8a',blue2:'#2563a8',green:'#1a7a3a',gold:'#8a6010',red:'#b03020',purple:'#5a3690'};
let role='aluno', panel='dash', loginTab='aluno', qIndex=0, qSelected=null, simStarted=false, simFinished=false, simIndex=0, simAnswers=[], simLog=[], fcQty=4, fcAreas=['Direito Civil','Direito Penal','Direito Constitucional','Processo Civil'];
const areas=['Direito Civil','Direito Penal','Direito Constitucional','Processo Civil','Processo Penal','Direito Administrativo','Direito Tributário','Direito Empresarial','Direito do Trabalho','Processo do Trabalho','Direito Ambiental','Direito Previdenciário','Direito Internacional','Direitos Humanos','Direito do Consumidor','Direito Eleitoral','Direito Financeiro','Filosofia do Direito','Ética Profissional'];
const trilhas=[{area:'Direito Civil',icon:'⚖️',pct:78,tag:'14 de 18 módulos',color:'#1a4f8a',modules:['Parte Geral — Pessoas e Bens','Fatos e Atos Jurídicos','Teoria Geral dos Contratos','Responsabilidade Civil','Direito de Família']},{area:'Direito Penal',icon:'🔒',pct:55,tag:'8 de 15 módulos',color:'#b03020',modules:['Teoria do Delito','Crimes contra a Pessoa','Crimes contra o Patrimônio','Crimes contra a Fé Pública']},{area:'Direito Constitucional',icon:'🏛️',pct:42,tag:'5 de 12 módulos',color:'#5a3690',modules:['Princípios Fundamentais','Direitos e Garantias Fundamentais','Controle de Constitucionalidade']},{area:'Processo Civil',icon:'📋',pct:30,tag:'3 de 10 módulos',color:'#1a7a3a',modules:['Teoria Geral do Processo','Petição Inicial e Tutelas','Recursos no CPC/2015']}];
const modelos={
'Ética Profissional':['O advogado foi procurado por potencial cliente para atuar em causa que envolve parte adversa já atendida anteriormente pelo mesmo profissional. Considerando o Estatuto da Advocacia e o Código de Ética, qual conduta é mais adequada?',['Verificar eventual conflito de interesses e preservar o sigilo profissional','Aceitar automaticamente a causa, pois todo cidadão tem direito de escolha','Divulgar informações do caso anterior para demonstrar transparência','Recusar sempre qualquer nova causa, ainda que não exista conflito']],
'Direito Civil':['João celebrou contrato de compra e venda de veículo com Maria, mas a vendedora deixou de entregar o bem no prazo ajustado. Diante do inadimplemento contratual, qual providência jurídica é cabível?',['Exigir o cumprimento da obrigação ou a resolução do contrato, com perdas e danos','Impetrar habeas corpus para compelir a entrega do bem','Requerer controle concentrado de constitucionalidade','Ajuizar ação penal privada subsidiária da pública']],
'Direito Penal':['Durante a prática de determinada conduta, o agente prevê a possibilidade de produzir o resultado lesivo, mas acredita sinceramente que ele não ocorrerá. Essa situação caracteriza:',['Culpa consciente','Dolo direto','Dolo eventual','Crime impossível']],
'Direito Constitucional':['Uma proposta de emenda constitucional pretende abolir o voto direto, secreto, universal e periódico. À luz da Constituição Federal, essa proposta:',['Não pode ser objeto de deliberação, por atingir cláusula pétrea','Pode ser aprovada por maioria simples','Depende apenas de referendo popular posterior','É válida se proposta pelo Presidente da República']],
'Processo Civil':['Em uma ação judicial, a parte autora demonstra probabilidade do direito e risco de dano grave caso aguarde o julgamento final. Nessa hipótese, poderá requerer:',['Tutela provisória de urgência','Apenas sentença definitiva','Recurso especial preventivo','Incidente de uniformização constitucional']],
'Processo Penal':['No processo penal, a defesa identifica constrangimento ilegal à liberdade de locomoção do acusado. O instrumento constitucional adequado para impugnar essa situação é:',['Habeas corpus','Mandado de injunção','Ação popular','Recurso de revista']],
'Direito Administrativo':['A Administração Pública percebe que praticou ato administrativo ilegal. Com fundamento no princípio da autotutela, ela poderá:',['Anular o ato ilegal e revogar atos inconvenientes ou inoportunos','Manter o ato ilegal para preservar a segurança jurídica em qualquer hipótese','Submeter todo ato ao Poder Legislativo antes de revê-lo','Revogar sentença judicial transitada em julgado']],
'Direito Tributário':['Município institui novo imposto e pretende cobrá-lo imediatamente no mesmo exercício financeiro. A regra constitucional que, em geral, impede essa cobrança imediata é:',['Anterioridade tributária','Vedação ao confisco penal','Legalidade administrativa genérica','Duplo grau obrigatório']],
'Direitos Humanos':['Uma política pública de acesso à justiça deve considerar grupos em situação de vulnerabilidade e reduzir barreiras econômicas e sociais. Essa abordagem está relacionada principalmente ao princípio da:',['Igualdade material e promoção da dignidade humana','Supremacia absoluta da vontade privada','Irrecorribilidade das decisões administrativas','Tipicidade penal fechada']],
default:['Leia a situação hipotética e assinale a alternativa juridicamente mais adequada segundo a legislação brasileira e os princípios aplicáveis ao tema.',['Alternativa juridicamente correta conforme o gabarito','Alternativa incompatível com o regime jurídico aplicável','Alternativa que confunde institutos de áreas distintas','Alternativa sem fundamento legal adequado']]
};
function makeExam(exame,ano,prova,total){const ans=['A','B','C','D'];return Array.from({length:total},(_,i)=>{const area=areas[i%areas.length],m=modelos[area]||modelos.default,g=ans[(i+exame.length)%4];return{prova,exame,ano,area,dif:i<20?'Fácil':i<55?'Médio':'Difícil',ref:exame+' · Questão '+(i+1),text:m[0],opts:m[1],correta:ans.indexOf(g),gabarito:g,comment:'Gabarito sincronizado: alternativa '+g+'. Comentário demonstrativo gerado a partir do tema da questão.'}})}
const questoes=[...makeExam('ENADE Direito 2025','2025','ENADE',40),...makeExam('ENADE Direito 2022','2022','ENADE',40),...makeExam('OAB 42º · Tipo 1','2024','OAB',80),...makeExam('OAB 43º · Tipo 1','2025','OAB',80),...makeExam('OAB 45º · Tipo 1','2025','OAB',80),...makeExam('OAB 46º · Tipo 1','2026','OAB',80)];
let flashcards=[{area:'Direito Civil',q:'Qual o prazo geral de prescrição no Código Civil de 2002?',a:'10 anos, conforme art. 205 do Código Civil, quando a lei não fixar prazo menor.',color:'blue'},{area:'Direito Penal',q:'O que é dolo eventual?',a:'O agente prevê o resultado e assume o risco de produzi-lo. Difere da culpa consciente.',color:'red'},{area:'Direito Constitucional',q:'Quais são as cláusulas pétreas da Constituição Federal?',a:'Forma federativa, voto direto/secreto/universal/periódico, separação dos Poderes e direitos e garantias individuais.',color:'purple'},{area:'Processo Civil',q:'O que é tutela de evidência?',a:'Tutela provisória concedida independentemente de urgência nas hipóteses do art. 311 do CPC.',color:'green'},{area:'Direito Administrativo',q:'O que é autotutela administrativa?',a:'É o poder-dever da Administração de rever seus próprios atos.',color:'blue'},{area:'Direito Tributário',q:'O que significa anterioridade tributária?',a:'Regra que impede a cobrança de tributo no mesmo exercício financeiro, ressalvadas exceções.',color:'gold'}];
const navAluno=[['Início','dash','🏠','Painel'],['Aprender','trilhas','📚','Trilhas de Estudo'],['Aprender','flashcards','🃏','Flashcards','48'],['Aprender','questoes','📋','Questões'],['Aprender','simulado','🎓','Simulado'],['Ferramentas IA','pecas','📄','Gerador de Peças','IA'],['Ferramentas IA','juris','🔍','Jurisprudência'],['Ferramentas IA','resumos','✨','Resumos Automáticos'],['Conta','perfil','👤','Perfil & XP'],['Conta','certificados','🏆','Certificados']];
const navAdmin=[['Administração','adm-dash','📊','Analytics'],['Administração','adm-provas','📋','Provas & Questões'],['Administração','adm-alunos','👥','Estudantes'],['Administração','adm-conteudo','📚','Conteúdo'],['Administração','adm-pecas','📄','Peças Geradas'],['Administração','adm-relatorios','📈','Relatórios']];
function tag(text,tone){return '<span class="tag '+(tone||'')+'">'+text+'</span>'}function setLoginTab(t,el){loginTab=t;document.querySelectorAll('.login-tab').forEach(b=>b.classList.remove('on'));el.classList.add('on');document.getElementById('login-email').value=t==='admin'?'admin@lexia.br':'aluno@lexia.br';document.getElementById('login-pass').value=t==='admin'?'Admin@2026':'Aluno@2026'}function tryLogin(){doLogin(loginTab)}function doLogin(t){role=t;panel=t==='admin'?'adm-dash':'dash';document.getElementById('login-screen').style.display='none';document.getElementById('app-screen').style.display='flex';document.getElementById('u-name').textContent=t==='admin'?'Coordenação Lexia':'Ana Beatriz Lima';document.getElementById('u-role').textContent=t==='admin'?'Administrador':'Estudante de Direito';document.getElementById('u-avatar').textContent=t==='admin'?'CL':'AB';renderNav();render()}function logout(){location.reload()}
function renderNav(){const nav=role==='admin'?navAdmin:navAluno;let last='',html='';nav.forEach(n=>{if(n[0]!==last){last=n[0];html+='<div class="sb-section-label">'+last+'</div>'}html+='<button class="sb-item '+(panel===n[1]?'on':'')+'" onclick="panel=\''+n[1]+'\';renderNav();render()"><span class="sb-ico">'+n[2]+'</span>'+n[3]+(n[4]?'<span class="sb-badge">'+n[4]+'</span>':'')+'</button>'});html+='<div class="sb-section-label">Sair</div><button class="sb-item" onclick="logout()"><span class="sb-ico">↩</span>Encerrar sessão</button>';document.getElementById('sidebar').innerHTML=html}
function render(){const nav=role==='admin'?navAdmin:navAluno;const item=nav.find(n=>n[1]===panel);document.getElementById('crumb').textContent=item?item[3]:'Painel';const pages={dash,trilhasPage,flashcardsPage,questoesPage,simuladoPage,pecasPage,jurisPage,resumosPage,perfilPage,certificadosPage,adminDash,adminProvas,adminAlunos,adminSimple};const map={trilhas:'trilhasPage',flashcards:'flashcardsPage',questoes:'questoesPage',simulado:'simuladoPage',pecas:'pecasPage',juris:'jurisPage',resumos:'resumosPage',perfil:'perfilPage',certificados:'certificadosPage','adm-dash':'adminDash','adm-provas':'adminProvas','adm-alunos':'adminAlunos','adm-conteudo':'adminSimple','adm-pecas':'adminSimple','adm-relatorios':'adminSimple'};document.getElementById('main').innerHTML=(pages[map[panel]]||dash)()}
function dash(){return '<div class="hero card"><div class="avatar-xl">AB</div><div class="hero-main"><h1>Bem-vinda, Ana Beatriz!</h1><p style="font-size:.82rem;color:var(--t2);margin-top:.2rem">Direito Civil · Preparação OAB</p><div style="margin-top:.6rem">'+tag('Nível 4')+tag('1.240 XP','gold')+tag('🔥 7 dias consecutivos','green')+'</div></div><div class="hero-side"><div style="font-size:.7rem;color:var(--t3);font-weight:900;text-transform:uppercase;letter-spacing:.06em">Meta OAB 1ª Fase</div><p style="font-size:.82rem;margin-top:.4rem"><b>23 dias</b> para o próximo simulado</p><button class="btn" style="margin-top:.6rem" onclick="panel=\'simulado\';renderNav();render()">Iniciar simulado</button></div></div><div class="grid4">'+[['📚','12','Aulas concluídas'],['📝','8','Peças elaboradas'],['🃏','94%','Acerto flashcards'],['❓','67%','Acerto OAB']].map(s=>'<div class="card"><div style="font-size:1.2rem">'+s[0]+'</div><div class="stat-val">'+s[1]+'</div><div class="stat-lbl">'+s[2]+'</div></div>').join('')+'</div><div class="grid2"><div class="card"><h3>Progresso por área</h3>'+trilhas.map(t=>'<div style="margin-top:1rem"><div style="display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:.35rem"><span>'+t.area+'</span><b style="color:'+t.color+'">'+t.pct+'%</b></div><div class="progress"><div class="bar" style="width:'+t.pct+'%;background:'+t.color+'"></div></div></div>').join('')+'</div><div class="card"><h3>Atividade recente</h3>'+['Peça gerada: Habeas Corpus|Hoje, 09:14|','Flashcards — 15 revisados|Ontem, 20:30|gold','Questão OAB respondida|23/05, 18:00|'].map(x=>{const p=x.split('|');return '<div class="timeline-row"><div class="dot '+p[2]+'"></div><div><b style="font-size:.82rem">'+p[0]+'</b><div style="font-size:.7rem;color:var(--t3)">'+p[1]+'</div></div></div>'}).join('')+'</div></div>'}
function trilhasPage(){return '<div class="page-title">Trilhas de Estudo</div><div class="grid2">'+trilhas.map(t=>'<div class="trilha-card"><div style="height:3px;background:'+t.color+'"></div><div class="trilha-header"><div style="display:flex;justify-content:space-between;margin-bottom:.55rem"><b>'+t.icon+' '+t.area+'</b>'+tag(t.pct+'%',t.pct>60?'':'gold')+'</div><div class="progress"><div class="bar" style="width:'+t.pct+'%;background:'+t.color+'"></div></div><div style="font-size:.72rem;color:var(--t3);margin-top:.45rem">'+t.tag+'</div></div>'+t.modules.map((m,i)=>'<div class="modulo '+(i<2?'done':i===2?'active':'')+'" onclick="openModulo(\''+m+'\',\''+t.area+'\')"><div class="mod-ico">'+(i<2?'✓':i===2?'▶':'🔒')+'</div><div><b style="font-size:.82rem">'+m+'</b><div style="font-size:.72rem;color:var(--t3)">'+(i<2?'Concluído':i===2?'Em andamento':'Bloqueado')+' · '+(45+i*10)+' min</div></div></div>').join('')+'</div>').join('')+'</div>'}
function openModulo(m,a){document.getElementById('modal-title').textContent=m;document.getElementById('modal-body').innerHTML='<p style="font-size:.85rem;line-height:1.75;color:var(--t2)">Módulo de '+a+' com explicação guiada, exemplos práticos, revisão por flashcards e questões OAB/ENADE ao final.</p>';document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}
function flashcardsPage(){const shown=flashcards.filter(c=>fcAreas.includes(c.area)).slice(0,fcQty);return '<div class="page-title">Flashcards Jurídicos <small>escolha áreas e quantidade</small></div><div class="card"><div class="grid4"><label class="form-label">Quantos flashcards deseja?<select class="form-select" onchange="fcQty=+this.value;render()">'+[4,8,12,20,30,50].map(n=>'<option '+(fcQty===n?'selected':'')+' value="'+n+'">'+n+' flashcards</option>').join('')+'</select></label><label class="form-label">Área<select class="form-select" onchange="fcAreas=this.value===\'Todas\'?[...areas]:[this.value];render()"><option>Todas</option>'+areas.map(a=>'<option>'+a+'</option>').join('')+'</select></label><div style="display:flex;align-items:end">'+tag(shown.length+' exibidos')+'</div><div style="display:flex;align-items:end;justify-content:end;gap:.5rem"><button class="btn btn-outline" onclick="fcAreas=[...areas];render()">Todas</button><button class="btn btn-outline" onclick="fcAreas=[];render()">Limpar</button></div></div></div><div class="fc-deck">'+shown.map((c,i)=>'<button class="flash-card" onclick="this.classList.toggle(\'revealed\')">'+tag(c.area,c.color)+'<div class="fc-q">'+c.q+'</div><div class="fc-a">'+c.a+'</div><div class="fc-hint">clique para revelar</div></button>').join('')+'</div><div class="card" style="margin-top:1rem"><h3>Gerar novo flashcard com IA</h3><div style="display:flex;gap:.7rem;margin-top:.9rem"><input class="form-input" placeholder="Ex: prescrição, habeas corpus, contratos..."><button class="btn" onclick="flashcards.unshift({area:\'Direito Civil\',q:\'Flashcard gerado: quais são os elementos do negócio jurídico?\',a:\'Agente capaz, objeto lícito/possível/determinado ou determinável e forma prescrita ou não defesa em lei.\',color:\'blue\'});render()">Gerar com IA</button></div></div>'}
function filteredQuestions(){const ano=document.getElementById('fAno')?.value||'Todos',prova=document.getElementById('fProva')?.value||'Todas',dif=document.getElementById('fDif')?.value||'Todas',area=document.getElementById('fArea')?.value||'Todas';return questoes.filter(q=>(ano==='Todos'||q.ano===ano)&&(prova==='Todas'||q.prova===prova)&&(dif==='Todas'||q.dif===dif)&&(area==='Todas'||q.area===area))}
function questoesPage(){const anos=['Todos',...Array.from(new Set(questoes.map(q=>q.ano))).sort((a,b)=>Number(b)-Number(a))];const qs=filteredQuestions();const q=qs[qIndex%Math.max(1,qs.length)]||questoes[0];return '<div class="page-title">Questões</div><div class="card"><div class="grid5"><label class="form-label">Ano<select id="fAno" class="form-select" onchange="qIndex=0;qSelected=null;render()">'+anos.map(a=>'<option>'+a+'</option>').join('')+'</select></label><label class="form-label">Prova<select id="fProva" class="form-select" onchange="qIndex=0;qSelected=null;render()"><option>Todas</option><option>OAB</option><option>ENADE</option></select></label><label class="form-label">Dificuldade<select id="fDif" class="form-select" onchange="qIndex=0;qSelected=null;render()"><option>Todas</option><option>Fácil</option><option>Médio</option><option>Difícil</option></select></label><label class="form-label">Área<select id="fArea" class="form-select" onchange="qIndex=0;qSelected=null;render()"><option>Todas</option>'+areas.map(a=>'<option>'+a+'</option>').join('')+'</select></label><div style="display:flex;align-items:end">'+tag(qs.length+' questões encontradas')+'</div></div></div><div class="grid4"><div class="card"><div class="stat-val" style="color:var(--blue)">67%</div><div class="stat-lbl">Taxa de acerto geral</div></div><div class="card"><div class="stat-val">143</div><div class="stat-lbl">Respondidas</div></div><div class="card"><div class="stat-val">'+qs.length+'</div><div class="stat-lbl">No banco filtrado</div></div><div class="card"><div class="stat-val">'+(qSelected===q.correta?1:0)+'</div><div class="stat-lbl">Acertos nesta sessão</div></div></div><div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.8rem"><div>'+tag(q.prova,q.prova==='ENADE'?'purple':'')+tag(q.area)+tag(q.dif,'gray')+tag(q.ano,'gray')+'</div><span style="font-size:.72rem;color:var(--t3)">'+q.ref+'</span></div><div class="progress"><div class="bar" style="width:'+(qIndex/Math.max(1,qs.length))*100+'%"></div></div><p style="text-align:center;margin:1rem 0;color:var(--t3);font-size:.75rem">Questão <b>'+(qIndex+1)+'</b> de <b>'+Math.max(1,qs.length)+'</b></p><p style="font-size:.86rem;line-height:1.75;font-weight:700;margin-bottom:1rem">'+q.text+'</p>'+q.opts.map((o,i)=>'<button class="q-option '+(qSelected!==null?(i===q.correta?'correct':qSelected===i?'wrong':''):'')+'" '+(qSelected!==null?'disabled':'')+' onclick="qSelected='+i+';render()"><span class="q-letter">'+'ABCD'[i]+'</span>'+o+'</button>').join('')+(qSelected!==null?'<div class="card" style="margin-top:.8rem;background:'+(qSelected===q.correta?'var(--grn-l)':'var(--red-l)')+';color:'+(qSelected===q.correta?'var(--grn)':'var(--red)')+'"><b>'+(qSelected===q.correta?'✓ Correto.':'✗ Incorreto.')+'</b> '+q.comment+'</div>':'')+'<div style="text-align:right;margin-top:1rem"><button class="btn" onclick="qIndex=(qIndex+1)%'+Math.max(1,qs.length)+';qSelected=null;render()">Próxima questão →</button></div></div>'}

function simuladoPage(){if(simFinished)return simResult(); if(simStarted)return simRun(); simQs=buildSimQs();return '<div class="page-title">Simulado</div><div class="card"><h2 style="font-size:1.05rem;margin-bottom:.7rem">Personalizar simulado</h2><p style="font-size:.82rem;color:var(--t2)">Monte um simulado personalizado com filtros inteligentes.</p><div class="grid5" style="margin-top:1.25rem"><label class="form-label">Quantidade<select class="form-select" onchange="simConfig.quantidade=+this.value;render()">'+[5,10,20,40,80].map(n=>'<option '+(simConfig.quantidade===n?'selected':'')+' value="'+n+'">'+n+' questões</option>').join('')+'</select></label><label class="form-label">Prova<select class="form-select" onchange="simConfig.prova=this.value;render()"><option>Todas</option><option '+(simConfig.prova==='OAB'?'selected':'')+'>OAB</option><option '+(simConfig.prova==='ENADE'?'selected':'')+'>ENADE</option></select></label><label class="form-label">Dificuldade<select class="form-select" onchange="simConfig.dificuldade=this.value;render()"><option>Todas</option><option>Fácil</option><option>Médio</option><option>Difícil</option></select></label><label class="form-label">Área<select class="form-select" onchange="simConfig.area=this.value;render()"><option>Todas</option>'+areas.map(a=>'<option '+(simConfig.area===a?'selected':'')+'>'+a+'</option>').join('')+'</select></label><label class="form-label">Questões IA<select class="form-select" onchange="simConfig.usarIA=this.value===\'Sim\';render()"><option '+(simConfig.usarIA?'selected':'')+'>Sim</option><option '+(!simConfig.usarIA?'selected':'')+'>Não</option></select></label></div><div class="card" style="background:#f8fafc;margin-top:1.25rem;margin-bottom:0;display:flex;align-items:center;justify-content:space-between"><div><b>'+simQs.length+' questões selecionadas</b><div style="font-size:.75rem;color:var(--t2);margin-top:.2rem">Banco integrado OAB + ENADE '+(simConfig.usarIA?'· Questões IA ativadas':'')+'</div></div><button class="btn" onclick="simStarted=true;simFinished=false;simIndex=0;simAnswers=[];simLog=[];simQs=buildSimQs();render()">Iniciar simulado</button></div></div>'}
function simRun(){const q=simQs[simIndex];return '<div class="page-title">Simulado em andamento</div><div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:.8rem"><div>'+tag(q.prova,q.prova==='ENADE'?'purple':'')+tag(q.area)+tag(q.dif,'gray')+'</div><b style="font-size:.82rem;color:var(--t2)">'+(simIndex+1)+' / '+simQs.length+'</b></div><div class="progress"><div class="bar" style="width:'+(simIndex/simQs.length)*100+'%"></div></div><p style="font-size:.88rem;line-height:1.8;font-weight:700;margin:1.2rem 0">'+q.text+'</p>'+q.opts.map((o,i)=>'<button class="q-option" onclick="simAnswer('+i+')"><span class="q-letter">'+'ABCD'[i]+'</span>'+o+'</button>').join('')+'</div>'}
