nale a afirmativa correta.","alternativas":["Como Clarice é casada, ela é civilmente capaz.","Maria do Carmo, pela matrícula no ensino superior, é civilmente capaz.","Todas as filhas são relativamente incapazes, pois são maiores de 16 e menores de 18 anos.","Todas as filhas são absolutamente incapazes, pois são menores de 18 anos, sujeitando-se à autoridade parental."],"gabarito":"A","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa A. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":12,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":38,"codigo":"OAB2026TIPO1-038","area":"Direito Civil","dificuldade":"Médio","enunciado":"Joaquim, de 71 anos de idade, é viúvo de Marta há cerca de quatro anos, e não finalizou a partilha de bens deixados por sua falecida esposa, porque há um litígio entre o filho comum do ex-casal e a filha do primeiro casamento de Marta. Na semana passada, Joaquim procurou você, como advogado(a), para ser orientado juridicamente acerca da união que pretende estabelecer com Joana, tendo em vista que a partilha anterior não será realizada antes do novo matrimônio. A respeito do regime de bens que deveria adotar na nova união, assinale a opção que apresenta, corretamente, a sua orientação.","alternativas":["Separação convencional de bens, ante a idade de Joaquim.","Qualquer regime de bens, por força da autonomia que é assegurada a Joaquim.","Comunhão parcial de bens, de forma a resguardar os bens ainda não partilhados.","Separação obrigatória de bens, para evitar a confusão patrimonial entre os vínculos conjugais."],"gabarito":"D","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa D. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":12,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":39,"codigo":"OAB2026TIPO1-039","area":"Direito Civil","dificuldade":"Médio","enunciado":"Após uma intensa discussão motivada por questões financeiras, Lucas desferiu golpes fatais em seus pais, resultando na morte de ambos, que deixaram uma herança significativa. Mateus, seu irmão mais novo, ainda menor de idade, está sob a tutela de seu tio Ricardo, que se recusa a promover a exclusão de Lucas da sucessão por indignidade. Considerando que Mateus, por ser menor, não tem capacidade legal para agir diretamente, surgem dúvidas sobre quem tem legitimidade para requerer judicialmente a exclusão de Lucas da herança e quais são os procedimentos adequados para isso. Diante da situação hipotética narrada e com base na legislação vigente, assinale a afirmativa correta.","alternativas":["Apenas Mateus, ao atingir a maioridade, terá o direito de pedir judicialmente a exclusão de Lucas da sucessão, pois ele é o herdeiro direto prejudicado.","O Ministério Público tem legitimidade para requerer a exclusão de Lucas por indignidade, protegendo os direitos de Mateus, menor e incapaz de agir por conta própria.","Apenas Ricardo, na qualidade de tutor de Mateus, pode requerer judicialmente a exclusão de Lucas da sucessão, e a recusa de Ricardo impede que qualquer outra pessoa o faça.","Lucas só poderá ser excluído da sucessão se Ricardo, na qualidade de tutor, concordar, independentemente da legitimidade de outro herdeiro ou do Ministério Público para a propositura da ação."],"gabarito":"B","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa B. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":12,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":40,"codigo":"OAB2026TIPO1-040","area":"Direito Civil","dificuldade":"Médio","enunciado":"Lorena resolveu alienar um imóvel avaliado em R$ 2.000.000,00 para Marta. Para tanto, elas elaboraram uma minuta de contrato de compra e venda, especificando as partes, o bem, o preço e a forma de pagamento. Considerando a urgência da vendedora, que iria se mudar para o exterior, essa minuta foi impressa na casa de Marta e assinada pelas partes e pelas testemunhas Natália e Oscar. Sobre a situação hipotética narrada, assinale a afirmativa correta.","alternativas":["O contrato de compra e venda é válido, uma vez que, na presença de duas testemunhas, o instrumento particular poderia ser utilizado.","O contrato de compra e venda é nulo, por desobediência de sua forma, mas poderá ser convertido em promessa de compra e venda.","O contrato de compra e venda é anulável, por vício de sua forma, decaindo as partes do direito de promover a anulação no prazo de dois anos de sua celebração.","O contrato de compra e venda é anulável por vício de forma. A lei permite, entretanto, a sua convalidação caso haja o reconhecimento das firmas de todos os envolvidos no Ofício de Notas."],"gabarito":"B","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa B. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":12,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":41,"codigo":"OAB2026TIPO1-041","area":"Direito Civil","dificuldade":"Médio","enunciado":"Eduardo vendeu um imóvel urbano a Clara, estipulando em contrato particular que, caso futuramente ela decidisse vendê-lo, Clara deveria notificá-lo previamente, conferindo-lhe o direito de adquirir o bem nas mesmas condições ofertadas a terceiros. Passados doze meses da compra, Clara recebeu proposta de venda pelo mesmo valor pago e, sem notificar Eduardo, vendeu o imóvel para Flávio. Eduardo, ao saber do negócio já concluído, procurou Flávio para discutir o direito de preferência, mas este afirmou não ter sido informado sobre qualquer cláusula contratual anterior. Eduardo ajuizou ação para haver o imóvel para si, mediante o pagamento do mesmo valor da proposta aceita por Clara. Com base nas disposições legais sobre o direito de preempção, assinale a afirmativa correta.","alternativas":["Eduardo não pode exigir o imóvel para si, mas poderá pleitear perdas e danos contra Clara, caso comprove que foi privado de exercer seu direito de preferência.","Eduardo poderá reaver o imóvel se provar que notificou Flávio, por escrito, antes da conclusão do negócio, mesmo que Clara tenha omitido a existência da preferência.","Eduardo perdeu o direito à preempção, pois este não pode ser exercido se o novo comprador não tinha ciência da cláusula de preferência existente no contrato anterior.","Eduardo pode exigir o imóvel para si, mediante depósito do valor ajustado com o terceiro, desde que o faça no prazo de até 180 dias da alienação, conforme admite o Código Civil."],"gabarito":"A","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa A. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":13,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":42,"codigo":"OAB2026TIPO1-042","area":"Direito Civil","dificuldade":"Médio","enunciado":"Sara, em 24 de outubro de 2023, outorgou a Vítor, seu filho, uma procuração por instrumento público para vender seu imóvel até 24 de outubro de 2026. No momento da outorga, Sara gozava de boa saúde mental. A partir de 2024, Sara passou a sofrer um acelerado processo de demência, vindo a perder as suas habilidades cognitivas básicas no início de 2025. Sara foi interditada e Roberto, seu marido, tornou-se o seu curador. Em 24 de setembro de 2025, Raul se interessou em comprar o imóvel de Sara, e Vítor se apresentou como procurador da mãe. Na qualidade de advogado de Raul, assinale a opção que apresenta a sua orientação jurídica para o caso.","alternativas":["Não recomendaria a aquisição do imóvel, figurando Vítor como representante de Sara, pois há possíveis interesses conflitantes entre eles.","Não recomendaria a aquisição do imóvel, figurando Vítor como representante de Sara, pois, diante da interdição, o contrato de mandato é extinto.","Recomendaria a aquisição do imóvel, figurando Vítor como representante de Sara, pois, apesar da incapacidade superveniente, o contrato de mandato é eficaz até o término do prazo, quando este for determinado.","Recomendaria a aquisição do imóvel, figurando Vítor como representante de Sara, pois, tendo a procuração sido outorgada por instrumento público, e estando Sara com boa saúde mental no momento da outorga, o mandato é válido e eficaz."],"gabarito":"B","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa B. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":13,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":43,"codigo":"OAB2026TIPO1-043","area":"Estatuto da Criança e do Adolescente","dificuldade":"Fácil","enunciado":"Enzo, de 16 anos de idade, ingressou em um grande supermercado e subtraiu diversas peças de picanha, que totalizaram mais de R$ 2.000,00 (dois mil reais). Um segurança, percebendo a atitude suspeita de Enzo, o apreendeu no estacionamento. Enzo confessou a autoria. O Ministério Público representou contra o adolescente pela prática de ato infracional análogo ao crime de furto (Art. 155, caput, do CP). Durante a instrução processual, ficou constatado que essa foi a primeira passagem de Enzo pela Vara da Infância e Juventude. A família de Enzo procurou você, como advogado(a), para saber qual medida poderá ser aplicada ao caso. Com base na expressa disposição do Estatuto da Criança e do Adolescente (ECA), assinale a afirmativa que apresenta, corretamente, a medida que você indicou.","alternativas":["Não poderá ser aplicada a medida socioeducativa de advertência, tendo em vista a primariedade e a pouca lesividade do ato.","Ele deve receber a medida socioeducativa de internação, já que isso o afastará do meio criminoso e permitirá sua ressocialização.","A medida cabível é a semiliberdade, já que ele deve receber uma medida socioeducativa, mas não a ponto de mantê-lo totalmente privado de liberdade.","Não cabe a aplicação da medida socioeducativa de internação, porque o ato não foi cometido mediante grave ameaça ou violência à pessoa e não há reiteração em infrações graves."],"gabarito":"D","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa D. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":13,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":44,"codigo":"OAB2026TIPO1-044","area":"Estatuto da Criança e do Adolescente","dificuldade":"Médio","enunciado":"Matheus, 17 anos, insiste em passar longos períodos na rua, deixando de lado os deveres escolares e, também, os compromissos familiares. A rebeldia de Matheus é atribuída à ausência do pai, que abandonou a família logo após o seu nascimento e de quem nunca mais ele teve notícia. Carolina, preocupada com a situação do filho, busca a inserção de Matheus no mercado formal de trabalho e encontra a oportunidade em um grande supermercado da região. O estabelecimento necessita de uma pessoa para carregar as caixas de produtos e abastecer o mercado durante a madrugada, especificamente entre meia-noite e quatro horas da manhã. Entretanto, por ainda não ter atingido a maioridade, Carolina possui dúvidas sobre a possibilidade de Matheus trabalhar. Por isso, procura você, como advogado(a), para ter sua orientação jurídica. Sobre a hipótese apresentada, assinale a afirmativa que, corretamente, apresenta a sua orientação.","alternativas":["Matheus, por estar no final da adolescência, pode trabalhar sem restrições.","Matheus não pode ingressar no mercado formal de trabalho, por ainda não ter completado 18 anos.","Matheus não pode trabalhar no cargo oferecido, já que o ECA veda o trabalho noturno entre as 22h de um dia e as 5h do dia seguinte.","Por ter 17 anos, Matheus pode trabalhar no mercado durante a madrugada, desde que a atividade não prejudique a sua frequência às aulas."],"gabarito":"C","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa C. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":13,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":45,"codigo":"OAB2026TIPO1-045","area":"Direito do Consumidor","dificuldade":"Médio","enunciado":"Mário, passando por dificuldades financeiras, solicitou, em juízo, a instauração de processo de repactuação de dívidas, que é deferido juntamente com a designação de audiência conciliatória. Na data fixada, a maior parte dos credores compareceu, com exceção do Banco XYZ S.A., que preferiu não se submeter à conciliação por superendividamento, por entender ser infrutífero o procedimento. A respeito da ausência do Banco XYZ S.A. à audiência, assinale a afirmativa correta.","alternativas":["Acarreta o vencimento antecipado da dívida de Mário.","Interrompe os encargos da mora incidentes em seu crédito.","Permite-lhe ajuizar individualmente ação de cobrança do crédito.","Importa na submissão ao plano de repactuação de dívidas nas mesmas condições que os credores presentes."],"gabarito":"B","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa B. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":14,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":46,"codigo":"OAB2026TIPO1-046","area":"Direito do Consumidor","dificuldade":"Médio","enunciado":"Maria Victoria, em maio de 2023, decidiu aceitar a oferta do cartão de crédito Black, oferecido pelo Banco Y, do qual já era correntista há cerca de três anos. Contudo, em agosto de 2023, deixou de pagar a fatura de julho, no valor de R$ 5.300,00 (cinco mil e trezentos reais). Em razão disso, passado o vencimento, o Banco Y debitou automaticamente da conta-corrente dela o valor de R$ 300,00 (trezentos reais), referente ao denominado “pagamento mínimo” da fatura do cartão de crédito. Sobre a hipótese apresentada, assinale a afirmativa correta.","alternativas":["Nas hipóteses em que não há previsão contratual para tanto, é possível ao banco debitar automaticamente o valor integral da fatura do cartão de crédito da conta-corrente do consumidor, quando ultrapassados 60 dias do inadimplemento e notificado o consumidor do débito após 30 dias da data do seu vencimento.","Independentemente de serem contratos distintos, pelo fato de existir uma única relação jurídica entre o consumidor e o banco, pode o banco debitar o valor mínimo da fatura do cartão de crédito automaticamente da conta-corrente do consumidor em caso de inadimplemento.","Havendo saldo em conta, mesmo não havendo previsão contratual para tanto, é possível ao banco debitar automaticamente o valor integral da fatura do cartão de crédito da conta-corrente do consumidor, quando ultrapassados 30 dias do inadimplemento e notificado o consumidor do débito.","Tratando-se de contratos distintos, de cartão de crédito e de conta-corrente, o banco somente pode fazer o débito na conta-corrente do valor mínimo da fatura se essa possibilidade estiver prevista de forma expressa, clara e destacada no contrato celebrado com a instituição financeira."],"gabarito":"D","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa D. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":14,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":47,"codigo":"OAB2026TIPO1-047","area":"Direito Empresarial","dificuldade":"Médio","enunciado":"Mercado Barra Velha Ltda. emitiu nota promissória no valor de R$ 19.800,00 (dezenove mil e oitocentos reais), com vencimento no dia 19 de dezembro de 2021. Não houve pagamento na data do vencimento e o credor somente levou o título a protesto no dia 2 de dezembro de 2023, sendo o protesto lavrado dois dias após. Sobre o caso, com base na legislação de regência da nota promissória e das condições para sua cobrança em face do emitente, assinale a afirmativa correta.","alternativas":["O credor ainda poderá promover a execução da nota promissória em face do emitente em razão da interrupção da prescrição pelo protesto cambial.","O credor poderá promover a execução da nota promissória em face do emitente, considerando-se que ainda não expirou o prazo de cinco anos para a propositura da ação cambial.","O credor não pode promover a execução da nota promissória, em razão do protesto para a cobrança do emitente ser facultativo e do decurso do prazo de três anos da data do vencimento.","O título deveria ter sido apresentado até o primeiro dia útil após o vencimento, acarretando a perda do direito de ação em caso de inobservância dessa regra, embora o protesto seja facultativo para a cobrança."],"gabarito":"A","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa A. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":14,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":48,"codigo":"OAB2026TIPO1-048","area":"Direito Empresarial","dificuldade":"Difícil","enunciado":"A padaria Jacaré dos Homens Ltda. teve sua falência requerida em razão da impontualidade no pagamento de duplicata de prestação de serviço, no valor de R$ 62.000,00 (sessenta e dois mil reais), aceita e devidamente protestada para este fim. A devedora procurou você, como advogado(a), informando que pretende depositar o valor cobrado. Acerca deste depósito, assinale a afirmativa correta.","alternativas":["Deverá ser realizado em dinheiro, no prazo de quinze dias, contado da citação da devedora.","Compreenderá o valor total do crédito, acrescido de correção monetária, juros e honorários advocatícios.","Suspenderá o processo pelo prazo de trinta dias ou até que seja apreciado o mérito da cobrança, o que ocorrer por último.","Poderá ser realizado em dinheiro ou mediante prestação de caução real ou fidejussória no prazo de cinco dias, contado da citação."],"gabarito":"B","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa B. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":14,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":49,"codigo":"OAB2026TIPO1-049","area":"Direito Empresarial","dificuldade":"Médio","enunciado":"A sociedade empresária Pinheiros & Filhos Ltda., constituída em 2017 e com sede em Pancas, ES, pretende registrar como marca o sinal distintivo nominativo Pancadão, a ser utilizado nos produtos alimentícios que ela fornece a mercados, supermercados e armazéns na região de Pancas, ES, e Resplendor, MG. Na mesma cidade de Pancas, ES, há um estabelecimento explorado pelo empresário individual Domingos Guandu, cujo título é Bar e Mercearia Pancadão, constituído em 2000 e usado desde então, que revende os produtos alimentícios fornecidos por Pinheiros & Filhos Ltda. Considerados estes dados, a respeito do registro de marca, assinale a afirmativa correta.","alternativas":["Não há impedimento do registro de Pancadão como marca, pois o uso do mesmo sinal distintivo para título de estabelecimento de terceiro, ainda que anterior, é incapaz de retirar a originalidade da marca.","Não há impedimento do registro de Pancadão como marca, haja vista que o sinal distintivo é novo e só há proteção para o título de estabelecimento no âmbito da propriedade industrial com o registro no INPI.","Pancadão não poderá ser registrado como marca por ser a reprodução de sinal distintivo característico de título de estabelecimento de terceiro, quando suscetível de causar confusão ou associação entre a marca e o título de estabelecimento.","Pancadão não poderá ser registrado como marca em razão da prioridade de uso do título de estabelecimento Pancadão pelo empresário Domingos Guandu, em âmbito nacional, decorrente da inscrição do empresário na Junta Comercial."],"gabarito":"C","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa C. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":15,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":50,"codigo":"OAB2026TIPO1-050","area":"Direito Empresarial","dificuldade":"Fácil","enunciado":"Em relação aos elementos caracterizadores do empresário, assinale a afirmativa correta.","alternativas":["O empresário caracteriza-se pelo exercício profissional de atos de comércio, dentre os quais não se inclui a prestação de serviços.","O exercício de profissão intelectual, de natureza artística, literária ou científica em nenhuma hipótese poderá servir para caracterizar o empresário.","O empresário caracteriza-se pelo exercício profissional de atividade econômica organizada para produção ou circulação de bens ou de serviços.","A inscrição do empresário na Junta Comercial e o exercício de atividade econômica em caráter habitual são os dois requisitos para sua caracterização."],"gabarito":"C","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa C. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":15,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":51,"codigo":"OAB2026TIPO1-051","area":"Direito Processual Civil","dificuldade":"Médio","enunciado":"Machado de Assis ajuizou ação indenizatória em face de Quincas Borba, pugnando pela condenação do réu ao pagamento de indenização por danos morais e materiais, resultantes do inadimplemento de contrato de prestação de serviços. O Juiz condenou o réu ao pagamento de indenização por danos morais no montante de R$ 5.000,00 (cinco mil reais) e danos materiais, a serem apurados em sede de liquidação de sentença, diante da necessidade de comprovação dos prejuízos que vêm sendo experimentados pelo autor, desde a ocorrência do ilícito. Quincas Borba contratou você, como advogado(a), para interpor recurso de apelação, buscando a reforma integral da sentença. Tomando o caso acima como premissa, assinale a opção que, corretamente, apresenta sua orientação.","alternativas":["Enquanto não houver o julgamento do recurso de apelação, não será possível realizar a liquidação de sentença no capítulo referente aos danos materiais.","Apesar de Quincas Borba ter ofertado apelação, Machado de Assis poderá requerer desde logo a liquidação do capítulo dos danos materiais em autos apartados.","A liquidação de sentença somente poderá ser promovida por requerimento de Machado de Assis, pois o réu não detém legitimidade para requerer a liquidação de sentença.","Quincas Borba, em liquidação de sentença, poderá rediscutir a obrigação de pagamento dos danos materiais, sendo lícito ao Juiz modificar a sentença anteriormente proferida."],"gabarito":"B","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa B. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":15,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":52,"codigo":"OAB2026TIPO1-052","area":"Direito Processual Civil","dificuldade":"Médio","enunciado":"Por conta de danos sofridos em um acidente de trânsito, Juciara ajuizou ação em face de Carla, pleiteando a sua condenação ao pagamento de indenização. Julgado procedente o pedido, a Ré foi condenada ao pagamento de R$ 20.000,00 (vinte mil reais) a título de indenização por danos morais e materiais. Transitada em julgado a sentença, Carla imediatamente peticiona no referido processo, antes de qualquer depósito, oferecendo o pagamento de R$ 15.000,00 (quinze mil reais), com o devido depósito de tal quantia, e pleiteando o reconhecimento do cumprimento de sua obrigação. Sobre tal fato, assinale a afirmativa correta.","alternativas":["Concluindo o Juiz pela insuficiência do depósito, incidirão a multa e os honorários advocatícios de 10% sobre o valor total devido.","Juciara deverá ser intimada do depósito e, caso impugne o valor, somente poderá levantar o montante total após o Juiz decidir sobre a suficiência do depósito.","Caso Juciara não se oponha ao valor ofertado, ainda que inferior à condenação, será reconhecida como satisfeita a obrigação, com a consequente extinção do processo.","O cumprimento de sentença depende da expressa manifestação de vontade da parte autora, de modo que Carla não poderia realizar o depósito dos valores devidos antes de intimada para tanto."],"gabarito":"C","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa C. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":15,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":53,"codigo":"OAB2026TIPO1-053","area":"Direito Processual Civil","dificuldade":"Médio","enunciado":"Paula ajuizou ação indenizatória por atraso de voo contra a companhia aérea Big Ben perante certo Juizado Especial Cível. Em sentença, o Magistrado condenou a companhia aérea ao pagamento de determinada quantia em dinheiro. Interposto recurso inominado pela companhia aérea, a Turma Recursal competente proveu o recurso. No entanto, em sua decisão, cometeu graves erros de aplicação de normas infraconstitucionais federais e normas constitucionais. A decisão colegiada, por outro lado, não incorreu em omissão, contradição, obscuridade ou erro material, e a matéria constitucional está devidamente pré-questionada. Diante desse cenário, assinale a afirmativa correta.","alternativas":["Não há recurso cabível contra a decisão proferida pela Turma Recursal.","Paula deve opor embargos de declaração a fim de sanar os erros de interpretação de norma cometidos pela Turma Recursal.","Paula deve interpor recurso extraordinário contra a decisão da Turma Recursal, tendo em vista que a decisão incorreu em erros de aplicação de normas constitucionais.","Paula deve interpor recurso especial e recurso extraordinário simultaneamente, tendo em vista que o primeiro é cabível quando há violação à norma infraconstitucional federal, enquanto o segundo é cabível quando há violação à norma constitucional."],"gabarito":"C","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa C. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":16,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":54,"codigo":"OAB2026TIPO1-054","area":"Direito Processual Civil","dificuldade":"Médio","enunciado":"Aziz ajuizou ação de procedimento comum contra Betina, na qual requer sua condenação ao pagamento de R$ 10.000,00 (dez mil reais) por danos morais, após ter se sentido humilhado por Betina, que o xingou na frente de colegas de trabalho durante certa reunião profissional. Em primeiro grau, o Magistrado proferiu sentença que julgou parcialmente procedente o pedido de Aziz, condenando Betina ao pagamento de R$ 6.000,00 (seis mil reais). Aberto o prazo de 15 dias úteis para a interposição de recurso contra a sentença, apenas Aziz interpôs apelação, tendo requerido a reforma da decisão para que Betina fosse condenada a pagar o valor integral de R$ 10.000,00 (dez mil reais). Após a interposição do recurso de apelação por Aziz, o Magistrado abriu o prazo para que Betina apresentasse contrarrazões no prazo legal. Diante desse cenário, assinale a afirmativa correta.","alternativas":["Betina poderá apresentar contrarrazões ao recurso unicamente no prazo de 15 dias corridos.","Betina poderá apresentar contrarrazões ao recurso no prazo de 15 dias úteis e, nos 15 dias úteis subsequentes, poderá interpor apelação adesiva.","Betina poderá apresentar, no prazo concedido, contrarrazões ao recurso e interpor apelação adesiva; caso o recurso de apelação de Aziz seja inadmitido, o recurso de Betina também o será.","Betina poderá apresentar apenas contrarrazões ao recurso, não sendo possível a interposição de recurso adesivo no caso concreto, tendo em vista que o recurso adesivo não é admissível em apelação."],"gabarito":"C","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa C. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":16,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":55,"codigo":"OAB2026TIPO1-055","area":"Direito Processual Civil","dificuldade":"Médio","enunciado":"João propõe ação de exigência das contas contra o seu sócio, Vinícius, para verificar a regularidade da administração dos bens da pessoa jurídica Discos de Vinil Ltda, da qual ambos são sócios. Vinícius contesta o pedido, sustentando que já havia prestado as contas extrajudicialmente, bem como efetuado a juntada da prestação de contas em conjunto com a contestação. Nesse caso, continuando o procedimento, o Juiz deverá","alternativas":["intimar João para se manifestar no prazo de 15 dias.","julgar antecipadamente o mérito, impondo a Vinícius o dever de prestar as contas.","extinguir o processo sem resolução do mérito, ante a falta de interesse de agir de João.","designar, necessariamente, uma audiência de instrução e julgamento para colher o depoimento pessoal das partes, a fim de deslindar a controvérsia."],"gabarito":"A","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa A. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":16,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":56,"codigo":"OAB2026TIPO1-056","area":"Direito Processual Civil","dificuldade":"Difícil","enunciado":"A Associação de Defesa dos Usuários de Smartphone (ADUS) ajuizou ação civil pública em face do fabricante X, requerendo a sua condenação para a retirada do aparelho Y do mercado, em razão de vícios em seu processo construtivo. Após a oferta de contestação pelo réu, no curso da fase instrutória, houve abandono imotivado da causa pela Associação. Sobre o caso narrado, assinale a afirmativa correta.","alternativas":["É vedado ao Poder Público se habilitar como litisconsorte na causa.","O Ministério Público poderá assumir a titularidade da ação, assim como outra associação legitimada.","A ação deverá ser extinta sem resolução do mérito, fundado em abandono da causa, independentemente de requerimento do réu.","A associação, para propor a ação civil pública, deve necessariamente ter sido constituída há pelo menos um ano, vedada a dispensa de tal requisito por decisão judicial."],"gabarito":"B","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa B. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":16,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":57,"codigo":"OAB2026TIPO1-057","area":"Direito Penal","dificuldade":"Médio","enunciado":"Daniel chegou em casa embriagado e exigiu que sua esposa, Bianca, praticasse com ele conjunção carnal. Diante da recusa de Bianca, Daniel passou a empregar a coação física contra a sua esposa, porém, os gritos de Bianca foram ouvidos por vizinhos, que lograram entrar no imóvel e imobilizar Daniel, antes que consumasse o ato. Daniel foi denunciado pelo delito de estupro, mas, alguns meses após os fatos, e antes do recebimento da denúncia, Daniel e Bianca reataram o casamento. A você, na qualidade de advogado(a) de defesa de Daniel, cabe alegar","alternativas":["a retratação tácita da representação da ofendida.","a causa de diminuição de pena em razão da tentativa.","a excludente de ilicitude ante o exercício regular de um direito.","o perdão tácito em razão da manutenção da sociedade conjugal."],"gabarito":"B","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa B. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":17,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":58,"codigo":"OAB2026TIPO1-058","area":"Direito Penal","dificuldade":"Médio","enunciado":"Hermenegildo e Ataulfo são amigos desde a infância, mas, devido a divergências políticas, tornaram-se inimigos. Na véspera da eleição para Presidente do Sindicato da classe a qual pertencem, eles se encontraram em um botequim da cidade de Sucupira e o primeiro sacou sua pistola, que estava carregada com 17 munições, e disparou uma vez, com a intenção de matar, na direção de Ataulfo, atingindo-o no joelho. No clima tenso que surgiu depois do ato, Ataulfo lembrou a Hermegildo que ambos formaram o ataque do time de futebol que se sagrou campeão juvenil na escola primária. Hermenegildo, emocionado com a lembrança do ex-amigo, abandonou a arma de fogo no chão e foi embora. Ataulfo sobreviveu sem sequelas. Diante da situação hipotética narrada, assinale a afirmativa correta.","alternativas":["Houve arrependimento voluntário, e Hermenegildo deve responder pelo crime que desejou consumar.","Houve crime impossível, pois a conduta de Hermenegildo mostrou-se absolutamente ineficaz.","Houve tentativa imperfeita, pois a hesitação de Hermenegildo impediu o resultado mais gravoso.","Houve desistência voluntária, e Hermenegildo deve responder pelos atos já praticados."],"gabarito":"D","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa D. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":17,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":59,"codigo":"OAB2026TIPO1-059","area":"Direito Penal","dificuldade":"Difícil","enunciado":"Leandro e Leonardo planejaram matar Sérgio e, para tanto, resolveram simular um assalto durante o qual aqueles efetuariam disparos com armas de fogo na direção deste. Leandro e Leonardo foram conduzidos ao local em dois carros pilotados, respectivamente, por José e Luciano, que estavam cientes do plano, mas se recusaram a pegar nas armas de fogo. Sérgio faleceu em razão dos ferimentos. Diante da situação hipotética, assinale a opção correta.","alternativas":["José e Luciano são partícipes do crime de homicídio doloso consumado praticado por Leandro e Leonardo.","José e Luciano praticaram tentativa de roubo, enquanto Leandro e Leonardo praticaram o crime de homicídio.","José e Luciano são autores colaterais do crime de roubo, enquanto Leandro e Leonardo são autores mediatos do crime de homicídio.","José e Luciano não integram o concurso de agentes, pois somente Leandro e Leonardo detinham o domínio final da empreitada criminosa."],"gabarito":"A","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa A. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":17,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":60,"codigo":"OAB2026TIPO1-060","area":"Direito Penal","dificuldade":"Médio","enunciado":"Paulo, ao sair irritado da partida em que o seu clube de futebol havia perdido de goleada para o maior rival, sacou sua arma de fogo e, mesmo não desejando diretamente matar alguém, mas assumindo o risco de fazê-lo, disparou diversas vezes na direção de uma estação de trem, pois tinha ciência de que ela estava lotada e servia como ponto de encontro para a torcida do clube rival. Um dos disparos acabou atingindo fatalmente um padre, que se deslocava em direção à igreja para oficiar a missa. Sobre o crime praticado por Paulo, assinale a afirmativa correta.","alternativas":["Homicídio, mediante dolo eventual.","Homicídio culposo, pois sua intenção não era causar a morte.","Tentativa de homicídio, pois sua intenção não era causar a morte.","Homicídio mediante preterdolo, pois o padre não estava entre os alvos de Paulo."],"gabarito":"A","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa A. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":17,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":61,"codigo":"OAB2026TIPO1-061","area":"Direito Penal","dificuldade":"Médio","enunciado":"Josué foi condenado, por sentença transitada em julgado, pela prática do crime de tráfico de drogas, a cumprir a pena de 9 anos de reclusão e 900 dias-multa. Durante a execução da pena, entre as opções de trabalho e estudo que lhe foram ofertadas, Josué optou por aderir aos cursos profissionalizantes a distância, com o objetivo de reduzir o tempo de encarceramento. Diante de tal situação hipotética, assinale a afirmativa correta.","alternativas":["Josué tem direito à remição na razão de um dia de pena para cada dia de estudo.","O tempo de ensino a distância pode ser computado para fins de remição da pena.","Em caso de falta grave, o Juiz poderá revogar a integralidade do tempo remido do ato praticado.","A detração por trabalho na prisão é mais vantajosa do que a remição do tempo de pena pelo estudo."],"gabarito":"B","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa B. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":18,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":62,"codigo":"OAB2026TIPO1-062","area":"Direito Penal","dificuldade":"Médio","enunciado":"Pedro costumava consumir maconha. Vislumbrando a perspectiva de lucro, passou a plantá-la e a fabricar artesanalmente cigarros de maconha, mantendo-os parcialmente em depósito e vendendo o restante da produção por meio de aplicativo de mensagens telefônicas. Devido ao aumento da divulgação do serviço prestado, Pedro foi investigado e preso quando possuía, em casa, 500 gramas de maconha, sendo acusado da prática do crime de tráfico de drogas por cinco vezes, haja vista que importou sementes, plantou-as, fabricou cigarros e os manteve em depósito, além de vender parte da produção. Você, como advogado(a), foi constituído(a) por Pedro para atuar no curso da Ação Penal. Sobre o caso narrado, assinale a opção que indica, corretamente, a orientação jurídica que você prestou.","alternativas":["Pedro praticou apenas o crime de porte de drogas para o consumo pessoal, pois a droga foi produzida e apreendida no interior de sua casa.","Pedro praticou o crime de tráfico de drogas por cinco vezes, sob continuidade delitiva, razão pela qual faz jus à mitigação da pena total.","Pedro praticou crime único de tráfico de drogas, pois o tipo penal aplicável ao caso é misto, o que atrai a incidência do princípio da alternatividade.","Pedro praticou o crime de tráfico de drogas por cinco vezes, sob concurso formal, razão pela qual faz jus à mitigação da pena total."],"gabarito":"C","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa C. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":18,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":63,"codigo":"OAB2026TIPO1-063","area":"Direito Processual Penal","dificuldade":"Médio","enunciado":"Marivaldo foi denunciado por organização criminosa e peculato. A denúncia foi lastreada, exclusivamente, no depoimento de Sérgio, corréu, que celebrou acordo de colaboração premiada com o Ministério Público. Assim, recebida a denúncia, foram citados ambos os réus, sendo que a citação de Marivaldo ocorreu no dia 10/05, e a de Sérgio, no dia 20/05 do corrente ano. De acordo com o caso narrado, na qualidade de advogado(a) de Marivaldo, assinale a opção que apresenta a conduta adequada a ser adotada.","alternativas":["O prazo de apresentação da resposta à acusação é de dez dias a contar da citação do último corréu, tratando-se de prazo comum às partes.","O prazo de apresentação da resposta à acusação é de dez dias a contar da citação de Marivaldo, podendo ser encerrado antes do prazo de Sérgio.","Deve ser alegada a violação ao contraditório, pois o corréu delatado deve participar das tratativas de celebração do acordo de colaboração premiada.","Deve ser alegada a ausência de justa causa para o recebimento da denúncia, pois a palavra do colaborador, sem provas de corroboração, é insuficiente para o recebimento da denúncia."],"gabarito":"D","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa D. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":18,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":64,"codigo":"OAB2026TIPO1-064","area":"Direito Processual Penal","dificuldade":"Difícil","enunciado":"Vanessa foi denunciada pelo crime de furto por ter subtraído um celular. Na audiência, a prova testemunhal apontou que Vanessa utilizou de grave ameaça, consistente em apontar um revólver para a vítima, como meio de obtenção do celular. A vítima não compareceu à audiência de reconhecimento de pessoas. O Juiz, usando a prova testemunhal, sem qualquer aditamento da denúncia por parte do Ministério Público, condenou Vanessa pelo crime de roubo. Sobre a hipótese, assinale a opção que apresenta, corretamente, o que a defesa deve alegar na apelação.","alternativas":["A violação ao princípio do ne bis in idem.","A violação ao princípio da correlação entre acusação e sentença.","A impossibilidade de a prova testemunhal servir para condenar a ré, inclusive pelo furto.","A nulidade do processo, porque a condenação dependeria necessariamente do reconhecimento pessoal feito pela vítima."],"gabarito":"B","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa B. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":18,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":65,"codigo":"OAB2026TIPO1-065","area":"Direito Processual Penal","dificuldade":"Difícil","enunciado":"Anderson está sendo investigado pela prática do crime de extorsão mediante sequestro. Depois da quebra dos sigilos bancários e fiscal, a polícia efetuou o indiciamento de Anderson, sendo certo que não existia mais nenhuma diligência pendente. A defesa de Anderson requereu o acesso aos autos da investigação, que foi negado pelo Delegado de Polícia, com o argumento da inquisitividade e sigilo do inquérito policial. O Juiz também negou o acesso afirmando que o inquérito é sigiloso e possuía extratos bancários e fiscais. Assinale a opção que indica, corretamente, o argumento que você, na condição de advogado(a), deve usar no recurso para garantir o acesso ao inquérito.","alternativas":["O princípio de in dubio pro reo.","O direito absoluto de acessar o inquérito, em qualquer hipótese, como consectário da ampla defesa.","O princípio da publicidade, que deve ser aplicado tanto na fase de investigação quanto na fase processual.","É direito do advogado regularmente constituído ter acesso às diligências já documentadas, somado ao fato de não existir nenhuma diligência pendente."],"gabarito":"D","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa D. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":19,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":66,"codigo":"OAB2026TIPO1-066","area":"Direito Processual Penal","dificuldade":"Médio","enunciado":"Nicola injuriou Robson e Carlos, servidores públicos federais, por fatos relacionados a times de futebol, mas sem caráter racial na injúria. Robson ofereceu queixa-crime, ao passo que Carlos deixou passar o prazo de decadência. O Juiz extinguiu a punibilidade, sob o argumento de que a decadência do direito de um dos envolvidos provocava a extinção de punibilidade em relação a todos. Assinale a opção que apresenta o recurso que você, na condição de advogado(a) de Robson, deve apresentar.","alternativas":["O princípio da eventualidade demonstra o equívoco da decisão do Juiz.","O direito de queixa é autônomo para cada vítima, o que torna impossível, juridicamente, a extensão da decadência nesse caso.","A decadência não extingue a punibilidade, sendo apenas uma causa de diminuição a ser levada em consideração na dosimetria da pena.","A propositura de queixa por parte de Robson interrompeu o prazo de decadência para Carlos, uma vez que não há que se falar em extinção de punibilidade."],"gabarito":"B","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa B. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":19,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":67,"codigo":"OAB2026TIPO1-067","area":"Direito Processual Penal","dificuldade":"Médio","enunciado":"Leandro oferece queixa-crime no Juizado Especial Criminal. O Juiz rejeita a queixa sustentando a existência de decadência. Na condição de advogado(a) de Leandro, assinale a opção que indica, corretamente, o recurso que deve ser interposto contra a decisão que rejeitou a queixa.","alternativas":["Apelação.","Recurso inominado.","Carta testemunhável.","Recurso em sentido estrito."],"gabarito":"A","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa A. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":19,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":68,"codigo":"OAB2026TIPO1-068","area":"Direito Processual Penal","dificuldade":"Médio","enunciado":"Débora, primária e sem antecedentes, foi presa em flagrante no Aeroporto Internacional de Guarulhos, quando desembarcava no Brasil, em voo vindo do exterior, com um artefato que simulava uma arma de fogo de uso proibido na bagagem, ou seja, um simulacro que pode facilmente ser confundido com uma arma de fogo real. O simulacro é produto de importação proibida no Brasil. Débora foi enquadrada no delito de tráfico internacional de armas, previsto no Art. 18 do Estatuto do Desarmamento, cuja pena cominada é de 8 a 16 anos de reclusão, com a causa de aumento de metade (Art. 19 do Estatuto). A Polícia Federal lavrou o auto de prisão em flagrante e Débora foi submetida à audiência de custódia perante o Juiz Federal de Guarulhos. Como advogado(a) de Débora, assinale a afirmativa que contém as teses defensivas corretas.","alternativas":["A atipicidade do fato, ante o crime impossível e, ainda que assim não fosse, há incompetência absoluta da Justiça Federal.","A desclassificação para contrabando (pena de 2 a 5 anos) e o cabimento de liberdade provisória, com ou sem medidas cautelares diversas da prisão.","Como Débora é mulher e não tem antecedentes criminais, e o fato não foi cometido mediante violência ou grave ameaça, é cabível a substituição da prisão preventiva por domiciliar.","O fato foi meramente tentado, de forma que a pena mínima cominada com a redução máxima pela tentativa é igual a 4 anos, tornando cabível o acordo de não persecução penal."],"gabarito":"B","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa B. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":19,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":69,"codigo":"OAB2026TIPO1-069","area":"Direito Previdenciário","dificuldade":"Médio","enunciado":"Antônio José, segurado obrigatório do Regime Geral de Previdência Social, completou 65 anos de idade, após 30 anos ininterruptos de atividade remunerada como segurado empregado. Diante disso, procurou você, como advogado(a), para ser orientado sobre sua aposentadoria. Assinale a opção que apresenta, corretamente, a sua orientação.","alternativas":["Antônio não possui carência para fins de aposentadoria.","Antônio já possui idade e carência para fins de aposentadoria.","Antônio somente poderia, no caso narrado, se aposentar após 35 anos de contribuição.","Antônio não possui idade mínima, na forma fixada pela Constituição da República de 1988."],"gabarito":"A","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa A. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":20,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":70,"codigo":"OAB2026TIPO1-070","area":"Direito do Trabalho","dificuldade":"Médio","enunciado":"Manuela Dias, empregada doméstica, procurou você, como advogado(a), para receber orientação jurídica para uma demanda relacionada a acidente de trabalho, que ocorreu durante os seus afazeres diários na residência da empregadora doméstica, que gerou incapacidade temporária. Assinale a opção que indica a orientação correta.","alternativas":["Manuela poderá usufruir de benefício previdenciário por incapacidade temporária, ainda que possua menos de 12 contribuições mensais.","O acidente de trabalho somente será reconhecido como tal caso haja incapacidade mínima de seis meses para o trabalho, avaliada por perícia médica.","A conexão da incapacidade com o trabalho poderá ser aferida pelo INSS, mas nunca com a aplicação do Nexo Técnico Epidemiológico Previdenciário – NTEP.","A incapacidade de Manuela, na situação narrada, nunca poderia ser decorrente de doenças, pois o acidente de trabalho é sempre súbito, imediato e instantâneo."],"gabarito":"A","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa A. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":20,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":71,"codigo":"OAB2026TIPO1-071","area":"Direito do Trabalho","dificuldade":"Médio","enunciado":"Paulo foi contratado pela sociedade empresária Novos Horizontes para exercer a função de técnico em informática. João trabalha no mesmo setor e, por força de readaptação, exerce a mesma função de Paulo há seis meses. Luciana foi contratada um ano depois de Paulo, e ambos exercem a mesma função, não havendo diferença no trabalho realizado pelos três empregados. A sociedade empresária não tinha pessoal organizado em quadro de carreira, e o trabalho era distribuído entre os três indistintamente. Contudo, João recebia R$ 600,00 (seiscentos reais) a mais que Paulo, que, por sua vez recebia R$ 500,00 (quinhentos reais) a mais de salário que Luciana. Diante disso, você, como advogado(a), foi consultado(a) por Luciana acerca da diferença salarial. Assinale a opção que apresenta a resposta correta dada ao questionamento.","alternativas":["A diferença salarial não se justifica em nenhuma das hipóteses, cabendo a equiparação ao salário de maior valor.","Paulo pode ganhar mais que Luciana pelo fato de ser homem, mas, em relação a João, a diferença salarial é injustificável.","Paulo pode ganhar mais que Luciana em razão do tempo na função, que é a razão de Luciana não fazer jus ao mesmo salário que João.","A diferença salarial de Luciana em relação a Paulo não se justifica, pelo que os dois deveriam receber o mesmo salário, mas no caso de João, por ser readaptado, a diferença salarial é cabível."],"gabarito":"D","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa D. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":20,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":72,"codigo":"OAB2026TIPO1-072","area":"Direito do Trabalho","dificuldade":"Fácil","enunciado":"Uma Organização não Governamental está realizando uma série de parcerias com entidades privadas visando à inserção e ao aprendizado de menores no mercado de trabalho, a fim de estimular o primeiro emprego, bem como evitar os riscos de envolvimento com a criminalidade. Diante disso, consultou você, na qualidade de advogado(a), a respeito do trabalho do menor como empregado. Assinale a opção que apresenta, corretamente, a sua orientação sobre o caso.","alternativas":["É permitido ao menor de 18 e maior de 16 anos, o trabalho em bilheterias em cinemas e teatros, das 22 às 24 horas, a fim de não gerar prejuízo à frequência escolar.","É permitido ao maior de 16 anos e menor de 18 anos, o trabalho como frentista em postos de gasolina.","É permitido ao menor o trabalho em quiosques da orla das praias destinados à venda de comidas de todo o gênero e bebidas alcoólicas e não alcoólicas.","É permitido ao menor, a partir de 14 anos, trabalhar na condição de aprendiz."],"gabarito":"D","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa D. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":20,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":73,"codigo":"OAB2026TIPO1-073","area":"Direito do Trabalho","dificuldade":"Médio","enunciado":"Pedro trabalha numa sociedade empresária desde 2022. Na norma coletiva da categoria de Pedro há uma cláusula que fixa o intervalo intrajornada de 20 minutos para a jornada superior a seis horas diárias e, outra cláusula, prevendo que a remuneração do trabalho noturno será igual à do diurno. Considerando o que foi estipulado na norma coletiva, de acordo com a CLT, assinale a afirmativa correta.","alternativas":["Ambas as cláusulas da norma coletiva são inválidas.","Somente a cláusula relativa ao trabalho noturno é válida.","Somente a cláusula relativa ao intervalo intrajornada é válida.","Ambas as cláusulas são válidas, porque relativas a direitos passíveis de negociação."],"gabarito":"A","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa A. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":21,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":74,"codigo":"OAB2026TIPO1-074","area":"Direito do Trabalho","dificuldade":"Médio","enunciado":"A sociedade empresária Distribuidora de Bebidas Bom Paladar Ltda. pretende instituir uma política de incentivo aos seus empregados. Para tanto, deseja dar benefícios compreendidos em melhorias da condição de trabalho, com o fornecimento de uniformes novos, mais leves e confortáveis, computadores portáteis, transporte coletivo de ida e volta para o trabalho em ônibus da sociedade empresária, além de incentivo à educação, com pagamento de mensalidades e bolsa-livros para todos os empregados. Você foi procurado(a), como advogado(a), para responder à consulta da sociedade empresária acerca da integração dos valores à remuneração dos empregados. Diante disso, observado o texto da CLT, assinale a afirmativa que, corretamente, apresenta a sua resposta.","alternativas":["Todos os benefícios concedidos não integrarão a remuneração dos empregados.","Apenas a concessão de uniformes novos não integrará a remuneração dos empregados.","Apenas o benefício de incentivo à educação não integrará a remuneração dos empregados.","Apenas o fornecimento de transporte não integrará a remuneração dos empregados, por ser tempo à disposição do empregador."],"gabarito":"A","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa A. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":21,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":75,"codigo":"OAB2026TIPO1-075","area":"Direito do Trabalho","dificuldade":"Médio","enunciado":"Jonas trabalhava em uma sociedade empresária desde 2021. Com a nova chefia, que assumiu em janeiro de 2025, Jonas passou a ser explícita e sistematicamente discriminado pelo chefe em razão de sua orientação sexual, já que mantinha uma relação homoafetiva que era de conhecimento geral. Jonas foi dispensado, sem justa causa, em março de 2025. Em razão disso, Jonas o(a) procurou, na condição de advogado(a), para conhecer dos seus direitos. Assinale a opção que, considerando os fatos narrados e a norma de regência, apresenta, corretamente, sua orientação jurídica para o caso.","alternativas":["Nada há a fazer, porque é direito do empregador efetuar a dispensa sem justa causa.","O direito que assiste a Jonas é ser reintegrado, com ressarcimento integral de todo o período de afastamento.","Jonas poderá optar entre a reintegração ou a percepção, em dobro, da remuneração do período de afastamento.","Caberá apenas o pagamento, de forma simples, do período compreendido entre a dispensa e o ajuizamento da ação."],"gabarito":"C","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa C. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":21,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":76,"codigo":"OAB2026TIPO1-076","area":"Direito Processual do Trabalho","dificuldade":"Médio","enunciado":"Jorge Lucas trabalhou por um ano na sociedade empresária Alfa Beta Gama Ltda. Insatisfeito por trabalhar várias horas extras diárias sem recebê-las, apesar de consignar corretamente a sobrejornada nos controles de ponto, Jorge Lucas pediu demissão. Na rescisão do contrato de trabalho, por um equívoco do Departamento de Pessoal, foi pago um valor equivalente ao aviso prévio. Dias depois, Jorge Lucas ajuizou reclamação trabalhista pleiteando horas extras. A sociedade empresária contratou você, como advogado(a), para defendê-la. Acerca do que poderá ser alegado sobre o equívoco do pagamento a mais de aviso prévio, à luz do entendimento consolidado na jurisprudência do Tribunal Superior do Trabalho (TST), assinale a afirmativa correta.","alternativas":["Tendo sido pago o valor do aviso prévio espontaneamente pela sociedade empresária, está preclusa qualquer argumentação a esse respeito.","Deverá ser alegada a dedução dos valores pagos a título de aviso prévio da condenação ao pagamento dos valores relativos às horas extras.","Deverá ser alegada a compensação do valor pago a título do aviso prévio com eventual condenação em horas extras, o que deverá ser feito em sede de contestação.","Deverá ser alegada a quitação do valor pago a título do aviso prévio com eventual condenação em horas extras, o que poderá ser feito em qualquer momento processual na instância ordinária."],"gabarito":"C","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa C. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":21,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":77,"codigo":"OAB2026TIPO1-077","area":"Direito Processual do Trabalho","dificuldade":"Médio","enunciado":"Em determinada reclamação trabalhista que tramita perante a 60ª Vara do Trabalho de Maringá, PR, o autor requereu o pagamento do vale-transporte, que jamais fora pago, e as diferenças do FGTS, afirmando que, em parte do contrato, ele não foi depositado pelo ex-empregador na conta vinculada. Em defesa, a sociedade empresária sustentou que o empregado não necessitava de vale-transporte, porque ele residia próximo à sede da sociedade empresária em que exercia as suas atividades, deslocando-se a pé para ir ao serviço e voltar, e que recolheu de forma escorreita o FGTS. Sobre o ônus da prova, considerando os fatos narrados e o entendimento consolidado do Tribunal Superior do Trabalho (TST), assinale a afirmativa correta.","alternativas":["Tanto em relação ao vale-transporte quanto ao FGTS, o ônus da prova caberá ao empregado.","Em relação ao vale-transporte caberá à sociedade empresária; quanto ao FGTS, ao trabalhador.","Em relação ao vale-transporte, caberá ao trabalhador; quanto ao FGTS, à sociedade empresária.","Tanto em relação ao vale-transporte quanto ao FGTS, o ônus da prova caberá à sociedade empresária."],"gabarito":"D","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa D. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":22,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":78,"codigo":"OAB2026TIPO1-078","area":"Direito Processual do Trabalho","dificuldade":"Médio","enunciado":"Em determinada reclamação trabalhista que tramita perante a 58ª Vara do Trabalho de Cuiabá, MT, o pedido formulado foi julgado procedente em parte. A sociedade empresária reclamada recorreu ordinariamente e o reclamante, de forma adesiva. Distribuídos os apelos pelo Tribunal Regional, o Relator verificou que o recurso ordinário da reclamada se encontrava intempestivo, já que interposto no 16º dia contado da publicação da sentença. Considerando esses fatos e a norma de regência, assinale a afirmativa correta.","alternativas":["Os dois recursos não serão conhecidos.","O recurso ordinário não será conhecido, e o recurso adesivo será apreciado.","O recurso adesivo não será conhecido, salvo se o reclamante recorrente tiver feito o preparo na forma da lei.","Equivocado o Relator, pois, havendo recurso adesivo, o prazo é contado em dobro, pelo que o recurso ordinário é tempestivo e será conhecido."],"gabarito":"A","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa A. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":22,"status":"pendente_revi o obrigou a acordar muito cedo, o mesmo valendo para sua esposa. Sobre os fatos apresentados, considerando o previsto na CLT, assinale a afirmativa correta.","alternativas":["O procedimento é regular porque a lei não prevê horário para a prática dos atos processuais.","O Oficial de Justiça está equivocado, porque somente poderia realizar o ato processual a partir das 6 horas.","O procedimento é irregular, porque a lei prevê que os atos processuais podem ser feitos a partir das 7 horas.","Se os atos podem ser realizados até mesmo no domingo, mesmo sem a autorização do Juiz, com igual razão pode ser feito durante a semana, às 5h30."],"gabarito":"B","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa B. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":22,"status":"pendente_revisao"}];

div>'}
function uniqSorted(vals){return [...new Set(vals.filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'pt-BR',{numeric:true}))}
function optionsHtml(list,current){return list.map(v=>'<option '+(v===current?'selected':'')+'>'+escapeHtml(v)+'</option>').join('')}
function countBy(items,key){return items.reduce((acc,item)=>{const k=key(item)||'Sem classificação';acc[k]=(acc[k]||0)+1;return acc},{})}
function bancoCountList(titulo,obj){const rows=Object.entries(obj).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'pt-BR'));return '<div class="card"><h3>'+titulo+'</h3>'+(rows.length?rows.map(r=>'<div class="coord-mini"><span>'+escapeHtml(r[0])+'</span><b>'+r[1]+'</b></div>').join(''):'<p class="mural-text">Sem dados para os filtros atuais.</p>')+'</div>'}
function bancoQuestoesFiltradas(){return questoes.filter(q=>(bancoArea==='Todas'||q.area===bancoArea)&&(bancoAno==='Todos'||q.ano===bancoAno)&&(bancoExame==='Todos'||q.prova===bancoExame))}
function bancoFiltrosHtml(){const areaOpts=['Todas',...uniqSorted(questoes.map(q=>q.area))],anoOpts=['Todos',...uniqSorted(questoes.map(q=>q.ano)).sort((a,b)=>Number(b)-Number(a))],exameOpts=['Todos','OAB','ENADE','Personalizada'];return '<div class="card"><div class="grid4"><label class="form-label">Área<select class="form-select" onchange="bancoArea=this.value;render()">'+optionsHtml(areaOpts,bancoArea)+'</select></label><label class="form-label">Ano<select class="form-select" onchange="bancoAno=this.value;render()">'+optionsHtml(anoOpts,bancoAno)+'</select></label><label class="form-label">Exame<select class="form-select" onchange="bancoExame=this.value;render()">'+optionsHtml(exameOpts,bancoExame)+'</select></label><div style="display:flex;align-items:end;justify-content:end"><button class="btn btn-outline" onclick="limparBancoFiltros()">Limpar filtros</button></div></div></div>'}
function adminProvasBanco(){const filtradas=bancoQuestoesFiltradas(),validadas=filtradas.filter(q=>!questaoIncompleta(q)),pendentes=filtradas.filter(questaoIncompleta),porArea=countBy(filtradas,q=>q.area),porAno=countBy(filtradas,q=>q.ano),porExame=countBy(filtradas,q=>q.prova),oab=filtradas.filter(q=>q.prova==='OAB').length,enade=filtradas.filter(q=>q.prova==='ENADE').length;return bancoFiltrosHtml()+'<div class="grid5"><div class="card"><div class="stat-val" style="color:var(--blue)">'+questoes.length+'</div><div class="stat-lbl">Questões totais no banco</div></div><div class="card"><div class="stat-val" style="color:var(--grn)">'+validadas.length+'</div><div class="stat-lbl">Validadas para alunos</div></div><div class="card"><div class="stat-val" style="color:var(--gold)">'+pendentes.length+'</div><div class="stat-lbl">Pendentes de revisão</div></div><div class="card"><div class="stat-val" style="color:var(--blue2)">'+oab+'</div><div class="stat-lbl">OAB no filtro</div></div><div class="card"><div class="stat-val" style="color:var(--pur)">'+enade+'</div><div class="stat-lbl">ENADE no filtro</div></div></div><div class="grid3">'+bancoCountList('Questões por área',porArea)+bancoCountList('Questões por ano',porAno)+bancoCountList('Questões por exame',porExame)+'</div><div class="card">'+tag('Validadas aparecem para o aluno','green')+tag('Pendentes ficam retidas','gold')+tag('Código rastreável','gray')+'<p class="mural-text" style="margin-top:.65rem">Questões com enunciado ou alternativas genéricas não entram no painel do aluno até serem revisadas pelo professor.</p><div style="margin-top:.8rem"><a class="btn btn-outline" href="'+prova2023Url+'" target="_blank" rel="noopener">Abrir prova OAB 2023 - PDF FGV</a></div><div style="margin-top:1rem">'+filtradas.slice(0,24).map(q=>'<div class="question-bank-row"><div><b>'+escapeHtml(q.codigo||q.ref)+'</b><div style="font-size:.72rem;color:var(--t3);margin-top:.15rem">'+escapeHtml(q.ref)+'</div><div style="font-size:.72rem;color:var(--t3);margin-top:.15rem">'+escapeHtml(q.text.slice(0,92))+'...</div></div><div>'+escapeHtml(q.area)+'</div><div>'+escapeHtml(q.ano)+' · '+escapeHtml(q.prova)+'</div><div>'+tag(q.gabarito)+'</div><div>'+tagStatusQuestao(q)+' '+tag(q.origem||'Banco','gray')+'</div></div>').join('')+'</div></div>'}
function adminProvasComentarios(){const filtradas=bancoQuestoesFiltradas();return bancoFiltrosHtml()+'<div class="card">'+tag('Comentários editáveis','purple')+'<p class="mural-text">Edite aqui o comentário/fundamento que aparece para o aluno após responder cada questão.</p><div style="margin-top:1rem">'+filtradas.slice(0,18).map((q,i)=>'<div class="report-q"><div style="display:flex;justify-content:space-between;gap:.8rem;align-items:center;margin-bottom:.55rem"><div><b>'+escapeHtml(q.codigo||q.ref)+'</b><div class="student-doc">'+escapeHtml(q.ref)+' · '+escapeHtml(q.area)+' · Gabarito '+escapeHtml(q.gabarito)+'</div></div>'+tag(q.prova,q.prova==='ENADE'?'purple':'')+'</div><p class="mural-text">'+escapeHtml(q.text.slice(0,150))+'...</p><label class="form-label" style="margin-top:.7rem">Comentário / fundamento<textarea id="comentarioQuestao'+i+'" class="form-input" style="min-height:74px;resize:vertical">'+escapeHtml(comentarioAtualQuestao(q))+'</textarea></label><div class="admin-actions"><button class="btn" onclick="salvarComentarioQuestao(\''+escapeHtml(q.codigo||'')+'\',\'comentarioQuestao'+i+'\')">Salvar comentário</button></div></div>').join('')+'</div></div>'}
function salvarQuestaoManual(){const area=document.getElementById('admArea')?.value||'Direito Civil',fonte=(document.getElementById('admFonte')?.value||'Questões do professor · '+syncState.periodo).trim(),ano=(document.getElementById('admAno')?.value||anoFromText(fonte)).trim(),dif=document.getElementById('admDif')?.value||'Médio',text=(document.getElementById('admEnunciado')?.value||'').trim(),opts=['A','B','C','D'].map(l=>(document.getElementById('admAlt'+l)?.value||'').trim()),correta=Number(document.querySelector('input[name="admCorreta"]:checked')?.value||0),comment=(document.getElementById('admComentario')?.value||'').trim();if(!text||opts.some(o=>!o)){alert('Preencha o enunciado e as quatro alternativas.');return}const nova=makeBancoQuestao({fonte,ano,area,dif,text,opts,correta,comment,origem:'Professor'});syncSeguroSupabase('questoes','create',{codigo:nova.codigo,area,prova:fonte,ano,dificuldade:dif,enunciado:text,alternativas:opts,correta,comentario:nova.comment,origem:'Professor'});addQuestoesAoBanco([nova]);alert('Questão salva e sincronizada com o painel do aluno.')}
function importarQuestoesIA(){const fonte=(document.getElementById('admImportProva')?.value||'Importação IA · '+syncState.periodo).trim(),ano=anoFromText(fonte),difSel=document.getElementById('admImportDif')?.value||'Automático',areaSel=document.getElementById('admImportArea')?.value||'Automático',dif=difSel==='Automático'?'Médio':difSel,baseCount=questoes.filter(q=>q.exame===fonte||q.ref?.startsWith(fonte+' - Questão')).length,pool=areaSel==='Automático'?areas.slice(0,5):[areaSel];const novas=pool.map((area,i)=>{const modelo=modelos[area]||modelos.default,gabarito='A',q=makeBancoQuestao({fonte,ano,area,dif,text:modelo[0],opts:modelo[1],correta:0,comment:comentarioIADemo(area,gabarito,modelo[1][0],modelo[1],0),origem:'Importação IA'});q.ref=fonte+' - Questão '+(baseCount+i+1);q.codigo=makeQuestaoCodigo(fonte,ano,baseCount+i+1);return q});addQuestoesAoBanco(novas);alert(novas.length+' questões importadas e sincronizadas com o painel do aluno.')}
function limparBancoFiltros(){bancoArea='Todas';bancoAno='Todos';bancoExame='Todos';render()}
function editarComentarioQuestaoPorIndice(i){const q=questoes[i];if(q?.codigo)editarComentarioQuestao(q.codigo)}
function salvarComentarioQuestao(codigo,textareaId){const q=questoes.find(item=>item.codigo===codigo),el=document.getElementById(textareaId);if(!q||!el)return;const texto=el.value.trim();if(!texto){alert('Informe um comentário para salvar.');return}q.comment=texto;questaoComentarioOverrides[codigo]=texto;persistQuestaoComentarioOverrides();questoesExtras=questoesExtras.map(item=>item.codigo===codigo?{...item,comment:texto}:item);persistQuestoesExtras();syncSeguroSupabase('questoes','upsert',{codigo:q.codigo,area:q.area,prova:q.exame||q.prova,ano:q.ano,dificuldade:q.dif,enunciado:q.text,alternativas:q.opts,correta:q.correta,comentario:texto,origem:q.origem||'Professor'});syncQuestoesBanco();render();alert('Comentário salvo e sincronizado com o painel do aluno.')}
function editarComentarioQuestao(codigo){const q=questoes.find(item=>item.codigo===codigo);if(!q)return;const novo=prompt('Editar comentário / fundamento',q.comment||'');if(novo===null)return;const texto=novo.trim()||q.comment;q.comment=texto;questaoComentarioOverrides[codigo]=texto;persistQuestaoComentarioOverrides();questoesExtras=questoesExtras.map(item=>item.codigo===codigo?{...item,comment:texto}:item);persistQuestoesExtras();syncQuestoesBanco();render()}
function adminAlunos(){const filtrados=estudantes.filter(e=>!studentSearch||e.nome.toLowerCase().includes(studentSearch.toLowerCase())||e.email.toLowerCase().includes(studentSearch.toLowerCase()));const ativos=estudantes.filter(e=>e.status==='Ativo').length;return '<div class="admin-head"><div class="page-title" style="margin:0;border:0;padding:0">Estudantes</div><div class="admin-tools"><input class="form-input" style="width:195px" placeholder="Buscar por nome..." value="'+escapeHtml(studentSearch)+'" oninput="studentSearch=this.value;render()"><button class="btn" onclick="showStudentForm=!showStudentForm;render()">+ Cadastrar</button></div></div>'+adminAlunoForm()+'<div class="grid4"><div class="card"><div class="stat-val">'+estudantes.length+'</div><div class="stat-lbl">Total</div></div><div class="card"><div class="stat-val" style="color:var(--grn)">'+ativos+'</div><div class="stat-lbl">Ativos</div></div><div class="card"><div class="stat-val" style="color:var(--gold)">'+(estudantes.length-ativos)+'</div><div class="stat-lbl">Inativos</div></div><div class="card"><div class="stat-val" style="color:var(--blue)">3</div><div class="stat-lbl">Este mês</div></div></div><div class="card"><table class="student-table"><tr><th>Estudante</th><th>E-mail</th><th>Turma</th><th>Trilha</th><th>XP</th><th>Última atividade</th><th>Status</th><th></th></tr>'+filtrados.map((e,i)=>'<tr><td><div class="student-name"><div class="student-avatar" style="background:'+e.color+'">'+iniciais(e.nome)+'</div><div><b>'+e.nome+'</b><div class="student-doc">'+e.doc+'</div></div></div></td><td>'+e.email+'</td><td>'+e.turma+'</td><td>'+tag(e.trilha)+'</td><td><b>'+e.xp+'</b></td><td style="color:var(--t2)">'+e.atividade+'</td><td><span class="status-pill '+(e.status==='Ativo'?'':'off')+'">'+e.status+'</span></td><td><button class="icon-btn" onclick="editarAluno('+i+')">✎</button><button class="icon-btn" onclick="removerAluno('+i+')">🗑</button></td></tr>').join('')+'</table></div>'}

<script type="module">
const firebaseConfig = {
  apiKey: "AIzaSyAeUTzfyva0d6hukh_6kFQaN4-k4JAETRs",

};
const lexiaAuthRules = {
  coordenadorEmails: ["coordenador@lexia.br","plataformalexia@gmail.com.br","plataformalexia@gmail.com","brunofelipe.oem@gmail.com"],
  professorEmails: ["professor@lexia.br","bruno_miranda88@hotmail.com"]
};
const firebaseSdkVersion = "12.7.0";
function firebaseIsConfigured(){
  return firebaseConfig.apiKey && !firebaseConfig.apiKey.includes("COLE_AQUI");
}
function roleForGoogleEmail(email){
  const normalized = String(email||"").toLowerCase();
  if(lexiaAuthRules.coordenadorEmails.map(e=>e.toLowerCase()).includes(normalized))return "coord";
  const professoresCadastrados = window.getProfessoresAcessoEmails ? window.getProfessoresAcessoEmails() : [];
  if([...lexiaAuthRules.professorEmails,...professoresCadastrados].map(e=>e.toLowerCase()).includes(normalized))return "professor";
  return "aluno";
}
async function getFirebaseAuth(){
  if(!window.lexiaFirebaseApp){
    const appSdk = await import(`https://www.gstatic.com/firebasejs/${firebaseSdkVersion}/firebase-app.js`);
    window.lexiaFirebaseApp = appSdk.initializeApp(firebaseConfig);
  }
  if(!window.lexiaFirebaseAuth){
    const authSdk = await import(`https://www.gstatic.com/firebasejs/${firebaseSdkVersion}/firebase-auth.js`);
    window.lexiaFirebaseAuthSdk = authSdk;
    window.lexiaFirebaseAuth = authSdk.getAuth(window.lexiaFirebaseApp);
  }
  return window.lexiaFirebaseAuth;
}
window.lexiaGoogleLogin = async function(selectedRole){
  if(!firebaseIsConfigured()){
    alert("Firebase ainda não foi configurado. Entrando em modo demonstrativo.");
    window.lexiaApplyGoogleUser(selectedRole,null);
    return;
  }
  try{
    const auth = await getFirebaseAuth();
    const {GoogleAuthProvider,signInWithPopup} = window.lexiaFirebaseAuthSdk || await import(`https://www.gstatic.com/firebasejs/${firebaseSdkVersion}/firebase-auth.js`);
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({prompt:"select_account"});
    const result = await signInWithPopup(auth,provider);
    const user = result.user;
    window.lexiaFirebaseUser = user;
    window.lexiaApplyGoogleUser(roleForGoogleEmail(user.email),{name:user.displayName||user.email,email:user.email});
  }catch(err){
    alert("Não foi possível entrar com Google. Verifique a configuração do Firebase e os domínios autorizados.");
    console.error(err);
  }
};
window.lexiaFirebaseSignOut = async function(){
  try{
    if(!window.lexiaFirebaseAuth)return;
    const {signOut} = window.lexiaFirebaseAuthSdk || await import(`https://www.gstatic.com/firebasejs/${firebaseSdkVersion}/firebase-auth.js`);
    await signOut(window.lexiaFirebaseAuth);
    window.lexiaFirebaseUser = null;
  }catch(err){
    console.warn(err);
  }
};
</script>
