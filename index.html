o seja particular e esteja com assinatura autenticada, é dispensável a intervenção de testemunhas.","O locatário poderá, em réplica, manifestar ao locador que aceita as condições apresentadas por terceiro para obter a renovação pretendida.","O ramo de negócio a ser explorado pelo terceiro proponente pode ou não ser o mesmo do locatário, desde que seja explorado continuadamente nos últimos três anos."],"gabarito":"C","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":15,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":51,"codigo":"OAB2025TIPO1-051","area":"Direito Empresarial","dificuldade":"Médio","enunciado":"José ajuizou ação de indenização por danos materiais e morais contra Ana. Na petição inicial, José formulou requerimento de tutela provisória de urgência para que fosse determinado o bloqueio imediato de bens detidos por Ana, até o valor pleiteado por José no processo judicial, como forma de resguardar uma futura indenização para José, se forem julgados procedentes os seus pedidos de danos materiais e morais. Após realizar a admissibilidade da petição inicial, o magistrado concedeu a tutela provisória de urgência em favor de José. Nessa situação hipotética, assinale a opção que indica o recurso a ser interposto por Ana.","alternativas":["Não cabe recurso imediato contra a decisão que defere a tutela provisória de urgência.","Agravo de instrumento, uma vez que a decisão que defere a tutela provisória de urgência é decisão interlocutória impugnável por tal recurso.","Apelação, tendo em vista que a decisão que defere a tutela provisória de urgência tem natureza de sentença, passível de impugnação por tal recurso.","Apelação, tendo em vista que a decisão que defere a tutela provisória de urgência é decisão interlocutória passível de impugnação por tal recurso."],"gabarito":"B","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":15,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":52,"codigo":"OAB2025TIPO1-052","area":"Direito Empresarial","dificuldade":"Médio","enunciado":"Joana ajuizou ação declaratória de nulidade de negócio jurídico em face de João e Regina, alegando ter sido vítima de dolo de ambos na celebração de contrato de compra e venda de imóvel. Em sede de contestação, além de negarem os fatos alegados por Joana, João e Regina procuram você, como advogado(a), para propor reconvenção contra Joana e Marcelo, seu fiador, para cobrar valores alegadamente em atraso, referentes às parcelas do contrato de compra e venda firmado pelas partes. Sobre o caso acima, assinale a opção que apresenta, corretamente, a orientação jurídica prestada.","alternativas":["Joana poderá desistir da ação para impedir o prosseguimento da reconvenção.","Joana, com a propositura da reconvenção, será citada pessoalmente e deverá apresentar resposta no prazo de 15 dias.","Não há óbice à propositura da reconvenção em face de Joana e de Marcelo, ainda que este não tenha sido o autor do processo originário.","A reconvenção somente poderá ser admitida porque João e Regina contestaram o pedido, não sendo lícita a propositura de reconvenção sem que o réu ofereça contestação."],"gabarito":"C","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":15,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":53,"codigo":"OAB2025TIPO1-053","area":"Direito Processual Civil","dificuldade":"Difícil","enunciado":"Lucas requereu o cumprimento de sentença de obrigação de pagar alimentos, decorrente de sentença condenatória proferida em desfavor de Leonardo, seu pai, que é servidor público, condenado ao pagamento de alimentos, no percentual de 20% de seus rendimentos líquidos. Regularmente intimado, Leonardo não pagou o débito cobrado, porém apresentou petição alegando que enfrenta dificuldades financeiras que impossibilitam o cumprimento da obrigação, requerendo ao Juízo a concessão de maior prazo para pagar a dívida. Sobre o caso apresentado, assinale a afirmativa correta.","alternativas":["A comprovação de que Leonardo poderá cumprir parcialmente a obrigação alimentar justificará o inadimplemento em absoluto.","Não acolhida a defesa de Leonardo, o Juiz decretará a sua prisão pelo prazo de dois a seis meses, que, se cumprida, o eximirá do pagamento das prestações vencidas.","O Juiz poderá ordenar a prisão civil de Leonardo em razão do inadimplemento das obrigações referentes às cinco prestações anteriores ao ajuizamento da execução e as que vencerem no curso do processo.","Lucas poderá requerer o desconto em folha de pagamento da importância da prestação alimentícia, buscando o pagamento dos alimentos vencidos e vincendos devidos por Leonardo, até o limite de 50% dos ganhos líquidos do executado."],"gabarito":"D","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":16,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":54,"codigo":"OAB2025TIPO1-054","area":"Direito Processual Civil","dificuldade":"Médio","enunciado":"Marta faleceu, deixando três filhos, cônjuge e bens a inventariar. Nenhum dos herdeiros é incapaz, há consenso sobre a partilha, e eles desejam realizar o inventário da forma mais rápida possível. Considerando os procedimentos judiciais e extrajudiciais que regem o inventário e a partilha, assinale a afirmativa que apresenta a providência a ser adotada pelos herdeiros.","alternativas":["Realizar o inventário extrajudicial por meio de escritura pública, sendo necessária a assistência de um(a) advogado(a).","Realizar o inventário extrajudicial por meio de escritura pública, exigindo-se assistência de um(a) advogado(a) e a intervenção do Ministério Público a fim de controlar a legalidade da partilha.","Ajuizar ação pelo procedimento comum de inventário e partilha, os quais necessariamente devem ocorrer pela via judicial, independentemente da existência de consenso entre os herdeiros.","Comparecer perante o Tabelionato e realizar o inventário e a partilha mediante escritura pública, dispensada a assistência de um(a) advogado(a) por haver acordo sobre a partilha."],"gabarito":"A","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":16,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":55,"codigo":"OAB2025TIPO1-055","area":"Direito Processual Civil","dificuldade":"Médio","enunciado":"Glauco ingressou com uma ação contra Alex que, após o trânsito em julgado da sentença condenatória, deu início ao cumprimento de sentença. Alex foi devidamente intimado para pagar o débito no prazo legal, mas não realizou o pagamento. Seis dias após o término do prazo para o pagamento, ao ser questionado sobre a apresentação da impugnação ao cumprimento de sentença, Alex afirmou que ainda aguardava uma intimação específica para impugnar, pois acreditava que o prazo para se manifestar só começaria a contar após essa nova intimação. Diante dessa situação, assinale a afirmativa correta.","alternativas":["Alex está correto, pois o prazo para impugnação ao cumprimento de sentença só se inicia após uma nova intimação específica para esse fim.","O prazo para impugnação ao cumprimento de sentença tem início após o transcurso do prazo para o pagamento voluntário, independentemente de nova intimação.","Alex pode apresentar a impugnação a qualquer momento durante a execução, pois não há prazo específico para essa manifestação, em razão do princípio da ampla defesa, devendo ser apresentada em autos apartados.","O prazo para a impugnação ao cumprimento de sentença tem início antes do prazo para o pagamento voluntário, isto é, primeiro Alex é intimado para impugnar e, caso a impugnação não seja acolhida, ele é intimado para efetuar o pagamento do débito."],"gabarito":"B","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":16,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":56,"codigo":"OAB2025TIPO1-056","area":"Direito Processual Civil","dificuldade":"Difícil","enunciado":"Joana ajuizou ação em face de Pietra, cirurgiã plástica, requerendo a sua condenação ao pagamento de danos morais e estéticos, resultantes de procedimento estético malsucedido. Ocorre que, anteriormente, em decisão transitada em julgado, fundada na mesma causa de pedir e contra a mesma profissional, um pedido idêntico de Joana foi julgado improcedente em face de Pietra, sob o fundamento de que não restou comprovada conduta negligente de Pietra, a ensejar a sua condenação. Em tal hipótese, assinale a opção que indica o fenômeno processual cabível para extinguir a ação proposta por Joana.","alternativas":["Conexão, por ser comum o pedido e a causa de pedir.","Litispendência, por se repetir ação já proposta e em curso.","Perempção, por ter havido extinção de ação anteriormente proposta por Joana.","Coisa julgada, por haver decisão de mérito transitada em julgado com as mesmas partes, causa de pedir e pedido."],"gabarito":"D","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":16,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":57,"codigo":"OAB2025TIPO1-057","area":"Direito Processual Civil","dificuldade":"Difícil","enunciado":"taldir, cidadão brasileiro, depois de anos de poupança, conseguiu realizar o sonho de infância e comprou um pacote de viagem para conhecer a cidade de Orlando, nos EUA. Como nunca havia viajado em avião, taldir irritou-se com as condições precárias disponibilizadas na classe econômica da aeronave privada registrada sob bandeira brasileira e desistiu da viagem durante o voo, exigindo, aos gritos, o imediato retorno ao aeroporto de origem. Ao ser advertido pela tripulação, taldir agrediu fisicamente o comissário de bordo, de nacionalidade brasileira, causando-lhe lesão corporal grave, quando o avião já sobrevoava território estrangeiro. Sobre essa situação hipotética, assinale a afirmativa correta.","alternativas":["O fato está incondicionalmente sujeito à legislação brasileira, tendo em vista a nacionalidade do autor e da vítima do delito.","O fato está sujeito, simultaneamente, à legislação brasileira e à legislação estrangeira, sendo aplicável a teoria da ubiquidade quanto ao tempo do delito.","O fato está sujeito exclusivamente à legislação estrangeira, haja vista que a aeronave privada estava em território estrangeiro quando ocorreu a prática do delito.","O fato estará sujeito à legislação brasileira, caso não seja julgado no país estrangeiro em cujo território se encontrava a aeronave no momento da prática do delito."],"gabarito":"D","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":17,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":58,"codigo":"OAB2025TIPO1-058","area":"Direito Processual Civil","dificuldade":"Médio","enunciado":"Na noite em que completou 19 anos de idade, Júnior, morador do bairro Leblon, RJ, resolveu testar o Bugatti Chiron de seu pai, que é o carro mais caro do Brasil, avaliado em cerca de 10 milhões de reais. Júnior esqueceu a sua carteira de habilitação em casa e saiu com o veículo, mas, por desconhecer a extraordinária potência do motor, perdeu o controle da direção e abalroou José, morador de rua, que foi socorrido, mas teve as pernas amputadas. Diante de tal situação hipotética, com base nos princípios aplicáveis ao conflito aparente de normas penais, assinale a afirmativa correta.","alternativas":["Por força do princípio da consunção, Júnior deverá responder pelo delito de tentativa de homicídio culposo.","Por força do princípio da subsidiariedade, Júnior deverá responder pelo delito de lesão corporal de natureza grave.","Por força do princípio da especialidade, Júnior deverá responder pelo delito de lesão corporal culposa na direção de veículo automotor.","Por força do princípio da alternatividade, Júnior deverá responder pelo delito de dirigir veículo automotor, em via pública, sem a devida habilitação, ou pelo delito de lesão corporal culposa."],"gabarito":"C","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":17,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":59,"codigo":"OAB2025TIPO1-059","area":"Direito Penal","dificuldade":"Fácil","enunciado":"João é missionário, e Pedro é pastor, ambos da mesma igreja. O primeiro planejou apropriar-se do dinheiro dos dízimos que Pedro costumava guardar em uma urna em seu quarto, localizado nos fundos da igreja. Quando Pedro se ausentou durante a noite, João pulou o muro e arrombou a fechadura, mas, ao se aproximar da urna, foi tomado por um sentimento sobrenatural, orou para livrar-se dos maus pensamentos e foi embora. Sobre a ação praticada por João, assinale a afirmativa correta.","alternativas":["João percorreu as fases da cogitação, preparação e execução, que integram o iter criminis, mas não exauriu a conduta, o que era imprescindível para a caracterização da tentativa.","João praticou tentativa de furto e ser-lhe-á aplicada a pena do crime consumado a ser reduzida, dentro das margens legais, segundo o trecho do iter criminis que foi percorrido.","João praticou tentativa imperfeita de furto, pois, apesar de ter praticado todos os atos executórios, o resultado não foi atingido por circunstâncias sobrenaturais avessas à vontade do agente.","João consumou o crime de violação de domicílio, pois, de maneira livre e consciente, ingressou na casa alheia contra a vontade de quem de direito."],"gabarito":"D","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":17,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":60,"codigo":"OAB2025TIPO1-060","area":"Direito Penal","dificuldade":"Difícil","enunciado":"Abelardo pegou a filha de Geraldo na saída do colégio e a manteve sob seu poder durante cinco dias, liberando-a após ter sido cumprida a exigência de pagamento da quantia de R$ 100.000,00 (cem mil reais). No terceiro dia do encarceramento, entrou em vigor uma nova lei que dobrou a pena aplicável ao crime de extorsão mediante sequestro. Sobre a aplicabilidade da nova lei ao caso narrado, assinale a afirmativa correta.","alternativas":["É inaplicável, por força do princípio da retroatividade da lei penal.","É aplicável, por força do princípio da alternatividade da lei penal.","É aplicável, por força do princípio da continuidade das leis.","É inaplicável, por força do princípio da ubiquidade da lei penal."],"gabarito":"C","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":17,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":61,"codigo":"OAB2025TIPO1-061","area":"Direito Penal","dificuldade":"Médio","enunciado":"Em 1º de abril, dia da mentira, Maria resolveu “pregar uma peça” em Pedro, coveiro no cemitério Paz Eterna. Maria pediu a José que divulgasse nas redes sociais que ela falecera após ter sofrido um infarto. Como parte da encenação, Maria sedou-se e deitou-se em um caixão, que foi lacrado e encaminhado por José, com documentos sofisticadamente falsificados, para a sede do Paz Eterna. Sem ser avisado ou desconfiar da farsa, Pedro ficou muito triste e, após orar pela alma de Maria, cumpriu seu dever profissional, realizando a cremação e guardando as cinzas num pote de vidro, que se quebrou. Sobre o procedimento de Pedro, assinale a afirmativa correta.","alternativas":["Ele não praticou crime, pois agiu com base em erro de tipo invencível.","Ele praticou apenas o delito de vilipêndio culposo das cinzas do cadáver de Maria.","Ele praticou o delito de homicídio culposo por descumprir dever de cuidado objetivo.","Ele praticou o delito de homicídio qualificado pela impossibilidade de reação da vítima."],"gabarito":"A","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":18,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":62,"codigo":"OAB2025TIPO1-062","area":"Direito Penal","dificuldade":"Difícil","enunciado":"Bernardo é gerente bancário e teve seu filho levado por terceiros, que lhe exigiram o pagamento de um milhão de reais para devolvê- lo com vida. Bernardo, valendo-se de sua condição de gerente de banco, foi à agência em que trabalhava e subtraiu a quantia, sendo, entretanto, flagrado quando chegava em sua casa portando o dinheiro subtraído. Sobre a situação de Bernardo no fato hipotético, assinale a afirmativa correta.","alternativas":["Agiu amparado por exercício regular de direito.","Está isento de pena por inexigibilidade de conduta diversa.","Agiu em legítima defesa de terceiro e está excluída a antijuridicidade da conduta.","Deve responder pelo crime de furto consumado, pois chegou a ter posse pacífica do dinheiro."],"gabarito":"B","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":18,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":63,"codigo":"OAB2025TIPO1-063","area":"Direito Penal","dificuldade":"Médio","enunciado":"Lucas era investigado por estupro de vulnerável, pois, de acordo com as investigações, teria mantido relações sexuais com pessoa menor de 14 anos. A partir de indícios concretos, a 1ª Vara Criminal da Comarca correspondente ao local dos fatos expediu mandado de busca e apreensão de aparelhos eletrônicos de Lucas, após regular requerimento do Ministério Público. Nos dispositivos eletrônicos apreendidos foram localizados diversos arquivos, cujo conteúdo apresentava abuso sexual infantil, armazenados e compartilhados nas redes sociais, acessíveis de qualquer lugar do país e do exterior, sem se confirmar, contudo, a hipótese inicial de estupro de vulnerável. Assim, Lucas foi denunciado como incurso nas penas do Art. 241- A e do Art. 241-B, ambos do ECA (divulgação e armazenamento de conteúdo pornográfico envolvendo criança ou adolescente). A sentença foi proferida pelo Juiz de Direito da 1ª Vara Criminal da Comarca, tendo sido confirmada pelo Tribunal de Justiça correspondente, e transitada em julgado, condenando Lucas a 5 anos de reclusão, em regime semiaberto. A respeito dos fatos, assinale a opção que apresenta, corretamente, a providência de Direito Processual Penal que o(a) advogado(a) deve adotar.","alternativas":["A ocorrência do trânsito em julgado impede que sejam suscitadas questões processuais atinentes à nulidade ou à incompetência absoluta, admitindo-se a rediscussão dos fatos apenas se for baseada em prova nova, mediante revisão criminal.","Pode ser alegada a nulidade da busca e apreensão e de todos os atos dela decorrentes, diante da incompetência absoluta do Juízo que determinou a diligência, impetrando-se habeas corpus.","Pode ser impetrado habeas corpus, alegando a nulidade da sentença e de todos os atos decisórios posteriores à realização da busca e apreensão, diante da incompetência absoluta do Juízo.","Tendo em vista que a busca e apreensão foi deferida apenas para a investigação de estupro de vulnerável, é incabível a utilização das provas na persecução penal relativa a fato diverso, o que pode ser alegado pela impetração de um mandado de segurança."],"gabarito":"C","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":18,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":64,"codigo":"OAB2025TIPO1-064","area":"Direito Penal","dificuldade":"Médio","enunciado":"Arthur está cumprindo pena privativa de liberdade pela prática do crime de furto qualificado. Durante o curso da execução penal sofreu uma queda e ficou tetraplégico, atestado em laudo médico oficial. No final do ano, o Presidente da República concedeu indulto natalino via Decreto, abrangendo os casos de tetraplegia superveniente à prática do delito, desde que o crime tivesse sido praticado sem violência ou grave ameaça. Sendo assim, você, como advogado(a) de Arthur, formulou o pedido de declaração da extinção da punibilidade ao Juízo da Execução, que indeferiu o pedido, sem apresentar fundamentação. Diante do caso narrado, na qualidade de advogado(a) de Arthur, você deve interpor","alternativas":["agravo em execução, no prazo de cinco dias. Sem prejuízo, pode ser impetrado habeas corpus.","recurso de apelação, no prazo de cinco dias. Sem prejuízo, pode ser impetrado habeas corpus.","agravo em execução, no prazo de cinco dias. Apenas em caso de não ser interposto recurso, pode-se optar pela via do habeas corpus.","recurso em sentido estrito, no prazo de cinco dias. Diante da unirecorribilidade das decisões, de forma alternativa, pode-se optar pela via do habeas corpus."],"gabarito":"A","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":19,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":65,"codigo":"OAB2025TIPO1-065","area":"Direito Processual Penal","dificuldade":"Fácil","enunciado":"Túlio abriu sua geladeira, retirou sua água com gás e, ao beber, sentiu um gosto estranho, posteriormente vindo a descobrir que se tratava de solvente. Em seguida, Túlio entrou no quarto e chamou sua esposa, Felícia, de “assassina”. Após o esclarecimento de que o solvente tinha sido colocado por equívoco na geladeira por seu filho Thor, Túlio pediu desculpas à Felícia. Alguns dias depois, Felícia contou, em uma roda informal, para a sua amiga Promotora de Justiça, que o marido a havia chamado de “assassina”. Diante de tais fatos, o Ministério Público ofereceu a denúncia por crime de injúria em desfavor de Túlio. Sobre o caso narrado, como advogado(a) de Túlio, assinale a afirmativa correta.","alternativas":["Em razão de envolver violência doméstica, o crime é de ação penal pública incondicionada, cabendo apenas se defender quanto ao mérito da acusação.","O crime é de ação penal privada, devendo ser alegada a ilegitimidade do Ministério Público para a propositura da ação.","O crime é de ação penal pública condicionada à representação, e essa conversa informal já vale como representação, cabendo apenas se defender quanto ao mérito da acusação.","O crime é de ação pública condicionada à representação, mas a conversa informal não pode ser aceita como exercício do direito de representar."],"gabarito":"B","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":19,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":66,"codigo":"OAB2025TIPO1-066","area":"Direito Processual Penal","dificuldade":"Difícil","enunciado":"Joaquim, menor impúbere de 8 anos de idade, sofreu castigos físicos imoderados praticados por seu pai, Geraldo. Diante do fato, a mãe de Joaquim, representando-o, constituiu você como advogado(a) do menor. Assinale a opção que apresenta, corretamente, o requerimento que você, como advogado(a) de Joaquim, deve apresentar.","alternativas":["A fixação de medida cautelar do Código de Processo Penal, pois ausente um regramento específico em favor de vítimas do sexo masculino.","A destituição de guarda, no âmbito cível, e, somente então, haverá legitimidade de Joaquim para postular qualquer medida no âmbito criminal.","A fixação de medida protetiva de urgência de proibição de contato e aproximação, com base na lei específica de prevenção e enfrentamento à violência doméstica e familiar contra a criança e o adolescente.","A fixação de medida protetiva de urgência de alimentos provisórios, com base na lei de violência doméstica e familiar contra a mulher, por analogia, ante a ausência de lei específica que ampare a pretensão de Joaquim."],"gabarito":"C","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":19,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":67,"codigo":"OAB2025TIPO1-067","area":"Direito Processual Penal","dificuldade":"Médio","enunciado":"Caim, desejando matar Abel, lhe ofereceu um pastel de camarão durante uma festa, sabendo que esse alimento lhe causaria severa alergia. Abel consumiu o pastel oferecido por Caim, além de diversos outros salgados e, em sequência, teve uma violenta crise alérgica, vindo a falecer. Acionada a polícia, os investigadores recolheram, em um mesmo invólucro, todos os alimentos da festa, os quais foram submetidos à perícia, que concluiu que “todos os alimentos periciados contêm traços de camarão em quantidade suficiente para causar a morte da vítima, da forma como ocorreu, não se podendo precisar se a contaminação de tais alimentos ocorreu durante o preparo, na cozinha, ou durante o recolhimento pela Polícia.” A necropsia revelou que o consumo de substância alergênica causou a morte de Abel. Sabe-se, ainda, que não é mais possível repetir a colheita de vestígios e a perícia dos alimentos. Assim, Caim foi denunciado pelo homicídio doloso de Abel. Como advogado de Caim, é correto afirmar que a quebra da cadeia de custódia enseja","alternativas":["a ausência de fiabilidade do laudo de necrópsia.","a ausência de prova fiável do nexo de causalidade.","a nulidade absoluta do processo, atingindo todas as provas produzidas.","a nulidade da prova pericial, a qual deve ser desentranhada do processo."],"gabarito":"B","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":19,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":68,"codigo":"OAB2025TIPO1-068","area":"Direito Processual Penal","dificuldade":"Difícil","enunciado":"Flávia foi pronunciada pela suposta prática de crime de aborto. O processo estava tramitando na cidade de Salgados, PA, e teve grande repercussão no local, havendo, inclusive, várias ameaças de populares contra a ré. A sessão de julgamento pelo júri popular já foi designada, tendo a defesa sido intimada da referida designação. Sobre a hipótese, assinale a opção que indica o modo adequado de você, como advogado(a) da ré, requerer que o julgamento ocorra em outra Comarca.","alternativas":["Suscitar incidente de deslocamento de competência para a Justiça Federal.","Apresentar um pedido de Revisão Criminal.","Oferecer exceção de incompetência territorial.","Pedir o desaforamento do júri."],"gabarito":"D","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":20,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":69,"codigo":"OAB2025TIPO1-069","area":"Direito Processual Penal","dificuldade":"Médio","enunciado":"Joana Silva, empregada doméstica, prestando serviço aos mesmos empregadores por cinco anos consecutivos, é demitida por justa causa, devido à prática de ilícito prontamente comprovado em ambiente laboral. Joana, seis meses após o desligamento, sofreu um acidente de trânsito, restando incapacitada permanentemente para qualquer atividade remunerada. Nesse contexto, assinale a afirmativa correta.","alternativas":["Joana poderá obter o benefício previdenciário de aposentadoria por incapacidade permanente.","Joana não possui direito a qualquer prestação previdenciária, haja vista o desligamento por justa causa.","Joana, caso comprove ter efetuado recolhimentos como facultativa, pode obter a concessão do benefício previdenciário.","Joana somente pode obter o benefício previdenciário se o acidente tiver ocorrido no prazo de três meses após a demissão."],"gabarito":"A","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":20,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":70,"codigo":"OAB2025TIPO1-070","area":"Direito Processual Penal","dificuldade":"Médio","enunciado":"Sílvia Lima, empregada segurada do Regime Geral da Previdência Social (RGPS), desempenha suas funções em atividades externas, mediante entregas de produtos elaborados por seu empregador. Em uma de suas entregas, logo após deixar a mercadoria e já no retorno ao seu posto de trabalho, foi atingida por um veículo em alta velocidade, que transitava em desacordo com os limites da via. Em virtude do ocorrido, Sílvia permaneceu afastada por um ano, em gozo de benefício previdenciário por incapacidade temporária, tendo se recuperado plenamente para as suas atividades. Sobre a situação de Sílvia, segundo o RGPS, assinale a afirmativa correta.","alternativas":["Ela poderá se aposentar por incapacidade permanente.","Ela tem direito ao auxílio-acidente após o retorno às atividades.","Ela, durante o afastamento, deve continuar a receber salários, normalmente.","Ela, após o retorno à sua atividade, gozará de estabilidade provisória de 12 meses no emprego."],"gabarito":"D","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":20,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":71,"codigo":"OAB2025TIPO1-071","area":"Direito do Trabalho","dificuldade":"Fácil","enunciado":"A sociedade empresária Bons Caminhos Ltda. consultou você, como advogado(a), porque pretendia contratar, em setembro de 2025, alguns aprendizes e estagiários com 18 anos de idade para que realizassem atividades na modalidade de teletrabalho. A sociedade empresária deseja saber se tal pretensão era válida. Em resposta à demanda da sociedade empresária, considerando os termos da CLT, assinale a afirmativa correta.","alternativas":["É permitido contratar aprendizes e estagiários para realizarem atividades na modalidade de teletrabalho.","É permitido contratar aprendizes na modalidade de teletrabalho, mas não estagiários, por desvirtuar a filosofia do estágio.","É permitido contratar estagiários na modalidade de teletrabalho, mas não aprendizes, porque o contrato de trabalho deles é especial.","Somente é permitido contratar aprendizes e estagiários em regime de teletrabalho se houver autorização dos seus pais ou responsáveis."],"gabarito":"A","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":20,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":72,"codigo":"OAB2025TIPO1-072","area":"Direito do Trabalho","dificuldade":"Médio","enunciado":"Em outubro de 2023, a sociedade empresária Plantas Ornamentais Ltda. dispensou o empregado Josimar, sem justa causa, após dois anos de contrato de trabalho. A sociedade calculou as verbas resilitórias e depositou-as na conta do trabalhador em cinco dias e, no mesmo dia, fez o recolhimento da indenização de 40% sobre o FGTS. Ocorre que, por equívoco do setor de Recursos Humanos da sociedade empresária, as guias para o saque do FGTS e os formulários para o requerimento do seguro-desemprego somente foram entregues 60 dias após o término do aviso prévio. Sobre a hipótese, considerando os termos da CLT, assinale a afirmativa correta.","alternativas":["Não se cogitará qualquer multa ou penalidade pela ausência de prejuízo, já que as verbas foram depositadas na conta de Josimar no prazo legal.","A sociedade empresária pagará uma multa de 50% do valor das verbas resilitórias, em razão do atraso na entrega dos documentos do FGTS e do seguro-desemprego.","A situação gerou enorme prejuízo ao trabalhador, daí porque as verbas referentes à saída deverão ser pagas em dobro como forma de punição da sociedade empresária.","A sociedade empresária pagará multa pelo atraso na entrega dos documentos do FGTS e do seguro-desemprego em favor do trabalhador, no valor equivalente ao seu salário."],"gabarito":"D","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":20,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":73,"codigo":"OAB2025TIPO1-073","area":"Direito do Trabalho","dificuldade":"Difícil","enunciado":"Jéssica trabalha em um hospital particular de Belo Horizonte, no setor de tratamento de pacientes com doenças infectocontagiosas, recebendo adicional de insalubridade em grau máximo. Em 2024, Jessica engravidou e deu ciência do fato ao seu chefe, que imediatamente a transferiu para o setor de convênios, localizado em um prédio diferente do hospital, ocupando uma confortável e arejada sala comercial na qual cinco funcionários negociam com os planos de saúde conveniados, por telefone, a tabela de valores pelos atendimentos e procedimentos, sem atendimento presencial do público externo. Sobre a situação apresentada e os termos da CLT, assinale a afirmativa correta.","alternativas":["A empregada, durante a gestação, fez jus ao adicional de insalubridade, que cessará após o nascimento da criança, não se estendendo ao período de lactação.","O direito ao adicional de insalubridade, até o retorno, deverá cessar porque a transferência foi uma necessidade para a qual a sociedade empresária não colaborou.","Jéssica, de acordo com a norma de regência, terá direito à metade do valor do adicional de insalubridade que recebia, enquanto estiver em local sem agente agressor à saúde.","A sociedade empresária deve pagar o adicional de insalubridade à gestante enquanto ela estiver no setor de convênios, fazendo a compensação desse valor na cota-parte do INSS."],"gabarito":"D","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":21,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":74,"codigo":"OAB2025TIPO1-074","area":"Direito do Trabalho","dificuldade":"Médio","enunciado":"Luana Moreira trabalha em uma sociedade empresária do setor de cosméticos das 7h às 13h15min e desfruta de 15 minutos de intervalo que ocorre das 10h às 10h15min, mas está pressionando sua chefia, aduzindo que teria direito a 1 hora, no mínimo, razão pela qual pretende receber 1 hora como extraordinária, com repercussão nas demais parcelas salariais do contrato. A sociedade empresária consultou você, como advogado(a), para saber como agir. Sobre a hipótese apresentada, de acordo com a legislação trabalhista em vigor, assinale a afirmativa que, corretamente, apresenta a sua resposta.","alternativas":["Luana deverá receber o restante do período do intervalo para inteirar 1 hora de forma indenizatória.","Luana não tem direito ao pagamento do intervalo, considerando que a jornada não excede 6 horas e os 15 minutos são de intervalo.","Luana deverá receber o valor correspondente a uma hora integral, com os devidos reflexos nas parcelas salariais do contrato de trabalho.","Luana deverá receber a diferença de 45 minutos de forma indenizatória, com repercussão nas parcelas salariais do contrato de trabalho."],"gabarito":"B","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":21,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":75,"codigo":"OAB2025TIPO1-075","area":"Direito do Trabalho","dificuldade":"Médio","enunciado":"Reginaldo trabalha para a sociedade empresária Móveis Modulados Ltda. desde 2021 como montador, sendo considerado um empregado exemplar. Em agosto de 2024, Reginaldo compareceu ao trabalho com uma tornozeleira eletrônica, fato que se tornou o comentário geral na sociedade empresária, pois todos especulavam o que Reginaldo teria feito de errado. A sociedade empresária, que nunca havia se deparado com tal situação, o(a) consultou, como advogado(a), para obter um parecer sobre o que deverá ocorrer com o contrato de trabalho de Reginaldo. Você verifica pelo sistema processual que a tornozeleira foi colocada de modo cautelar, pois o processo de Reginaldo ainda está no início e refere-se a vias de fato que teve com um torcedor de time adversário quando estava em um estádio, no final de semana, assistindo a uma partida de futebol. Sobre o contrato de trabalho de Reginaldo, considerando os fatos e a legislação em vigor, assinale a opção correta.","alternativas":["Será interrompido, sendo garantido a Reginaldo 50% do seu salário.","Será suspenso, até que haja decisão final da justiça criminal.","Será rompido por justa causa, em razão do mau procedimento.","Não sofrerá qualquer consequência."],"gabarito":"D","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":21,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":76,"codigo":"OAB2025TIPO1-076","area":"Direito Processual do Trabalho","dificuldade":"Difícil","enunciado":"João Paulo trabalhou como vendedor em uma loja de calçados de 20/02/2022 a 30/01/2023, situada próxima de sua residência, no município de Duque de Caxias, RJ. Pela proximidade, menos de 50 m de distância, João Paulo ia a pé para o serviço e não optou por receber vale-transporte. Ocorre que, ao ser dispensado, ajuizou ação trabalhista reclamando a concessão do benefício, ação que seu advogado distribuiu para o Município do Rio de Janeiro, indo para a 100ª Vara do Trabalho (VT) do Rio de Janeiro, que designou uma audiência presencial. A loja está localizada em Duque de Caxias e você, advogado(a) da loja, tem seu escritório na mesma cidade. Sobre a competência territorial e a medida processual a ser adotada, assinale a afirmativa correta.","alternativas":["A ação poderá transcorrer no Rio de Janeiro, tendo sido essa a opção do empregado, pelo que se prorrogou a competência.","Deverá ser apresentada exceção de incompetência territorial em preliminar de contestação, podendo também ser suscitada oralmente no momento da audiência, antes da defesa.","Deverá ser apresentada petição de exceção de incompetência territorial até cinco dias após o recebimento da notificação citatória, em peça autônoma e antes da audiência.","Deverá ser apresentada exceção de incompetência territorial no ato da audiência em peça autônoma, mas junto com a apresentação da defesa, de modo a evitar eventual preclusão."],"gabarito":"C","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":21,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":77,"codigo":"OAB2025TIPO1-077","area":"Direito Processual do Trabalho","dificuldade":"Médio","enunciado":"Lorena trabalha como tosadora de animais em um pet-shop desde 2022, recebendo um salário mínimo nacional mensalmente. Ainda com o contrato de trabalho em vigor, Lorena pediu que você, como advogado(a), ajuizasse, em 2024, reclamação trabalhista postulando o pagamento de adicional noturno, pois ela trabalha até 22h30. Na petição inicial, você não requereu gratuidade de justiça, nem juntou declaração de miserabilidade ou necessidade jurídica. O pedido foi julgado totalmente improcedente, mas o Juiz concedeu, de ofício, a gratuidade de justiça. Considerando os fatos narrados, a previsão contida na CLT e o entendimento consolidado do TST, assinale a afirmativa correta.","alternativas":["A lei é omissa quanto aos critérios para deferir a gratuidade de justiça, podendo o Juiz concedê-la ou não.","O Juiz está correto, porque o nível salarial de Lorena autoriza a concessão da gratuidade de justiça de ofício.","A parte não requereu gratuidade de justiça, caracterizando, assim, julgamento extra petita, vedado na hipótese.","A gratuidade de justiça na Justiça do Trabalho é um pedido implícito, devendo ser automaticamente concedida a qualquer trabalhador."],"gabarito":"B","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":22,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":78,"codigo":"OAB2025TIPO1-078","area":"Direito Processual do Trabalho","dificuldade":"Difícil","enunciado":"Jean ajuizou reclamação trabalhista, em 2024, contra o seu ex- empregador, requerendo o pagamento do adicional de insalubridade. Após contestada, o Juiz determinou a realização de perícia a cargo de um engenheiro do trabalho. A ré apresentou seu protesto sob a alegação de que, para tal perícia, somente um médico do trabalho poderia realizá-la. Considerando os termos da CLT e da jurisprudência consolidada do TST, assinale a afirmativa correta.","alternativas":["A sociedade empresária está correta, porque a realização de perícia de insalubridade é ato privativo de médico do trabalho, conforme prevê a CLT.","A sociedade empresária está equivocada, porque a perícia pode ser realizada por médico do trabalho ou engenheiro do trabalho registrados no Ministério do Trabalho.","Sendo da confiança do Juiz, qualquer profissional poderá ser nomeado perito para a realização de perícia de insalubridade, cabendo à empresa antecipar os honorários.","A perícia para fins de insalubridade somente pode ser realizada por engenheiro do trabalho, desde que registrado no Ministério do Trabalho."],"gabarito":"B","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":22,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":79,"codigo":"OAB2025TIPO1-079","area":"Direito Processual do Trabalho","dificuldade":"Médio","enunciado":"Um sindicato de classe dos empregados ajuizou, perante o Tribunal Regional do Trabalho competente, dissídio coletivo de natureza econômica com alcance municipal. Após ser devidamente contestado, o processo foi extinto sem a resolução do mérito, não havendo margem para a oposição de embargos de declaração. Considerando esses fatos e que você é o(a) advogado(a) do sindicato autor, assinale a opção que indica o recurso cabível e o respectivo prazo.","alternativas":["Recurso ordinário, no prazo de 8 dias.","Recurso de revista, no prazo de 8 dias.","Agravo de petição, no prazo de 15 dias.","Recurso extraordinário, no prazo de 15 dias."],"gabarito":"A","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":22,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":80,"codigo":"OAB2025TIPO1-080","area":"Direito Processual do Trabalho","dificuldade":"Fácil","enunciado":"Você foi procurado(a) por um Sindicato de Empregados que deseja ajuizar uma ação em face de outro Sindicato de Empregados, com o objetivo de discutir a legitimidade para receber as contribuições sindicais oriundas de uma determinada sociedade empresária. Sobre a hipótese, assinale a afirmativa correta.","alternativas":["A ação deverá ser ajuizada na Justiça do Trabalho.","A ação deverá ser ajuizada na Justiça Comum Federal.","A ação deverá ser ajuizada na Justiça Comum Estadual.","Não caberá ajuizamento de ação judicial, mas apenas procedimento administrativo no Ministério do Trabalho e Emprego."],"gabarito":"A","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":22,"status":"pendente_revisao"}]
const oab46Dados=[{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":1,"codigo":"OAB2026TIPO1-001","area":"Ética Profissional / Estatuto da Advocacia e da OAB","dificuldade":"Fácil","enunciado":"Paloma, advogada gestante, compareceu ao Fórum da Comarca de Itaporanga, PB, para participar de uma audiência. Ao tentar estacionar no local, foi impedida de acessar a garagem sob a justificativa de que não havia vagas reservadas para gestantes. Além disso, foi obrigada a passar por um detector de metais, mesmo tendo informado de sua condição de gestante. Indignada, Paloma buscou esclarecer os seus direitos. Sobre a hipótese narrada, com base no Estatuto da OAB, assinale a afirmativa correta.","alternativas":["Paloma, por ser advogada gestante, tem o direito de não ser submetida a detectores de metais, mas o estacionamento exclusivo só é garantido em Tribunais e Fóruns Federais, não nos Fóruns Estaduais.","Os direitos de Paloma, como o de não ser submetida aos detectores de metais e à reserva de vagas, são aplicáveis apenas em Tribunais Superiores, e não se estendem a Fóruns de Comarcas Estaduais.","Paloma, por ser advogada gestante, tem o direito de entrar em Fóruns e Tribunais sem ser submetida a detectores de metais e tem direito à reserva de vagas nas garagens dos Fóruns dos Tribunais.","Paloma tem o direito de entrada no Fórum sem ser submetida a detectores de metais, mas o direito à reserva de vagas em garagens para gestantes é uma mera liberalidade do Tribunal e não é garantido por lei."],"gabarito":"C","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa C. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":3,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":2,"codigo":"OAB2026TIPO1-002","area":"Ética Profissional / Estatuto da Advocacia e da OAB","dificuldade":"Médio","enunciado":"Danilo, procurador de carreira, foi nomeado Procurador-Geral de sua instituição. Antes de assumir a Procuradoria-Geral do Estado, ele patrocinava várias causas trabalhistas contra empresas privadas e causas tributárias. Agora, Danilo está em dúvida se poderá continuar advogando nessas ações. Sobre a hipótese apresentada, com base nas disposições do Estatuto da OAB sobre incompatibilidades e impedimentos, assinale a afirmativa correta.","alternativas":["Danilo está impedido de atuar em causas trabalhistas e tributárias contra a Fazenda Pública que o remunera, mas pode continuar patrocinando as causas contra empresas privadas.","Danilo poderá continuar patrocinando suas causas trabalhistas e tributárias, pois o cargo de Procurador-Geral do Estado não gera incompatibilidade ou impedimento para advogar em questões privadas.","Danilo poderá continuar patrocinando as causas tributárias, mas não as trabalhistas, pois apenas as causas tributárias contra a Fazenda Pública estão abrangidas pelo impedimento previsto no Estatuto da OAB.","Danilo não poderá continuar patrocinando suas causas trabalhistas e tributárias, pois o cargo de Procurador-Geral do Estado obsta o exercício da advocacia desvinculado da função que exerce, durante o período da investidura."],"gabarito":"D","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa D. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":3,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":3,"codigo":"OAB2026TIPO1-003","area":"Ética Profissional / Estatuto da Advocacia e da OAB","dificuldade":"Médio","enunciado":"Alfredo é graduado em Direito pela Universidade Beta, mas não foi aprovado no Exame da Ordem dos Advogados do Brasil (OAB). Durante a graduação, Alfredo não teve a oportunidade de estagiar em um escritório de advocacia. Recentemente, após já estar formado, surgiu a oportunidade de estagiar em um escritório credenciado pelo Conselho Seccional da OAB. Ele deseja saber se pode participar do estágio profissional de advocacia mesmo após a conclusão de seu curso e se seria possível inscrever-se no quadro de estagiários da OAB. Sobre a hipótese, com base no disposto no Art. 9º do Estatuto da Advocacia e da OAB, assinale a afirmativa correta.","alternativas":["Alfredo não pode participar de estágio de advocacia, pois o estágio só é permitido para estudantes de Direito que ainda estejam cursando os últimos anos do curso jurídico.","Alfredo pode se inscrever no quadro de estagiários da OAB, mas somente se concluir o estágio profissional em uma instituição de ensino superior, e não em escritório credenciado pelo Conselho Seccional da OAB.","Alfredo pode participar do estágio profissional de advocacia e inscrever-se como estagiário da OAB, mesmo após a conclusão do curso, desde que o estágio seja realizado em escritório credenciado pela OAB.","Alfredo pode participar do estágio profissional, mas não poderá inscrever-se no quadro de estagiários da OAB, pois já concluiu a graduação em Direito e apenas alunos ainda cursando o ensino jurídico podem obter essa inscrição."],"gabarito":"C","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa C. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":3,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":4,"codigo":"OAB2026TIPO1-004","area":"Ética Profissional / Estatuto da Advocacia e da OAB","dificuldade":"Fácil","enunciado":"Os advogados Eduardo e Diogo são sócios de uma sociedade profissional de advogados, cujos atos constitutivos foram devidamente registrados e aprovados pelo Conselho Seccional da OAB na base territorial em que está localizada a sua sede. No entanto, Eduardo foi contratado por Afonso para representá-lo em uma ação de alimentos movida por sua esposa Dalila, e Diogo foi contratado por Dalila para representá-la na mesma ação. Os advogados desejam saber se podem continuar com essas representações, tendo em vista que são sócios da mesma sociedade de advogados. Sobre o caso narrado, com base no Art. 15 do Estatuto da Advocacia e da OAB, assinale a afirmativa correta.","alternativas":["Eduardo e Diogo não podem representar, em juízo, clientes com interesses opostos, por serem sócios da mesma sociedade de advogados.","Eduardo e Diogo podem representar Afonso e Dalila em juízo, desde que firmem compromisso por escrito de que não haverá conflito de interesse entre os dois advogados.","Eduardo e Diogo podem continuar com as respectivas representações de Afonso e Dalila, desde que informem previamente ao Juiz que ambos fazem parte da mesma sociedade.","Eduardo e Diogo podem continuar com as representações, desde que cada um atue de forma independente dentro da sociedade de advogados, contando com corpo auxiliar próprio."],"gabarito":"A","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa A. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":3,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":5,"codigo":"OAB2026TIPO1-005","area":"Ética Profissional / Estatuto da Advocacia e da OAB","dificuldade":"Médio","enunciado":"Mateus, advogado regularmente inscrito na OAB, contratou Marcos, profissional da área de vendas, para abordar pessoas nas imediações da agência do Instituto Nacional do Seguro Social da sua cidade, visando à captação de causas previdenciárias. Foi acertado que Marcos teria participação nos honorários advocatícios das causas que conseguisse agenciar. Constatados os fatos, e após o devido processo administrativo disciplinar, o Tribunal de Ética e Disciplina do Conselho Seccional competente aplicou a pena de censura a Mateus. Considerando o enunciado e o Estatuto da Advocacia e da OAB, assinale a afirmativa correta.","alternativas":["Havendo circunstâncias atenuantes, será possível substituir a sanção de censura pela aplicação isolada de multa.","Transitada em julgado a decisão, a sanção aplicada a Mateus deverá constar dos seus assentamentos, dando-se ampla publicidade nos meios oficiais.","A gravidade da conduta infracional de Mateus não permite a conversão da pena de censura em advertência, ainda que verificada a ausência de punição disciplinar anterior.","A circunstância de Mateus exercer de modo assíduo e proficiente mandato em cargo ou qualquer órgão da OAB, caso comprovada, deverá ser considerada pelo Tribunal na aplicação da sanção disciplinar."],"gabarito":"D","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa D. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":4,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":6,"codigo":"OAB2026TIPO1-006","area":"Ética Profissional / Estatuto da Advocacia e da OAB","dificuldade":"Difícil","enunciado":"Abelardo é contratado para representar o milionário Everardo em uma causa cível de importante vulto. Ficou combinado que, em caso de êxito, Abelardo fará jus a uma joia de elevadíssimo valor, a título de honorários. Sucede que, depois de ganhar a causa, Everardo sofreu revés na justiça criminal, quando uma decisão judicial determinou o bloqueio de todo o seu patrimônio pela suspeita de crimes financeiros. Nesse caso, à luz do Estatuto da Ordem dos Advogados do Brasil e do Código de Ética e Disciplina, assinale a afirmativa correta.","alternativas":["Abelardo poderá requerer ao Juiz Criminal o desbloqueio de até 20% dos bens de Everardo para o pagamento de seus honorários e dos demais custos com a defesa.","Abelardo poderá, diante do bloqueio, participar dos bens particulares de Everardo, de forma excepcional, considerada a impossibilidade de pagamento por outro meio, ainda que tal forma de pagamento não tenha sido pactuada.","A cláusula de honorários de êxito ou quota litis não é vedada, mas deve necessariamente ser expressa em pecúnia, de modo que, prevendo-se a entrega de uma joia, constata-se a nulidade que determina que Abelardo só fará jus aos honorários de sucumbência, se houver.","A cláusula de honorários de êxito ou quota litis é vedada, de sorte que será necessário proceder ao arbitramento dos honorários de Abelardo, em remuneração compatível com o trabalho e o valor econômico da questão, observado obrigatoriamente o disposto no Art. 85 do Código de Processo Civil."],"gabarito":"A","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa A. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":4,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":7,"codigo":"OAB2026TIPO1-007","area":"Ética Profissional / Estatuto da Advocacia e da OAB","dificuldade":"Fácil","enunciado":"Frederico, advogado, após alcançar grande sucesso na advocacia, decidiu se dedicar também à construção civil, passando a atuar simultaneamente nas duas áreas. Diante da afinidade temática entre o Direito Imobiliário e o setor de construção civil, Frederico teve a ideia de unir ambas as atividades em um único escritório, oferecendo aos clientes consultoria jurídica e serviços de incorporação imobiliária. Para divulgar o seu novo empreendimento, contratou um escritório de marketing, que produziu uma campanha publicitária conjunta, ressaltando seus trabalhos como advogado e como empreendedor da construção civil. Sobre o fato narrado, com base no Estatuto da OAB, assinale a afirmativa correta.","alternativas":["É possível a divulgação conjunta, desde que respeitados o decoro e a dignidade da advocacia, cabendo ao Tribunal de Ética e Disciplina da OAB avaliar a adequação da publicidade.","É permitida a divulgação conjunta apenas quando a outra atividade também for regulamentada por entidade de classe, hipótese em que a OAB poderá celebrar o convênio para a publicidade cruzada.","É vedada a divulgação conjunta de advocacia com outra atividade, ainda que exercida pela mesma pessoa e que haja afinidade entre os ramos, como ocorre entre a advocacia imobiliária e a construção civil.","Em regra, não é possível divulgar a advocacia em conjunto com outra atividade, mas nesse caso seria permitido, pois as atividades são exercidas por uma mesma pessoa e possuem afinidade temática, inexistindo conflito ético."],"gabarito":"C","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa C. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":4,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":8,"codigo":"OAB2026TIPO1-008","area":"Ética Profissional / Estatuto da Advocacia e da OAB","dificuldade":"Médio","enunciado":"O advogado Toledo atua na defesa de Tício, investigado por crimes de corrupção e lavagem de dinheiro. Durante as investigações, o próprio Toledo passou a ser investigado por suposta participação em atos ilícitos praticados por seu cliente. Em troca de benefícios penais, o Ministério Público ofereceu a possibilidade de firmar acordo de colaboração premiada ao advogado, desde que ele fornecesse informações sobre Tício e outros envolvidos. Com base no Estatuto da OAB, assinale a afirmativa correta.","alternativas":["O advogado pode colaborar contra seu cliente se a colaboração resultar apenas em redução de pena, sendo vedada a extinção total da punibilidade em razão de delação premiada.","O advogado não pode celebrar colaboração premiada contra o cliente atual, mas poderá fazê-lo em relação a um ex-cliente, desde que não mais exista vínculo profissional formal entre ambos.","O advogado poderá firmar colaboração premiada em face de seu cliente, desde que o acordo seja autorizado judicialmente, hipótese em que ficará isento de punição administrativa perante o Tribunal de Ética e Disciplina.","O advogado não pode efetuar colaboração premiada contra quem seja ou tenha sido seu cliente, e a inobservância dessa regra poderá acarretar processo disciplinar com aplicação de uma sanção de exclusão dos quadros da OAB, sem prejuízo da responsabilização penal."],"gabarito":"D","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa D. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":4,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":9,"codigo":"OAB2026TIPO1-009","area":"Filosofia do Direito","dificuldade":"Médio","enunciado":"Leia os fragmentos a seguir. Sócrates estava sentado à porta de sua casa. Nesse momento, passa um homem correndo e atrás dele vem um grupo de soldados. Um dos soldados então grita: agarre esse sujeito, ele é um ladrão! Ao que responde Sócrates: que você entende por ‘ladrão’? (...) Questões zetéticas têm uma função especulativa explícita e são infinitas. Questões dogmáticas têm uma função diretiva explícita e são finitas. Nas primeiras, o problema tematizado é configurado como um ser (que é algo?). Nas segundas, a situação nelas captada configura-se como um dever-ser (como deve-ser algo?). Por isso, o enfoque zetético visa saber o que é uma coisa. Já o enfoque dogmático preocupa-se em possibilitar uma decisão e orientar ação. (FERRAZ JUNIOR, Tercio Sampaio. Introdução ao Estudo do direito: técnica, decisão, dominação.) De acordo com a terminologia utilizada pelo Professor Tercio Sampaio Ferraz Junior, assinale a afirmativa correta.","alternativas":["O enfoque dado por Sócrates pode ser considerado dogmático, pois coloca em dúvida o próprio conceito de ladrão utilizado pelo soldado.","A acentuação da dúvida e do aspecto ontológico da conduta de Sócrates denotam uma característica típica das questões zetéticas.","A utilização dos conceitos de roubo e furto previstos no Código Penal para descaracterizar a imputação de um homem correndo como sendo um ladrão é tipicamente zetética.","O enfoque zetético deve ceder espaço para a função dogmática, pois o Direito no mundo atual exige decisões técnicas, tornando contraproducente especulações ontológicas."],"gabarito":"B","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa B. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":5,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":10,"codigo":"OAB2026TIPO1-010","area":"Introdução ao Estudo do Direito / Hermenêutica","dificuldade":"Fácil","enunciado":"Em decisão histórica, o Supremo Tribunal Federal (STF) aplicou a lei de greve do setor privado, Lei nº 7.783/1989, aos servidores públicos, pois, apesar de existir previsão constitucional expressa desse direito ao setor público, não havia lei que a regulamentasse, impedindo o seu exercício. Ao verificar a ausência da norma e das razões de semelhança para aplicar o normativo já existente, assinale a opção que melhor explica a técnica utilizada pelo STF para justificar o seu julgamento.","alternativas":["Costumes.","Equidade.","Analogia.","Princípios Gerais de Direito."],"gabarito":"C","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa C. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":5,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":11,"codigo":"OAB2026TIPO1-011","area":"Direito Constitucional","dificuldade":"Médio","enunciado":"Maria descobriu que seu nome constava, erroneamente, em registros públicos estaduais como devedora de impostos, mesmo sem nada dever ao Fisco. Muito correta, procurou imediatamente a Secretaria de Estado da Fazenda do Estado Alfa, solicitando que fosse corrigida a informação. Porém, apesar das reiteradas solicitações, o órgão não realizou a retificação. Em razão disso, seu amigo Pedro sugeriu a impetração de um habeas data, o que seria feito diretamente por Maria, sem a presença de um(a) advogado(a). Insegura, Maria procurou você, como advogado(a), para saber se este seria o caminho adequado para a retificação desejada. Segundo o sistema jurídico-constitucional brasileiro, assinale a opção que apresenta, corretamente, a orientação a ser dada.","alternativas":["A questão deve ser solucionada pela via do mandado de segurança, único remédio capaz de propiciar a retificação de dados, como no caso de Maria.","O objetivo almejado por Maria deve ser atingido pela via de processo judicial sigiloso, não sendo o remédio sugerido hábil para solucionar o problema ventilado.","Maria pode utilizar esse específico remédio constitucional, embora sua impetração vá depender da contratação de advogado(a), que possua capacidade postulatória.","O remédio constitucional em questão não é o instrumento adequado para o caso, pois é direcionado a situações em que se queira ter acesso a informações de sua própria pessoa."],"gabarito":"C","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa C. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":5,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":12,"codigo":"OAB2026TIPO1-012","area":"Direito Constitucional","dificuldade":"Médio","enunciado":"Carlos é prefeito do Município Beta, localizado no Estado Alfa. Ele tomou conhecimento da descoberta de uma nova reserva de petróleo em Alfa (reserva Mantuã), situada no território de Beta. Interessado em saber se os resultados da exploração de petróleo e gás natural poderiam gerar recursos para Beta, Carlos consultou você, como Procurador(a)-Geral do Município, para esclarecer sua dúvida. Sobre a hipótese narrada, segundo o sistema constitucional brasileiro, assinale a opção que apresenta, corretamente, o esclarecimento dado.","alternativas":["Somente Beta, região que efetivamente abriga a reserva Mantuã, poderá se beneficiar dos resultados econômicos diretos da exploração.","O Estado Alfa, o Município Beta e a União, nos termos da lei, serão beneficiados pelos resultados econômicos diretos obtidos da exploração.","Apenas a União, a quem pertencem os recursos minerais no país, inclusive os do subsolo, poderá se beneficiar dos resultados econômicos diretos da exploração.","Somente Alfa e Beta, os entes que suportarão diretamente os reveses que a exploração de petróleo ocasiona, poderão se beneficiar dos resultados econômicos diretos da exploração."],"gabarito":"B","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa B. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":5,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":13,"codigo":"OAB2026TIPO1-013","area":"Direito Constitucional","dificuldade":"Difícil","enunciado":"O Estado Delta publicou lei que criou novos critérios para a concessão de benefícios fiscais no âmbito estadual. Esse diploma normativo, no entanto, foi declarado inconstitucional pelo Supremo Tribunal Federal (STF), em sede de Ação Direta de Inconstitucionalidade (ADI). Apesar disso, meses depois, a Assembleia Legislativa de Delta aprovou a Lei X/2025 com conteúdo idêntico ao da lei anteriormente declarada inconstitucional. O Governador do Estado Delta, inconformado, solicitou que o Procurador-Geral do Estado analisasse a conformidade constitucional da Lei X/2025. Assinale a opção que, do ponto de vista jurídico-constitucional, apresenta a solução correta para o tema.","alternativas":["O Governador do Estado deve ingressar com uma reclamação perante o STF, pois a Lei X/2025 afrontou o efeito vinculante da decisão anterior.","O efeito vinculante da decisão anterior do STF não alcança a atividade legislativa típica, não havendo óbice a que seja proposta uma nova ADI tendo a Lei X/2025 como objeto.","A Lei X/2025 não pode ser objeto de nova ADI, pois o efeito vinculante da decisão do STF na ADI anterior impede que qualquer legitimado questione a norma de mesmo conteúdo.","Pode ser ajuizada uma nova ADI, tendo a Lei X/2025 como objeto, porque o Poder Legislativo está vinculado à decisão anterior do STF, mesmo em relação à sua função típica de legislar."],"gabarito":"B","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa B. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":6,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":14,"codigo":"OAB2026TIPO1-014","area":"Direito Constitucional","dificuldade":"Médio","enunciado":"A Câmara Municipal de Alfa constatou que o Prefeito Municipal não prestou as contas anuais de governo, afetas à administração municipal, dentro do prazo estabelecido na legislação, o que se estendeu por três exercícios. Após reiteradas notificações, a omissão permaneceu, impedindo a fiscalização do uso dos recursos públicos. Diante dessa situação, o Governador do Estado Beta decidiu decretar intervenção estadual no Município para garantir a prestação de contas. No entanto, a medida gerou debate entre os agentes políticos locais, que questionaram a sua legalidade e consultaram você, como advogado(a), a esse respeito. Sobre a hipótese narrada, considerando a ordem constitucional vigente, assinale a opção que apresenta, corretamente, a orientação jurídica prestada.","alternativas":["A Câmara Municipal de Alfa, ao constatar a omissão na prestação de contas, deve requerer diretamente ao Supremo Tribunal Federal que determine a intervenção estadual.","A intervenção estadual, no caso, somente poderia ser decretada se houvesse uma determinação judicial reconhecendo a omissão como grave o suficiente para justificar a medida extrema.","A intervenção estadual depende de autorização prévia do Poder Legislativo estadual, pois qualquer limitação à autonomia municipal exige controle político pelos representantes do povo.","O Governador pode decretar a intervenção sem a necessidade de autorização legislativa ou judicial prévia, pois a situação apresentada no problema constitui hipótese expressa de intervenção estadual."],"gabarito":"D","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa D. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":6,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":15,"codigo":"OAB2026TIPO1-015","area":"Direito Constitucional","dificuldade":"Médio","enunciado":"O Tribunal de Contas do Estado Ômega, ao analisar as contas de um gestor público, constatou a existência de irregularidades graves na aplicação de verbas destinadas à educação, gerando prejuízo ao erário. Após garantir o contraditório e a ampla defesa, o Tribunal proferiu decisão definitiva determinando o ressarcimento dos valores desviados. No entanto, o gestor público entendia que não deveria cumprir a decisão, pois, a seu ver, seria necessário o ajuizamento de uma ação judicial para validar a obrigação de pagamento. Por essa razão, consultou você, como advogado(a). Sobre a hipótese, com base no sistema constitucional brasileiro, assinale a afirmativa que apresenta a orientação jurídica correta.","alternativas":["A obrigação de ressarcimento ao erário dependeria da confirmação por parte da Assembleia Legislativa de Ômega, pois os Tribunais de Contas são órgãos subordinados ao Poder Legislativo.","A decisão do Tribunal de Contas não pode ser executada diretamente pela Fazenda Pública, pois, para que haja exigibilidade do crédito, é imprescindível o ajuizamento de ação judicial declaratória.","A decisão do Tribunal de Contas tem eficácia de título executivo extrajudicial, sem necessidade de homologação pelo Poder Judiciário, e pode ser cobrada pela Fazenda Pública por meio de execução fiscal.","A obrigação de ressarcimento ao erário somente pode ser imposta por decisão do Poder Judiciário, pois os Tribunais de Contas não possuem competência para reconhecer a responsabilidade financeira de gestores públicos."],"gabarito":"C","comentario":"Gabarito oficial preliminar FGV/OAB: alternativa C. Comentário jurídico detalhado e explicação individualizada das alternativas ainda pendentes de validação manual; não foram inseridos artigos, leis ou súmulas para evitar fundamento legal impreciso.","fundamento_legal":[],"fonte":"FGV/OAB 2026 Tipo 1","pagina_pdf":6,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2026 Tipo 1","ano":"2026","numero":16,"codigo":"OAB2026TIPO1-016","area":"Direito Constitucional","dificuldade":"Médio","enunciado":"Ao final de seu segundo mandato consecutivo, o Prefeito do Município Delta, João Carlos, encaminhou à Câmara de Vereadores um projeto de lei de sua própria iniciativa, propondo a majoração dos subsídios dos próximos Prefeito e Vice-Prefeito para a legislatura seguinte. O projeto foi devidamente aprovado pela maioria dos vereadores de Delta e sancionado por João Carlos, antes do término de seu mandato. Um legitimado à deflagração do controle concentrado de constitucionalidade consultou você, como advogado(a), em relação à compatibilidade do respectivo diploma normativo com a Constituição da República. Sobre o caso concreto apresentado, assinale a afirmativa correta.","alternativas":["A lei municipal aprovada atende aos pressupostos constitucionais da ordem jurídica brasileira, que exige a forma de lei municipal para a fixação do subsídio do Prefeito.","A lei municipal aprovada atende aos pressupostos da ordem jurídica brasileira, desde que as regras estabelecidas para o tema observem o que dispõe a Lei Orgânica do Município.","Não sendo João Carlos beneficiário da majoração dos subsídios, o processo legislativo aprovado pela Câmara Municipal de Delta converge com o que determina o sistema jurídico brasileiro.","A lei aprovada pela Câmara Municipal de Delta não a
