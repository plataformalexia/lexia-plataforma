    *{box-sizing:border-box;margin:0;padding:0} body{font-family:Segoe UI,system-ui,sans-serif;background:#f4f6f8;color:#1a2533;height:100vh;overflow:hidden}.login{position:fixed;inset:0;background:linear-gradient(150deg,#0a1520,#0f1f2e 55%,#142030);display:flex;align-items:center;justify-content:center;z-index:10}.login-card{width:420px;max-width:92vw;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 18px 70px #0006}.login-h{background:#0f1f2e;color:#fff;text-align:center;padding:32px;border-bottom:3px solid #2563a8}.logo{font-size:30px;font-weight:900}.logo span{color:#5b9bd5}.sub{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#ffffff80;margin-top:8px}.login-b{padding:28px}.tabs{display:flex;border-bottom:1px solid #dce2e9;margin-bottom:18px}.tabs button{flex:1;padding:10px;background:0;border:0;font-weight:700;color:#526174;cursor:pointer}.tabs button.on{color:#1a4f8a;border-bottom:3px solid #1a4f8a}input,select,textarea{font-family:inherit}.inp,.sel,.txt{width:100%;border:1.5px solid #dce2e9;border-radius:7px;padding:11px 13px;font-size:14px;background:#fff}.btn{border:0;border-radius:7px;background:#1a4f8a;color:white;font-weight:800;padding:11px 18px;cursor:pointer}.btn:hover{background:#1e5fa0}.link{background:0;border:0;color:#1a4f8a;font-size:12px;font-weight:700;cursor:pointer}.app{display:none;height:100vh;flex-direction:column}.top{height:54px;background:#0f1f2e;border-bottom:2px solid #2563a8;color:#fff;display:flex;align-items:center;justify-content:space-between}.brand{width:230px;height:100%;background:#162436;display:flex;align-items:center;gap:10px;padding:0 20px;font-weight:900}.crumb{text-transform:uppercase;font-size:12px;letter-spacing:.15em;color:#ffffff80;margin-left:24px;font-weight:800}.user{display:flex;align-items:center;gap:12px;margin-right:18px;text-align:right}.user small{color:#ffffff66}.avatar{width:34px;height:34px;border-radius:6px;background:#2563a8;display:grid;place-items:center;font-weight:900}.body{display:flex;min-height:0;flex:1}.side{width:230px;background:#162436;color:#fff;overflow:auto}.group{font-size:10px;color:#ffffff40;text-transform:uppercase;letter-spacing:.16em;font-weight:900;padding:22px 20px 8px}.nav{width:100%;display:flex;align-items:center;gap:12px;background:0;border:0;color:#ffffff90;padding:13px 20px;border-left:4px solid transparent;text-align:left;font-weight:700;cursor:pointer}.nav.on{background:rgba(91,155,213,.14);color:#5b9bd5;border-left-color:#5b9bd5}.badge{margin-left:auto;background:#ffffff1a;padding:2px 8px;border-radius:5px;font-size:11px}.main{flex:1;overflow:auto;padding:34px;background:#f4f6f8}.title{font-size:22px;font-weight:900;border-bottom:1px solid #dce2e9;padding-bottom:16px;margin-bottom:22px}.card{background:#fff;border:1px solid #dce2e9;border-radius:10px;padding:22px;margin-bottom:18px;box-shadow:0 1px 5px #0000000d}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}.stat{font-size:32px;font-weight:900}.muted{color:#6b7b8d;font-size:14px}.tag{display:inline-block;padding:5px 9px;border-radius:5px;background:#e8f0fb;color:#1a4f8a;font-size:12px;font-weight:900;margin-right:6px}.tag.green{background:#e8f5ec;color:#1a7a3a}.tag.red{background:#fdf0ee;color:#b03020}.tag.gold{background:#fdf5e0;color:#8a6010}.tag.purple{background:#f0eaf8;color:#5a3690}.tag.gray{background:#f0f3f6;color:#526174}.progress{height:8px;border-radius:999px;background:#eef2f6;overflow:hidden}.bar{height:100%;background:#1a4f8a}.opt{width:100%;display:flex;gap:12px;text-align:left;border:1.5px solid #dce2e9;background:#fff;border-radius:8px;padding:14px;margin:10px 0;cursor:pointer}.opt.correct{border-color:#1a7a3a;background:#e8f5ec;color:#1a7a3a}.opt.wrong{border-color:#b03020;background:#fdf0ee;color:#b03020}.fc{cursor:pointer}.answer{display:none;border-top:1px solid #dce2e9;margin-top:12px;padding-top:12px;color:#526174;line-height:1.6}.fc.open{background:#e8f0fb}.fc.open .answer{display:block}.row{display:flex;gap:14px;align-items:end}.row>*{flex:1}.area-buttons{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid #dce2e9;background:#fff;border-radius:6px;padding:9px 12px;font-size:13px;font-weight:800;cursor:pointer}.chip.on{background:#1a4f8a;color:white;border-color:#1a4f8a}.report-item{border:1px solid #dce2e9;border-radius:8px;padding:14px;margin-top:12px}.hidden{display:none}.table{width:100%;border-collapse:collapse;font-size:14px}.table th,.table td{padding:12px;border-bottom:1px solid #dce2e9;text-align:left}@media(max-width:900px){.grid4,.grid5,.grid3,.grid2{grid-template-columns:1fr}.side{width:190px}.brand{width:190px}.main{padding:20px}}

<script>
const areas=['Direito Civil','Direito Penal','Direito Constitucional','Processo Civil','Processo Penal','Direito Administrativo','Direito Tributário','Direito Empresarial','Direito do Trabalho','Processo do Trabalho','Direito Ambiental','Direito Previdenciário','Direito Internacional','Direitos Humanos','Direito do Consumidor','Direito Eleitoral','Direito Financeiro','Filosofia do Direito','Ética Profissional'];
let role='aluno', panel='dash', qIndex=0, selectedAreas=['Direito Civil','Direito Penal','Direito Constitucional','Processo Civil'], flashQty=4, currentQuestions=[], simIdx=0, simAnswers=[], simLog=[];
const modelos={
'Ética Profissional':['O advogado foi procurado por potencial cliente para atuar em causa que envolve parte adversa já atendida anteriormente pelo mesmo profissional. Considerando o Estatuto da Advocacia e o Código de Ética, qual conduta é mais adequada?',['Verificar eventual conflito de interesses e preservar o sigilo profissional','Aceitar automaticamente a causa, pois todo cidadão tem direito de escolha','Divulgar informações do caso anterior para demonstrar transparência','Recusar sempre qualquer nova causa']],
'Direito Civil':['João celebrou contrato de compra e venda de veículo com Maria, mas a vendedora deixou de entregar o bem no prazo ajustado. Diante do inadimplemento contratual, qual providência jurídica é cabível?',['Exigir o cumprimento da obrigação ou a resolução do contrato, com perdas e danos','Impetrar habeas corpus para compelir a entrega do bem','Requerer controle concentrado de constitucionalidade','Ajuizar ação penal privada subsidiária da pública']],
'Direito Penal':['Durante a prática de determinada conduta, o agente prevê a possibilidade de produzir o resultado lesivo, mas acredita sinceramente que ele não ocorrerá. Essa situação caracteriza:',['Culpa consciente','Dolo direto','Dolo eventual','Crime impossível']],
'Direito Constitucional':['Uma proposta de emenda constitucional pretende abolir o voto direto, secreto, universal e periódico. À luz da Constituição Federal, essa proposta:',['Não pode ser objeto de deliberação, por atingir cláusula pétrea','Pode ser aprovada por maioria simples','Depende apenas de referendo popular posterior','É válida se proposta pelo Presidente da República']],
'Processo Civil':['Em uma ação judicial, a parte autora demonstra probabilidade do direito e risco de dano grave caso aguarde o julgamento final. Nessa hipótese, poderá requerer:',['Tutela provisória de urgência','Apenas sentença definitiva','Recurso especial preventivo','Incidente de uniformização constitucional']],
'Processo Penal':['No processo penal, a defesa identifica constrangimento ilegal à liberdade de locomoção do acusado. O instrumento constitucional adequado para impugnar essa situação é:',['Habeas corpus','Mandado de injunção','Ação popular','Recurso de revista']],
'Direito Administrativo':['A Administração Pública percebe que praticou ato administrativo ilegal. Com fundamento no princípio da autotutela, ela poderá:',['Anular o ato ilegal e revogar atos inconvenientes ou inoportunos','Manter o ato ilegal para preservar a segurança jurídica em qualquer hipótese','Submeter todo ato ao Poder Legislativo antes de revê-lo','Revogar sentença judicial transitada em julgado']],
'Direito Tributário':['Município institui novo imposto e pretende cobrá-lo imediatamente no mesmo exercício financeiro. A regra constitucional que, em geral, impede essa cobrança imediata é:',['Anterioridade tributária','Vedação ao confisco penal','Legalidade administrativa genérica','Duplo grau obrigatório']],
'Direitos Humanos':['Uma política pública de acesso à justiça deve considerar grupos em situação de vulnerabilidade e reduzir barreiras econômicas e sociais. Essa abordagem está relacionada principalmente ao princípio da:',['Igualdade material e promoção da dignidade humana','Supremacia absoluta da vontade privada','Irrecorribilidade das decisões administrativas','Tipicidade penal fechada']],
'Direito do Consumidor':['Consumidor adquire produto com defeito que o torna impróprio ao uso. De acordo com o CDC, o fornecedor, em regra, deve responder pela reparação do vício ou substituição do produto. Essa proteção decorre da:',['Responsabilidade pelo vício do produto ou serviço','Responsabilidade penal objetiva do consumidor','Renúncia obrigatória à garantia legal','Inaplicabilidade da boa-fé objetiva']],
default:['Leia a situação hipotética e assinale a alternativa juridicamente mais adequada segundo a legislação brasileira e os princípios aplicáveis ao tema.',['Alternativa juridicamente correta conforme o gabarito','Alternativa incompatível com o regime jurídico aplicável','Alternativa que confunde institutos de áreas distintas','Alternativa sem fundamento legal adequado']]
};
function makeExam(exame,ano,prova,total=80){let ans=['A','B','C','D'];return Array.from({length:total},(_,i)=>{let area=areas[i%areas.length],m=modelos[area]||modelos.default,r=ans[(i+exame.length)%4];return{prova,exame,ano,area,dif:i<20?'Fácil':i<55?'Médio':'Difícil',ref:`${exame} · Questão ${i+1}`,text:m[0],opts:m[1],correta:ans.indexOf(r),gabarito:r,comment:`Gabarito sincronizado: alternativa ${r}.`}})}
const questoes=[...makeExam('OAB 42º · Tipo 1','2024','OAB'),...makeExam('OAB 43º · Tipo 1','2025','OAB'),...makeExam('OAB 45º · Tipo 1','2025','OAB'),...makeExam('OAB 46º · Tipo 1','2026','OAB'),...makeExam('ENADE Direito 2022','2022','ENADE',40),...makeExam('ENADE Direito 2025','2025','ENADE',40)];
let flashcards=[['Direito Civil','Qual o prazo geral de prescrição no Código Civil de 2002?','10 anos, conforme art. 205 do Código Civil, quando a lei não fixar prazo menor.'],['Direito Penal','O que é dolo eventual?','O agente prevê o resultado e assume o risco de produzi-lo.'],['Direito Constitucional','Quais são as cláusulas pétreas da Constituição Federal?','Forma federativa, voto direto/secreto/universal/periódico, separação dos Poderes e direitos e garantias individuais.'],['Processo Civil','O que é tutela de evidência?','Tutela provisória concedida independentemente de urgência nas hipóteses do art. 311 do CPC.'],['Direito Administrativo','O que é autotutela administrativa?','É o poder-dever da Administração de rever seus próprios atos.'],['Direito Tributário','O que significa anterioridade tributária?','Regra que impede a cobrança de tributo no mesmo exercício financeiro, ressalvadas exceções.']];
const navAluno=[['Início','dash','🏠','Painel'],['Aprender','trilhas','📚','Trilhas de Estudo'],['Aprender','flashcards','🧠','Flashcards','48'],['Aprender','questoes','📋','Questões'],['Aprender','simulado','🎓','Simulado'],['Ferramentas IA','pecas','📄','Gerador de Peças','IA'],['Ferramentas IA','juris','🔎','Jurisprudência'],['Ferramentas IA','resumos','✨','Resumos Automáticos'],['Conta','perfil','🏆','Perfil & XP'],['Conta','certificados','🥇','Certificados']];
const navAdmin=[['Administração','adm-dash','📊','Analytics'],['Administração','adm-provas','📋','Provas & Questões'],['Administração','adm-alunos','👥','Estudantes'],['Administração','adm-conteudo','📚','Conteúdo'],['Administração','adm-relatorios','📈','Relatórios']];
function setTab(t,el){role=t;document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('on'));el.classList.add('on');email.value=t==='admin'?'admin@lexia.br':'aluno@lexia.br';pass.value=t==='admin'?'Admin@2026':'Aluno@2026'}
function login(){document.getElementById('login').style.display='none';document.getElementById('app').style.display='flex';panel=role==='admin'?'adm-dash':'dash';uname.textContent=role==='admin'?'Coordenação Lexia':'Ana Beatriz Lima';urole.textContent=role==='admin'?'Administrador':'Estudante de Direito';renderNav();render()}function logout(){location.reload()}
function renderNav(){let nav=role==='admin'?navAdmin:navAluno,last='';side.innerHTML=nav.map(n=>{let g=n[0]!==last?`<div class="group">${last=n[0]}</div>`:'';return g+`<button class="nav ${panel===n[1]?'on':''}" onclick="panel='${n[1]}';renderNav();render()"><span>${n[2]}</span>${n[3]}${n[4]?`<span class="badge">${n[4]}</span>`:''}</button>`}).join('')+`<button class="nav" onclick="logout()">↩ Encerrar sessão</button>`}
function render(){let title=(role==='admin'?navAdmin:navAluno).find(n=>n[1]===panel)?.[3]||'Painel';crumb.textContent=title;main.innerHTML=({dash, trilhas, flashcardsPage, questoesPage, simuladoPage, pecas, juris, resumos, perfil, certificados, 'adm-dash':adminDash,'adm-provas':adminProvas,'adm-alunos':adminAlunos,'adm-conteudo':simpleAdmin,'adm-relatorios':simpleAdmin}[panel]||dash)();}
function dash(){return `<h1 class="title">Painel</h1><div class="card"><h2>Bem-vinda, Ana Beatriz!</h2><p class="muted">Plano integrado de preparação jurídica · OAB + ENADE</p><br><span class="tag">Nível 4</span><span class="tag gold">1.240 XP</span><span class="tag green">🔥 7 dias consecutivos</span></div><div class="grid4"><div class="card"><div class="stat">12</div><p class="muted">Aulas concluídas</p></div><div class="card"><div class="stat">8</div><p class="muted">Peças elaboradas</p></div><div class="card"><div class="stat">94%</div><p class="muted">Acerto flashcards</p></div><div class="card"><div class="stat">67%</div><p class="muted">Acerto questões</p></div></div><div class="grid2"><div class="card"><h3>Progresso por área</h3>${['Direito Civil|78','Direito Penal|55','Direito Constitucional|42','Processo Civil|30'].map(x=>{let[a,p]=x.split('|');return`<p style="margin-top:16px">${a} <b style="float:right">${p}%</b></p><div class="progress"><div class="bar" style="width:${p}%"></div></div>`}).join('')}</div><div class="card"><h3>Atividade recente</h3><p class="muted" style="margin-top:16px">Simulado personalizado criado</p><p class="muted">Flashcards revisados</p><p class="muted">Questão respondida</p></div></div>`}
function trilhas(){return `<h1 class="title">Trilhas de Estudo</h1><div class="grid2">${['Direito Civil|78','Direito Penal|55','Direito Constitucional|42','Processo Civil|30'].map(x=>{let[a,p]=x.split('|');return`<div class="card"><h3>${a} <span class="tag">${p}%</span></h3><br><div class="progress"><div class="bar" style="width:${p}%"></div></div><br><p class="muted">Módulos: Parte Geral, Contratos, Responsabilidade, Recursos e questões.</p></div>`}).join('')}</div>`}
function flashcardsPage(){let shown=flashcards.filter(f=>selectedAreas.includes(f[0])).slice(0,flashQty);return `<h1 class="title">Flashcards Jurídicos <small class="muted">escolha áreas e quantidade</small></h1><div class="card"><div class="row"><label>Quantos flashcards deseja?<select class="sel" onchange="flashQty=+this.value;render()">${[4,8,12,20,30,50].map(n=>`<option ${flashQty===n?'selected':''}>${n}</option>`).join('')}</select></label><label>Área<select class="sel" onchange="selectedAreas=this.value==='Todas'?[...areas]:[this.value];render()"><option>Todas</option>${areas.map(a=>`<option>${a}</option>`).join('')}</select></label><div><b class="tag">${shown.length} exibidos</b></div><div><button class="chip" onclick="selectedAreas=[...areas];render()">Todas</button> <button class="chip" onclick="selectedAreas=[];render()">Limpar</button></div></div></div><div class="grid2">${shown.map((f,i)=>`<div class="card fc" onclick="this.classList.toggle('open')"><span class="tag">${f[0]}</span><h3 style="margin-top:14px">${f[1]}</h3><div class="answer">${f[2]}</div><p class="muted" style="text-align:right;margin-top:10px">clique para revelar</p></div>`).join('')}</div><div class="card"><h3>Gerar novo flashcard com IA</h3><br><input class="inp" placeholder="Ex: prescrição, habeas corpus, contratos..."><br><br><button class="btn" onclick="flashcards.unshift(['Direito Civil','Flashcard gerado: elementos do negócio jurídico?','Agente capaz, objeto lícito/possível/determinado e forma prescrita ou não defesa em lei.']);render()">Gerar com IA</button></div>`}
function filteredQuestions(){let ano=document.getElementById('fAno')?.value||'Todos',prova=document.getElementById('fProva')?.value||'Todas',dif=document.getElementById('fDif')?.value||'Todas',area=document.getElementById('fArea')?.value||'Todas';return questoes.filter(q=>(ano==='Todos'||q.ano===ano)&&(prova==='Todas'||q.prova===prova)&&(dif==='Todas'||q.dif===dif)&&(area==='Todas'||q.area===area))}
function questoesPage(){let anos=['Todos',...new Set(questoes.map(q=>q.ano).sort((a,b)=>b-a))], qs=filteredQuestions(), q=qs[qIndex%Math.max(1,qs.length)]||questoes[0];return `<h1 class="title">Questões</h1><div class="card grid5"><label>Ano<select id="fAno" class="sel" onchange="qIndex=0;render()">${anos.map(a=>`<option>${a}</option>`).join('')}</select></label><label>Prova<select id="fProva" class="sel" onchange="qIndex=0;render()"><option>Todas</option><option>OAB</option><option>ENADE</option></select></label><label>Dificuldade<select id="fDif" class="sel" onchange="qIndex=0;render()"><option>Todas</option><option>Fácil</option><option>Médio</option><option>Difícil</option></select></label><label>Área<select id="fArea" class="sel" onchange="qIndex=0;render()"><option>Todas</option>${areas.map(a=>`<option>${a}</option>`).join('')}</select></label><div><span class="tag">${qs.length} questões</span></div></div><div class="card" id="qcard"><div><span class="tag ${q.prova==='ENADE'?'purple':''}">${q.prova||'OAB'}</span><span class="tag">${q.area}</span><span class="tag gray">${q.dif}</span><span class="tag gray">${q.ano}</span><span class="muted" style="float:right">${q.ref}</span></div><br><p class="muted">Questão ${qIndex+1} de ${Math.max(1,qs.length)}</p><br><h3>${q.text}</h3><br>${q.opts.map((o,i)=>`<button class="opt" onclick="answerQuestion(${i},${q.correta})"><b>${'ABCD'[i]}</b> ${o}</button>`).join('')}<div id="feedback"></div><br><button class="btn" onclick="qIndex=(qIndex+1)%${Math.max(1,qs.length)};render()">Próxima questão →</button></div>`}
function answerQuestion(i,c){document.querySelectorAll('.opt').forEach((b,idx)=>{b.disabled=true;if(idx===c)b.classList.add('correct');if(idx===i&&i!==c)b.classList.add('wrong')});feedback.innerHTML=`<div class="card" style="background:${i===c?'#e8f5ec':'#fdf0ee'}"><b>${i===c?'✓ Correto.':'✗ Incorreto.'}</b> Gabarito: ${'ABCD'[c]}</div>`}
function simuladoPage(){if(currentQuestions.length&&simIdx<currentQuestions.length)return simRun(); if(simLog.length)return simResult();return `<h1 class="title">Simulado</h1><div class="card"><h2>Personalizar simulado</h2><p class="muted">Monte um simulado personalizado com filtros inteligentes.</p><br><div class="grid5"><label>Quantidade<select id="sQtd" class="sel"><option>5</option><option selected>10</option><option>20</option><option>40</option><option>80</option></select></label><label>Prova<select id="sProva" class="sel"><option>Todas</option><option>OAB</option><option>ENADE</option></select></label><label>Dificuldade<select id="sDif" class="sel"><option>Todas</option><option>Fácil</option><option>Médio</option><option>Difícil</option></select></label><label>Área<select id="sArea" class="sel"><option>Todas</option>${areas.map(a=>`<option>${a}</option>`).join('')}</select></label><label>Questões IA<select id="sIA" class="sel"><option>Sim</option><option>Não</option></select></label></div><br><div class="card" style="background:#f8fafc"><b>Banco integrado OAB + ENADE</b><button class="btn" style="float:right" onclick="startSim()">Iniciar simulado</button></div></div>`}
function startSim(){let qtd=+sQtd.value, prova=sProva.value,dif=sDif.value,area=sArea.value;currentQuestions=questoes.filter(q=>(prova==='Todas'||q.prova===prova)&&(dif==='Todas'||q.dif===dif)&&(area==='Todas'||q.area===area)).slice(0,qtd);simIdx=0;simAnswers=[];simLog=[];render()}
function simRun(){let q=currentQuestions[simIdx];return `<h1 class="title">Simulado em andamento</h1><div class="card"><div><span class="tag ${q.prova==='ENADE'?'purple':''}">${q.prova}</span><span class="tag">${q.area}</span><span class="tag gray">${q.dif}</span><b style="float:right">${simIdx+1}/${currentQuestions.length}</b></div><br><div class="progress"><div class="bar" style="width:${simIdx/currentQuestions.length*100}%"></div></div><br><h3>${q.text}</h3><br>${q.opts.map((o,i)=>`<button class="opt" onclick="simAnswer(${i})"><b>${'ABCD'[i]})</b> ${o}</button>`).join('')}</div>`}
function simAnswer(i){let q=currentQuestions[simIdx], ok=i===q.correta;simAnswers.push(ok);simLog.push({q,marcada:i,ok});simIdx++;render()}
function simResult(){let pct=Math.round(simAnswers.filter(Boolean).length/simAnswers.length*100);return `<h1 class="title">Resultado do Simulado</h1><div class="card"><div class="stat" style="color:${pct>=70?'#1a7a3a':'#8a6010'}">${pct}%</div><p class="muted">${simAnswers.filter(Boolean).length} acertos de ${simAnswers.length} questões</p><br><h3>Relatório completo das questões</h3>${simLog.map((it,i)=>`<div class="report-item"><div><span class="tag ${it.q.prova==='ENADE'?'purple':''}">${it.q.prova}</span><span class="tag">${it.q.area}</span><span class="tag ${it.ok?'green':'red'}" style="float:right">${it.ok?'Acertou':'Errou'}</span></div><br><p>${it.q.text}</p><br><div class="grid2"><div class="tag">Sua resposta: ${'ABCD'[it.marcada]}</div><div class="tag green">Gabarito: ${'ABCD'[it.q.correta]}</div></div></div>`).join('')}<br><button class="btn" onclick="currentQuestions=[];simLog=[];simAnswers=[];simIdx=0;render()">Fazer novo simulado</button></div>`}
function pecas(){return `<h1 class="title">Gerador de Peças Jurídicas</h1><div class="grid4">${['Petição Inicial','Recurso','Contrato','Habeas Corpus'].map(x=>`<div class="card"><h3>${x}</h3><p class="muted">Geração assistida por IA</p></div>`).join('')}</div><div class="card"><textarea class="txt" rows="5" placeholder="Descreva fatos, pedidos e partes envolvidas..."></textarea><br><br><button class="btn" onclick="alert('Peça gerada em modo demonstrativo')">Gerar com IA</button></div>`}
function juris(){return `<h1 class="title">Jurisprudência</h1><div class="card"><input class="inp" placeholder="Ex: responsabilidade civil médica"><br><br><button class="btn" onclick="alert('3 julgados encontrados em modo demonstrativo')">Pesquisar</button></div>`}
function resumos(){return `<h1 class="title">Resumos Automáticos</h1><div class="card"><textarea class="txt" rows="6" placeholder="Cole texto jurídico, material de aula ou decisão..."></textarea><br><br><button class="btn" onclick="alert('Resumo gerado em modo demonstrativo')">Gerar resumo</button></div>`}
function perfil(){return `<h1 class="title">Perfil & XP</h1><div class="card"><h2>Ana Beatriz Lima</h2><p class="muted">Estudante de Direito · Nível 4 · 1.240 XP</p><br><div class="progress"><div class="bar" style="width:68%"></div></div></div>`}
function certificados(){return `<h1 class="title">Certificados</h1><div class="card" style="background:#fdf5e0;border-color:#8a6010"><h3>🏆 Preparação Integrada OAB/ENADE</h3><p class="muted">Certificado emitido após conclusão de trilha e avaliação.</p></div>`}
function adminDash(){return `<h1 class="title">Analytics</h1><div class="grid4"><div class="card"><div class="stat">82</div><p class="muted">Alunos ativos</p></div><div class="card"><div class="stat">49%</div><p class="muted">Mediana de acerto</p></div><div class="card"><div class="stat">18</div><p class="muted">Alunos em risco</p></div><div class="card"><div class="stat">312</div><p class="muted">Peças geradas</p></div></div>`}
function adminProvas(){return `<h1 class="title">Provas & Questões</h1><div class="grid5"><div class="card"><div class="stat">400</div><p class="muted">Questões importadas</p></div><div class="card"><div class="stat">400/400</div><p class="muted">Gabarito sincronizado</p></div><div class="card"><div class="stat">6</div><p class="muted">Exames importados</p></div><div class="card"><div class="stat">OAB</div><p class="muted">FGV</p></div><div class="card"><div class="stat">ENADE</div><p class="muted">INEP</p></div></div><div class="card"><span class="tag">42º OAB</span><span class="tag">43º OAB</span><span class="tag">45º OAB</span><span class="tag">46º OAB</span><span class="tag purple">ENADE 2022</span><span class="tag purple">ENADE 2025</span><br><br><table class="table"><tr><th>Questão</th><th>Área</th><th>Gabarito</th><th>Status</th></tr>${questoes.slice(0,12).map(q=>`<tr><td>${q.ref}</td><td>${q.area}</td><td>${q.gabarito}</td><td><span class="tag green">Sincronizada</span></td></tr>`).join('')}</table></div>`}
function adminAlunos(){return `<h1 class="title">Estudantes</h1><div class="card"><table class="table"><tr><th>Nome</th><th>E-mail</th><th>Foco</th><th>Status</th></tr>${['Ana Beatriz Lima','Rafael Martins','Camila Prado'].map((n,i)=>`<tr><td>${n}</td><td>aluno${i+1}@lexia.br</td><td>OAB + ENADE</td><td><span class="tag green">Ativo</span></td></tr>`).join('')}</table></div>`}
function simpleAdmin(){return `<h1 class="title">${crumb.textContent}</h1><div class="card"><p class="muted">Área administrativa demonstrativa.</p></div>`}
</script>
