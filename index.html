function questoesPage(){const anos=['Todos',...Array.from(new Set(questoes.map(q=>q.ano))).sort((a,b)=>Number(b)-Number(a))],qs=filteredQuestions(),q=qs[qIndex%Math.max(1,qs.length)]||questoes[0];return '<div class="page-title">Questões</div><div class="card"><div class="grid5"><label class="form-label">Ano<select id="fAno" class="form-select" onchange="qIndex=0;qSelected=null;render()">'+anos.map(a=>'<option>'+a+'</option>').join('')+'</select></label><label class="form-label">Prova<select id="fProva" class="form-select" onchange="qIndex=0;qSelected=null;render()"><option>Todas</option><option>OAB</option><option>ENADE</option></select></label><label class="form-label">Dificuldade<select id="fDif" class="form-select" onchange="qIndex=0;qSelected=null;render()"><option>Todas</option><option>Fácil</option><option>Médio</option><option>Difícil</option></select></label><label class="form-label">Área<select id="fArea" class="form-select" onchange="qIndex=0;qSelected=null;render()"><option>Todas</option>'+areas.map(a=>'<option>'+a+'</option>').join('')+'</select></label><div style="display:flex;align-items:end">'+tag(qs.length+' questões encontradas')+'</div></div></div><div class="grid4"><div class="card"><div class="stat-val" style="color:var(--blue)">67%</div><div class="stat-lbl">Taxa de acerto geral</div></div><div class="card"><div class="stat-val">143</div><div class="stat-lbl">Respondidas</div></div><div class="card"><div class="stat-val">'+qs.length+'</div><div class="stat-lbl">No banco filtrado</div></div><div class="card"><div class="stat-val">'+(qSelected===q.correta?1:0)+'</div><div class="stat-lbl">Acertos nesta sessão</div></div></div><div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.8rem"><div>'+tag(q.prova,q.prova==='ENADE'?'purple':'')+tag(q.area)+tag(q.dif,'gray')+tag(q.ano,'gray')+'</div><span style="font-size:.72rem;color:var(--t3)">'+q.ref+'</span></div><p style="font-size:.86rem;line-height:1.75;font-weight:700;margin-bottom:1rem">'+q.text+'</p>'+q.opts.map((o,i)=>'<button class="q-option '+(qSelected!==null?(i===q.correta?'correct':qSelected===i?'wrong':''):'')+'" '+(qSelected!==null?'disabled':'')+' onclick="qSelected='+i+';render()"><span class="q-letter">'+'ABCD'[i]+'</span>'+o+'</button>').join('')+(qSelected!==null?'<div class="card" style="margin-top:.8rem;background:'+(qSelected===q.correta?'var(--grn-l)':'var(--red-l)')+';color:'+(qSelected===q.correta?'var(--grn)':'var(--red)')+'"><b>'+(qSelected===q.correta?'Correto.':'Incorreto.')+'</b> '+q.comment+'</div>':'')+'<div style="text-align:right;margin-top:1rem"><button class="btn" onclick="qIndex=(qIndex+1)%'+Math.max(1,qs.length)+';qSelected=null;render()">Próxima questão</button></div></div>'}
let simConfig={quantidade:10,prova:'Todas',dificuldade:'Todas',area:'Todas',usarIA:true};
function buildSimQs(){return questoes.filter(q=>(simConfig.prova==='Todas'||q.prova===simConfig.prova)&&(simConfig.dificuldade==='Todas'||q.dif===simConfig.dificuldade)&&(simConfig.area==='Todas'||q.area===simConfig.area)).slice(0,simConfig.quantidade)}
function simuladoPage(){if(simFinished)return simResult();if(simStarted)return simRun();simQs=buildSimQs();return '<div class="page-title">Simulado</div><div class="card"><h2 style="font-size:1.05rem;margin-bottom:.7rem">Personalizar simulado</h2><p style="font-size:.82rem;color:var(--t2)">Monte um simulado personalizado com filtros inteligentes.</p><div class="grid5" style="margin-top:1.25rem"><label class="form-label">Quantidade<select class="form-select" onchange="simConfig.quantidade=+this.value;render()">'+[5,10,20,40,80].map(n=>'<option '+(simConfig.quantidade===n?'selected':'')+' value="'+n+'">'+n+' questões</option>').join('')+'</select></label><label class="form-label">Prova<select class="form-select" onchange="simConfig.prova=this.value;render()"><option>Todas</option><option '+(simConfig.prova==='OAB'?'selected':'')+'>OAB</option><option '+(simConfig.prova==='ENADE'?'selected':'')+'>ENADE</option></select></label><label class="form-label">Dificuldade<select class="form-select" onchange="simConfig.dificuldade=this.value;render()"><option>Todas</option><option>Fácil</option><option>Médio</option><option>Difícil</option></select></label><label class="form-label">Área<select class="form-select" onchange="simConfig.area=this.value;render()"><option>Todas</option>'+areas.map(a=>'<option '+(simConfig.area===a?'selected':'')+'>'+a+'</option>').join('')+'</select></label><label class="form-label">Questões IA<select class="form-select" onchange="simConfig.usarIA=this.value===\'Sim\';render()"><option '+(simConfig.usarIA?'selected':'')+'>Sim</option><option '+(!simConfig.usarIA?'selected':'')+'>Não</option></select></label></div><div class="card" style="background:#f8fafc;margin-top:1.25rem;margin-bottom:0;display:flex;align-items:center;justify-content:space-between"><div><b>'+simQs.length+' questões selecionadas</b><div style="font-size:.75rem;color:var(--t2);margin-top:.2rem">Banco integrado OAB + ENADE '+(simConfig.usarIA?'- Questões IA ativadas':'')+'</div></div><button class="btn" onclick="simStarted=true;simFinished=false;simIndex=0;simAnswers=[];simLog=[];simQs=buildSimQs();render()">Iniciar simulado</button></div></div>'}
function simRun(){const q=simQs[simIndex];return '<div class="page-title">Simulado em andamento</div><div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:.8rem"><div>'+tag(q.prova,q.prova==='ENADE'?'purple':'')+tag(q.area)+tag(q.dif,'gray')+'</div><b style="font-size:.82rem;color:var(--t2)">'+(simIndex+1)+' / '+simQs.length+'</b></div><p style="font-size:.88rem;line-height:1.8;font-weight:700;margin:1.2rem 0">'+q.text+'</p>'+q.opts.map((o,i)=>'<button class="q-option" onclick="simAnswer('+i+')"><span class="q-letter">'+'ABCD'[i]+'</span>'+o+'</button>').join('')+'</div>'}
function simAnswer(i){const q=simQs[simIndex],ok=i===q.correta;simAnswers.push(ok);simLog.push({questao:q,marcada:i,ok});if(simIndex>=simQs.length-1){simFinished=true;simStarted=false}else simIndex++;render()}
function simResult(){const pct=Math.round((simAnswers.filter(Boolean).length/Math.max(1,simAnswers.length))*100);return '<div class="page-title">Resultado do Simulado</div><div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:3.8rem;font-weight:900;color:'+(pct>=70?'var(--grn)':'var(--gold)')+'">'+pct+'%</div><div style="font-size:.82rem;color:var(--t2)">'+simAnswers.filter(Boolean).length+' acertos de '+simAnswers.length+' questões</div></div>'+tag(pct>=70?'Excelente desempenho':'Continue revisando',pct>=70?'green':'gold')+'</div><div style="margin-top:1.4rem;padding-top:.9rem;border-top:1px solid var(--bd);display:flex;justify-content:space-between"><h3>Relatório completo</h3><span style="font-size:.8rem;color:var(--t2)">'+simLog.length+' questões respondidas</span></div>'+simLog.map((it,i)=>'<div class="report-q"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.55rem"><div>'+tag(it.questao.prova,it.questao.prova==='ENADE'?'purple':'')+tag(it.questao.area)+tag('Questão '+(i+1),'gray')+'</div>'+tag(it.ok?'Acertou':'Errou',it.ok?'green':'red')+'</div><p style="font-size:.82rem;line-height:1.65">'+it.questao.text+'</p><div class="mini-grid"><div class="mini blue">Sua resposta: '+'ABCD'[it.marcada]+'</div><div class="mini green">Gabarito: '+'ABCD'[it.questao.correta]+'</div></div></div>').join('')+'<button class="btn" style="margin-top:1rem" onclick="simStarted=false;simFinished=false;simIndex=0;simAnswers=[];simLog=[];render()">Fazer novo simulado</button></div>'}
function pecasPage(){const modelos=['Petição Inicial','Recurso','Contrato','Habeas Corpus'];return '<div class="page-title">Gerador de Peças Jurídicas</div><div class="grid4">'+modelos.map(x=>'<button class="card" style="cursor:pointer;text-align:left" onclick="selecionarPeca(\''+x+'\')"><div style="width:34px;height:34px;color:var(--blue)">'+icons.doc+'</div><b style="display:block;margin-top:.7rem">'+x+'</b></button>').join('')+'</div><div class="card"><h3>Elaborar peça com IA</h3><textarea id="pecaTexto" class="form-input" style="width:100%;min-height:120px;margin-top:1rem" placeholder="Descreva fatos, pedidos e partes envolvidas..."></textarea><br><button class="btn" style="margin-top:1rem" onclick="gerarPeca()">Gerar com IA</button></div>'}
function selecionarPeca(tipo){const el=document.getElementById('pecaTexto');if(!el)return;el.value='Modelo selecionado: '+tipo+'\\n\\nDescreva aqui os fatos, pedidos, partes envolvidas e documentos disponíveis.';el.focus()}
function gerarPeca(){const texto=(document.getElementById('pecaTexto')?.value||'').trim();alert(texto?'Peça gerada em modo demonstrativo.':'Selecione um modelo ou descreva a peça antes de gerar.')}
function chatPage(){return '<div class="page-title">Chat Jurídico</div><div class="card"><h3>Assistente jurídico IA</h3><div class="chat-log" id="chatLog">'+chatHistory.map(m=>'<div class="chat-msg '+m.role+'">'+escapeHtml(m.content)+'</div>').join('')+'</div><div class="chat-form"><input id="chatPergunta" class="form-input" placeholder="Digite sua pergunta jurídica..." onkeydown="if(event.key===\'Enter\')enviarChatJuridico()"><button class="btn" onclick="enviarChatJuridico()">Enviar</button></div><div class="chat-note">Conectado ao endpoint local <b>'+escapeHtml(getChatEndpoint())+'</b>. As respostas são apoio educacional e não substituem análise profissional.</div></div>'}
function jurisPage(){return '<div class="page-title">Jurisprudência</div><div class="card"><h3>Pesquisa jurisprudencial</h3><input id="jurisBusca" class="form-input" style="width:100%;margin-top:1rem" placeholder="Ex: responsabilidade civil médica"><button class="btn" style="margin-top:1rem" onclick="pesquisarJuris()">Pesquisar</button><div id="jurisResultados"></div></div>'}
function escapeHtml(text){return String(text).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function getChatEndpoint(){if(location.protocol!=='file:')return'/api/chat';try{return localStorage.getItem('lexiaApiUrl')||'http://localhost:8787/api/chat'}catch(e){return'http://localhost:8787/api/chat'}}
function pesquisarJuris(){const q=(document.getElementById('jurisBusca')?.value||'').trim();const box=document.getElementById('jurisResultados');if(!box)return;box.innerHTML=q?'<div class="juris-result"><b>Consulta preparada:</b> '+escapeHtml(q)+'<br>Use o chat ao lado para pedir ementas, fundamentos legais, teses relacionadas ou riscos da argumentação.</div>':'<div class="juris-result">Digite um tema para preparar a pesquisa.</div>'}
async function enviarChatJuridico(){const input=document.getElementById('chatPergunta'),pergunta=(input?.value||'').trim();if(!pergunta)return;chatHistory.push({role:'user',content:pergunta},{role:'assistant',content:'Consultando a API...'});render();try{const response=await fetch(getChatEndpoint(),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:pergunta,history:chatHistory.slice(0,-1)})});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Falha ao consultar a API.');chatHistory[chatHistory.length-1]={role:'assistant',content:data.answer||'A API não retornou texto.'}}catch(err){chatHistory[chatHistory.length-1]={role:'assistant',content:'Não consegui consultar a API. '+(err?.message||'Verifique se o servidor local está ativo e se OPENAI_API_KEY foi configurada.')}}render()}
function resumosPage(){return '<div class="page-title">Resumos Automáticos</div><div class="card"><textarea class="form-input" style="width:100%;min-height:150px" placeholder="Cole texto jurídico, material de aula ou decisão..."></textarea><br><button class="btn" style="margin-top:1rem" onclick="alert(\'Resumo gerado em modo demonstrativo.\')">Gerar resumo</button></div>'}
function perfilPage(){return '<div class="page-title">Perfil & XP</div><div class="card hero"><div class="avatar-xl">AB</div><div><h2>Ana Beatriz Lima</h2><p style="color:var(--t2);font-size:.85rem;margin:.3rem 0">Estudante de Direito - Nível 4 - 1.240 XP</p><div class="progress" style="width:min(360px,70vw)"><div class="bar" style="width:68%"></div></div></div></div>'}
function certificadosPage(){return '<div class="page-title">Certificados</div><div class="card" style="background:var(--gold-l);border-color:var(--gold)"><b>Preparação Integrada OAB/ENADE</b><p style="font-size:.82rem;color:var(--t2);margin-top:.5rem">Certificado emitido após conclusão de trilha e avaliação.</p></div>'}
function adminDash(){return '<div class="page-title">Analytics</div><div class="grid4">'+[['82','Alunos ativos','grn'],['49%','Mediana de acerto','gold'],['18','Alunos em risco','red'],['312','Peças geradas','blue']].map(x=>'<div class="card"><div class="stat-val" style="color:var(--'+x[2]+')">'+x[0]+'</div><div class="stat-lbl">'+x[1]+'</div></div>').join('')+'</div><div class="grid2"><div class="card"><h3>Trajetória de desempenho</h3>'+[38,44,46,49,53,67].map((v,i)=>'<div style="display:flex;align-items:center;gap:.8rem;margin-top:.8rem"><span style="width:40px;font-size:.72rem;color:var(--t3)">'+['Fev','Mar','Abr','Mai','Jun','Nov'][i]+'</span><div class="progress" style="flex:1"><div class="bar" style="width:'+v+'%"></div></div><b style="font-size:.75rem">'+v+'%</b></div>').join('')+'</div><div class="card"><h3>Risco por área</h3>'+trilhas.map(t=>'<div style="display:flex;gap:.8rem;align-items:center;margin-top:.8rem"><span style="width:130px;font-size:.8rem;color:var(--t2)">'+t.area+'</span><div class="progress" style="flex:1"><div class="bar" style="width:'+(100-t.pct)+'%;background:'+(t.pct<50?'var(--red)':'var(--gold)')+'"></div></div></div>').join('')+'</div></div>'}
function adminProvas(){return '<div class="page-title">Provas & Questões</div><div class="grid5"><div class="card"><div class="stat-val" style="color:var(--blue)">480</div><div class="stat-lbl">Questões importadas</div></div><div class="card"><div class="stat-val" style="color:var(--grn);font-size:1.4rem">480/480</div><div class="stat-lbl">Gabarito sincronizado</div></div><div class="card"><div class="stat-val" style="color:var(--pur);font-size:1.3rem">OAB + ENADE</div><div class="stat-lbl">Provas integradas</div></div><div class="card"><div class="stat-val" style="color:var(--gold);font-size:1.3rem">Preliminar</div><div class="stat-lbl">Status</div></div><div class="card"><div class="stat-val" style="color:var(--blue2)">7</div><div class="stat-lbl">Exames importados</div></div></div><div class="card">'+tag('OAB 2023 Tipo 1','green')+tag('42 OAB')+tag('43 OAB')+tag('45 OAB')+tag('46 OAB')+tag('ENADE 2022','purple')+tag('ENADE 2025','purple')+tag('480 questões sincronizadas','green')+'<div style="margin-top:.8rem"><a class="btn btn-outline" href="'+prova2023Url+'" target="_blank" rel="noopener">Abrir prova OAB 2023 - PDF FGV</a></div><table style="width:100%;border-collapse:collapse;margin-top:1rem;font-size:.82rem"><tr style="color:var(--t3);text-transform:uppercase;font-size:.7rem"><th style="text-align:left;padding:.7rem;border-bottom:2px solid var(--bd)">Questão</th><th style="text-align:left;padding:.7rem;border-bottom:2px solid var(--bd)">Área</th><th style="text-align:left;padding:.7rem;border-bottom:2px solid var(--bd)">Gabarito</th><th style="text-align:left;padding:.7rem;border-bottom:2px solid var(--bd)">Status</th></tr>'+questoes.filter(q=>q.ano==='2023').slice(0,12).map(q=>'<tr><td style="padding:.7rem;border-bottom:1px solid var(--bd)"><b>'+q.ref+'</b></td><td style="padding:.7rem;border-bottom:1px solid var(--bd)">'+q.area+'</td><td style="padding:.7rem;border-bottom:1px solid var(--bd)">'+tag(q.gabarito)+'</td><td style="padding:.7rem;border-bottom:1px solid var(--bd)">'+tag('Sincronizada','green')+'</td></tr>').join('')+'</table></div>'}
function adminAlunos(){return '<div class="page-title">Estudantes</div><div class="card"><table style="width:100%;border-collapse:collapse;font-size:.82rem"><tr style="color:var(--t3);text-transform:uppercase;font-size:.7rem"><th style="text-align:left;padding:.7rem;border-bottom:2px solid var(--bd)">Nome</th><th style="text-align:left;padding:.7rem;border-bottom:2px solid var(--bd)">E-mail</th><th style="text-align:left;padding:.7rem;border-bottom:2px solid var(--bd)">Trilha</th><th style="text-align:left;padding:.7rem;border-bottom:2px solid var(--bd)">Status</th></tr>'+['Ana Beatriz Lima','Rafael Martins','Camila Prado'].map((n,i)=>'<tr><td style="padding:.7rem;border-bottom:1px solid var(--bd)"><b>'+n+'</b></td><td style="padding:.7rem;border-bottom:1px solid var(--bd)">aluno'+(i+1)+'@lexia.br</td><td style="padding:.7rem;border-bottom:1px solid var(--bd)">OAB + ENADE</td><td style="padding:.7rem;border-bottom:1px solid var(--bd)">'+tag('Ativo','green')+'</td></tr>').join('')+'</table></div>'}
function adminSimple(){return '<div class="page-title">'+document.getElementById('crumb').textContent+'</div><div class="card"><p style="font-size:.85rem;line-height:1.7;color:var(--t2)">Área administrativa preservada em formato navegável para gestão de conteúdo, peças e relatórios.</p></div>'}
</script>
</body>
