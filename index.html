gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa C. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":12,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":40,"codigo":"OAB44TIPO1-040","area":"Direito Civil","dificuldade":"Médio","enunciado":"Do testamento deixado por Natália constou a seguinte cláusula acerca da parte disponível: “lego o apartamento X para meus filhos Henrique e Carolina, os quais serão individualmente substituídos, se não puderem aceitar, pelo meu filho Carlos.” Após o registro, abertura e determinação de seu cumprimento, Henrique renunciou à sucessão testamentária, satisfazendo-se com a legítima. Você, como advogado(a), foi consultado(a) acerca da transmissão causa mortis do apartamento X. Assinale a opção que apresenta, corretamente, sua orientação.","alternativas":["Caberá à Carolina e a Carlos, por força da substituição prevista.","Ficará integralmente com Carolina, por conta do direito de acrescer.","Será dividido entre Henrique e Carolina, pois a renúncia não pode ser parcial.","Deverá ser integralmente entregue a Carlos, em razão da disposição conjuntiva."],"gabarito":"A","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa A. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":12,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":41,"codigo":"OAB44TIPO1-041","area":"Direito Civil","dificuldade":"Médio","enunciado":"Beatriz nasceu duzentos e cinquenta dias após a morte do pai, Bernardo, com quem sua mãe, Gabriela, era casada há 2 anos. Quando Gabriela foi registrar Beatriz, Leonardo, irmão de Bernardo, afirmou que não aceitaria que ela a registrasse como filha de Bernardo, a não ser que Gabriela provasse a paternidade, por meio de exame de DNA. Sobre a situação apresentada, assinale a afirmativa correta.","alternativas":["Gabriela precisa realizar o exame de DNA para que possa registrar Beatriz, uma vez que é direito da família do falecido questionar a paternidade a este atribuída após a sua morte.","Gabriela precisa realizar o exame de DNA para que possa registrar Beatriz, uma vez que, nos termos do Código Civil, a paternidade não é presumida após a dissolução do vínculo conjugal.","Gabriela não precisa realizar o exame de DNA para que possa registrar Beatriz, uma vez que a criança nasceu após a morte de Bernardo e o direito para contestação da paternidade é personalíssimo.","Gabriela não precisa realizar o exame de DNA para que possa registrar Beatriz, uma vez que, nos termos do Código Civil, presumem-se concebidos na constância do casamento os filhos nascidos nos trezentos dias subsequentes à dissolução da sociedade conjugal por morte."],"gabarito":"D","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa D. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":13,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":42,"codigo":"OAB44TIPO1-042","area":"Direito Civil","dificuldade":"Difícil","enunciado":"Carlos é titular de direito real de uma laje, referente à parte superior de uma edificação localizada em uma área urbana. Recentemente, ele tomou conhecimento de que uma empresa de internet está negociando diretamente com o proprietário da construção-base para instalar cabeamentos de fibra ótica e outros equipamentos de infraestrutura no subsolo dessa construção. A instalação não interfere no direito real de Carlos, bem como não afeta o uso do bem. Mesmo assim, Carlos tem dúvidas sobre a legalidade dessa instalação sem a sua expressa autorização, bem como sobre seu direito a eventual compensação. Diante disso, ele consultou você, como advogado(a), para orientá-lo sobre a questão. Assinale a opção que apresenta, corretamente, sua orientação.","alternativas":["Carlos tem o direito de impedir a instalação dos cabos de fibra ótica, pois a utilização do subsolo da construção-base requer sua autorização expressa como titular do direito real de laje.","A empresa de internet pode instalar os cabos de fibra ótica no subsolo da construção-base sem a autorização de Carlos, pois a instalação não interfere em seu direito real de laje.","Carlos deve ser compensado financeiramente pela empresa de internet antes da instalação dos cabos no subsolo da construção-base, devido à titularidade de seu direito real de laje.","A instalação dos cabos de fibra ótica pela empresa de internet é ilegal e pode ser contestada por Carlos judicialmente, já que ele possui um direito real sobre a construção e não autorizou o uso do subsolo."],"gabarito":"B","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa B. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":13,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":43,"codigo":"OAB44TIPO1-043","area":"Estatuto da Criança e do Adolescente","dificuldade":"Fácil","enunciado":"João, 17 anos, foi representado pelo Ministério Público pela prática de ato infracional análogo a roubo. Consta nos autos que o representado teria abordado dois transeuntes e, simulando estar armado, anunciou o roubo, tendo subtraído os celulares e as carteiras das vítimas. Ao final do procedimento, o Juízo da Infância considerou comprovadas a autoria e a materialidade, tendo julgado procedente o pedido e fixado a medida socioeducativa de internação. O(A) advogado(a) do adolescente deseja apresentar recurso de apelação. Sobre o recurso a ser interposto, com base no Estatuto da Criança e do Adolescente, assinale a afirmativa correta.","alternativas":["O sistema recursal adotado é o do Código de Processo Civil, sendo certo que o prazo será de 10 (dez) dias.","O sistema recursal adotado é o do Código de Processo Penal, sendo certo que o prazo será de 10 (dez) dias.","O sistema recursal adotado é o do Código de Processo Civil, sendo certo que o prazo será de 15 (quinze) dias.","O sistema recursal adotado é o do Código de Processo Penal, sendo certo que o prazo será de 5 (cinco) dias e, após isso, haverá o prazo de 8 (oito) dias para oferecimento das razões."],"gabarito":"A","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa A. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":13,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":44,"codigo":"OAB44TIPO1-044","area":"Estatuto da Criança e do Adolescente","dificuldade":"Fácil","enunciado":"Ricardo, 13 anos, filho de Vanda, não foi registrado pelo pai biológico. Desde tenra idade, o adolescente foi criado por João, de 50 anos, marido de Vanda. João e Ricardo se viam como pai e filho e assim eram reconhecidos na vizinhança. João procura você, como advogado(a), e diz que tem inequívoca vontade de adotar Ricardo. Após a juntada de toda a documentação necessária, e com anuência de Vanda e Ricardo, é ajuizada a ação de adoção, sendo certo que, no curso da ação, João reitera a inequívoca vontade de adotar Ricardo. Ocorre que, dois meses após a distribuição, João sofre um ataque cardíaco e vem a falecer. Vanda e Ricardo, desesperados, o(a) procuram, como advogado(a), para que você indique o caminho jurídico viável para o caso. De acordo com o ECA, assinale a afirmativa que apresenta, corretamente, sua orientação.","alternativas":["O processo de adoção deve prosseguir, mesmo com a morte de João. Nesse caso, se a sentença julgar procedente o pedido, seus efeitos retroagirão à data do óbito.","A adoção é direito personalíssimo. Logo, falecendo o autor do pedido, o único caminho jurídico é a extinção do processo.","A adoção só pode seguir se os herdeiros biológicos de João anuírem, já que possuem interesse direto na herança do finado.","O processo de adoção pode seguir, mesmo com a morte de João. Nessa hipótese, caso julgado procedente o pedido, os efeitos se produzem a partir do trânsito em julgado da sentença constitutiva."],"gabarito":"A","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa A. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":13,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":45,"codigo":"OAB44TIPO1-045","area":"Direito do Consumidor","dificuldade":"Fácil","enunciado":"Joana, aposentada, contratou diversos empréstimos ao longo dos anos para fazer frente a necessidades inesperadas, em razão de um grave problema de saúde que enfrentou, além de assumir dívidas com cartões de crédito, lojas e empréstimos consignados. Com o tempo, Joana não conseguiu mais pagar todas as parcelas, que agora superam o valor de sua aposentadoria, comprometendo suas despesas básicas, como alimentação e saúde. Buscando uma solução, Joana o(a) procurou, como advogado(a), para que você a assessorasse no caso. Com base no Código de Defesa do Consumidor, assinale a opção que apresenta seu parecer.","alternativas":["Joana pode requerer judicialmente a renegociação das dívidas contraídas para consumo pessoal, mas não dos empréstimos financeiros.","Joana pode requerer judicialmente a renegociação de suas dívidas, preservando o mínimo existencial, e buscar um plano de pagamento compatível com sua renda.","O deferimento do pedido judicial de renegociação das dívidas dependerá de Joana provar que as obrigações foram contraídas em razão do seu grave problema de saúde.","Joana é responsável por suas dívidas, inexistindo possibilidade de renegociação judicial, pois as obrigações contratuais devem ser cumpridas independentemente das dificuldades financeiras."],"gabarito":"B","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa B. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":14,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":46,"codigo":"OAB44TIPO1-046","area":"Direito do Consumidor","dificuldade":"Médio","enunciado":"A sociedade empresária VittaBem Alimentos Ltda. lançou no mercado nacional uma nova linha de sucos naturais, supostamente livres de conservantes e aditivos químicos, amplamente divulgada em campanhas publicitárias nas principais redes de televisão e mídias digitais. Após quatro meses de intensa comercialização, o Ministério da Saúde, por meio de fiscalização e laudos laboratoriais, constatou que os produtos continham substâncias artificiais em níveis superiores aos permitidos pela Anvisa, representando risco potencial à saúde dos consumidores. Diante da repercussão nacional do caso, uma associação de defesa do consumidor ajuizou ação civil pública, pleiteando: a retirada imediata dos produtos do mercado; e a condenação da sociedade empresária ao pagamento de indenização por danos morais coletivos. A sociedade empresária contestou, sustentando, entre outros argumentos, a inaplicabilidade do Código de Defesa do Consumidor e a ausência de culpa e de dano individual comprovado. Sobre o caso apresentado, com base no ordenamento jurídico brasileiro, especialmente no Código de Defesa do Consumidor, assinale a afirmativa correta.","alternativas":["A coletividade de pessoas, ainda que indetermináveis, equipara-se a consumidor, podendo ser tutelada judicialmente por meio de Ação Civil Pública.","A Ação Civil Pública é incabível, pois somente o consumidor individual e identificado possui legitimidade para pleitear indenização por danos oriundos da relação de consumo.","O conceito de consumidor por equiparação exige que a coletividade seja determinada e tenha comprovadamente adquirido o produto para ser considerada consumidora.","Apenas os consumidores que efetivamente adquiriram e consumiram o produto possuem legitimidade para buscar reparação por danos, ainda que representados por associação."],"gabarito":"A","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa A. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":14,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":47,"codigo":"OAB44TIPO1-047","area":"Direito Empresarial","dificuldade":"Médio","enunciado":"No contrato de sociedade em conta de participação firmado entre o sócio ostensivo e quatro sócios participantes não há cláusula dispondo sobre a admissão de novos sócios. Diante da omissão, assinale a afirmativa correta.","alternativas":["É defeso ao sócio ostensivo admitir novo sócio sem o consentimento expresso ou tácito dos demais sócios, sendo tácito o consentimento se eles não se opuserem nos trinta dias seguintes ao ingresso do novo sócio.","O sócio ostensivo pode admitir novo sócio com ou sem o consentimento dos demais sócios em razão de sua responsabilidade ilimitada e pessoal pelo exercício da atividade constitutiva do objeto social.","É defeso ao sócio ostensivo admitir novo sócio sem o consentimento expresso dos demais sócios.","O sócio ostensivo pode admitir novo sócio com o consentimento da maioria dos demais sócios; havendo empate, cabe a ele o voto de qualidade."],"gabarito":"C","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa C. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":14,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":48,"codigo":"OAB44TIPO1-048","area":"Direito Empresarial","dificuldade":"Médio","enunciado":"Santa Aceguá, administradora e sócia da Mercearia Cerro Branco Ltda., para saber os efeitos que a falência de um dos seus devedores, o empresário Júlio Cidreira, terá em relação a seu crédito, consulta você como advogado(a). Assinale a opção que apresenta, corretamente, sua orientação.","alternativas":["A falência opera a novação dos créditos quirografários existentes na data da decretação, que serão pagos até o limite de 25% (vinte e cinco por cento) de seu valor, exceto se o ativo apurado for superior para garantir o pagamento integral a outras classes de credores.","A falência produz o vencimento antecipado das dívidas do falido, com o abatimento proporcional dos juros, e converte todos os créditos em moeda estrangeira para a moeda do País, pelo câmbio do dia da decisão judicial.","A falência determina a suspensão da prescrição a partir da data da decretação a falência, sendo retomado o curso do prazo a partir da data do trânsito em julgado da sentença de encerramento.","A falência acarreta a suspensão das execuções pelo prazo de 180 (cento e oitenta) dias, contado da data da decretação, prorrogável uma única vez por igual prazo."],"gabarito":"B","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa B. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":14,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":49,"codigo":"OAB44TIPO1-049","area":"Direito Empresarial","dificuldade":"Difícil","enunciado":"Francisco Morato tem domicílio em Cidade Ocidental/GO e pretende ser empresário individual em Brasília/DF. Se o negócio der certo, Francisco Morato pretende abrir duas filiais, uma em Unaí/MG e, outra, em Natividade/TO. Considerando-se as normas do Código Civil para a inscrição do empresário e da instituição de filiais, é correto afirmar que Francisco Morato deverá realizar sua inscrição como empresário na Junta Comercial do","alternativas":["Estado de Goiás, tendo como referência a cidade do seu domicílo, Cidade Ocidental, e, com relação às filiais, nas Juntas Comerciais dos Estados de Minas Gerais e do Tocantins, sem necessidade de averbação da constituição das filiais na Junta Comercial do Estado de Goiás.","Distrito Federal, tendo como referência a sede da sociedade empresária, Brasília, e, com relação às filiais, nas Juntas Comerciais dos Estados de Minas Gerais e do Tocantins, com averbação da constituição das filiais na Junta Comercial do Distrito Federal.","Estado de Goiás, tendo como referência a cidade do seu domicílo, Cidade Ocidental, e, com relação às filiais, na mesma Junta Comercial, por ser o lugar do seu domicílio.","Distrito Federal, tendo como referência a sede da sociedade empresária, Brasília, e, com relação às filiais, na mesma Junta Comercial por ser o lugar da sede."],"gabarito":"B","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa B. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":15,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":50,"codigo":"OAB44TIPO1-050","area":"Direito Empresarial","dificuldade":"Fácil","enunciado":"Nísia Parnamirim realizou sua inscrição como microempreendedora individual (MEI) e consultou você, como advogado(a), para saber o tratamento que lhe é dispensado pela Lei Complementar nº 123/2006 (Lei do Simples Nacional). Sobre a hipótese, assinale a opção que apresenta, corretamente, sua resposta.","alternativas":["Nísia Parnamirim poderá utilizar sua residência como sede do estabelecimento, quando não for indispensável a existência de local próprio para o exercício da atividade.","Nísia Parnamirim poderá manter sua condição de microempreendedora individual desde que a receita bruta auferida no ano-calendário anterior seja de até R$ 60.000,00 (sessenta mil reais).","Caso Nísia Parnamirim queira alienar seu estabelecimento, a eficácia do ato em relação a terceiros depende da averbação do contrato no Registro Público de Empresas Mercantis e de sua publicação na imprensa oficial.","A comprovação da receita bruta anual por parte de Nísia Parnamirim será feita mediante escrituração do Livro Caixa e apresentação do registro de vendas ou de prestação de serviços."],"gabarito":"A","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa A. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":15,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":51,"codigo":"OAB44TIPO1-051","area":"Direito Empresarial","dificuldade":"Médio","enunciado":"Ricardo propôs a execução de um título executivo extrajudicial contra Isabela. Diante da propositura da execução por Ricardo, Isabela apresentou embargos à execução. O Magistrado julgou improcedentes os embargos à execução de Isabela que, irresignada, interpôs recurso de apelação contra a sentença de improcedência dos embargos à execução. Ao receber a apelação interposta por Isabela, o Desembargador relator, integrante de Câmara Cível, julgou o recurso monocraticamente, negando provimento à apelação. Assinale a opção que apresenta o recurso cabível a ser interposto por Isabela.","alternativas":["Recurso especial, para que seja analisada, pelo Superior Tribunal de Justiça, eventual violação de lei federal por ter sido negado provimento à apelação de forma monocrática pelo desembargador relator.","Agravo interno, para que seja analisada, pelo Desembargador relator, eventual violação de lei federal decorrente de ter sido negado provimento à apelação de forma monocrática pelo próprio relator.","Agravo interno, por se tratar de decisão proferida pelo Desembargador relator, a ser analisado pelo órgão colegiado da Câmara Cível.","Recurso especial, por se tratar de decisão proferida pelo Desembargador relator, a ser analisado pelo órgão colegiado da Câmara Cível."],"gabarito":"C","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa C. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":15,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":52,"codigo":"OAB44TIPO1-052","area":"Direito Empresarial","dificuldade":"Difícil","enunciado":"João é advogado regularmente inscrito nos quadros da Ordem dos Advogados do Brasil. Em uma sexta-feira à noite, seu amigo Thiago o procurou e, bastante nervoso, indagou se João poderia ingressar com um requerimento de tutela antecipada antecedente perante o Plantão Judicial, porque sua irmã necessitava de uma cirurgia de emergência. João reuniu os documentos enviados por Thiago e protocolou o requerimento, porém deixou de fazer a juntada da procuração assinada pela irmã de Thiago, que também é advogada. A medida de urgência foi concedida e, ato contínuo, João foi intimado para efetuar a juntada da procuração, bem como para complementar a petição inicial, nos termos do Art. 303, § 1º, inciso I, do CPC. A irmã de Thiago outorgou procuração geral para o foro por meio de instrumento particular por ela assinado. Sobre o caso narrado, com base no ordenamento jurídico brasileiro, assinale a afirmativa correta.","alternativas":["A procuração deve ser exibida no prazo de 10 (dez) dias, prorrogável por igual período por despacho do Juiz.","A irmã de Thiago, ainda que advogada, não poderá postular em causa própria, por expressa disposição do Código de Processo Civil.","Não seria lícito a João, em nenhuma hipótese, postular em juízo sem procuração, motivo pelo qual o processo deverá ser extinto sem resolução do mérito.","A procuração outorgada pela irmã de Thiago habilita João a praticar todos os atos do processo, exceto, entre outros poderes, receber citação, confessar e reconhecer a procedência do pedido."],"gabarito":"D","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa D. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":15,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":53,"codigo":"OAB44TIPO1-053","area":"Direito Empresarial","dificuldade":"Médio","enunciado":"Em execução fundada em título extrajudicial, movida por Murilo, seu ex-sócio, Marília foi executada. Após regular citação, Marília não ofertou defesa, não nomeou bens à penhora, nem pagou o débito exequendo. Por essa razão, Murilo requereu a realização de penhora em contas correntes de titularidade de Marília, com o intuito de satisfazer seu crédito. A indisponibilidade do valor foi determinada pelo Juízo. Tomando o caso acima como premissa, assinale a afirmativa correta.","alternativas":["A indisponibilidade de ativos financeiros pode ser realizada sem ciência prévia de Marília, pois é hipótese que dispensa o contraditório prévio.","Eventual impenhorabilidade das quantias tornadas indisponíveis poderá ser comprovada por Marília no prazo de 10 dias, contados da intimação da penhora.","Marília poderá requerer a substituição da penhora do dinheiro por fiança bancária, em valor não inferior ao do débito constante da petição inicial, acrescido de vinte por cento.","Caso Marília efetue o pagamento da dívida por outro meio, o Juiz determinará a notificação da instituição financeira para que, em até 48 horas, cancele a indisponibilidade."],"gabarito":"A","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa A. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":16,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":54,"codigo":"OAB44TIPO1-054","area":"Direito Processual Civil","dificuldade":"Médio","enunciado":"Juliana e André foram casados por anos, tiveram um filho que atualmente está com 6 anos, mas, por adversidades conjugais, resolveram pôr fim ao casamento. Após a separação, o filho ficou residindo com a mãe em cidade distinta do pai. Considerando que não tem mais volta a relação conjugal, Juliana, por meio do seu advogado, deseja propor ação de divórcio e guarda. Sobre o caso, assinale a afirmativa correta.","alternativas":["A ação de divórcio e guarda deve tramitar em segredo de justiça.","A ação de divórcio e guarda deve ser proposta no domicílio de André.","Se André, após a citação, não comparecer em audiência nem apresentar contestação, ele não poderá mais intervir no processo.","Ainda que André apresente resistência à ação de divórcio e guarda, sendo vencido na ação, ele não poderá ser condenado em honorários de sucumbência."],"gabarito":"A","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa A. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":16,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":55,"codigo":"OAB44TIPO1-055","area":"Direito Processual Civil","dificuldade":"Médio","enunciado":"Débora, servidora pública aposentada do Município de Fortaleza, procurou você, como advogado(a), para ajuizar uma ação pelo procedimento comum em face do Município, pleiteando o pagamento de verbas em atraso a título de auxílio alimentação. Proferida sentença de procedência do pedido, foi interposto recurso de apelação pelo réu, não provido, assim como foi mantida a sentença em remessa necessária na mesma oportunidade. Transitada em julgado a sentença, Débora pretende receber os valores que lhe são devidos. Sobre o caso, assinale a afirmativa correta.","alternativas":["A Fazenda Pública Municipal, caso não pague o valor devido à Débora de forma espontânea, diferentemente do que ocorre com as Fazendas Estadual e Federal, sujeita-se à penhora de seus bens.","Débora deverá instruir sua petição de cumprimento de sentença com o demonstrativo discriminado e atualizado do crédito, devendo o Município ser intimado para apresentar impugnação nos mesmos autos.","Não impugnada a execução, os valores devidos deverão ser depositados diretamente na conta corrente da autora, por se tratar de servidora pública.","Débora deverá indicar o valor atualizado do crédito em sua petição de cumprimento de sentença, devendo o Município ser citado para apresentar embargos em autos apartados."],"gabarito":"B","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa B. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":16,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":56,"codigo":"OAB44TIPO1-056","area":"Direito Processual Civil","dificuldade":"Difícil","enunciado":"Pedro, locatário de um imóvel, ingressa com ação de consignação em pagamento após a locadora, Ana, recusar-se a receber o aluguel, o que foi comprovado pela juntada de documentos, nos quais Ana se recusa, expressamente, a receber a quantia. Atendendo a requerimento de Pedro, o Juiz determinou o depósito do valor em juízo, o que foi tempestivamente cumprido pelo autor. Ato contínuo, Ana é citada, mas não ofereceu contestação. Em tal hipótese, assinale a opção que apresenta, corretamente, a providência que o(a) advogado(a) deverá requerer ao Juízo.","alternativas":["A intimação das partes para que especifiquem as provas que pretendem produzir.","A decretação da revelia de Ana e a fixação de multa pela prática de ato atentatório à dignidade da justiça.","A determinação de devolução do montante depositado e a extinção do processo sem resolução do mérito em razão de se tratar de pedido incontroverso.","O julgamento pela procedência do pedido da ação de consignação em pagamento, declarando extinta a obrigação e condenando Ana ao pagamento de custas e honorários advocatícios."],"gabarito":"D","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa D. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":16,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":57,"codigo":"OAB44TIPO1-057","area":"Direito Processual Civil","dificuldade":"Médio","enunciado":"Matheus foi a uma festa de réveillon onde reencontrou sua ex-namorada, Laís, sendo ambos maiores e capazes. Assim que a viu, ele se aproximou dela e, a partir daí, iniciaram uma animada conversa sobre os “velhos tempos”. Em determinado momento, Matheus, sem a anuência de Laís, acariciou suas nádegas e tentou beijá-la, para satisfazer sua própria lascívia. Acerca da tipificação da conduta de Matheus, assinale a afirmativa correta.","alternativas":["É fato atípico.","É crime de estupro.","É crime de assédio sexual.","É crime de importunação sexual."],"gabarito":"D","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa D. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":16,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":58,"codigo":"OAB44TIPO1-058","area":"Direito Processual Civil","dificuldade":"Difícil","enunciado":"Saulo, em razão de seu posicionamento político, foi chamado de “burro” e “idiota” por João, Paulo e Sérgio, seus adversários políticos, que tinham a intenção de ofender sua dignidade e decoro. Inconformado, Saulo decidiu processar seus três ofensores. Após a propositura da queixa, Saulo reconciliou-se com Sérgio, sendo o perdão dado pela vítima aceito pelo ofensor, e comunicou o fato ao Juizado Especial em que tramitava a ação penal. Em relação ao caso narrado, assinale a opção que indica, corretamente, o crime cometido pelos três amigos e as implicações da reconciliação entre Saulo e Sérgio.","alternativas":["Injúria; o perdão concedido a Sérgio é de natureza personalíssima.","Calúnia; o perdão concedido a Sérgio torna perempta a ação em relação a João e a Paulo.","Difamação; o perdão concedido a Sérgio se aplica, obrigatoriamente, a João e a Paulo.","Injúria; o perdão concedido a Sérgio se aplica, obrigatoriamente, a João e a Paulo."],"gabarito":"D","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa D. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":17,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":59,"codigo":"OAB44TIPO1-059","area":"Direito Processual Civil","dificuldade":"Médio","enunciado":"Thiago, 21 anos de idade, e Vinicius, 17 anos, se conheceram no interior de uma boate. Alterados em razão da ingestão de cerveja, decidiram praticar um crime de furto em um posto de gasolina, mas foram abordados por policiais logo após a prática delitiva. Apenas naquele momento, Thiago veio a tomar conhecimento da idade de Vinicius, e que ele já tinha sido apreendido uma vez pela suposta prática de ato infracional análogo ao crime de dano. O Ministério Público ofereceu denúncia em face de Thiago como incurso nas penas do Art. 155, § 4º, inciso IV, do CP (furto qualificado pelo concurso de agentes) e do Art. 244-B do ECA (corrupção de menores). Assinale a opção que indica a alegação que você, como advogado(a) de defesa de Thiago, deve apresentar para questionar a capitulação delitiva.","alternativas":["A conduta não configura crime de corrupção de menores, em razão do erro de tipo permissivo, podendo Thiago apenas ser condenado pelo crime de furto simples.","A conduta não configura crime de corrupção de menores, em razão do erro de tipo essencial, podendo Thiago apenas ser condenado pelo crime de furto qualificado.","O furto supostamente praticado seria simples e não qualificado, diante da inimputabilidade de Vinicius, apesar de possível a condenação pelo crime de corrupção de menores.","O furto supostamente praticado seria simples, diante da inimputabilidade de Vinicius, bem como não seria possível a condenação pelo crime de corrupção de menores, diante da natureza material do delito e da apreensão anterior de Vinicius."],"gabarito":"B","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa B. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":17,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":60,"codigo":"OAB44TIPO1-060","area":"Direito Processual Civil","dificuldade":"Fácil","enunciado":"Marisa administrava os proventos de pensão recebidos por sua mãe, Sônia, que faleceu em dezembro de 2022. Com a intenção de continuar recebendo os proventos, Marisa deixou de comunicar à autarquia previdenciária o falecimento de Sônia e, assim, conseguiu efetuar os saques dos valores depositados nos meses de janeiro a março de 2023. Em abril, a autarquia recebeu notícia do falecimento e cessou os pagamentos. Ato contínuo, apurou o valor dos saques indevidos realizados por Marisa após o falecimento da segurada, acrescidos de multa e juros e a inscreveu em dívida ativa. Marisa, notificada, efetuou o pagamento integral do débito, de forma parcelada, entre os meses de outubro de 2023 e janeiro de 2024. A denúncia foi ajuizada em janeiro de 2024, e recebida em fevereiro de 2024. De acordo com a teoria do crime, assinale a opção que apresenta o que a defesa de Marisa deve, corretamente, alegar.","alternativas":["Desistência voluntária.","Arrependimento eficaz.","Arrependimento posterior.","Exercício regular de um direito."],"gabarito":"C","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa C. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":17,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":61,"codigo":"OAB44TIPO1-061","area":"Direito Processual Civil","dificuldade":"Médio","enunciado":"Pierre, estrangeiro, nacional e residente no país Alfa, veio ao Brasil, onde praticou o crime de homicídio contra Bruna, cidadã brasileira. Em seguida, Pierre deixou o território nacional e retornou ao seu país de residência. Você, como advogado(a) de Pierre, deve analisar a aplicação da lei penal brasileira ao caso. Assinale a opção que apresenta seu parecer.","alternativas":["Somente a lei do país Alfa é aplicável, pois Pierre saiu do território nacional.","A lei brasileira só é aplicável se o fato também for considerado crime no país Alfa.","A lei brasileira é aplicável, de forma condicionada, diante do fato de a vítima ser brasileira.","A lei brasileira é aplicável, independentemente de o fato ser crime no país de domicílio ou da nacionalidade de Pierre."],"gabarito":"D","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa D. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":17,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":62,"codigo":"OAB44TIPO1-062","area":"Direito Processual Civil","dificuldade":"Médio","enunciado":"Hermes, aposentado com 65 anos de idade, encontrou sua esposa, Diana, 40 anos mais jovem, em plena execução de ato sexual com seu primo, Aquiles, também sexagenário. Tomado pela fúria, Hermes sacou sua arma de fogo e disparou um tiro no pescoço de Aquiles. Hermes possuía 18 munições restantes no cartucho de sua arma, mas conseguiu controlar sua ira e, arrependido, levou Aquiles ao hospital. Apesar de ter sofrido ferimento que lhe gerou perigo à vida, devido ao rápido atendimento médico, Aquiles sobreviveu e, como ficou livre de sequelas, retomou suas ocupações habituais em uma semana. Atualmente, Hermes, Diana e Aquiles mantêm relação de amizade. Com base na situação hipotética narrada, assinale a opção que indica, corretamente, o delito praticado por Hermes.","alternativas":["Tentativa de homicídio.","Crime de lesão corporal de natureza leve.","Crime de lesão corporal de natureza grave.","Crime de exercício arbitrário das próprias razões."],"gabarito":"C","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa C. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":17,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":63,"codigo":"OAB44TIPO1-063","area":"Direito Processual Civil","dificuldade":"Difícil","enunciado":"No dia 10 de agosto de 2023, foi publicada a decisão de rejeição da queixa-crime relativa ao crime de injúria (pena: um a seis meses de detenção), que teria sido praticado por Maria Aparecida contra Augusto. Augusto, inconformado com a sentença, procurou você, como advogado(a), para se insurgir contra a decisão de rejeição de exordial acusatória. Assinale a opção que indica, corretamente, o recurso cabível para o caso.","alternativas":["Agravo.","Apelação.","Recurso Inominado.","Recurso em Sentido Estrito."],"gabarito":"B","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa B. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":18,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":64,"codigo":"OAB44TIPO1-064","area":"Direito Penal","dificuldade":"Difícil","enunciado":"Cauã e Mayara são indígenas integrados e mantêm relação íntima de afeto, sendo residentes em comunidade tradicional. Certo dia, motivado por ciúmes, Cauã agrediu Mayara, atingindo-a no rosto, fato que ocasionou uma lesão corporal leve. Sobre a orientação assumida pelo(a) advogado(a) de defesa de Mayara, assinale a afirmativa correta.","alternativas":["A ação penal é pública e incondicionada, por se tratar de disputa sobre direito indígena, de competência da Vara Criminal da Justiça Estadual.","A ação penal depende de representação da ofendida e seguirá o rito do Juizado Especial Criminal, perante a Justiça Federal, pelo fato de envolver indígenas como autor e vítima.","A ação penal é pública e incondicionada, por se tratar de violência doméstica e familiar contra a mulher, e a competência para julgamento é da Justiça Federal, em razão de envolver indígenas.","A ação penal é pública e incondicionada, e a competência para julgamento é do Juizado de Violência Doméstica e Familiar contra a Mulher, ante a relação íntima de afeto existente entre autor e vítima."],"gabarito":"D","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa D. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":18,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":65,"codigo":"OAB44TIPO1-065","area":"Direito Penal","dificuldade":"Fácil","enunciado":"Peterson teve sua prisão temporária decretada pelo prazo de trinta dias, ao ser investigado pela prática do crime de homicídio culposo na direção de veículo automotor, disposto no Art. 302 da Lei nº 9.503/1997 (Código de Trânsito Brasileiro), cuja pena cominada é de dois a quatro anos de detenção. A decisão foi fundamentada na necessidade da coleta de provas imprescindíveis durante a investigação policial. Você foi procurado(a), como advogado(a), para atuar no melhor interesse de Peterson, no primeiro dia da sua prisão. Assinale a opção que apresenta, corretamente, o pedido cabível tendo em vista os interesses de seu cliente.","alternativas":["A liberdade provisória com arbitramento de fiança, pois a pena máxima do crime não ultrapassa quatro anos.","A liberdade provisória com aplicação de medidas cautelares diversas da prisão, pois não demonstrada a imprescindibilidade da medida.","O relaxamento imediato da prisão ilegal, pois o crime de homicídio culposo na direção de veículo automotor não está no rol dos crimes que autorizam a prisão temporária.","O relaxamento da prisão ilegal a partir do quinto dia de prisão, pois a prática do homicídio culposo na direção de veículo automotor não configura crime hediondo e o prazo da prisão temporária deveria ser de 5 dias, e não, de 30 dias."],"gabarito":"C","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa C. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":18,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":66,"codigo":"OAB44TIPO1-066","area":"Direito Penal","dificuldade":"Difícil","enunciado":"André foi denunciado por ter subtraído a bolsa de Márcia, mediante rompimento de obstáculo. A subtração foi legitimamente comprovada no processo, porém, não obstante tenha o rompimento de obstáculo deixado vestígios, não foi realizada qualquer perícia, sem justificativa plausível. Finda a instrução, manifestou-se o Ministério Público pela condenação, conforme a denúncia, sem requerer qualquer diligência. Dada a palavra ao(à) advogado(a) de André, em alegações finais defensivas, este(a) deve requerer","alternativas":["a absolvição sumária de André, por não constituir o fato infração penal.","o afastamento da qualificadora do furto, desclassificando a conduta para furto simples.","a nulidade do processo desde o recebimento da denúncia, a fim de que seja realizada a prova pericial.","a conversão do julgamento em diligência, a fim de que se realize prova pericial para comprovar a existência do rompimento de obstáculo."],"gabarito":"B","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa B. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":18,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":67,"codigo":"OAB44TIPO1-067","area":"Direito Penal","dificuldade":"Médio","enunciado":"Foi oferecida denúncia em face de Samuel, pelo delito de furto, que foi distribuída ao Juízo competente, tendo havido regular instrução processual. Os autos foram conclusos para sentença, porém, o Juiz titular, que presidiu a instrução, afastou-se por dois dias para participar de um curso oficial. Por isso, a Corregedoria do Tribunal designou Juiz substituto para atuar naquele Juízo. O Magistrado substituto prolatou a sentença, condenando Samuel, com base na prova oral colhida, ainda que nenhuma urgência houvesse nesse processo. Com base nas informações do enunciado, assinale a opção que indica a alegação que você, como advogado(a) de Samuel, deve apresentar.","alternativas":["Violação ao princípio da identidade física do Juiz, causa de nulidade relativa da sentença.","Suspeição do Magistrado que prolatou a sentença, como preliminar de mérito na apelação.","Impedimento do Magistrado que prolatou a sentença, causa de nulidade absoluta da decisão.","Violação ao princípio do Juiz Natural, pois deveria ter havido sorteio entre os Juízes substitutos, e não, a designação por livre escolha da Corregedoria do Tribunal."],"gabarito":"A","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa A. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":18,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":68,"codigo":"OAB44TIPO1-068","area":"Direito Penal","dificuldade":"Médio","enunciado":"Flávio foi preso em flagrante junto com outros três indivíduos, todos acusados pela prática do crime de roubo, disposto no Art. 157 do CP. Flávio permaneceu preso preventivamente durante o processo. Na audiência de instrução e julgamento, uma das testemunhas arroladas pela defesa afirmou que, no dia dos fatos, Flávio estava trabalhando na loja de material de construção que funcionava na frente do local onde os autores do fato estavam praticando o crime, e acabou sendo preso junto com os outros acusados. A testemunha também mencionou que a loja possui sistema de monitoramento de segurança, e que o dono da loja guardou imagens desse dia, para fornecê-las em sede policial se isso fosse demandado. O interrogatório dos réus foi regularmente realizado. Diante do fato narrado, assinale a opção que indica, corretamente, a medida jurídica que você, como advogado(a) de Flávio, deve adotar.","alternativas":["Apresentar alegações finais por memoriais, requerendo as imagens da loja.","Requerer diligências para oficiar à loja de material de construções para que forneça as imagens do dia dos fatos.","Apresentar alegações finais orais em audiência, com pedido de absolvição sumária, diante do depoimento da testemunha.","Requerer a nulidade da audiência de instrução e julgamento, pois as imagens da loja não foram apresentadas em sede policial."],"gabarito":"B","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa B. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":19,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":69,"codigo":"OAB44TIPO1-069","area":"Direito Penal","dificuldade":"Fácil","enunciado":"Manoel, mecânico de manutenção, após acidente durante sua atividade remunerada, recebeu benefício por incapacidade temporária durante dois anos. Antes da alta previdenciária, foi encaminhado para a reabilitação profissional, na qual se identificou a necessidade de utilização de prótese e fisioterapia, sem necessidade de transfusão de sangue ou cirurgia, em local conveniado com o INSS. Nesse contexto hipotético, assinale a afirmativa correta.","alternativas":["No seu processo de reabilitação profissional está incluído o transporte, quando necessário.","Manoel poderia se recusar a fazer a reabilitação profissional, pois a lei não a indica como etapa obrigatória a ser observada pelos segurados.","A reabilitação profissional permitirá seu retorno à atividade remunerada, na qual contará com estabilidade provisória de 5 anos.","A reabilitação profissional não compreende o fornecimento de aparelhos de prótese, de órtese e de instrumentos de auxílio para locomoção."],"gabarito":"A","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa A. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":19,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":70,"codigo":"OAB44TIPO1-070","area":"Direito Previdenciário","dificuldade":"Médio","enunciado":"Humberto Alves, profissional liberal, desempenha a atividade de eletricista autônomo, prestando serviço a diversos clientes, todos pessoas físicas, mediante remuneração e sem relação de emprego. Sobre o enquadramento de Humberto Alves como trabalhador autônomo no RGPS, assinale a afirmativa correta.","alternativas":["Ele é segurado obrigatório do Regime Geral de Previdência Social.","Ele não poderá obter aposentadoria por idade ou por incapacidade permanente.","Ele, por não possuir relação de emprego, é dispensado de quaisquer recolhimentos previdenciários.","Ele se qualifica como segurado trabalhador avulso do Regime Geral de Previdência Social."],"gabarito":"A","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa A. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":19,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":71,"codigo":"OAB44TIPO1-071","area":"Direito do Trabalho","dificuldade":"Fácil","enunciado":"Guilherme, engenheiro responsável por obras de infraestrutura, trabalha para uma sociedade empresária há cinco anos. Ao longo dos últimos 4 anos sempre desfrutou de 30 dias de férias corridos. Em janeiro de 2024, ao verificar a incidência de numerosos feriados ao longo do ano, ele pretendeu fracionar suas férias. Assim sendo, procurou você, como advogado(a), para orientá-lo sobre a possibilidade de fracionar os 30 dias de férias a que tem direito. Acerca do interesse do seu cliente, assinale a opção que indica, corretamente, a orientação a ser dada.","alternativas":["Ele não pode fracionar as férias porque não usufruiu desse direito nos últimos quatro anos, mas tem o direito de converter 1/3 em pecúnia.","Ele pode fracionar as férias em 3 períodos de 10 dias consecutivos cada, para fazer coincidir com os numerosos feriados observados ao longo do ano.","Ele pode fracionar as férias em períodos inferiores a cinco dias, contados em dias úteis, de modo a coincidir, ou no início ou no término, com os feriados.","Ele pode fracionar as férias em até 3 períodos, desde que um deles não seja inferior a 14 dias corridos e, os demais, não sejam inferiores a cinco dias corridos, cada um."],"gabarito":"D","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa D. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":19,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":72,"codigo":"OAB44TIPO1-072","area":"Direito do Trabalho","dificuldade":"Médio","enunciado":"Pedro é caixa em um banco comercial desde 2022, e sua jornada contratual é de 2ª a 6ª feira, das 10 às 16 horas, com intervalo de 15 minutos para refeição. Ocorre que, na prática, diante do grande volume de trabalho, Pedro trabalha de 2ª a 6ª feira, das 10 às 18 horas, com intervalo de 15 minutos. Sobre o intervalo, considerando os fatos e a previsão da CLT, assinale a afirmativa correta.","alternativas":["A jornada cumprida por Pedro não credencia qualquer intervalo.","Pedro terá direito a um intervalo de 15 minutos diários, já aproveitado.","Pedro receberá, a título indenizatório, 45 minutos diários com adicional de 50%.","O empregado deverá receber 55 minutos de horas extras diárias acrescidas de 50%."],"gabarito":"C","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa C. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":19,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":73,"codigo":"OAB44TIPO1-073","area":"Direito do Trabalho","dificuldade":"Médio","enunciado":"Eduarda estava radiante porque ficou grávida de seu primeiro filho, um sonho que acalentou durante muitos anos. Ocorre que, em virtude de problemas de saúde, Eduarda sofreu um aborto espontâneo na 6ª semana da gravidez. Sobre a situação de Eduarda, nos termos da CLT, assinale a afirmativa correta.","alternativas":["Ela poderá se afastar do trabalho por um período de 30 dias.","Ela terá direito a um repouso remunerado de duas semanas.","Ela terá direito ao mesmo período da licença-paternidade, ou seja, 5 dias.","Ela não terá direito a qualquer período de repouso, por faltar previsão legal."],"gabarito":"B","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa B. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":19,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":74,"codigo":"OAB44TIPO1-074","area":"Direito do Trabalho","dificuldade":"Médio","enunciado":"Giovana encontra-se em auxílio temporário por incapacidade (auxílio-doença) há 6 anos, permanecendo, basicamente, em sua residência, realizando afazeres domésticos. Não há impossibilidade de Giovana realizar os atos da vida civil de maneira geral, mas está limitada em sua capacidade laborativa. Em 2024, Giovana lembrou que, no mês anterior ao início do seu benefício previdenciário, realizou várias horas extras, que pretende reivindicar judicialmente, e para tanto o(a) procura, como advogado(a), para obter uma orientação. Considerando esses fatos e o entendimento consolidado do TST, assinale a opção que apresenta, corretamente, sua orientação.","alternativas":["Desaconselhável a demanda, porque a prescrição que vier a ser suscitada impedirá a análise do suposto direito.","Haverá prescrição extintiva bienal porque a ação não foi ajuizada nos 2 anos seguintes à concessão do benefício.","A prescrição para quem está recebendo benefício previdenciário é trintenária, daí o pedido de horas extras ser viável.","Não corre prescrição parcial porque o contrato se encontra suspenso e, por isso, a prescrição não flui contra Giovana."],"gabarito":"A","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa A. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":20,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":75,"codigo":"OAB44TIPO1-075","area":"Direito do Trabalho","dificuldade":"Médio","enunciado":"Você foi consultado, na qualidade de advogado(a), por quatro mulheres trabalhadoras (Ligia, Paula, Geórgia e Sílvia), acerca de situações específicas que ocorreram no mercado de trabalho. Ligia indagou sobre um anúncio de emprego para chefe de cozinha que continha expressa referência à preferência por homens. Paula teria sido preterida em promoção, porque estava grávida de 6 meses e entraria em licença-maternidade em pouco tempo. De Geórgia, na entrevista de emprego, foi exigido, como condicionante da contratação, o atestado de que não estaria grávida. Sílvia perguntou acerca de um anúncio de empregos exclusivos para homens, no qual havia a descrição dos serviços como sendo de transporte, armazenagem e movimentação de cargas de 30 kg, sem o auxílio de meios mecânicos. Acerca da sua resposta às quatro consultas, assinale a afirmativa correta.","alternativas":["Todas as exigências são legítimas, porque estão contidas no poder empregatício.","Todas as exigências são ilegítimas, pois violam os direitos da mulher e demonstram discriminação no mercado de trabalho.","As exigências nos casos de Ligia, Paula e Geórgia são ilegais, por violarem direitos das mulheres; em relação ao caso de Sílvia, a exigência é legítima.","As exigências relacionadas a Paula e a Geórgia são ilícitas, pois ferem o direito à maternidade, sendo as demais justificáveis, com base nas naturais exigências do mercado de trabalho."],"gabarito":"C","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa C. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":20,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":76,"codigo":"OAB44TIPO1-076","area":"Direito do Trabalho / Direito Processual do Trabalho","dificuldade":"Difícil","enunciado":"Sandra trabalhou na sociedade empresária Sorvete Saboroso Ltda. por 3 anos, como atendente de loja. Após ser dispensada em 2024, Sandra ajuizou reclamação trabalhista contra a ex-empregadora requerendo equiparação salarial com a funcionária Maria, que exercia a mesma função, mas recebia salário superior. Apresentada a defesa, os pontos controvertidos definidos foram: diferença na perfeição técnica entre as empregadas e diferença superior a quatro anos no tempo de serviço para o empregador. Considerando a distribuição estática do ônus da prova e os termos da CLT, assinale a afirmativa correta.","alternativas":["À empresa caberá provar a diferença na perfeição técnica e a diferença superior a quatro anos no tempo de serviço entre as cotejadas.","À empresa caberá provar a diferença superior a quatro anos no tempo de serviço e, à empregada, a diferença na perfeição técnica.","À empregada caberá provar a diferença superior a quatro anos no tempo de serviço para o empregador e, à empresa, a diferença na perfeição técnica.","À empregada caberá provar a diferença na perfeição técnica e a diferença superior a quatro anos no tempo de serviço entre as cotejadas."],"gabarito":"A","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa A. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":20,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":77,"codigo":"OAB44TIPO1-077","area":"Direito do Trabalho / Direito Processual do Trabalho","dificuldade":"Médio","enunciado":"Você é advogado(a) de uma sociedade empresária que figura como ré em quatro ações na Justiça do Trabalho. Uma ação versa sobre a dispensa de um empregado que aderiu a uma greve. Outra, sobre indenização por dano moral, em razão de suposto assédio moral praticado por um superior hierárquico de um empregado. A terceira versa sobre horas extras. E a quarta, versa exclusivamente sobre cobrança de contribuições previdenciárias supostamente não efetuadas pelo empregador ao longo de um contrato de trabalho de um outro empregado. Sobre a competência da Justiça do Trabalho nas quatro ações apresentadas, assinale a afirmativa correta.","alternativas":["A Justiça do Trabalho é competente para todos os pedidos formulados nas ações.","A competência para o pedido de indenização por danos morais é da Justiça Comum.","A Justiça do Trabalho não tem competência para os dissídios oriundos de direito de greve.","A Justiça do Trabalho é incompetente para julgar o pedido de cobrança de contribuições previdenciárias supostamente não efetuadas pelo empregador."],"gabarito":"D","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa D. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":20,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":78,"codigo":"OAB44TIPO1-078","area":"Direito do Trabalho / Direito Processual do Trabalho","dificuldade":"Difícil","enunciado":"No bojo de uma execução que tramita perante a 100ª Vara do Trabalho de Porto Velho/RO, o Juiz, após conceder vista ao executado, homologou o cálculo apresentado pelo exequente e fixou a dívida em R$ 20.000,00. O executado pretende se valer do parcelamento da dívida na forma do CPC, subsidiariamente aplicado ao Processo do Trabalho. Considerando esses fatos e de acordo com a legislação em vigor, sabendo-se que não há oposição do credor, assinale a afirmativa correta.","alternativas":["O executado poderá honrar a dívida em 5 parcelas iguais e sucessivas e, após garantido o Juízo, apresentar embargos à execução.","O executado depositará 30% da execução acrescido de custas e honorários advocatícios, e o restante, em até seis parcelas mensais, acrescidas de correção monetária e de juros de 1% ao mês.","A pretensão não terá sucesso porque o parcelamento somente é possível quando o valor homologado for o cálculo apresentado pelo executado.","Caberá à sociedade empresária apresentar metade do valor juntamente com uma petição onde irá requerer o parcelamento, devendo pagar o restante em três parcelas iguais e sucessivas."],"gabarito":"B","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa B. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":21,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":79,"codigo":"OAB44TIPO1-079","area":"Direito do Trabalho / Direito Processual do Trabalho","dificuldade":"Médio","enunciado":"Helena foi empregada de uma sociedade empresária de fevereiro de 2022 a janeiro de 2024, quando foi dispensada sob a alegação de justa causa. Ciente de que não fez absolutamente nada de errado, e considerando que sua única testemunha é uma outra ex-funcionária que se encontra enferma e terá pouco tempo de vida, Helena ajuizou, em março de 2024, uma ação para produção antecipada de provas, distribuída por sorteio para a 950ª Vara do Trabalho de São Paulo. Na referida ação foi colhido o depoimento da testemunha, que pouco depois veio a falecer. Arquivada a produção antecipada de provas, Helena pretende ajuizar reclamação trabalhista para anular a justa causa aplicada, valendo-se inclusive do testemunho da finada. Sobre o fato narrado, considerando o disposto na norma de regência, assinale a afirmativa correta.","alternativas":["A ação deverá ser distribuída ao Juízo da 950ª Vara do Trabalho de São Paulo, que é prevento para apreciar a lide.","A reclamação trabalhista será livremente distribuída a uma das Varas do Trabalho de São Paulo.","Qualquer Juízo do Trabalho poderá apreciar a demanda na localidade de São Paulo, exceto a 950ª Vara, que já realizou parte da instrução e formou juízo de valor.","Far-se-á a distribuição por dependência à 950ª Vara do Trabalho de São Paulo, cabendo ao(à) advogado(a) do réu suscitar exceção de suspeição, caso o mesmo Magistrado que instruiu a produção antecipada da prova queira julgar a causa."],"gabarito":"B","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa B. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":21,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 44 Tipo 1","ano":"2025","numero":80,"codigo":"OAB44TIPO1-080","area":"Direito do Trabalho / Direito Processual do Trabalho","dificuldade":"Fácil","enunciado":"Soraya integrava o contrato social de uma sociedade empresária, mas se afastou dela em janeiro de 2019 e registrou sua saída perante a Junta Comercial em dezembro de 2021. Joana foi empregada da sociedade empresária em questão de abril de 2019 a setembro de 2022, tendo ajuizado reclamação trabalhista em outubro de 2023. Obteve vitória judicial e iniciou a execução em janeiro de 2025. Não tendo a sociedade empresária solvabilidade, requereu o direcionamento da execução contra os sócios atuais, sem êxito. Então, requereu que a execução fosse feita em relação à Soraya. Considerando esses fatos e o que prevê a CLT, assinale a afirmativa correta.","alternativas":["É possível a execução de Soraya porque, entre a averbação de sua saída e o ajuizamento da ação, transcorreu prazo inferior a 2 anos.","Uma vez que entre o afastamento de Soraya e o início da execução transcorreu prazo superior a 2 anos, ela não poderá ser executada.","Entre o afastamento de Soraya e o ajuizamento da ação transcorreu prazo superior a 2 anos, pelo que a ex-sócia não poderá ser executada.","Tendo sido sócia à época da prestação dos serviços de Joana, e enriquecido com o seu labor, Soraya pode ser executada a qualquer tempo."],"gabarito":"A","comentario":"Gabarito extraído do gabarito definitivo da FGV/OAB para a prova Tipo 1: alternativa A. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1 - 44º Exame de Ordem Unificado","pagina_pdf":21,"status":"pendente_revisao"}];
const oab45Dados=[{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":1,"codigo":"OAB2025TIPO1-001","area":"Ética Profissional","dificuldade":"Fácil","enunciado":"Os irmãos, Matilde, advogada, e Frederico, consultor de empresas, decidiram firmar sociedade para prestar serviços jurídicos e de consultoria empresarial na capital mineira. Para isso, montaram um escritório em conjunto na cidade de Belo Horizonte, MG, divulgando seus serviços por meio de panfletos e redes sociais (Instagram e LinkedIn), ressaltando a natureza jurídica e empresarial das atividades como um ponto de destaque do escritório. Em relação às regras sobre a atividade privativa de advocacia e à publicidade de serviços advocatícios, conforme o Estatuto da Advocacia e da Ordem dos Advogados do Brasil, assinale a afirmativa correta.","alternativas":["É vedada a divulgação dos serviços advocatícios em conjunto com qualquer outra atividade, inclusive a de consultoria empresarial.","A publicidade conjunta dos serviços advocatícios e empresariais é permitida apenas quando realizada por meio de plataformas digitais, como redes sociais.","Matilde e Frederico podem atuar conjuntamente, já que as atividades jurídicas e de consultoria empresarial possuem afinidade e se complementam.","A divulgação dos serviços advocatícios juntamente com atividades de consultoria empresarial é permitida, desde que os materiais de publicidade sejam sóbrios e não induzam ao erro."],"gabarito":"A","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":3,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":2,"codigo":"OAB2025TIPO1-002","area":"Ética Profissional","dificuldade":"Fácil","enunciado":"Helena concluiu seu mestrado em Administração Pública e acumulou significativo conhecimento jurídico, mas não possui formação em Direito nem inscrição nos quadros da OAB. Apesar disso, ela passou a oferecer consultoria jurídica e a atuar em audiências representando clientes. André, por sua vez, era advogado regularmente inscrito na OAB, porém foi suspenso do exercício profissional por prática de infração disciplinar. Mesmo suspenso, ele continuou a realizar atos privativos da advocacia, tais como peticionar e participar de audiências. Com base nessas situações hipotéticas, assinale a afirmativa correta.","alternativas":["Os atos praticados por André, após a sua suspensão da OAB, são nulos, pois ele está impedido de exercer a advocacia enquanto durar a suspensão.","Os atos privativos da advocacia praticados por Helena, que não possui inscrição na OAB, são válidos, desde que seus clientes a autorizem expressamente, ratificando os atos por ela praticados.","Os atos praticados por Helena são válidos, desde que restritos à consultoria extrajudicial e relacionados à administração pública, uma vez que ela não representa clientes em processos judiciais.","Tanto os atos praticados por Helena quanto os atos praticados por André são anuláveis, porém sujeitos à convalidação, pois a atuação em audiências e a prática de consultoria jurídica, embora preferencialmente exercidas por advogados, podem, excepcionalmente, ser exercidas por pessoa com conhecimento jurídico."],"gabarito":"A","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":3,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":3,"codigo":"OAB2025TIPO1-003","area":"Ética Profissional","dificuldade":"Médio","enunciado":"Tarcísio, advogado trabalhista com mais de 20 anos de experiência, prestou concurso público para a Outorga de Delegações de Serventias Notariais e Registrais e, após aprovação, assumiu um Tabelionato de Notas e Ofício de Registro Civil em uma comarca do mesmo Estado. Ele deseja saber se poderá continuar exercendo a advocacia em causa própria e, além disso, pretende patrocinar uma ação contra a empresa pública estadual responsável pelo fornecimento de água. Sobre incompatibilidades e impedimentos, com base nas disposições do Estatuto da OAB, assinale a afirmativa correta.","alternativas":["Tarcísio poderá exercer a advocacia apenas em causa própria, conforme prevê o Estatuto da OAB, mas estará impedido de advogar contra a empresa pública estadual de fornecimento de água.","Tarcísio poderá advogar livremente, inclusive contra a empresa pública estadual de fornecimento de água, uma vez que o exercício da atividade notarial não gera impedimento para o exercício da advocacia.","Tarcísio está em situação de incompatibilidade total com o exercício da advocacia, sendo vedada a atuação em qualquer causa, inclusive em causa própria, em razão de seu cargo como titular de serventia notarial e registral.","Tarcísio poderá continuar exercendo a advocacia, desde que em causas particulares que não envolvam empresas públicas ou concessionárias de serviço público, estando livre de impedimentos em ações de interesse pessoal."],"gabarito":"C","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":3,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":4,"codigo":"OAB2025TIPO1-004","area":"Ética Profissional","dificuldade":"Médio","enunciado":"A advogada Jéssica foi contratada pela sociedade empresária de telefonia Alfa para trabalhar 10 horas contínuas por dia, de segunda a quinta-feira, totalizando 40 horas semanais. Além disso, o contrato escrito firmado entre Jéssica e a sociedade empresária prevê que, em situações excepcionais, ela deverá trabalhar horas extras, sendo remunerada com um adicional de 50% sobre o valor da hora normal. Jéssica questiona a validade dessas condições contratuais, especialmente em relação à duração da jornada de trabalho e à remuneração das horas extras. Com base no Art. 20 do Estatuto da Advocacia e da OAB, assinale a afirmativa correta.","alternativas":["O contrato de Jéssica é válido, pois a jornada semanal não ultrapassa 40 horas, e as horas extras podem ser remuneradas com um adicional de 50% conforme estipulado no contrato.","A sociedade empresária está correta ao fixar 10 horas de trabalho por dia, desde que Jéssica cumpra apenas quatro dias de trabalho por semana, sem a necessidade de pagamento de horas extras.","O contrato de Jéssica é inválido, pois a jornada diária não pode exceder 8 horas contínuas, e as horas extras devem ser remuneradas com um adicional de 100%, conforme previsto no Estatuto da OAB, independentemente do contrato firmado.","A sociedade empresária está agindo corretamente, pois Jéssica pode trabalhar até 10 horas por dia desde que sua jornada semanal não ultrapasse 40 horas, mas a remuneração das horas extras deveria ser de 100% sobre o valor da hora normal, independentemente do contrato escrito."],"gabarito":"C","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":3,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":5,"codigo":"OAB2025TIPO1-005","area":"Ética Profissional","dificuldade":"Fácil","enunciado":"O jovem Marcos foi contratado como auxiliar de escritório por renomada banca de advocacia. Autodidata e talentoso, Marcos aproveitava os momentos de folga para estudar os processos judiciais patrocinados pelo escritório e, apesar de nunca ter frequentado o curso de graduação em Direito, tornou-se relativamente conhecedor prático de muitos temas jurídicos. Com esse conhecimento, Marcos resolveu se inscrever no Exame da Ordem dos Advogados do Brasil, apresentando, para tanto, diploma falsificado de bacharel em Direito. Após a aprovação, Marcos se inscreveu como advogado na OAB, novamente fazendo uso do referido documento falso. Seis anos após esses fatos, uma denúncia anônima a respeito do ilícito ensejou a instauração do competente processo administrativo disciplinar. Considerando o enunciado e o Estatuto da Advocacia e da Ordem dos Advogados do Brasil, assinale a afirmativa correta.","alternativas":["A gravidade da conduta atribuída a Marcos atrai a competência do Conselho Federal da Ordem dos Advogados do Brasil para apurar e punir a infração disciplinar.","Para a aplicação da sanção correspondente prevista em lei é necessária a manifestação de dois terços dos membros do Conselho Seccional competente.","A sanção disciplinar prevista para a conduta de Marcos é a de suspensão, que deve perdurar até que seja apresentado documento idôneo, cumulada com a aplicação de multa.","A pretensão à punibilidade da infração disciplinar encontra-se prescrita, uma vez que foi ultrapassado o prazo legal de cinco anos, contado da última data em que Marcos fez uso do documento falso."],"gabarito":"B","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":4,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":6,"codigo":"OAB2025TIPO1-006","area":"Ética Profissional","dificuldade":"Médio","enunciado":"Durante muitos an
