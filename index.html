os, João representou Pedro, na condição de seu advogado, em diversas causas. Recentemente, após encerrados todos os vínculos contratuais existentes entre si, Pedro passou a ser investigado pelo suposto cometimento de ilícitos tributários. Sobre esse contexto, de acordo com o Estatuto da Ordem e com o Código de Ética e Disciplina da Ordem dos Advogados do Brasil, assinale a afirmativa correta.","alternativas":["João não poderá ser obrigado a depor como testemunha no curso de eventual processo judicial em face de Pedro, ainda que este expressamente o autorize ou solicite o depoimento do ex-advogado.","João não poderá ser obrigado a depor como testemunha no curso de eventual processo judicial em face de Pedro, exceto se este expressamente o autorizar, ou no caso de solicitação do próprio ex-constituinte.","João poderá ser obrigado a depor sobre fatos que constituam sigilo profissional caso seu depoimento seja considerado imprescindível para a instrução em processos criminais que apurem a prática de crimes dolosos contra a vida.","Considerando que a investigação se iniciou após a extinção da relação profissional existente entre João e Pedro, não há qualquer prerrogativa em favor de João que o escuse da obrigação de depor como testemunha no curso de processo judicial sobre fato relacionado com pessoa de quem já foi advogado."],"gabarito":"A","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":4,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":7,"codigo":"OAB2025TIPO1-007","area":"Ética Profissional","dificuldade":"Fácil","enunciado":"Ana é advogada e acaba de dar à luz seu primeiro filho, a quem ainda amamenta. Ela foi cientificada de que a Sexta Câmara Cível deverá julgar um caso em que é uma das advogadas constituídas pelo recorrente. Sobre a hipótese, assinale a opção que indica o direito que Ana tem assegurado.","alternativas":["Vaga reservada na garagem do Fórum.","Suspensão de prazos processuais, desde que haja notificação por escrito ao cliente.","Entrada em tribunais sem ser submetida a detectores de metais e aparelhos de raios X.","Acesso a creche, onde houver, ou a local adequado para o atendimento das necessidades do bebê."],"gabarito":"D","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":4,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":8,"codigo":"OAB2025TIPO1-008","area":"Ética Profissional","dificuldade":"Médio","enunciado":"Pedro é advogado regularmente inscrito no Conselho Seccional da OAB do Estado Alfa e constituiu uma Sociedade Unipessoal de Advocacia registrada e ativa na mesma unidade federativa. Recentemente, ele foi convidado pelo renomado advogado Abraão para integrar uma Sociedade de Advogados, também com sede no Estado Alfa, na qualidade de sócio. Pedro considerou a proposta promissora e cogita aceitá-la, acreditando que pode participar de ambas as sociedades, desde que evite atuar nos mesmos processos ou contra os interesses de clientes de uma delas. Sobre a decisão de Pedro, com base no Estatuto da Advocacia e da OAB, assinale a afirmativa correta.","alternativas":["Pedro poderá integrar ambas as sociedades, desde que atue em processos distintos e jamais represente partes com interesses opostos.","Pedro poderá aceitar o convite de Abraão apenas se encerrar formalmente a Sociedade Unipessoal de Advocacia que já possui no Estado Alfa.","Pedro poderá participar das duas sociedades se firmar declaração formal de que manterá independência profissional e não haverá conflito de interesses.","Pedro poderá manter a sua sociedade unipessoal e, ao mesmo tempo, integrar a sociedade de Abraão desde que a nova sociedade registre filial em outra área territorial, ainda que continue atuando no Estado Alfa."],"gabarito":"B","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":4,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":9,"codigo":"OAB2025TIPO1-009","area":"Filosofia do Direito","dificuldade":"Médio","enunciado":"Leia o fragmento a seguir. Encontrar uma forma de associação que defenda e proteja as pessoas e os bens de cada associado com toda a força comum, e pela qual cada um, unindo-se a todos, só obedece a si mesmo, permanecendo, assim, tão livre quanto antes. (Jean-Jacques Rousseau) Assinale a opção que indica a forma de associação que, segundo Rousseau, responde a esse problema.","alternativas":["Luta de Classes.","Contrato Social.","União das Nações.","Utilitarismo de Regras."],"gabarito":"B","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":4,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":10,"codigo":"OAB2025TIPO1-010","area":"Direito Constitucional","dificuldade":"Fácil","enunciado":"Considere hipoteticamente que determinado Tribunal, no julgamento de três casos diversos, profere as seguintes decisões: I. Ao analisar determinada lei que diz ser “proibida a entrada de animais em estabelecimentos comerciais”, o Tribunal decide que cães-guias de pessoas com deficiência visual não estão abrangidos pela norma. II. Interpretando lei segundo a qual “é proibido fumar em ambientes fechados”, o Tribunal considera que a proibição deve se limitar ao que está textualmente contido na norma. III. Com base em lei que prevê o “benefício da licença- maternidade à mãe biológica”, o Tribunal defere esse benefício a uma mãe adotiva. Assinale a opção que indica corretamente os tipos de interpretação adotados pelo Tribunal nos casos I, II e III, respectivamente.","alternativas":["Extensiva, teleológica e axiológica.","Axiológica, restritiva e especificadora.","Restritiva, especificadora e extensiva.","Especificadora, restritiva e teleológica."],"gabarito":"C","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":5,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":11,"codigo":"OAB2025TIPO1-011","area":"Direito Constitucional","dificuldade":"Fácil","enunciado":"A Faculdade de Direito da Universidade do Estado Beta, pela primeira vez, publicou edital para o ingresso nos cursos de mestrado e doutorado, contendo sistema de cotas para graduados negros, indígenas, quilombolas e pessoas com deficiência. O edital baseia-se em lei estadual, promulgada no ano passado, que garante, pelo prazo de cinco anos, o acesso diferenciado aos programas de mestrado e doutorado. Indignado com essa regra, um graduado apresentou pedido administrativo visando à modificação do edital, com a exclusão do sistema de cotas. Para tanto, argumentou que ele viola o princípio da isonomia. Diante da polêmica, a Diretora da Faculdade consultou o corpo de advogados da Universidade. Sobre a hipótese apresentada, segundo o sistema jurídico- constitucional brasileiro, assinale a opção que indica o parecer correto que deve ser apresentado.","alternativas":["O acesso diferenciado, como apresentado no edital, só pode ser admitido para as educações básica e superior, sendo expressamente vedada a sua utilização em cursos de pós- graduação.","A diretoria da Faculdade de Direito tem discricionariedade para, livremente, estabelecer critérios para o acesso aos cursos de graduação e pós-graduação para quaisquer grupos sociais, com base na autonomia didático-científica e administrativa de que gozam as universidades públicas.","A realização da dimensão material do princípio da igualdade coaduna-se com a adoção de ações afirmativas que atinja grupos sociais determinados, atribuindo-lhes certas vantagens, normalmente por tempo definido, com vistas à superação de desigualdades decorrentes de situações históricas.","O edital elaborado pela Faculdade de Direito viola o princípio da isonomia formal, princípio constitucional elementar, que tem por função garantir idênticas condições de acesso ao ensino de pós-graduação a todos, relativizando possíveis diferenças culturais, de raça ou mesmo por deficiência."],"gabarito":"C","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":5,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":12,"codigo":"OAB2025TIPO1-012","area":"Direito Constitucional","dificuldade":"Médio","enunciado":"Romualdo, empresário do ramo de supermercados, dirige-se à Prefeitura do Município Alfa e solicita licença para instalar uma loja da sua rede em um bairro específico da cidade. O pedido é negado sob a justificativa de que já existia outro estabelecimento do mesmo ramo na região. Segundo a Prefeitura de Alfa, a concessão de licença afrontaria a Lei Complementar Municipal nº X (LC X/2024), que exige distância mínima de mil metros entre estabelecimentos que comercializem produtos semelhantes. Romualdo, então, procura você, como advogado(a), para analisar a situação com base na ordem jurídico-constitucional brasileira. Assinale a opção que apresenta, corretamente, sua análise sobre a hipótese narrada.","alternativas":["A norma municipal deve ser observada, em respeito à autonomia municipal garantida pela ordem jurídica brasileira.","A LC X é inconstitucional, já que Alfa, por não ser ente federativo, não possui competência legislativa para produzir leis complementares.","A existência de norma legal federal sobre a questão deve ser avaliada, porque, pelo critério hierárquico, esta última prevaleceria sobre a norma municipal.","A abertura do negócio em questão não deve ser restringida, porque a LC X, ao adotar o referido critério geográfico, viola o princípio constitucional da livre concorrência."],"gabarito":"D","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":5,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":13,"codigo":"OAB2025TIPO1-013","area":"Direito Constitucional","dificuldade":"Difícil","enunciado":"Marcos, que tem 56 anos de idade, é amigo de Joana, que já completou 58 anos de idade. Ambos, em disputas judiciais contra o Estado Alfa, tiveram reconhecidos seus respectivos direitos ao recebimento de valores em face do mencionado ente. Após os trâmites executórios, foi autorizada pelo Presidente do Tribunal de Justiça de Alfa a expedição do precatório de Marcos e, dois meses depois, pela mesma autoridade, autorizada a expedição do precatório de Joana. Ciente de que nenhum dos dois casos caracteriza débito de natureza alimentícia, Joana consultou você, como advogado(a), para saber se ela tem prioridade de recebimento por ser mais velha que Marcos. Assinale a opção que indica, corretamente, sua resposta.","alternativas":["A CRFB/88 não estabelece critérios de prioridade cronológica para o recebimento dos precatórios, quando os créditos não têm natureza alimentícia.","Tanto Joana quanto Marcos, por terem menos de 60 anos, devem receber seus créditos na ordem cronológica de apresentação dos precatórios.","Ambos, em razão da idade, terão direito ao recebimento imediato, sem se submeter à ordem cronológica estabelecida para a sistemática de precatórios pela CRFB/88.","Joana, por ter idade superior à de Marcos, possui prioridade etária sobre ele e, por isso, receberá seus créditos em data anterior à realização do pagamento a Marcos."],"gabarito":"B","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":5,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":14,"codigo":"OAB2025TIPO1-014","area":"Direito Constitucional","dificuldade":"Médio","enunciado":"Carlos Frederico, Deputado Estadual no Estado Alfa, apresentou projeto de lei que versa sobre tema que, embora considerado de grande relevância, não se enquadra no rol de matérias de competência legislativa expressa de qualquer dos entes federativos (União, Estados, Distrito Federal e Municípios). Por essa razão, alguns dos seus colegas deputados suscitaram a possível incompetência da Assembleia Legislativa de Alfa para legislar sobre o tema. Para esclarecer a dúvida, o Procurador-Geral da Assembleia Legislativa foi chamado a se manifestar. Assinale a opção que apresenta, segundo o sistema jurídico- constitucional brasileiro, o esclarecimento prestado.","alternativas":["A Assembleia Legislativa do Estado Alfa pode legislar sobre a matéria.","O projeto de lei é inconstitucional, porque a competência legislativa sobre a matéria é exclusiva da União.","A omissão constitucional permite concluir que se está diante de matéria de interesse local, de competência municipal.","A constitucionalidade do projeto de lei somente será reconhecida se, aprioristicamente, a Assembleia Legislativa de Alfa solicitar autorização ao Congresso Nacional para a respectiva tramitação."],"gabarito":"A","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":6,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":15,"codigo":"OAB2025TIPO1-015","area":"Direito Constitucional","dificuldade":"Difícil","enunciado":"A Lei Federal nº 1.079/1950 define os crimes de responsabilidade praticados pelo Presidente da República e traz normas regulando o respectivo processo. Há poucos meses, o Diretório Nacional do Partido Político Alfa consultou você, como advogado(a), sobre a possibilidade de ingressar com Ação Direta de Inconstitucionalidade (ADI) para impugnar alguns dispositivos da Lei nº 1.079/1950 que considerava incompatíveis com a ordem constitucional. Sobre a hipótese apresentada, assinale a afirmativa correta.","alternativas":["Como a Lei nº 1.079/1950 foi recepcionada pela ordem constitucional vigente, continuando a produzir efeitos nas últimas décadas, a Ação Direta de Inconstitucionalidade é a via de controle objetivo adequada para impugná-la.","Diante da fungibilidade reconhecida pelo Supremo Tribunal Federal entre a Ação Direta de Inconstitucionalidade e a Arguição de Descumprimento de Preceito Fundamental, admite-se, em qualquer caso, a conversão de uma via impugnativa em outra.","Embora seja cabível o ajuizamento de Ação Declaratória de Constitucionalidade em face da Lei nº 1.079/1950, para reconhecer a compatibilidade de seus dispositivos com a CRFB/88, a Ação Direta de Inconstitucionalidade não se presta a impugnar dispositivos de lei pré-constitucional.","A Ação Direta de Inconstitucionalidade não é a via de controle objetivo adequada para impugnar os dispositivos da Lei nº 1.079/1950, e, por se tratar de erro grosseiro, o Supremo Tribunal Federal não admite sua fungibilidade com a Arguição de Descumprimento de Preceito Fundamental."],"gabarito":"D","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":6,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":16,"codigo":"OAB2025TIPO1-016","area":"Direito Constitucional","dificuldade":"Médio","enunciado":"Mariana, que nasceu no Brasil, decidiu adquirir a nacionalidade de um país asiático. Embora este país não tivesse imposto condições para sua permanência no respectivo território ou para o exercício dos direitos civis, ela acreditava que essa decisão facilitaria sua circulação pelo continente asiático, já que tinha o propósito de explorar vários sítios montanhosos. No entanto, ao retornar ao Brasil neste mês, Mariana foi informada de que essa escolha pode resultar na perda de sua nacionalidade brasileira. Preocupada, ela consultou você, como advogado(a), para esclarecer a sua situação, explicando que nunca realizou qualquer pedido expresso para abdicar da nacionalidade brasileira. Sobre a situação de Mariana, de acordo com o sistema jurídico- constitucional brasileiro, assinale a afirmativa correta.","alternativas":["Ela mantém a nacionalidade brasileira, pois, no caso em análise, apenas o pedido expresso de perda da nacionalidade pode gerar tal consequência.","Ela não perde a nacionalidade brasileira, desde que comunique previamente ao governo brasileiro que não deseja renunciar a ela ao adquirir a nova nacionalidade.","Ela perde a nacionalidade brasileira apenas se deixar de exercer direitos políticos e civis no Brasil, como o voto ou a manutenção de propriedades, após adquirir a nova nacionalidade.","Ela perde a nacionalidade brasileira, pois ao adquirir voluntariamente outra nacionalidade, sem imposição do Estado estrangeiro, ela perde automaticamente a nacionalidade originária."],"gabarito":"A","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":6,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":17,"codigo":"OAB2025TIPO1-017","area":"Direitos Humanos","dificuldade":"Difícil","enunciado":"Na condição de advogado(a) especializado(a) na defesa de Direitos Humanos, você é procurado(a) por membros de uma comunidade de povos originários, interessados em regularizar a situação das terras por eles tradicionalmente ocupadas. A referida comunidade pretende obter esclarecimentos acerca do seu eventual direito de propriedade, bem como quanto à forma de sua utilização. Em relação ao tema, de acordo com o sistema regional americano e o ordenamento jurídico nacional, assinale a opção que apresenta, corretamente, o seu esclarecimento.","alternativas":["De acordo com o ordenamento jurídico interno, aos povos originários é assegurado o usufruto exclusivo das riquezas do solo por eles tradicionamente ocupado. Nesse sentido, pode a comunidade, exercendo o seu direito à autodeterminação, cultivar organismos geneticamente modificados em suas terras.","A Convenção nº 169, da Organização Internacional do Trabalho, reconhece expressamente o direito de propriedade dos povos originários em relação às terras que tradicionalmente ocupam.","Ao reconhecer, em favor das comunidades de povos originários, os direitos originários sobre as terras que tradicionalmente ocupam, o ordenamento jurídico nacional admite que tais áreas possam ser objeto de contrato de arrendamento, desde que celebrado pelos próprios, adequadamente representados e informados.","Embora a Corte Interamericana de Direitos Humanos não reconheça o direito de propriedade coletiva em favor das comunidades de povos originários quanto às terras que tradicionalmente ocupam, a Constituição Federal de 1988 expressamente determinou a outorga do título de propriedade aos povos originários, desde que demonstrada a tradicionalidade da sua ocupação."],"gabarito":"B","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":7,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":18,"codigo":"OAB2025TIPO1-018","area":"Direitos Humanos","dificuldade":"Difícil","enunciado":"De acordo com a jurisprudência da Corte Interamericana de Direitos Humanos, em relação ao Direito à Proteção Judicial, previsto no Art. 25 do Pacto de São José da Costa Rica, assinale a afirmativa correta.","alternativas":["O direito à proteção judicial não se exaure na prestação da tutela judicial cognitiva, sendo imprescindível que o Estado garanta os meios para executar, de maneira efetiva, as suas decisões definitivas.","Trata-se de direito que impõe obrigação meramente instrumental aos Estados-parte. Nesse sentido, é suficiente a previsão de recursos no plano formal para que a garantia seja considerada efetivamente observada.","Com vistas à preservação da soberania dos Estados-parte, caso sejam necessários esclarecimentos quanto à violação ou não por determinado Estado, de suas obrigações internacionais em virtude das atuações de seus órgãos judiciais, não poderá a Corte IDH examinar os processos judiciais internos, devendo se valer de outros elementos de análise.","Nos casos em que se verificou uma situação de graves violações a Direitos Humanos, é obrigação do Estado-parte promover a devida apuração e responsabilização de todos os envolvidos, sejam autoridades oficiais ou particulares. Admite- se, como única justificativa legítima ao não sancionamento dos responsáveis, a concessão de anistia, quando prevista em lei, devidamente aprovada pelo Poder Legislativo competente."],"gabarito":"A","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":7,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":19,"codigo":"OAB2025TIPO1-019","area":"Direito Eleitoral","dificuldade":"Fácil","enunciado":"João, prefeito do Município Alfa, no ano em que seriam realizadas eleições municipais, cedeu, de maneira gratuita, o uso de um prédio público, mais especificamente de uma escola pública, fora do horário de aulas, para que os partidos políticos pudessem promover as convenções partidárias nas quais seriam escolhidos os candidatos ao pleito. Ana, cidadã com elevado senso cívico, consultou você, como advogado(a), sobre a compatibilidade dessa medida com a legislação eleitoral. Em relação à atitude de João, assinale a afirmativa correta.","alternativas":["A decisão proferida gera prejuízo ao erário, pois, embora o prédio público possa ser utilizado pelos partidos políticos para a finalidade indicada, deveria ser pago aluguel.","João decidiu de maneira harmônica com a legislação eleitoral, pois o prédio público não pode ser utilizado para finalidades privadas, estando configurada uma conduta vedada aos agentes públicos em campanhas eleitorais.","A decisão de João mostra-se correta, pois, embora exista a regra geral de que os agentes públicos não podem ceder imóveis públicos em benefício dos partidos políticos, é ressalvada a realização de convenção partidária.","A decisão de João está ajustada à sistemática legal, pois, em prol do princípio democrático, os imóveis públicos devem ser cedidos, para fins exclusivamente eleitorais, aos candidatos, aos partidos e às coligações que os solicitem."],"gabarito":"C","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":7,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":20,"codigo":"OAB2025TIPO1-020","area":"Direito Eleitoral","dificuldade":"Médio","enunciado":"João, que acabara de assumir a função de tesoureiro do partido político Alfa, solicitou explicações ao(à) advogado(a) do partido a respeito dos cuidados que deveria ter na aplicação dos recursos oriundos do Fundo Especial de Assistência Financeira aos Partidos Políticos (Fundo Partidário), mais especificamente em relação à existência de plena liberdade valorativa do partido político na aplicação desses recursos e à necessidade, ou não, de prestação de contas. Sobre a hipótese formulada, assinale a afirmativa correta.","alternativas":["Os recursos devem ser aplicados por Alfa, nas finalidades autorizadas em lei, sendo objeto de prestação de contas à Justiça Eleitoral, embora o referido Fundo receba tanto valores de origem pública como privada.","Os recursos recebidos por Alfa devem ser aplicados nas finalidades autorizadas em lei, sendo objeto de prestação de contas apenas ao seu órgão de direção nacional, embora o referido Fundo seja formado a partir das sobras da arrecadação da União.","Como Alfa tem personalidade jurídica de direito privado, pode aplicar livremente os recursos recebidos nas finalidades previstas em seu estatuto e deve prestar contas à Justiça Eleitoral, quando se comprometer a realizar um projeto de interesse público.","Os recursos devem ser aplicados por Alfa nas finalidades livremente autorizadas em seu estatuto, mas, como os valores remetidos ao referido Fundo são captados pela Justiça Eleitoral com as multas eleitorais e as dotações da União, deve haver prestação de contas ao Tribunal de Contas da União."],"gabarito":"A","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":7,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":21,"codigo":"OAB2025TIPO1-021","area":"Direito Internacional","dificuldade":"Difícil","enunciado":"Hector, cidadão espanhol, chega ao Brasil, em janeiro de 2024, para passar as férias de verão em Salvador. Contudo, é proibido de ingressar no país pela Polícia Federal do Aeroporto Internacional de Salvador, porque, em janeiro de 2020, Hector foi expulso do Brasil e tal medida fora conjugada com o impedimento de reingresso por cinco anos. Sobre a hipótese apresentada, assinale a opção que indica, corretamente, a medida de retirada compulsória a ser aplicada a Hector.","alternativas":["Extradição.","Expulsão.","Deportação.","Repatriação."],"gabarito":"D","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":8,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":22,"codigo":"OAB2025TIPO1-022","area":"Direito Internacional","dificuldade":"Médio","enunciado":"Sobre a concessão de visto, com base na Lei de Migração e na Constituição da República, assinale a afirmativa correta.","alternativas":["O visto de visita poderá ser concedido ao imigrante que venha ao Brasil com o intuito de estabelecer residência por tempo indeterminado para tratar de sua saúde.","O visto de visita não será exigido do estrangeiro em caso de escala ou conexão em território nacional, ainda que o visitante deixe a área de trânsito internacional por algumas horas.","Entre as hipóteses de concessão do visto temporário está a do imigrante que vem ao Brasil com o intuito de estabelecer residência por tempo determinado e que venha praticar atividade religiosa ou serviço voluntário.","O visto diplomático não poderá ser estendido aos dependentes das autoridades e funcionários estrangeiros que viajem ao Brasil em missão oficial de caráter transitório ou permanente, representando Estado estrangeiro ou organismo internacional."],"gabarito":"C","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":8,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":23,"codigo":"OAB2025TIPO1-023","area":"Direito Tributário","dificuldade":"Fácil","enunciado":"Apesar de todas as despesas realizadas no primeiro semestre do ano pela Secretaria de Obras do Estado Alfa estarem devidamente previstas na sua lei orçamentária anual, o procedimento formal para sua realização não vinha atendendo integralmente as etapas e regras da legislação vigente, uma vez que todos os pagamentos aos fornecedores e empreiteiros estavam sendo realizados de maneira direta e antecipada ao vencedor da licitação, logo após a conclusão do edital de licitação. Diante desse cenário, à luz da Lei nº 4.320/1964, assinale a afirmativa correta.","alternativas":["Inicialmente deve ser feito o empenho da despesa contratada e, em seguida, salvo casos especiais previstos em legislação específica, a emissão da nota de empenho; após a verificação da entrega do material e da conclusão integral da obra deve haver a liquidação; por último, será emitida a ordem de pagamento para a empresa credora.","Após a entrega do material e a conclusão da obra certificada pelo servidor público responsável, será emitida a ordem de pagamento, a qual será utilizada pelo credor para sacar o valor devido na instituição bancária oficial, não sendo nos dias de hoje mais necessário o empenho e a liquidação.","Tendo havido licitação regular para a contratação de uma empresa para a realização de obras, sendo esta de notória reputação, ficam dispensados empenho e a liquidação, bastando que seja assinado o contrato da obra e apresentada a planilha de custos para que o pagamento seja feito antecipadamente, ficando a contratada responsável pela imediata devolução caso a obra não seja concluída.","Após a realização da licitação regular e contratação formal, mas antes do início da obra, deverá ser obtida autorização prévia do Tribunal de Contas para que este órgão fiscalizador realize o empenho e emita a nota de empenho; em seguida, o órgão contratante deverá acompanhar a entrega do material e a realização da obra, ficando a cargo deste apenas a liquidação e emissão da ordem de pagamento."],"gabarito":"A","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":8,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":24,"codigo":"OAB2025TIPO1-024","area":"Direito Tributário","dificuldade":"Médio","enunciado":"O Estado Alfa, ao final do segundo bimestre de um determinado exercício financeiro, percebeu que a realização da receita poderia não comportar o cumprimento das metas de resultado primário estabelecidas no Anexo de Metas Fiscais. Em razão disso, o Poder Executivo teve de realizar, nos trinta dias subsequentes, limitação de empenho e movimentação financeira. Diante desse cenário, assinale a opção que apresenta, corretamente, a despesa que poderia ser objeto de tal limitação de empenho.","alternativas":["A despesa que constitua obrigação legal do ente estadual.","A despesa com o pagamento do serviço da dívida estadual.","A despesa com desenvolvimento científico custeada por fundo criado para tal finalidade.","A despesa com aquisição de material de consumo para setores administrativos do Poder Executivo."],"gabarito":"D","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":8,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":25,"codigo":"OAB2025TIPO1-025","area":"Direito Tributário","dificuldade":"Médio","enunciado":"Nova lei federal, ampliando o prazo de pagamento de certo tributo federal, foi publicada em 15/06/2023. Contudo, seu texto foi omisso quanto ao momento em que entraria em vigor. Diante desse cenário de omissão, assinale a opção que indica, corretamente, o momento em que tal lei tributária entrará em vigor, em todo o país.","alternativas":["30 dias depois de oficialmente publicada.","45 dias depois de oficialmente publicada.","90 dias depois de oficialmente publicada.","no 1º dia do exercício seguinte àquele em que foi oficialmente publicada."],"gabarito":"B","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":9,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":26,"codigo":"OAB2025TIPO1-026","area":"Direito Tributário","dificuldade":"Difícil","enunciado":"O Estado Alfa publicou, em 29/12/2024, uma nova lei ordinária, instituindo a incidência de IPVA sobre a propriedade de veículos automotores aéreos e aquáticos, com fato gerador ocorrendo no dia 1º de janeiro de cada ano. A partir do mês de janeiro de 2025, o Fisco Estadual começou a enviar aos contribuintes carnês de pagamento de IPVA incidente sobre tais veículos aéreos e aquáticos, com data de pagamento até o final de fevereiro de 2025. Acerca deste cenário, assinale a afirmativa correta.","alternativas":["A cobrança poderia ser feita a partir de 01/01/2025.","As novas hipóteses de incidência de IPVA são inconstitucionais.","A cobrança poderia ser feita apenas decorridos 90 dias da data em que foi publicada a nova lei.","A lei somente poderia instituir a incidência de IPVA sobre a propriedade de veículos automotores aquáticos."],"gabarito":"C","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":9,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":27,"codigo":"OAB2025TIPO1-027","area":"Direito Tributário","dificuldade":"Médio","enunciado":"No Estado Alfa, a lei estadual do Imposto sobre a Transmissão Causa Mortis e Doações (ITCMD) determina que o lançamento deste tributo se faz por homologação via Internet. Por isso, dentro do prazo previsto em lei para comunicar o óbito à Secretaria Estadual de Fazenda, Júlia, filha e única herdeira de Maria, apresentou ao Fisco estadual a declaração correta de todos os bens que recebera a título de transmissão causa mortis de sua mãe, sendo o tributo integralmente devido ao Estado Alfa. O sistema on-line da Secretaria de Fazenda Estadual gerou a guia de pagamento do ITCMD, com vencimento em 07/03/2024. Contudo, o pagamento dessa guia não foi efetuado. Diante deste inadimplemento, assinale a opção que indica a partir de quando é contado o prazo prescricional para cobrança deste tributo.","alternativas":["Da data do óbito da mãe de Júlia, seu fato gerador.","Do dia seguinte ao vencimento previsto na guia de pagamento.","Do primeiro dia do exercício seguinte àquele do óbito da autora da herança.","Da data em que Júlia entrega a declaração ao Fisco estadual, seu fato gerador."],"gabarito":"B","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":9,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":28,"codigo":"OAB2025TIPO1-028","area":"Direito Tributário","dificuldade":"Difícil","enunciado":"Educando 100%, associação civil sem fins lucrativos, portadora de Certificado de Entidade Beneficente de Assistência Social (CEBAS), contratou a Construtora ABC Ltda. a fim de que esta realizasse a construção de um novo edifício para a entidade beneficente. Sobre o serviço de realização de obras incide o Imposto sobre Serviços (ISS), e a lei local, instituidora do tributo, estabeleceu que é obrigação da tomadora do serviço a retenção do ISS devido. Contudo, Educando 100% não reteve o ISS devido sobre a obra. A construtora prestadora do serviço também não efetuou o pagamento do ISS devido. Sobre a pretensão do Fisco de fazer a cobrança da dívida tributária, assinale a afirmativa correta.","alternativas":["A imunidade de Educando 100% impede que incida o ISS nessa prestação de serviços de obras.","Como responsável tributária pela retenção do ISS devido, Educando 100% pode ser cobrada pelo Fisco municipal.","Educando 100%, na condição de contribuinte, pode ser cobrada pelo Fisco municipal quanto a tais débitos de ISS.","Educando 100% é uma entidade imune, de modo que não se aplica a ela a lei local que estabelece a obrigação de o tomador do serviço reter o ISS."],"gabarito":"B","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":9,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":29,"codigo":"OAB2025TIPO1-029","area":"Direito Tributário","dificuldade":"Fácil","enunciado":"O Município Alfa, desejando aumentar sua arrecadação tributária, instituiu por lei ordinária municipal, publicada em 10/07/2025, um novo imposto sobre a concessão de autorizações para localização e funcionamento de estabelecimentos comerciais. A lei estabelece que produziria efeitos a partir de 01/01/2026. A sociedade empresária ABC Ltda., com estabelecimento comercial no Município Alfa, irresignada com a nova exação, contratou você, como advogado(a), para ajuizar ação declaratória tributária antes do início da vigência da nova lei, visando garantir que não seja cobrada quanto ao novo imposto municipal. Diante desse cenário, assinale a afirmativa correta.","alternativas":["A ação correta a ser manejada seria a ação anulatória tributária.","O novo imposto só pode ser criado por meio de uma lei complementar municipal, e não por mera lei ordinária.","A anterioridade nonagesimal não foi obedecida, pois a lei apenas entraria em vigor 90 dias após 01/01/2026.","O Município Alfa não pode criar esse novo imposto, por não estar compreendido em sua competência tributária constitucional."],"gabarito":"D","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":9,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":30,"codigo":"OAB2025TIPO1-030","area":"Direito Administrativo","dificuldade":"Médio","enunciado":"José é servidor público estadual lotado em um cargo que exerce o controle interno de determinado órgão administrativo. No exercício de suas atribuições, ele se deparou com um processo administrativo, no qual foi questionada a validade de certo ato administrativo que beneficia a sociedade empresária Calêndula, o qual apresentou vício na sua constituição, mas que está produzindo seus efeitos. Em razão disso, ele tem fundadas dúvidas acerca da necessidade de invalidar o ato administrativo e sobre as providências necessárias para tanto, dúvidas essas que levaram José a consultar a sua assessoria jurídica. À luz do disposto no Decreto-Lei nº 4.657/1942 (LINDB), com a redação conferida pela Lei nº 13.655/2018, que introduziu as disposições sobre segurança jurídica e eficiência na criação e na aplicação do direito público no ordenamento pátrio, assinale a opção que indica o esclarecimento correto prestado pela assessoria jurídica.","alternativas":["A existência de vício exige que a Administração decrete a invalidação do ato administrativo, com efeitos retroativos, ainda que tal decisão imponha aos sujeitos atingidos ônus e perdas que, em função das peculiaridades do caso, sejam anormais ou excessivos.","Constatado que o vício é insanável, a decisão na esfera administrativa que venha a decretar a invalidação de tal ato administrativo, que ainda não exauriu os seus efeitos, deverá indicar de modo expresso as suas consequências jurídicas e administrativas.","A verificação de qualquer vício em ato administrativo deve ensejar necessariamente a sua invalidação, independentemente do momento em que for verificado e de possíveis alternativas para melhor atender ao interesse público, ainda que tais alternativas possam justificar a sua convalidação.","No âmbito da esfera controladora, observado o vício, é imperiosa a anulação do ato, a ser prontamente realizada de ofício pela Administração, o que prescinde da observância da ampla defesa e do contraditório, bem como da justificação acerca da necessidade e adequação de tal invalidação."],"gabarito":"B","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":10,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":31,"codigo":"OAB2025TIPO1-031","area":"Direito Administrativo","dificuldade":"Médio","enunciado":"A sociedade empresária XYZ, após o regular processo licitatório, celebrou contrato administrativo com o Estado Alfa, sem previsão de cláusula compromissória ou compromisso arbitral. Contudo, sem qualquer justificativa, a Administração Pública, por meio de uma ordem escrita, suspendeu a execução do contrato, o que já perdura por seis meses. Sendo assim, a entidade privada procurou você, para, na qualidade de advogado(a) auxiliá-la a equacionar a questão posta. Nesse cenário, considerando as disposições da Lei nº 14.133/2021 (Lei de Licitações e Contratos Administrativos), assinale a afirmativa correta.","alternativas":["A extinção do contrato administrativo não é juridicamente cabível, pois a suspensão da sua execução não ultrapassou o prazo de 12 meses.","A sociedade empresária XYZ não tem direito à extinção do contrato administrativo, pois, como o Estado Alfa suspendeu a sua execução, inexiste inadimplemento contratual.","A extinção do contrato administrativo de forma consensual é vedada por expressa previsão legal, a qual impede o emprego da conciliação e da mediação no âmbito da Administração Pública.","A entidade privada contratada tem direito à extinção do contrato administrativo, que poderá ser consensual, por acordo entre as partes, por conciliação, por mediação ou por comitê de resolução de disputas, desde que haja interesse da Administração ou, ainda, por meio de decisão judicial."],"gabarito":"D","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":10,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":32,"codigo":"OAB2025TIPO1-032","area":"Direito Administrativo","dificuldade":"Difícil","enunciado":"Caio, político em primeira legislatura, responde, em Juízo, por ato doloso de improbidade administrativa que teria causado prejuízo ao erário. Registre-se que os fatos apurados remontam a fevereiro de 2024. No curso da demanda, após apresentar contestação, suscitando questões preliminares, Caio foi informado de que o Ministério Público requereu a decretação de indisponibilidade de todos os seus bens, englobando, inclusive, o imóvel onde reside, tido como bem de família e adquirido licitamente. Nesse contexto, preocupado com as consequências que um potencial resultado desfavorável na ação judicial geraria na sua carreira política, Caio procurou você, como advogado(a), afirmando que estaria disposto a celebrar um acordo de não persecução cível com o Ministério Público e que possui condições financeiras de ressarcir até 80% do dano causado ao erário. Buscou, ainda, a sua orientação jurídica sobre o processo em curso. Nesse cenário, considerando as disposições da Lei nº 8.429/1992 (Lei de Improbidade Administrativa), assinale a opção que apresenta, corretamente, sua orientação.","alternativas":["A defesa técnica poderá interpor agravo de instrumento, caso o Juiz afaste as questões preliminares suscitadas por Caio em sua contestação.","O Juiz poderá, convencido da probabilidade da ocorrência do ato de improbidade administrativa descrito na petição inicial, decretar a indisponibilidade dos bens de Caio, inclusive o bem de família.","Caio sendo condenado em sentença transitada em julgado, além da perda dos valores acrescidos ilicitamente ao patrimônio, estará sujeito à perda da função pública desempenhada e à cassação dos direitos políticos.","O Ministério Público e Caio poderão celebrar acordo de não persecução cível, desde que, além do ressarcimento de 80% do dano causado ao erário, o acusado confesse, formalmente, a prática do ato ímprobo."],"gabarito":"A","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":10,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":33,"codigo":"OAB2025TIPO1-033","area":"Direito Administrativo","dificuldade":"Difícil","enunciado":"Matheus, servidor público federal estável, ocupante de cargo público no Ministério do Meio Ambiente, externou o desejo de concorrer, nas próximas eleições, ao cargo de Prefeito do Município Alfa, cidade onde nasceu. Encorajado pelos amigos, Matheus, leigo na seara jurídica, entrou em contato com você para que, na qualidade de advogado(a), o orientasse sobre o exercício do mandato de prefeito e sua condição de servidor público federal. Nesse cenário, considerando as disposições da Lei nº 8.112/1990, que dispõe sobre o regime jurídico dos servidores civis da União, das autarquias e das funções públicas federais, assinale a afirmativa correta.","alternativas":["Investido no mandato de Prefeito do Município Alfa, Matheus ficará afastado do cargo público ocupado no Ministério do Meio Ambiente, sendo-lhe facultado optar pela sua remuneração.","Como os servidores públicos federais não podem dispor de filiação político-partidária, Matheus deverá exonerar-se do cargo público ocupado no Ministério do Meio Ambiente para que possa concorrer nas eleições municipais.","Havendo compatibilidade de horários e sendo investido no mandato de Prefeito do Município Alfa, Matheus perceberá as vantagens do cargo público ocupado no Ministério do Meio Ambiente, sem prejuízo da remuneração do cargo eletivo.","Matheus, a partir do dia primeiro de janeiro do ano da eleição, terá direito, por se tratar de servidor público federal estável, à licença para o exercício de atividade política, que perdurará até o dia subsequente à data da eleição, assegurados os vencimentos do cargo efetivo."],"gabarito":"A","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":11,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":34,"codigo":"OAB2025TIPO1-034","area":"Direito Administrativo","dificuldade":"Médio","enunciado":"Lucas, servidor público estatutário do Município Alfa, procurou Rodrigo, proprietário do estabelecimento comercial XYZ, especializado na manutenção de automóveis, para saber se ele tinha interesse em firmar um contrato administrativo, no valor de R$ 60.000,00 (sessenta mil reais), para a prestação de serviços de manutenção de veículos automotores de propriedade do Município. Antes de prosseguir nas tratativas, Rodrigo entrou em contato com você para, na qualidade de advogado(a), prestar-lhe a adequada consultoria jurídica. Considerando as disposições da Lei nº 14.133/2021 (Lei de Licitações e Contratos Administrativos), assinale a afirmativa que apresenta, corretamente, a sua orientação.","alternativas":["Em razão da inexigibilidade da licitação, é admissível a contratação direta entre o Município Alfa e o particular Rodrigo, desde que seja apresentada justificativa de preço.","O Município Alfa deverá realizar o processo licitatório para celebrar o contrato administrativo, vedando-se a contratação direta no cenário narrado, por ausência de previsão legal.","Admitir-se-á a contratação direta entre o Município Alfa e o particular Rodrigo, desde que o estabelecimento comercial XYZ esteja situado nos limites territoriais do ente federativo contratante.","É possível a contratação direta entre o Município Alfa e o particular Rodrigo, para a prestação de serviços de manutenção de veículos automotores de propriedade do ente federativo, por ser caso de licitação dispensável."],"gabarito":"D","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":11,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":35,"codigo":"OAB2025TIPO1-035","area":"Direito Ambiental","dificuldade":"Médio","enunciado":"A sociedade empresária Algoz, ao realizar o tratamento de determinados produtos químicos, causou danos ambientais que comprometeram o solo de sua propriedade, sendo certo que tanto o Estado X quanto o Município Y foram omissos no dever de fiscalização. Após a poluidora mascarar os aludidos danos, a propriedade foi vendida para a sociedade empresária Crédula, que não tinha conhecimento de tais fatos. Diante da situação descrita, o Ministério Público ajuizou ação civil pública com vistas a obter a responsabilização civil em decorrência dos danos ambientais, sendo certo que incluiu no polo passivo da demanda a sociedade empresária Crédula, atual proprietária, a sociedade Algoz, que praticou a conduta lesiva ao meio ambiente, bem como o Estado X e o Município Y, pela omissão deles no dever de fiscalização. Considerando os dados apresentados, assinale a afirmativa correta.","alternativas":["Os entes federativos têm legitimidade passiva para a demanda, na medida em que sua conduta omissiva não pode ensejar a responsabilização civil.","Apenas a sociedade empresária Algoz tem legitimidade passiva para a demanda, na medida em que foi a única que praticou a conduta comissiva que ensejou o dano ambiental.","A sociedade empresária Crédula não pode ser civilmente responsabilizada pelos danos ambientais em comento, de modo que não poderia constar do polo passivo da demanda.","Tanto as referidas sociedades quanto os entes federativos têm legitimidade passiva para a demanda, pois são passíveis de responsabilização civil todos aqueles que concorrerem para o dano ambiental, comissiva ou omissivamente, sendo certo que a obrigação ambiental é de natureza propter rem."],"gabarito":"D","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":11,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":36,"codigo":"OAB2025TIPO1-036","area":"Direito Ambiental","dificuldade":"Difícil","enunciado":"A sociedade empresária XYZ, com sede no Estado Alfa, pretende desenvolver atividade econômica potencialmente causadora de significativa degradação ambiental nos territórios dos Estados Alfa e Beta. Dessa forma, com o objetivo de cumprir a legislação ambiental, a entidade contratou você para, na qualidade de advogado(a), dar entrada com o requerimento de licenciamento ambiental junto ao(s) órgão(s) competente(s), auxiliando-a a obter todas as licenças ambientais necessárias. Nesse cenário, considerando as disposições da Resolução nº 237/1997 do Conselho Nacional do Meio Ambiente (Conama), que versa sobre o licenciamento ambiental, assinale a opção que apresenta, corretamente, a sua orientação.","alternativas":["O licenciamento ambiental deverá ser realizado pelo órgão ambiental competente do Estado Alfa, onde está localizada a sede da sociedade empresária XYZ.","Caberá aos órgãos ambientais dos Estados Alfa e Beta, em conjunto, procederem ao licenciamento ambiental da atividade econômica que a sociedade empresária XYZ pretende desenvolver.","Compete ao Instituto Brasileiro do Meio Ambiente e dos Recursos Naturais Renováveis (Ibama), autarquia de natureza federal, o licenciamento ambiental da atividade econômica que será desenvolvida pela sociedade empresária XYZ.","A sociedade empresária XYZ poderá, a seu critério, requerer o licenciamento ambiental junto ao órgão ambiental competente do Estado Alfa ou do Estado Beta, já que a atividade econômica será desenvolvida nos dois entes federativos."],"gabarito":"C","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":11,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":37,"codigo":"OAB2025TIPO1-037","area":"Direito Civil","dificuldade":"Fácil","enunciado":"Dagoberto celebrou contrato por meio do qual se comprometeu a comprar a casa de Marina, se seu investimento em ações atingisse um rendimento acima de 10% no dia 20 daquele mês. No dia indicado por Dagoberto, restou comprovado que suas ações renderam 15%, mas ele se negou a comprar o imóvel. Em razão disso, Marina procurou você, como advogado(a), para saber como proceder frente ao caso narrado. Assinale a opção que indica a correta orientação jurídica que você prestou.","alternativas":["Ela pode exigir a compra da casa, porque o encargo foi cumprido.","Ela não pode exigir a compra da casa, por se tratar de termo incerto.","Ela pode exigir a compra da casa, já que se implementou a condição suspensiva.","Ela não pode exigir a compra da casa, pois a condição do negócio é puramente potestativa."],"gabarito":"C","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":12,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":38,"codigo":"OAB2025TIPO1-038","area":"Direito Civil","dificuldade":"Médio","enunciado":"Mateus e Pedro adquiriram um veículo de Joana, figurando ambos como devedores solidários. Foi pactuado que o pagamento seria feito no prazo de 30 dias, contado da data da celebração do contrato. Ocorre que, dez dias após o acordo, Mateus faleceu, deixando dois herdeiros. Sobre as obrigações de cada um dos herdeiros de Mateus, assinale a afirmativa correta.","alternativas":["Estão obrigados a pagar a dívida como um todo, se a obrigação for divisível, com direito de ação regressiva contra Pedro.","Estão desobrigados de qualquer pagamento, pois a responsabilidade pelo pagamento não é transmitida aos herdeiros.","São obrigados, individualmente, a pagar a dívida que corresponder ao devedor solidário falecido, pois a obrigação é divisível.","São obrigados a pagar apenas a parte que corresponder à sua cota hereditária, pois a obrigação é divisível."],"gabarito":"D","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":12,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":39,"codigo":"OAB2025TIPO1-039","area":"Direito Civil","dificuldade":"Difícil","enunciado":"No último domingo, após uma partida de futebol, Ariano ofereceu carona em seu carro a João, seu fraterno amigo. Ao transitar por certa avenida em velocidade muito acima da permitida, o veículo conduzido por Ariano colidiu com um poste. João, com a colisão, sofreu graves lesões por todo corpo, tendo inclusive que amputar uma perna. A esposa de João, que está grávida, ficou extremamente abalada, encontrando-se internada em Unidade de Terapia Intensiva em um hospital público. A respeito do tema da responsabilidade civil de indenizar, com base nas súmulas do Superior Tribunal de Justiça, assinale a afirmativa correta.","alternativas":["É possível a cumulação das indenizações de dano estético e dano moral eventualmente sofridos por João, em razão das graves lesões sofridas no acidente.","A legitimidade para pleitear a indenização por dano moral é exclusiva de João, sendo inadmissível que sua esposa venha a pleitear perdas e danos pelo acidente.","Mesmo que o transporte realizado por Ariano tenha sido desinteressado e de simples cortesia, ele responde objetivamente pelos danos sofridos por João.","Como se trata de responsabilidade civil extracontratual, os eventuais danos sofridos por João geram juros moratórios e correção monetária a partir do trânsito em julgado da sentença."],"gabarito":"A","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":12,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":40,"codigo":"OAB2025TIPO1-040","area":"Direito Civil","dificuldade":"Médio","enunciado":"Gustavo, viúvo, é pai de Heitor e Gabriela. Gustavo tem uma relação harmoniosa com sua filha e extremamente conturbada com o filho. Por essa razão, Gustavo doou para sua filha uma casa que, ao tempo da liberalidade, correspondia a uma pequena fração de seu patrimônio. No contrato de doação, inexistiu qualquer cláusula especial. Dois anos após o referido contrato, Gustavo elaborou seu testamento, dispensando Gabriela de colacionar o bem. Com a morte de Gustavo e a abertura de seu testamento, Heitor está questionando a validade do contrato de doação e da dispensa de colação. Sobre a situação apresentada, assinale a afirmativa correta.","alternativas":["O contrato de doação é válido, e Gabriela está dispensada de colacionar o bem por força do testamento.","O contrato de doação é válido, mas a dispensa de colação é nula. Essa dispensa só pode ocorrer no próprio contrato de doação.","O contrato de doação é nulo, uma vez que a doação de ascendente para um descendente exige o consentimento dos demais descendentes.","O contrato de doação é anulável, uma vez que a doação de ascendente para um descendente exige o consentimento dos demais descendentes."],"gabarito":"A","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":12,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":41,"codigo":"OAB2025TIPO1-041","area":"Direito Civil","dificuldade":"Médio","enunciado":"A Farmácia Vida+, participante de um programa de descontos vinculado à operadora de planos de saúde MedSaúde S.A., compartilhou com a operadora informações detalhadas sobre as compras de seus clientes, incluindo medicamentos adquiridos, frequência das compras e histórico de uso de fármacos. Esse compartilhamento foi realizado sem o consentimento explícito dos clientes, sob a justificativa de que a MedSaúde S.A. poderia utilizar os dados para oferecer benefícios personalizados e otimizar seus serviços de saúde. Ao tomar conhecimento da prática, Cristina, uma das clientes da farmácia, procurou você, como advogado(a) para emitir parecer sobre o caso, especialmente sobre a configuração da violação de algum direito. Diante dessa situação e com base na Lei Geral de Proteção de Dados (LGPD), assinale a opção que apresenta, corretamente, o parecer emitido.","alternativas":["O compartilhamento de dados foi legal, pois tanto a farmácia como a operadora de saúde são autorizadas a tratar os dados pessoais de saúde para a execução dos seus contratos.","A Farmácia Vida+ violou a LGPD ao compartilhar dados pessoais sensíveis sem o consentimento dos titulares, estando sujeita a sanções e obrigada a eliminar os dados compartilhados.","O compartilhamento de dados foi lícito, pois a operadora de saúde tem interesse legítimo na obtenção dessas informações para aprimorar os seus serviços e oferecer benefícios aos clientes.","O compartilhamento de dados foi ilegal, mas a Farmácia Vida+ não pode ser responsabilizada, pois a operadora de planos de saúde é a responsável final pelo tratamento das informações, mas ambas são obrigadas a eliminar os dados."],"gabarito":"B","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":13,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":42,"codigo":"OAB2025TIPO1-042","area":"Direito Civil","dificuldade":"Difícil","enunciado":"Ruth é proprietária do Sítio Felicidade, localizado na zona rural do município de Ribeirão Corrente (SP). Há 15 anos, ela mantém canos subterrâneos de irrigação que atravessam o Sítio da Lua, de propriedade de Demétrio, para captar água de uma nascente situada dentro desse último. O uso sempre foi contínuo e sem oposição, mas invisível a olho nu, já que o sistema está instalado sob o solo. Nunca houve registro da servidão no Cartório de Registro de Imóveis, tampouco um contrato formal entre os antigos proprietários. Em novembro de 2025, Pedro, novo dono do Sítio da Lua, ao descobrir as tubulações, notificou Ruth para interromper o uso da água, alegando que a servidão não se constituiu validamente por ausência de registro. Considerando o caso concreto e as normas do Código Civil sobre a constituição e aquisição de servidões, assinale a afirmativa correta.","alternativas":["A usucapião da servidão poderia ser reconhecida após cinco anos de uso contínuo, dada a boa-fé e a posse qualificada de Ruth.","Ruth adquiriu a servidão por usucapião, pois o uso foi contínuo e incontestado por mais de dez anos, ainda que não fosse visível.","O direito de Ruth configura mera detenção tolerada, mas poderia ser convertido em servidão após 20 anos de utilização contínua.","Ruth não adquiriu a servidão, pois, não sendo aparente, exige registro no Cartório de Imóveis para a sua constituição válida, não admitindo usucapião."],"gabarito":"D","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":13,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":43,"codigo":"OAB2025TIPO1-043","area":"Estatuto da Criança e do Adolescente","dificuldade":"Fácil","enunciado":"Maria e José, ambos com 45 anos, possuem um filho em comum, Paulo, que, hoje, tem 17 anos. Quando Paulo tinha 12 anos, Maria e José se divorciaram e foi estipulada judicialmente a guarda unilateral para Maria, sendo certo que José sempre usou o seu direito de convivência com o adolescente em finais de semanas alternados. Após muito esforço, Maria conseguiu angariar recursos para fazer uma viagem dentro do território nacional com Paulo. A viagem será de uma semana e não afetará o direito de visitação de José. Ocorre que o genitor se opõe à viagem, mesmo sem apresentar qualquer justificativa para isso. Preocupada, Maria procura você, como advogado(a), para que lhe preste a solução jurídica adequada. De acordo com o ECA, assinale a opção que, corretamente, indica a sua orientação.","alternativas":["Maria deverá buscar o Juízo da Infância e Juventude e obter alvará para a autorização de viagem.","José só pode se opor à viagem se tivesse sido estipulada a guarda compartilhada, o que não é a hipótese apresentada.","Maria só pode fazer essa viagem com expressa autorização de José, já que ambos são detentores do poder familiar.","Maria não precisa da anuência do genitor, nem de autorização judicial, uma vez que a viagem é dentro do território nacional."],"gabarito":"D","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":13,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":44,"codigo":"OAB2025TIPO1-044","area":"Estatuto da Criança e do Adolescente","dificuldade":"Fácil","enunciado":"Marcos, 17 anos, responde a processo de apuração de ato infracional. Segundo a representação, o adolescente foi apreendido quando estava subtraindo bens de um estabelecimento comercial. Assim, foi-lhe imputada a conduta análoga ao Art. 155 do Código Penal (furto). Mariana, 40 anos, mãe de Marcos, o(a) procura, na condição de advogado(a), para fazer a defesa. Designada audiência de apresentação, estavam presentes Marcos, Mariana e as testemunhas de acusação. Tanto Marcos quanto Mariana confirmaram, perante a autoridade judiciária, que você fará a defesa técnica naquele processo. Entretanto, o Juízo verificou que não há procuração juntada aos autos. Por isso, o excluiu do feito e nomeou a Defensoria Pública para patrocinar os interesses do adolescente, contra a vontade deste e de sua genitora. Considerando o caso acima narrado, assinale a afirmativa correta.","alternativas":["O Magistrado errou ao nomear a Defensoria Pública, pois deveria ter adiado a audiência e dado um prazo razoável para a juntada da procuração.","Considerando a ausência de procuração, o adolescente estava indefeso, de modo que o Juízo agiu corretamente ao nomear a Defensoria Pública.","O Magistrado errou, uma vez que é dispensada a outorga de mandato quando o advogado(a) constituído(a) tiver sido indicado(a) por ocasião de ato formal com a presença da autoridade judiciária.","O Juízo errou, pois deveria adiar o ato e oficiar à OAB para a apuração de eventual infração disciplinar, já que o advogado(a) não poderia se apresentar na audiência sem a juntada da respectiva procuração."],"gabarito":"C","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":13,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":45,"codigo":"OAB2025TIPO1-045","area":"Direito do Consumidor","dificuldade":"Fácil","enunciado":"Augusto assinou um contrato de adesão com a sociedade empresária AquaLimpa, fornecedora de água e esgoto em sua cidade, para o fornecimento de água em sua residência. Após meses de uso regular, Augusto foi surpreendido por uma cobrança inesperada no valor de R$ 2.500,00 (dois mil e quinhentos reais), sendo alegado um “ajuste de consumo retroativo”. A sociedade empresária AquaLimpa informou que o valor deveria ser pago imediatamente para evitar o corte no fornecimento de água. No entanto, Augusto verificou que o contrato não mencionava essa possibilidade de ajuste retroativo, nem qualquer explicação prévia sobre o cálculo desse valor. Diante da situação hipotética narrada e com base no Código de Defesa do Consumidor, assinale a afirmativa correta.","alternativas":["Por ser um contrato escrito, Augusto não tem direito de contestar a cobrança, já que os termos do contrato foram previamente estipulados pela sociedade empresária e aceitos por ele.","Augusto deve questionar judicialmente a cobrança, uma vez que o contrato de adesão deve ser interpretado da forma mais favorável ao consumidor quando houver cláusulas ambíguas, contraditórias ou omissas.","Como o fornecimento de água é um serviço essencial, a sociedade empresária AquaLimpa não pode cortar o fornecimento de água, embora possa realizar a cobrança dos valores retroativos nos termos pactuados.","A sociedade empresária AquaLimpa pode cortar o fornecimento de água imediatamente se Augusto não pagar a dívida, pois a imediata interrupção no fornecimento de serviços em razão de inadimplência, independentemente de notificação, é lícita."],"gabarito":"B","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":14,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":46,"codigo":"OAB2025TIPO1-046","area":"Direito do Consumidor","dificuldade":"Médio","enunciado":"Maria adquiriu um aquecedor elétrico de uma marca renomada. Após uma semana de uso, o aquecedor apresentou um curto- circuito, causando um incêndio que danificou parte de sua residência. Após investigações, constatou-se que o defeito era decorrente de uma falha de fabricação, já relatada por outros consumidores. Ao buscar uma solução com o fabricante, este alegou que o acidente foi causado pelo uso inadequado do produto e negou responsabilidade. Sobre o fato narrado, com base no Código de Defesa do Consumidor, assinale a afirmativa correta.","alternativas":["No caso, não há que se falar em responsabilidade do fornecedor, pois o risco de curto-circuito é inerente a todos os produtos elétricos.","O fabricante só será responsabilizado se Maria provar que o acidente não decorreu de uso inadequado, independentemente da constatação do defeito do produto.","O fabricante poderá ser responsabilizado se Maria provar que utilizou o aquecedor conforme as instruções do manual de uso, bem como demonstrar a adequação de suas instalações elétricas.","O fabricante é responsável pelos danos causados pelo aquecedor defeituoso, independentemente de culpa e, comprovado o nexo causal entre o defeito e os danos, responderá de forma objetiva."],"gabarito":"D","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":14,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":47,"codigo":"OAB2025TIPO1-047","area":"Direito Empresarial","dificuldade":"Difícil","enunciado":"À Assembleia de Credores, convocada para deliberação sobre o plano de recuperação judicial apresentado por Atacado Têxtil Itapemirim Ltda., compareceram os credores Afonso Fundão e Viana & Cia. Ltda. O primeiro é sócio da recuperanda e credor por empréstimo fornecido a ela; o segundo é credor por duplicatas, cujo valor e condições de pagamento não serão alterados pelo plano. Com base nessas informações e nas disposições sobre a participação e o voto nas Assembleias de Credores (Lei nº 11.101/2005), assinale a afirmativa correta.","alternativas":["Apenas Afonso Fundão poderá votar, já que se trata de credor subordinado, integrante da classe III; Viana & Cia. Ltda. não poderá votar, porque o plano não alterou o valor ou as condições originais de pagamento.","Nenhum dos credores poderá votar na Assembleia, em razão de o primeiro ser sócio da devedora, e o segundo não ter alterado o valor ou as condições originais de pagamento.","Ambos poderão votar, em razão de o primeiro ser credor subordinado e o segundo credor quirografário, integrando a classe III na composição da Assembleia.","Apenas Viana & Cia. Ltda. poderá votar na Assembleia por ser credor quirografário, integrando a classe III; Afonso Fundão não poderá votar, em razão de ser sócio da devedora."],"gabarito":"B","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":14,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":48,"codigo":"OAB2025TIPO1-048","area":"Direito Empresarial","dificuldade":"Médio","enunciado":"Pedro e Vitória são casados desde 2005 no regime de comunhão parcial de bens e pretendem constituir sociedade simples com seus filhos Carlos e Conceição. De acordo com as regras do Código Civil para a participação de pessoas casadas em sociedade, assinale a afirmativa correta.","alternativas":["É possível a constituição de sociedade simples simultaneamente entre os cônjuges e seus filhos, tendo em vista não ser a sociedade empresária.","É defeso a constituição de sociedade simples simultaneamente entre os cônjuges e seus filhos, qualquer que seja o regime de bens do casamento.","É possível a constituição de sociedade simples entre os cônjuges e seus filhos simultaneamente, tendo em vista ser o regime de bens do casamento de comunhão parcial.","É defeso a constituição de sociedade simples simultaneamente entre os cônjuges e seus filhos, pois o casamento foi celebrado em regime de bens diferente do da separação absoluta."],"gabarito":"C","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":14,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":49,"codigo":"OAB2025TIPO1-049","area":"Direito Empresarial","dificuldade":"Difícil","enunciado":"A sociedade empresária Brasilândia Materiais de Construção contraiu empréstimo junto ao Banco Figueirão S.A. garantido pela alienação fiduciária de seis veículos automotores. O contrato tem prazo de vigência de 36 meses e, após o decurso de 17 meses, a devedora fiduciante deixou de pagar as prestações do empréstimo, sendo a mora comprovada por carta registrada com aviso de recebimento devidamente entregue. Diante da mora no adimplemento das obrigações contratuais, assinale a opção que indica a prerrogativa que o Banco Figueirão tem, na condição de proprietário fiduciário dos veículos automotores.","alternativas":["Poderá vendê-los a terceiros, independentemente de leilão, hasta pública, avaliação prévia ou qualquer outra medida judicial ou extrajudicial, salvo disposição expressa em contrário prevista no contrato.","Deverá ajuizar ação declaratória para positivar a mora da fiduciante e, após a avaliação dos bens e alvará judicial, poderá vendê-los a terceiros, devendo aplicar o preço da venda no pagamento de seu crédito e das despesas decorrentes.","Poderá vendê-los a terceiros desde que interpele previamente a devedora fiduciante para que realize o pagamento no prazo improrrogável de 15 dias, findo o qual a propriedade estará consolidada se não for realizado o pagamento integral do saldo devedor.","Deverá ajuizar ação de execução por quantia certa em face da fiduciante para cobrar o crédito, que abrange o principal, a correção monetária, os juros, as comissões, as taxas e a cláusula penal, podendo requerer, liminarmente, uma autorização judicial para a venda do bem em sede de tutela de evidência."],"gabarito":"A","comentario":"Gabarito extraído do gabarito preliminar da FGV/OAB para a prova Tipo 1. Comentário jurídico detalhado e fundamento legal pendentes de validação para evitar inserir artigos, leis ou súmulas sem conferência manual.","fundamento_legal":[],"fonte":"FGV/OAB 2025 Tipo 1","pagina_pdf":15,"status":"pendente_revisao"},{"prova":"OAB","exame":"OAB 2025 Tipo 1","ano":"2025","numero":50,"codigo":"OAB2025TIPO1-050","area":"Direito Empresarial","dificuldade":"Médio","enunciado":"A sociedade empresária Elétrica Passa Sete Ltda., por meio de seu administrador, ajuizou tempestivamente ação renovatória de locação não residencial referente ao imóvel onde está localizada a filial na cidade de Varginha, MG. Na petição inicial, a autora indicou as condições oferecidas para a renovação da locação, especialmente o novo valor do aluguel proposto. Apresentada a contestação, o locador informou que recebeu proposta de terceiro para a nova locação em condições melhores do que aquelas propostas pela locatária na petição inicial, sendo o valor locativo do imóvel 12% maior do que o oferecido pela locatária. Considerados os fatos narrados, assinale a afirmativa correta.","alternativas":["O locador não pode apresentar na contestação proposta de terceiro para a locação, ainda que em condições melhores, diante do direito potestativo do locatário à renovação compulsória.","A proposta de terceiro pode ser apresentada em documento público ou particular. Caso o document
